nferior)", "rosa": false, "seguro": true}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P5", "imagen": 13, "clave": "b", "img_key": "enero-13", "que_pregunto": "Arteriografía del tronco celíaco con letras A-D: a) A = esplénica (falso), b) C = a. gastroduodenal (CORRECTA: la rama que 'baja' desde la hepática común por detrás de D1), c) B = gástrica izda (falso), d) D = hepática común (falso, ya es propia). Nota: F2 cita 'S8 p6' pero la arteriografía celíaca del seminario es ESTA página (p5); p6 es la arteriografía de las gástricas. La placa exacta del cuadernillo es la de Reto 2 dig p15 (1 hepática común · 3 gástrica izda · 6 gastroomental izda · 7 esplénica · 8 gastroomental dcha · 11 gastroduodenal · 14 hepática propia · 15 tronco celíaco)."}, {"examen": "enero 2026", "pregunta": "P78 (apoyo, sin imagen)", "imagen": 13, "clave": "a", "img_key": "enero-13", "que_pregunto": "Pregunta de hígado sin imagen que se apoya en la misma zona: ligamento venoso de Arancio = ductus venosus (v. umbilical → VCI). Se cita aquí porque F2 la vincula a la imagen 13."}], "pack": "Trípode de Haller (T12) → 1) a. gástrica izda (curvatura menor, esofágicas); 2) a. esplénica (pancreáticas dorsal/magna/transversa, gástricas cortas al fundus, gastroepiploica izda); 3) a. hepática común → gastroduodenal (→ gastroepiploica dcha + pancreatoduodenal superior) + gástrica dcha, y sigue como hepática PROPIA → hepática dcha (→ cística) e izda. Venas: todas a la PORTA (esplénica + VMS; la gástrica izda directa a la porta). Linfa: ganglios celíacos. Colaterales celíaco↔AMS: arcadas pancreatoduodenales. Maniobra de Pringle = pinzar el lig. hepatoduodenal (hepática propia + porta + colédoco).", "trampa": "Hepática común vs propia (cambia de nombre en la gastroduodenal); identificar cada rama por su trayecto: esplénica = tortuosa a la izquierda; gástrica izda = pequeña y ascendente; gastroduodenal = descendente tras D1. Formato 'sólo una letra bien puesta, las demás cruzadas'.", "prioridad": 3}, {"key": "S8-p06", "pagina": 6, "item": 5, "tipo": "identifica", "titulo": "Arteriografía selectiva de la a. gástrica izquierda (Weir-Abrahams, leyenda 1-8)", "que_se_ve": "Panel (b) de una angiografía selectiva: catéter (1) en el origen de la a. gástrica izquierda (2), que asciende hacia el cardias dando la rama esofágica (4) y se ramifica por la curvatura menor y las caras del estómago (todo el ovillo de ramas de la derecha de la imagen); 6 = a. gástrica derecha, que viene de la hepática y se anastomosa con la izquierda en la curvatura menor. La cámara gástrica con aire (fundus) se ve a la izquierda de la imagen. Los números 3, 5, 7 y 8 de la leyenda son VENAS (v. gástrica izda, ramas esofágicas venosas, vv. gástricas cortas, v. esplénica) que corresponden al panel (a) —fase venosa— no reproducido en la diapositiva. Marcador 'L' = lado izquierdo del paciente.", "etiquetas": [{"n": "1", "nombre": "Catéter en el origen de la a. gástrica izquierda", "rosa": false, "seguro": true}, {"n": "2", "nombre": "A. gástrica izquierda", "rosa": true, "seguro": true, "nota": "Rama del tronco celíaco; forma con la gástrica dcha el arco de la curvatura MENOR; ramas esofágicas (varices por hipertensión portal)"}, {"n": "3", "nombre": "V. gástrica izquierda (coronaria estomáquica)", "rosa": false, "seguro": true, "nota": "No visible en el panel (b): drena directa a la PORTA; anastomosis portocava esofágica"}, {"n": "4", "nombre": "Rama esofágica de la a. gástrica izquierda", "rosa": true, "seguro": true}, {"n": "5", "nombre": "Ramas esofágicas de la v. gástrica izquierda", "rosa": false, "seguro": true, "nota": "Panel venoso, no visible aquí"}, {"n": "6", "nombre": "A. gástrica derecha", "rosa": true, "seguro": true, "nota": "Rama de la hepática (común o propia); curvatura menor, se anastomosa con la 2"}, {"n": "7", "nombre": "Vv. gástricas cortas", "rosa": false, "seguro": true, "nota": "Panel venoso; del fundus a la v. esplénica por el lig. gastroesplénico"}, {"n": "8", "nombre": "V. esplénica", "rosa": false, "seguro": true, "nota": "Panel venoso; recibe VMI y se une a la VMS tras el cuello del páncreas → porta"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P74 (contenido)", "imagen": 9, "clave": "a", "img_key": "enero-09", "que_pregunto": "La P74 preguntaba la irrigación por regiones del estómago sobre el tránsito baritado (imagen 9 = Reto 2 dig p7, NO está en S8): región A = fundus ← aa. gástricas CORTAS ← esplénica. Esta arteriografía es la lámina donde el profesor enseña el arco de la curvatura menor (gástricas izda + dcha)."}], "pack": "Estómago — curvatura MENOR: a. gástrica izda (tronco celíaco) + a. gástrica dcha (hepática); curvatura MAYOR: gastroepiploica dcha (gastroduodenal) + gastroepiploica izda (esplénica); FUNDUS: aa. gástricas cortas (esplénica, en el lig. gastroesplénico) + a. gástrica posterior. Venas homónimas → porta (gástricas izda/dcha directas; gastroepiploica dcha → VMS; cortas y gastroepiploica izda → esplénica). Linfa: gástricos izdos/dchos, gastroomentales, pancreatoesplénicos → todos a los celíacos. Inervación: vagos (anterior izdo, posterior dcho; nervio de Latarjet) y simpático T6-T9 vía plexo celíaco.", "trampa": "Atribuir el fundus a la gástrica izquierda (es de las CORTAS de la esplénica); preguntar de dónde nace la gástrica dcha (hepática, no tronco celíaco); confundir 'epiplón menor' (curvatura menor → hígado) con 'mayor' (cuelga de la curvatura mayor). Candidata caliente no caída todavía como imagen.", "prioridad": 2}, {"key": "S8-p07", "pagina": 7, "item": 6, "tipo": "identifica", "titulo": "Angiografía selectiva de la arteria mesentérica superior (Weir-Abrahams, leyenda 1-12)", "que_se_ve": "Aortografía/arteriografía selectiva AP: catéter (3) introducido por la ilíaca común derecha (6) y la aorta (1) con la punta en la AMS. Del borde IZQUIERDO de la AMS salen en abanico las ramas yeyunales (8, arriba, con arcadas simples) e ileales (4, abajo); del borde DERECHO la pancreatoduodenal inferior (7, la primera), la cólica media (10, hacia arriba y a la derecha, al mesocolon transverso), la cólica derecha (11) y la ileocólica (5), que termina en la apendicular (2). 9 = arterias lumbares de la aorta; 12 = uréter derecho (opacificado tenue, cruza por delante de los vasos ilíacos). Es LITERALMENTE la imagen 14 de enero 2026 (letras A-C).", "etiquetas": [{"n": "1", "nombre": "Aorta abdominal", "rosa": false, "seguro": true, "nota": "La AMS nace de ella en L1, 1 cm por debajo del tronco celíaco, detrás del cuello del páncreas"}, {"n": "2", "nombre": "A. apendicular", "rosa": false, "seguro": true, "nota": "Rama de la ileocólica; en el mesoapéndice, por detrás del íleon terminal"}, {"n": "3", "nombre": "Catéter con la punta selectivamente en la AMS", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Ramas ileales de la AMS", "rosa": true, "seguro": true, "nota": "Borde IZQUIERDO, distales; 3-5 órdenes de arcadas, vasa recta CORTOS"}, {"n": "5", "nombre": "A. ileocólica", "rosa": true, "seguro": true, "nota": "Rama terminal derecha: cólica ascendente, cecales ant/post, apendicular, ileal"}, {"n": "6", "nombre": "A. ilíaca común derecha", "rosa": false, "seguro": true, "nota": "Por donde entra el catéter (punción femoral)"}, {"n": "7", "nombre": "A. pancreatoduodenal inferior", "rosa": false, "seguro": true, "nota": "Primera rama derecha de la AMS; arcada con la PD superior (gastroduodenal) = anastomosis celíaco-AMS"}, {"n": "8", "nombre": "Ramas yeyunales de la AMS", "rosa": true, "seguro": true, "nota": "Borde IZQUIERDO, proximales; 1-2 arcadas, vasa recta LARGOS"}, {"n": "9", "nombre": "Arterias lumbares (de la aorta abdominal)", "rosa": false, "seguro": true}, {"n": "10", "nombre": "A. cólica media", "rosa": true, "seguro": true, "nota": "Borde derecho, hacia el mesocolon transverso; irriga 2/3 proximales del transverso (hasta Cannon-Böhm); se liga en cirugía del transverso"}, {"n": "11", "nombre": "A. cólica derecha", "rosa": false, "seguro": true, "nota": "Colon ascendente; a menudo nace de la ileocólica"}, {"n": "12", "nombre": "Uréter derecho", "rosa": false, "seguro": true, "nota": "Trampa de la placa: no es un vaso"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P10", "imagen": 14, "clave": "d", "img_key": "enero-14", "que_pregunto": "Misma angiografía con letras A-C: a) A = arterias ileales, b) B = arterias yeyunales, c) C = a. cólica media, d) NINGUNA correcta. Clave d: las etiquetas estaban permutadas (las yeyunales son las proximales del borde izquierdo con arcadas simples; las ileales las distales con arcadas múltiples; la cólica media sale del borde derecho hacia arriba). Hay que reconocer cada rama por su patrón, no por lo que 'suena'."}], "pack": "AMS (L1; pasa DELANTE de D3 y del proceso uncinado, DETRÁS del cuello del páncreas; la VMS a su derecha): borde izdo → 15-18 aa. yeyunales e ileales; borde dcho → PD inferior, cólica media, cólica dcha, ileocólica (→ apendicular). Territorio: desde la papila de Vater hasta 2/3 del transverso (línea de Cannon-Böhm). Venas: VMS (a la derecha de la arteria) → porta tras unirse a la esplénica. Linfa: ganglios mesentéricos superiores → tronco intestinal → cisterna de Pecquet. Inervación: plexo mesentérico superior (vago + simpático T10-T11; dolor periumbilical). Colaterales con AMI: arco de Riolano y a. marginal de Drummond. Pinza aortomesentérica (Wilkie) = D3 entre AMS y aorta.", "trampa": "Formato 'ninguna correcta' tras cruzar yeyunales/ileales/cólica media; incluir el uréter (12) como si fuera vaso; preguntar qué pasa por detrás de la AMS (D3, v. renal izda, proceso uncinado).", "prioridad": 3}, {"key": "S8-p08", "pagina": 8, "item": 7, "tipo": "identifica", "titulo": "Angiografía de la arteria mesentérica inferior — 3 paneles (Weir-Abrahams, leyenda 1-12)", "que_se_ve": "Panel (c) grande a la izquierda: arteriografía selectiva de la AMI en la que se ve el tronco corto de la AMI subiendo, la a. cólica izquierda (5) dividiéndose en rama ascendente (1) y descendente (2), la arteria marginal de Drummond (7) recorriendo el borde mesentérico del colon descendente y del transverso distal, las sigmoideas en abanico y la rectal superior (10) descendiendo a la pelvis; 3 = AMI. Panel (a): fase arterial/venosa mixta con 12 = punta del catéter en la AMI, 4 = vena mesentérica inferior (asciende paralela a la izquierda), 5/6 = a. y v. cólica izda, 10/11 = a. y v. rectal superior, 8 = sigmoideas. Panel (b): fase venosa del rectosigma con 9 = v. sigmoidea, 10-11 rectales. NO ha caído aún en 2026 → hueco caliente (todo el pack AMI/Drummond/rectal superior está en el temario y en el Reto 3 dig p9).", "etiquetas": [{"n": "1", "nombre": "Rama ascendente de la a. cólica izquierda", "rosa": true, "seguro": true, "nota": "Sube al ángulo esplénico y se anastomosa con la cólica media (arco de Riolano)"}, {"n": "2", "nombre": "Rama descendente de la a. cólica izquierda", "rosa": true, "seguro": true, "nota": "Colon descendente; se une a las sigmoideas por la marginal"}, {"n": "3", "nombre": "A. mesentérica inferior", "rosa": true, "seguro": true, "nota": "Nace de la aorta en L3, 3-4 cm sobre la bifurcación; retroperitoneal, baja a la izquierda"}, {"n": "4", "nombre": "V. mesentérica inferior", "rosa": false, "seguro": true, "nota": "Sube por el retroperitoneo a la izquierda del ángulo de Treitz y desemboca en la v. ESPLÉNICA (o en la confluencia)"}, {"n": "5", "nombre": "A. cólica izquierda", "rosa": true, "seguro": true, "nota": "Primera rama de la AMI; cruza por delante del uréter y vasos gonadales izdos"}, {"n": "6", "nombre": "V. cólica izquierda", "rosa": false, "seguro": true}, {"n": "7", "nombre": "A. marginal (de Drummond)", "rosa": true, "seguro": true, "nota": "Arcada continua paralela al borde mesocólico de todo el colon; anastomosis AMS-AMI; punto débil = Sudeck (última sigmoidea-rectal sup) y Griffiths (ángulo esplénico)"}, {"n": "8", "nombre": "Aa. sigmoideas", "rosa": true, "seguro": true, "nota": "2-4 ramas en el mesocolon sigmoideo"}, {"n": "9", "nombre": "V. sigmoidea", "rosa": false, "seguro": true}, {"n": "10", "nombre": "A. rectal superior", "rosa": true, "seguro": true, "nota": "Rama TERMINAL de la AMI; entra en el mesorrecto y se divide en dos ramas; irriga recto hasta la línea pectínea"}, {"n": "11", "nombre": "V. rectal superior", "rosa": false, "seguro": true, "nota": "→ VMI → esplénica → PORTA (plexo hemorroidal interno = anastomosis portocava)"}, {"n": "12", "nombre": "Punta del catéter en la a. mesentérica inferior", "rosa": false, "seguro": true}], "pregunta": null, "examen": [], "pack": "AMI (L3) → a. cólica izda (ascendente + descendente), 2-4 aa. sigmoideas, a. rectal superior (terminal). Territorio: 1/3 distal del transverso, descendente, sigma y recto superior (hasta la pectínea). Venas: VMI → v. esplénica (no a la VMS) → porta. Linfa: ganglios mesentéricos inferiores → lumbares/preaórticos. Inervación: parasimpático S2-S4 (nn. esplácnicos pélvicos, suben por el plexo hipogástrico) — NO vago; simpático L1-L2. Anastomosis: arco de Riolano (cólica media ↔ cólica izda), marginal de Drummond, y rectal superior ↔ media (ilíaca interna) ↔ inferior (pudenda interna).", "trampa": "'La VMI drena en la VMS' (drena en la esplénica); 'la AMI nace en L1' (L3); 'el sigma recibe inervación vagal' (S2-S4); confundir marginal de Drummond con arco de Riolano; preguntar qué rama es la terminal (rectal superior). Preparar como lámina 'Identifica' de alta probabilidad para septiembre.", "prioridad": 2}, {"key": "S8-p09", "pagina": 9, "item": 8, "tipo": "tecnica", "titulo": "Ecografía abdominal — posiciones de la sonda (I): 4 fotos con esquema", "que_se_ve": "Cuatro parejas esquema+foto de dónde se apoya la sonda para la exploración abdominal estándar. Superior izda: sonda TRANSVERSAL en línea media supraumbilical/epigastrio → aorta, VCI, páncreas (eje transverso). Superior dcha: sonda oblicua en el reborde costal (esquema con tres marcas amarilla/rosa/azul = barrido subcostal de derecha a izquierda) → hígado, vía biliar y vesícula. Inferior izda: sonda en hipocondrio izquierdo/flanco izdo (sobre el reborde costal, apuntando hacia el bazo) → bazo y riñón izquierdo. Inferior dcha: sonda longitudinal en flanco/fosa ilíaca derecha, lateral → riñón derecho (a través del hígado) y ciego/apéndice. Equivale a la imagen 11 de enero 2026 (exploración con tres posiciones A/B/C), aunque la placa del examen es externa.", "etiquetas": [{"n": "sup-izda", "nombre": "Sonda transversal, epigastrio/línea media supraumbilical → aorta abdominal, VCI, páncreas", "rosa": false, "seguro": false, "nota": "Interpretación visual; la diapositiva no rotula las fotos"}, {"n": "sup-dcha", "nombre": "Sonda subcostal oblicua derecha (barrido amarillo-rosa-azul) → hígado, vesícula y vía biliar", "rosa": false, "seguro": false}, {"n": "inf-izda", "nombre": "Sonda en hipocondrio/flanco izquierdo, intercostal → bazo y riñón izquierdo", "rosa": false, "seguro": false}, {"n": "inf-dcha", "nombre": "Sonda longitudinal en flanco derecho → riñón derecho, ciego, FID", "rosa": false, "seguro": false}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P73", "imagen": 11, "clave": "d", "img_key": "enero-11", "que_pregunto": "Imagen 11 (3 fotos de exploración/sonda abdominal A-C, placa externa parecida a estas): A (línea media supraumbilical) evalúa aorta y VCI; B (epigastrio) el estómago; C (intercostal izdo) el bazo → TODAS ciertas (d). Mismo tipo de pregunta que E26 P65 con las sondas del cuello (S7)."}], "pack": "Ventanas ecográficas: subcostal derecha (paciente en inspiración) = hígado, vesícula (ayunas, en el lecho vesicular entre lóbulos dcho y cuadrado), vía biliar y porta; epigastrio transversal = páncreas (delante de la v. esplénica y la AMS), aorta (izda) y VCI (dcha); intercostal izquierdo bajo = bazo (costillas 9-11) y riñón izdo; flanco derecho = riñón dcho a través del hígado (ventana acústica); suprapúbica = vejiga llena como ventana para próstata/útero. Lo retroperitoneal (aorta, VCI, riñones, páncreas) se ve a través de las vísceras; el gas del colon/estómago lo tapa.", "trampa": "Decir que el páncreas o la aorta 'no se ven por eco' (se ven en epigastrio, salvo gas); que el bazo se explora en decúbito supino anterior (mejor intercostal/lateral); que el paciente está en prono. Formato 'A/B/C evalúan…' con todas ciertas.", "prioridad": 2}, {"key": "S8-p10", "pagina": 10, "item": 9, "tipo": "tecnica", "titulo": "Ecografía abdominal — posiciones de la sonda (II): 3 fotos con esquema", "que_se_ve": "Tres parejas esquema+foto. Superior: sonda transversal en epigastrio/hipocondrio izquierdo bajo el reborde costal → páncreas (cuerpo-cola), estómago, aorta y v. esplénica. Inferior izda: paciente girado en decúbito lateral y sonda longitudinal INTERCOSTAL en el flanco/pared posterolateral izquierda → bazo y riñón izquierdo (la ventana clásica para el bazo, oculto tras las costillas 9-11). Inferior dcha: sonda en línea media/hipocondrio derecho con el esquema mostrando tres cortes (amarillo alto, azul medio, rosa periumbilical) = barrido longitudinal de aorta/VCI de epigastrio a ombligo (bifurcación en L4) y de hígado-riñón derecho.", "etiquetas": [{"n": "sup", "nombre": "Sonda transversal en epigastrio / hipocondrio izdo → páncreas, estómago, aorta, v. esplénica", "rosa": false, "seguro": false, "nota": "Interpretación visual; la diapositiva no rotula"}, {"n": "inf-izda", "nombre": "Decúbito lateral, sonda intercostal posterolateral izquierda → bazo y riñón izquierdo", "rosa": false, "seguro": false}, {"n": "inf-dcha", "nombre": "Barrido longitudinal (3 niveles amarillo/azul/rosa) línea media-hipocondrio dcho → aorta, VCI, hígado, riñón dcho", "rosa": false, "seguro": false}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P73 (placa gemela)", "imagen": 11, "clave": "d", "img_key": "enero-11", "que_pregunto": "Ver p9: la imagen 11 de enero (tres posiciones A/B/C: aorta-VCI, estómago, bazo) es del mismo tipo; estas fotos son las que el profesor tiene en el seminario."}], "pack": "Bazo: hipocondrio izdo, costillas 9-11, eje paralelo a la 10ª costilla; sólo palpable si duplica su tamaño (se explora en inspiración y en decúbito lateral dcho); irrigado por la a. esplénica (tronco celíaco); v. esplénica → porta; linfa a pancreatoesplénicos → celíacos. Riñón izdo más alto que el dcho (T12-L2 vs L1-L3). Aorta abdominal: T12-L4 (bifurcación), palpable en línea media supraumbilical; VCI a su derecha (L5).", "trampa": "Confundir qué lado/ventana ve el bazo (intercostal IZQUIERDO, no subcostal derecho); decir que el bazo normal se palpa; 'el riñón izquierdo está más bajo'. Formato técnica: '¿qué posición permite ver…?'", "prioridad": 2}, {"key": "S8-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Tránsito intestinal baritado — yeyuno e íleon (placa grande + Sobotta con leyenda 1-4)", "que_se_ve": "Izquierda: radiografía AP de tránsito baritado (contraste oral) que muestra el estómago relleno (arriba a la derecha del paciente/izquierda de la imagen → en la placa el estómago aparece en el cuadrante superior derecho de la imagen = lado izquierdo del paciente), el bulbo y el marco duodenal (D1-D2-D3) rodeando la cabeza del páncreas a la derecha de la columna, la flexura duodenoyeyunal, y las asas: YEYUNO en hemiabdomen superior izquierdo con pliegues circulares de Kerckring muy marcados ('pila de monedas', aspecto plumoso) e ÍLEON en hemiabdomen inferior derecho y pelvis, de menor calibre y pliegues borrados. Derecha: par de Sobotta con la leyenda 1-4. La placa grande es LITERALMENTE la imagen 15 de enero 2026 (letras A-D: B = yeyuno, C = íleon, D = 2ª porción del duodeno).", "etiquetas": [{"n": "1", "nombre": "Contracciones peristálticas en el íleon", "rosa": false, "seguro": true, "nota": "Segmentos estrechados 'en cuerda' por la contracción"}, {"n": "2", "nombre": "Íleon", "rosa": true, "seguro": true, "nota": "= C del examen. FID/pelvis, calibre menor, pliegues escasos, placas de Peyer, arcadas múltiples y vasa recta cortos, más grasa en el meso"}, {"n": "3", "nombre": "Pliegues circulares (de Kerckring) en el yeyuno", "rosa": true, "seguro": true, "nota": "Válvulas conniventes altas y numerosas = aspecto plumoso"}, {"n": "4", "nombre": "Yeyuno", "rosa": true, "seguro": true, "nota": "= B del examen. Hemiabdomen superior izdo, pared gruesa, más vascular, arcadas simples y vasa recta largos"}, {"n": "D (examen)", "nombre": "2ª porción del duodeno (descendente)", "rosa": true, "seguro": true, "nota": "Relaciones: hilio renal, vasos renales y uréter DERECHOS por detrás (fascia de Treitz); papilas mayor (Vater) y menor (Santorini); el mesocolon transverso cruza su cara anterior"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P3", "imagen": 15, "clave": "c", "img_key": "enero-15", "que_pregunto": "'En relación con el segmento D (= D2), señala la FALSA': a) desembocan las vías biliopancreáticas (cierta), b) fijo por la fascia retroduodenopancreática de Treitz (cierta), c) 'se relaciona con el uréter IZDO' → FALSA (es el uréter DERECHO), d) el mesocolon transverso se adhiere a su cara anterior separando supra/infracólico (cierta). Clave c."}, {"examen": "enero 2026", "pregunta": "P9", "imagen": 15, "clave": "d", "img_key": "enero-15", "que_pregunto": "'Señala la correcta': a) B = yeyuno (cierta), b) C = íleon (cierta), c) B y C son móviles, están detrás del delantal de los epiplones y fijos a la pared posterior por la raíz del mesenterio (cierta) → d) TODAS CORRECTAS."}], "pack": "Yeyuno-íleon: aa. yeyunales e ileales ← borde izquierdo de la AMS (L1) → arcadas → vasa recta; íleon terminal también ← rama ileal de la ileocólica. Venas: yeyunales/ileales → VMS → porta. Linfa: ganglios mesentéricos (yuxtaintestinales → intermedios → centrales) → mesentéricos superiores → tronco intestinal → cisterna de Pecquet. Inervación: vago (parasimpático) + esplácnicos T9-T11 vía plexo mesentérico superior; dolor referido periumbilical. Raíz del mesenterio: 15 cm, de la flexura duodenoyeyunal (izda de L2) a la unión ileocecal (FID), cruza D3, aorta, VCI, uréter dcho y psoas. D2: retroperitoneal secundario, fascia de Treitz; papila mayor a 8-10 cm del píloro.", "trampa": "Lateralidad del uréter/riñón en las relaciones de D2 (derecho); yeyuno vs íleon por su posición (izquierdo-alto / derecho-bajo) y pliegues; 'todas correctas'. La misma placa sirvió a 2 preguntas (P3 y P9) — puede volver a servir a otras 2 (irrigación de B/C: AMS; qué hay detrás de D3: aorta/VCI; pinza de Wilkie).", "prioridad": 3}, {"key": "S8-p12", "pagina": 12, "item": 11, "tipo": "tecnica", "titulo": "Enema opaco — preparación y técnica (bolsa de bario, sala de fluoroscopia, posición del paciente)", "que_se_ve": "Cuatro fotos/esquemas de la TÉCNICA del enema opaco: bolsa de sulfato de bario con su sistema colgada del pie de gotero (arriba-izda); sala de radiología con arco en C de fluoroscopia y mesa basculante (arriba-dcha); esquema del paciente en DECÚBITO LATERAL IZQUIERDO (posición de Sims) con la sonda rectal y el irrigador a 40 cm de altura, con el colon transverso, ascendente y descendente dibujados; y detalle de la introducción de la cánula rectal (flecha roja) siguiendo la curvatura del recto hacia el sacro. No hay números. Aviso: F2 §3.1 atribuye a 'S8 p12' el tránsito gastroduodenal A-F de la imagen 9 de enero; ese tránsito NO está en S8 — es Reto 2 dig p7 (1 D1 · 2 antro · 3 esófago · 4 fundus · 5 cuerpo · 6 flexura duodenoyeyunal · 7 D2).", "etiquetas": [{"n": "—", "nombre": "Bolsa de sulfato de bario + sistema (contraste rectal)", "rosa": false, "seguro": true}, {"n": "—", "nombre": "Sala de fluoroscopia con arco en C y mesa basculante", "rosa": false, "seguro": true}, {"n": "—", "nombre": "Paciente en decúbito lateral izquierdo (Sims); sonda rectal; irrigador a 40 cm (columna hidrostática baja para no perforar)", "rosa": false, "seguro": true}, {"n": "—", "nombre": "Cánula rectal introducida siguiendo la concavidad del sacro (flexura sacra)", "rosa": false, "seguro": true}], "pregunta": null, "examen": [], "pack": "Técnica: contraste único (bario) o doble (bario + aire) por vía rectal, con fluoroscopia y giro del paciente; llena recto → sigma → descendente → transverso → ascendente → ciego (puede refluir al íleon terminal por la válvula ileocecal). Contraindicado si sospecha de perforación (se usa contraste yodado hidrosoluble). Anatomía que enseña: recto (flexura sacra al introducir la cánula), lado izquierdo del paciente hacia abajo porque el sigma es izquierdo.", "trampa": "Preguntar qué posición o vía (rectal, decúbito lateral izdo); 'el enema opaco se administra por vía oral' (falso); confundir con el tránsito baritado (oral, para estómago-intestino delgado).", "prioridad": 1}, {"key": "S8-p13", "pagina": 13, "item": 12, "tipo": "identifica", "titulo": "Enema opaco de contraste único — marco cólico (Sobotta, leyenda 1-11 + placa grande)", "que_se_ve": "Izquierda: par de Sobotta (AP, enema opaco contraste único) con la leyenda 1-11: flexura hepática (1), transverso (2), ascendente (3), ciego (4), flexura esplénica (5, la más alta), descendente (6), haustras (7), contracciones peristálticas (8, 10), pliegues semilunares (9), sigmoide (11). Derecha: radiografía AP grande del marco cólico completo relleno de bario —ciego y ascendente a la derecha del paciente (izquierda de la imagen), transverso colgando en 'U', flexura esplénica alta, descendente, sigma redundante en la pelvis y recto. Esta placa grande es LITERALMENTE la imagen 16 de enero 2026 (letras A-F sobre cada segmento; la clave fue E + F = sigma y ciego).", "etiquetas": [{"n": "1", "nombre": "Flexura cólica hepática (derecha)", "rosa": true, "seguro": true, "nota": "Más baja que la esplénica; se relaciona con la cara visceral del hígado y el riñón dcho"}, {"n": "2", "nombre": "Colon transverso", "rosa": true, "seguro": true, "nota": "Intraperitoneal, meso propio (mesocolon transverso) pero anclado por lig. gastrocólico y frenocólicos; 2/3 AMS + 1/3 AMI (Cannon-Böhm)"}, {"n": "3", "nombre": "Colon ascendente", "rosa": true, "seguro": true, "nota": "Secundariamente retroperitoneal (fascia de Toldt dcha) → FIJO; a. cólica dcha e ileocólica"}, {"n": "4", "nombre": "Ciego", "rosa": true, "seguro": true, "nota": "Intraperitoneal y MÓVIL (se volvula si persiste mesocolon ascendente); FID; válvula ileocecal y apéndice; aa. cecales de la ileocólica"}, {"n": "5", "nombre": "Flexura cólica esplénica (izquierda)", "rosa": true, "seguro": true, "nota": "Más alta y aguda; lig. frenocólico izdo (sustentáculo del bazo); punto de Griffiths"}, {"n": "6", "nombre": "Colon descendente", "rosa": true, "seguro": true, "nota": "Secundariamente retroperitoneal (Toldt izda) → FIJO; a. cólica izda (AMI)"}, {"n": "7", "nombre": "Haustras", "rosa": false, "seguro": true, "nota": "Abombamientos entre pliegues semilunares por las tenias más cortas que el colon"}, {"n": "8", "nombre": "Contracción peristáltica", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Pliegues semilunares", "rosa": false, "seguro": true, "nota": "Los que separan las haustras; en enema se ven como muescas"}, {"n": "10", "nombre": "Contracción peristáltica", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Colon sigmoide", "rosa": true, "seguro": true, "nota": "Intraperitoneal con mesocolon sigmoideo largo → el que MÁS se volvula (adulto); aa. sigmoideas (AMI); dolor referido T12-L1"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P16", "imagen": 16, "clave": "d", "img_key": "enero-16", "que_pregunto": "'¿Qué segmentos se podrían volvular con mayor probabilidad?' a) A+B, b) B+C, c) C+D, d) E+F → clave d: sólo se vuelve lo que tiene meso largo y libre = SIGMA (vólvulo más frecuente) y CIEGO. Ascendente y descendente están fijos por las fascias de Toldt; el transverso tiene meso pero corto y anclado. Hay que saber qué letra cae sobre el sigma y cuál sobre el ciego en la placa (F2 y hojas-imagenes discrepan en si sigma=D o E; la clave oficial es E+F)."}], "pack": "Colon derecho (ciego, ascendente, 2/3 transverso) ← AMS: ileocólica, cólica dcha, cólica media; colon izquierdo (1/3 transverso, descendente, sigma) ← AMI: cólica izda, sigmoideas. Unión = a. marginal de Drummond + arco de Riolano. Venas homónimas → VMS (dcho) / VMI → esplénica (izdo) → porta. Linfa: epicólicos → paracólicos → intermedios → mesentéricos sup/inf. Inervación: vago hasta Cannon-Böhm, S2-S4 (esplácnicos pélvicos) después; simpático T10-L2. Peritoneo: ciego, transverso y sigma intraperitoneales con meso; ascendente y descendente secundariamente retroperitoneales (Toldt).", "trampa": "Elegir ascendente/descendente como volvulables; 'el colon transverso es retroperitoneal'; 'el ciego siempre está fijo'; flexura hepática más alta que la esplénica (es al revés). Con letras nuevas puede preguntar irrigación por segmento (AMS vs AMI) o cuál está fijo por Toldt.", "prioridad": 3}, {"key": "S8-p14", "pagina": 14, "item": 13, "tipo": "identifica", "titulo": "Enema de doble contraste — recto y canal anal: AP (leyenda 1-12) y LATERAL (leyenda 1-8) (Sobotta)", "que_se_ve": "Dos pares de Sobotta. Izquierda, proyección AP doble contraste (bario + aire): pliegue semilunar (1), colon ascendente (2), papila ileal (3), ciego (4), íleon terminal (5), recto (6), pliegue transverso del recto (7, válvula de Houston), sonda (8), conducto anal (9), transverso (10), sigmoide (11), ampolla rectal (12). Derecha, proyección LATERAL doble contraste: sigmoide (1), pliegue transverso del recto (2), ampolla rectal (3), sonda (4), sacro (5), flexura sacra del recto (6, concavidad anterior, apoyada en el sacro), cóccix (7), flexura perineal (8, anorrectal, convexidad anterior, ángulo de ~80° mantenido por el puborrectal). El panel LATERAL es LITERALMENTE la imagen 17 de enero 2026 (A = recto, B = flexura perineal, C = canal anal).", "etiquetas": [{"n": "1", "nombre": "[AP] Pliegue semilunar", "rosa": false, "seguro": true}, {"n": "2", "nombre": "[AP] Colon ascendente", "rosa": false, "seguro": true}, {"n": "3", "nombre": "[AP] Papila ileal (válvula ileocecal)", "rosa": true, "seguro": true, "nota": "Labio superior e inferior; frena el reflujo cecoileal"}, {"n": "4", "nombre": "[AP] Ciego", "rosa": false, "seguro": true}, {"n": "5", "nombre": "[AP] Íleon terminal", "rosa": true, "seguro": true, "nota": "El bario refluye al íleon a través de la válvula"}, {"n": "6", "nombre": "[AP] Recto", "rosa": true, "seguro": true, "nota": "12-15 cm desde S3 hasta el diafragma pélvico"}, {"n": "7", "nombre": "[AP] Pliegue transverso del recto (válvula de Houston)", "rosa": true, "seguro": true, "nota": "3 pliegues: superior y inferior izdos, medio dcho (de Kohlrausch)"}, {"n": "8", "nombre": "[AP] Sonda rectal", "rosa": false, "seguro": true}, {"n": "9", "nombre": "[AP] Conducto anal", "rosa": true, "seguro": true, "nota": "= C del examen: 2,5-3,5 cm, esfínter interno (liso, involuntario) + externo (estriado, pudendo)"}, {"n": "10", "nombre": "[AP] Colon transverso", "rosa": false, "seguro": true}, {"n": "11", "nombre": "[AP] Colon sigmoide", "rosa": false, "seguro": true}, {"n": "12", "nombre": "[AP] Ampolla rectal", "rosa": true, "seguro": true, "nota": "Porción dilatada del recto sobre el diafragma pélvico"}, {"n": "1 (lat)", "nombre": "[LAT] Colon sigmoide", "rosa": false, "seguro": true}, {"n": "2 (lat)", "nombre": "[LAT] Pliegue transverso del recto (Houston)", "rosa": false, "seguro": true}, {"n": "3 (lat)", "nombre": "[LAT] Ampolla del recto", "rosa": true, "seguro": true}, {"n": "4 (lat)", "nombre": "[LAT] Sonda", "rosa": false, "seguro": true}, {"n": "5 (lat)", "nombre": "[LAT] Sacro", "rosa": false, "seguro": true}, {"n": "6 (lat)", "nombre": "[LAT] Flexura sacra del recto", "rosa": true, "seguro": true, "nota": "= A del examen (recto con su flexura sacra): concavidad ANTERIOR, sigue la curva del sacro"}, {"n": "7 (lat)", "nombre": "[LAT] Cóccix", "rosa": false, "seguro": true}, {"n": "8 (lat)", "nombre": "[LAT] Flexura perineal (anorrectal) del recto", "rosa": true, "seguro": true, "nota": "= B del examen: convexidad anterior, ~80°, producida ACTIVAMENTE por el asa del m. puborrectal (continencia); por debajo empieza el conducto anal (C)"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P17", "imagen": 17, "clave": "d", "img_key": "enero-17", "que_pregunto": "Placa lateral con A-C: a) A = recto, b) B = flexura perineal, c) C = canal anal → d) TODAS CORRECTAS. Trampa de lectura: 'flexura' perineal, no 'fascia' perineal."}], "pack": "Recto y canal anal: a. rectal SUPERIOR ← AMI (terminal), a. rectal MEDIA ← ilíaca interna, a. rectal INFERIOR ← pudenda interna (← ilíaca interna) + sacra media (aorta). Venas: rectal superior → VMI → porta; medias e inferiores → ilíaca interna → cava (plexo hemorroidal = anastomosis portocava; hemorroides internas sobre la pectínea, externas debajo). Linfa: sobre la pectínea → mesentéricos inferiores e ilíacos internos; debajo → inguinales superficiales. Inervación: sobre la pectínea visceral (S2-S4 parasimpático + hipogástrico), indoloro; debajo somática (n. rectal inferior del pudendo, canal de Alcock), dolorosa. Peritoneo: 1/3 sup anterior y lateral, 1/3 medio anterior, 1/3 inf subperitoneal (fondo de saco de Douglas ♀ / rectovesical ♂ a 7,5 / 5-6 cm del ano).", "trampa": "Flexura sacra vs perineal (cuál es cóncava/convexa y quién la produce: puborrectal); 'fascia' por 'flexura'; línea pectínea como frontera de arteria/vena/linfa/nervio (formato 'todas correctas'); el recto SÍ tiene tenias/haustras (falso: las tenias se funden en una capa longitudinal continua).", "prioridad": 3}]}, "S9": {"fuente": "S9", "titulo": "Seminario S9 · Anatomía por técnicas de imagen III (TC abdominal por niveles)", "resumen_examen": "Fuente de prioridad BAJA: 0 imágenes en los exámenes de enero y mayo 2026 (F2 §3.2 lo pone como última prioridad). Son 8 láminas de TC axial con contraste (Weir-Abrahams) desde el diafragma hasta la pelvis, con listas de 39-61 estructuras. Si Bermúdez la usa, lo hará con el formato 'identifica el número X' o preguntando relaciones que se ven muy bien en el corte axial: porta detrás del cuello del páncreas, v. renal izda entre aorta y AMS, D3 detrás de la AMS, colédoco detrás de D1, caudado entre VCI y fisura del lig. venoso, segmentos hepáticos (Couinaud) según venas hepáticas, fascia de Gerota. Para el examen basta con dominar las 3 primeras diapositivas de técnica (planos, fases del contraste) y saber leer un corte a nivel de L1 (páncreas/hilio renal) y L3 (D3/pinza aortomesentérica).", "paginas": [{"key": "S9-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada — Seminario S9, Anatomía por técnicas de imagen III", "prioridad": 0}, {"key": "S9-p02", "pagina": 2, "item": null, "tipo": "tecnica", "titulo": "TAC abdominal · planos de reconstrucción: axial, coronal y sagital", "que_se_ve": "Esquema del TC helicoidal (tubo girando mientras la mesa avanza) y tres reconstrucciones del mismo abdomen: AXIAL (plano verde) a nivel de los riñones/L1, CORONAL (plano rojo, marcado A = anterior) con hígado, estómago, asas y pelvis, y SAGITAL (plano azul, marcado L) con columna, hígado y asas.", "etiquetas": [{"n": "axial", "nombre": "Corte transversal: se mira desde los PIES → la derecha del paciente queda a la IZQUIERDA de la imagen", "rosa": false, "seguro": true}, {"n": "coronal", "nombre": "Plano frontal: como una Rx AP, derecha del paciente a la izquierda de la imagen", "rosa": false, "seguro": true}, {"n": "sagital", "nombre": "Plano lateral: anterior a la izquierda de la imagen", "rosa": false, "seguro": true}], "examen": [], "pack": "Convención de lectura del TC axial: el paciente en supino visto desde los pies; anterior arriba, posterior (columna) abajo, DERECHA del paciente a la IZQUIERDA de la pantalla. Escala Hounsfield: aire −1000, grasa −100, agua 0, partes blandas +40-60, sangre/contraste +100-300, hueso +700-1000. TC helicoidal multicorte permite reconstrucciones multiplanares (MPR).", "trampa": "Invertir la lateralidad en el corte axial (el hígado está a la izquierda de la imagen = derecha del paciente).", "prioridad": 1}, {"key": "S9-p03", "pagina": 3, "item": null, "tipo": "tecnica", "titulo": "TAC abdominal · fases del contraste IV: simple, arterial, portal y tardía; técnicas especiales", "que_se_ve": "Cuatro cortes axiales al mismo nivel (L1, riñones/páncreas): FASE SIMPLE sin contraste (todo gris homogéneo), FASE ARTERIAL (aorta muy blanca, corteza renal realzada, hígado poco), FASE PORTAL (hígado y bazo homogéneamente realzados, venas visibles, riñón en nefrograma), FASE TARDÍA (contraste excretado en pelvis renal/uréteres; parénquimas se lavan). Lista: técnicas de contraste especiales — AngioTAC, dinámica pancreática/hepática/adrenal, UroTAC.", "etiquetas": [{"n": "Fase simple", "nombre": "Sin contraste IV: calcificaciones, litiasis, hemorragia aguda (hiperdensa)", "rosa": false, "seguro": true}, {"n": "Fase arterial", "nombre": "20-35 s: arterias (angioTAC), lesiones hipervasculares (hepatocarcinoma, tumores neuroendocrinos), fase corticomedular renal", "rosa": true, "seguro": true}, {"n": "Fase portal", "nombre": "60-70 s: máximo realce del hígado (75 % del flujo hepático es portal), venas porta/mesentérica/esplénica; fase estándar del TC abdominal; NEFROGRÁFICA en riñón (mejor para tumores renales)", "rosa": true, "seguro": true}, {"n": "Fase tardía", "nombre": "3-15 min: excreción renal (fase excretora/UroTAC), lavado de lesiones, hemangioma que se rellena", "rosa": false, "seguro": true}, {"n": "Especiales", "nombre": "AngioTAC · dinámica pancreática, hepática o adrenal (multifásica) · UroTAC", "rosa": false, "seguro": true}], "examen": [], "pack": "El hígado se realza sobre todo en fase PORTAL porque recibe ~75 % de su sangre por la porta (25 % por la a. hepática): un TC de abdomen 'de rutina' se hace en portal (fase venosa portal, como dice p4). La fase arterial sirve para arterias (angioTAC: aneurisma, sangrado activo) y lesiones hipervasculares. En riñón: corticomedular (arterial) → nefrográfica (portal-tardía, ~100 s; la mejor para masas) → excretora. Mismo concepto que el UroTAC de S10 p13-14 (cayó en mayo).", "trampa": "'La mejor fase para ver el parénquima hepático es la arterial' (falso: portal). 'Mejor fase para tumor renal = arterial' (falso: nefrográfica).", "prioridad": 2}, {"key": "S9-p04", "pagina": 4, "item": null, "tipo": "tecnica", "titulo": "TAC abdominal · plano axial del abdomen superior con contraste oral e IV en fase venosa portal — orientación ANT/POST/DER/IZQ", "que_se_ve": "Dibujo 3D de un corte axial del tronco (hígado a la derecha del paciente, estómago con contenido, bazo, riñones y columna) frente al TC axial correspondiente etiquetado ANT (arriba), POST (abajo), DER (izquierda de la imagen), IZQ (derecha de la imagen). Nivel: hígado, estómago con contraste oral y aire, bazo, ambos riñones (fase portal, nefrograma), aorta y VCI delante de la vértebra.", "etiquetas": [{"n": "ANT", "nombre": "Anterior = arriba de la imagen", "rosa": false, "seguro": true}, {"n": "POST", "nombre": "Posterior = abajo (columna, erectores)", "rosa": false, "seguro": true}, {"n": "DER", "nombre": "Derecha del paciente = IZQUIERDA de la imagen (hígado)", "rosa": false, "seguro": true}, {"n": "IZQ", "nombre": "Izquierda del paciente = DERECHA de la imagen (estómago, bazo)", "rosa": false, "seguro": true}], "examen": [], "pack": "Contraste ORAL (bario diluido/yodado) marca la luz digestiva en blanco para distinguir asas de masas/ganglios; contraste IV en fase portal realza parénquimas. En este nivel (T12-L1): hígado (dcha), estómago (izda, anterior) con aire en la parte anterior (paciente en supino: el aire sube a la parte más anterior = antro/cuerpo), bazo posterolateral izdo, riñones a ambos lados de la columna, aorta a la izda de la línea media delante de la vértebra y VCI a la dcha.", "trampa": "Lateralidad (ya está escrita en la diapo: es un regalo, no lo falles). Aorta IZDA / VCI DCHA en el corte.", "prioridad": 1}, {"key": "S9-p05", "pagina": 5, "item": 1, "tipo": "identifica", "titulo": "TC axial nivel 1 · abdomen superior alto (T10-T12): cúpulas, hiato esofágico, venas hepáticas, fundus, bazo, caudado (paneles a-d, lista 1-61)", "que_se_ve": "Cuatro cortes axiales en fase portal de arriba abajo: (a) nivel del hiato: esófago (32) entre hígado y fundus (14), venas hepáticas izda (25) y media (30) y dcha (20) confluyendo hacia la VCI, ácigos (4) y hemiácigos (18) junto a la aorta, bases pulmonares (50, 51), bazo (42), serrato (41); (b) segmentos hepáticos superiores 8 (61), 7 (60), 4A (56), 2 (54), diafragma (11), fascia subcutánea (45); (c) lóbulo hepático izdo (49) y dcho (39), caudado (53), VCI (19), dorsal ancho (22); (d) segmento anterior dcho (1), lateral izdo (21), medial izdo (29), a. gástrica izda (52), caudado (53), VCI (19), aorta (2), pilar dcho (37), pilar izdo (24), segmento posterior dcho (34), erectores (12).", "etiquetas": [{"n": "a-25", "nombre": "Vena hepática izquierda", "rosa": true, "seguro": true}, {"n": "a-30", "nombre": "Vena hepática media", "rosa": true, "seguro": true}, {"n": "a-20", "nombre": "Vena hepática derecha", "rosa": true, "seguro": true}, {"n": "a-32", "nombre": "Esófago", "rosa": true, "seguro": true}, {"n": "a-4", "nombre": "Vena ácigos", "rosa": false, "seguro": true, "nota": "Ácigos a la dcha de la aorta/esófago; hemiácigos a la izda: sistema de drenaje esofágico → varices."}, {"n": "a-14", "nombre": "Fundus del estómago", "rosa": false, "seguro": true}, {"n": "a-42", "nombre": "Bazo", "rosa": false, "seguro": true}, {"n": "a-41", "nombre": "Músculo serrato anterior", "rosa": false, "seguro": true}, {"n": "a-18", "nombre": "Vena hemiácigos", "rosa": false, "seguro": true}, {"n": "a-50", "nombre": "Lóbulo inferior del pulmón derecho", "rosa": false, "seguro": true}, {"n": "a-51", "nombre": "Lóbulo inferior del pulmón izquierdo", "rosa": false, "seguro": true}, {"n": "b-56", "nombre": "Segmento 4A del hígado (medial superior izquierdo)", "rosa": true, "seguro": true}, {"n": "b-54", "nombre": "Segmento 2 del hígado (lateral superior izquierdo)", "rosa": true, "seguro": true}, {"n": "b-61", "nombre": "Segmento 8 del hígado (anterior superior derecho)", "rosa": true, "seguro": true}, {"n": "b-60", "nombre": "Segmento 7 del hígado (posterior superior derecho)", "rosa": true, "seguro": true}, {"n": "b-11", "nombre": "Diafragma", "rosa": false, "seguro": true}, {"n": "b-45", "nombre": "Fascia subcutánea", "rosa": false, "seguro": true}, {"n": "c-49", "nombre": "Lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "c-39", "nombre": "Lóbulo hepático derecho", "rosa": false, "seguro": true}, {"n": "c-53", "nombre": "Segmento 1 del hígado (caudado)", "rosa": true, "seguro": true, "nota": "Lóbulo caudado: drena DIRECTO a la VCI (se hipertrofia en Budd-Chiari); entre VCI y fisura del lig. venoso."}, {"n": "c-19", "nombre": "Vena cava inferior", "rosa": true, "seguro": true, "nota": "VCI retrohepática: recibe las 3 venas hepáticas justo bajo el diafragma (T8)."}, {"n": "c-22", "nombre": "Músculo dorsal ancho", "rosa": false, "seguro": true}, {"n": "d-49", "nombre": "Lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "d-1", "nombre": "Segmento anterior del lóbulo hepático derecho", "rosa": false, "seguro": true}, {"n": "d-29", "nombre": "Segmento medial del lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "d-21", "nombre": "Segmento lateral del lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "d-52", "nombre": "Arteria gástrica izquierda", "rosa": true, "seguro": true, "nota": "A. gástrica izda: primera rama del tronco celíaco, va a la curvatura menor."}, {"n": "d-53", "nombre": "Segmento 1 del hígado (caudado)", "rosa": true, "seguro": true, "nota": "Lóbulo caudado: drena DIRECTO a la VCI (se hipertrofia en Budd-Chiari); entre VCI y fisura del lig. venoso."}, {"n": "d-19", "nombre": "Vena cava inferior", "rosa": false, "seguro": true, "nota": "VCI retrohepática: recibe las 3 venas hepáticas justo bajo el diafragma (T8)."}, {"n": "d-2", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "d-37", "nombre": "Pilar derecho del diafragma", "rosa": true, "seguro": true}, {"n": "d-24", "nombre": "Pilar izquierdo del diafragma", "rosa": true, "seguro": true}, {"n": "d-34", "nombre": "Segmento posterior del lóbulo hepático derecho", "rosa": false, "seguro": true}, {"n": "d-12", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}], "examen": [], "pack": "Venas hepáticas (dcha, media, izda) desembocan en la VCI justo bajo el diafragma (T8): la media separa lóbulo dcho/izdo (línea de Cantlie), la dcha separa segmentos anterior (5/8) y posterior (6/7), la izda separa 4 de 2/3. Caudado (S1) drena directo a la VCI. Hiato esofágico T10 formado por el pilar DCHO; aorta pasa por el hiato aórtico T12 con el conducto torácico y la ácigos. Ácigos a la dcha, hemiácigos a la izda de la aorta.", "trampa": "Confundir la ácigos (dcha) con la hemiácigos (izda); no reconocer el caudado entre la VCI y el lig. venoso; segmento 4A/4B (superior/inferior) vs 2/3.", "prioridad": 1}, {"key": "S9-p06", "pagina": 6, "item": 2, "tipo": "identifica", "titulo": "TC axial nivel 2 · T12-L1: tronco celíaco, porta, esplénica, curvaturas, vesícula, suprarrenales, polos renales superiores (paneles e-h, lista 1-61)", "que_se_ve": "(e) segmento 3 (55), a. esplénica (43) hacia la cola del páncreas (46); (f) yeyuno (16), curvatura menor (28), porta (33) entrando en el hilio, flexura esplénica (23); (g) segmento 4B (57), fisura del falciforme (13), cuello del páncreas (31), VCI (19), aorta (2), suprarrenal izda (27), suprarrenal dcha (40), cuerpo vertebral (7), saco tecal (47); (h) cuerpo gástrico (6) con aire anterior, colon transverso (48), segmento 5 (58), vesícula (15), D2 (10), cabeza del páncreas (17), v. esplénica (44), cuerpo del páncreas (5), a. hepática común (9), tronco celíaco (8), riñón dcho (38), segmento 6 (59), dorsal ancho (22), corteza renal (35), riñón izdo (26), colon descendente (3), fascia de Gerota (36), erectores (12).", "etiquetas": [{"n": "e-55", "nombre": "Segmento 3 del hígado (lateral inferior izquierdo)", "rosa": false, "seguro": true}, {"n": "e-43", "nombre": "Arteria esplénica", "rosa": true, "seguro": true}, {"n": "e-46", "nombre": "Cola del páncreas", "rosa": true, "seguro": true}, {"n": "f-16", "nombre": "Curvatura mayor del estómago", "rosa": false, "seguro": true}, {"n": "f-28", "nombre": "Curvatura menor del estómago", "rosa": true, "seguro": true}, {"n": "f-33", "nombre": "Vena porta", "rosa": true, "seguro": true, "nota": "Porta = VMS + esplénica detrás del cuello del páncreas; en el ligamento hepatoduodenal es POSTERIOR a colédoco (dcha) y hepática propia (izda)."}, {"n": "f-23", "nombre": "Flexura cólica izquierda (esplénica)", "rosa": false, "seguro": true}, {"n": "g-57", "nombre": "Segmento 4B del hígado (medial inferior izquierdo)", "rosa": false, "seguro": true}, {"n": "g-13", "nombre": "Fisura del ligamento falciforme", "rosa": true, "seguro": true, "nota": "Falciforme: separa segmento 4 (medial) del 2/3 (lateral); lleva el lig. redondo."}, {"n": "g-31", "nombre": "Cuello del páncreas", "rosa": true, "seguro": true}, {"n": "g-19", "nombre": "Vena cava inferior", "rosa": false, "seguro": true, "nota": "VCI retrohepática: recibe las 3 venas hepáticas justo bajo el diafragma (T8)."}, {"n": "g-2", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "g-27", "nombre": "Glándula suprarrenal izquierda", "rosa": true, "seguro": true}, {"n": "g-40", "nombre": "Glándula suprarrenal derecha", "rosa": true, "seguro": true}, {"n": "g-7", "nombre": "Cuerpo vertebral", "rosa": false, "seguro": true}, {"n": "g-47", "nombre": "Saco tecal (dural)", "rosa": false, "seguro": true}, {"n": "h-6", "nombre": "Cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "h-48", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "h-58", "nombre": "Segmento 5 del hígado (anterior inferior derecho)", "rosa": false, "seguro": true}, {"n": "h-15", "nombre": "Vesícula biliar", "rosa": true, "seguro": true}, {"n": "h-10", "nombre": "Duodeno, porción descendente (2ª)", "rosa": true, "seguro": true}, {"n": "h-17", "nombre": "Cabeza del páncreas", "rosa": true, "seguro": true}, {"n": "h-44", "nombre": "Vena esplénica", "rosa": true, "seguro": true}, {"n": "h-9", "nombre": "Arteria hepática común", "rosa": true, "seguro": true}, {"n": "h-8", "nombre": "Tronco celíaco", "rosa": true, "seguro": true}, {"n": "h-5", "nombre": "Cuerpo del páncreas", "rosa": true, "seguro": true}, {"n": "h-38", "nombre": "Riñón derecho", "rosa": false, "seguro": true}, {"n": "h-59", "nombre": "Segmento 6 del hígado (posterior inferior derecho)", "rosa": false, "seguro": true}, {"n": "h-22", "nombre": "Músculo dorsal ancho", "rosa": false, "seguro": true}, {"n": "h-35", "nombre": "Corteza renal", "rosa": false, "seguro": true}, {"n": "h-26", "nombre": "Riñón izquierdo", "rosa": false, "seguro": true}, {"n": "h-3", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "h-36", "nombre": "Fascia renal (Gerota)", "rosa": true, "seguro": true, "nota": "Fascia de Gerota: separa grasa perirrenal de pararrenal."}, {"n": "h-12", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}], "examen": [], "pack": "Tronco celíaco (T12): gástrica izda + hepática común + esplénica. La ESPLÉNICA corre tortuosa por el borde superior del páncreas hasta el hilio esplénico; la v. esplénica va por DETRÁS del cuerpo del páncreas y se une a la VMS detrás del cuello → PORTA. Hepática común → gastroduodenal (detrás de D1) + hepática propia (en el ligamento hepatoduodenal, izda del colédoco, delante de la porta). Suprarrenales: la dcha detrás de la VCI, en forma de coma; la izda semilunar, medial al polo superior del riñón izdo, detrás del páncreas/esplénica. Vesícula en la cara visceral del hígado entre S4B y S5; irrigada por la a. cística (hepática dcha, triángulo de Calot).", "trampa": "Confundir la a. esplénica (superior al páncreas, tortuosa) con la v. esplénica (posterior al páncreas, recta); situar la suprarrenal dcha delante de la VCI (va detrás); creer que el tronco celíaco sale a nivel de L1 (es T12; la AMS es L1).", "prioridad": 1}, {"key": "S9-p07", "pagina": 7, "item": 3, "tipo": "identifica", "titulo": "TC axial nivel 3 · L1 (plano transpilórico): páncreas completo, colédoco, Wirsung, v. renal izda, hilios renales, píloro y D1 (paneles a-d, lista 1-57)", "que_se_ve": "(a) corte por el cuerpo gástrico (5) y curvatura menor (25 en b), fisura del lig. venoso (12), segmento lateral (17) y medial (26) del lóbulo izdo, colédoco (7) en la cabeza pancreática, cuello (28), conducto pancreático (29, flecha), v. porta (32), v. esplénica (49), cuerpo del páncreas (4), cola (53), suprarrenal izda (24), aorta (2), suprarrenal dcha (47), v. hepática media (27) y dcha (42), segmento posterior (33), flexura esplénica (19), serrato (48); (b) píloro (57, flecha), porción pilórica (35), curvatura menor (25), vesícula (13), D1 (50), v. hepática dcha (42), flexura hepática (40), pilar dcho (41); (c) cabeza del páncreas (14), AMS (51), pilar izdo (20); (d) yeyuno (16), D2 (8), VCI (15), cuerpo vertebral (6), riñón dcho (43), riñón izdo (21), colon descendente (9), erectores (10), dorsal ancho (18).", "etiquetas": [{"n": "a-12", "nombre": "Fisura del ligamento venoso (Arancio)", "rosa": false, "seguro": true, "nota": "Fisura del lig. venoso (Arancio): separa el caudado del lóbulo izdo; inserción del omento menor."}, {"n": "a-17", "nombre": "Segmento lateral del lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "a-26", "nombre": "Segmento medial del lóbulo hepático izquierdo", "rosa": false, "seguro": true}, {"n": "a-5", "nombre": "Cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "a-1", "nombre": "Segmento anterior del lóbulo hepático derecho", "rosa": false, "seguro": true}, {"n": "a-29", "nombre": "Conducto pancreático (Wirsung)", "rosa": true, "seguro": true, "nota": "Wirsung: se une al colédoco en la ampolla de Vater (papila mayor de D2)."}, {"n": "a-28", "nombre": "Cuello del páncreas", "rosa": true, "seguro": true, "nota": "Cuello del páncreas: delante de la confluencia VMS-esplénica = origen de la porta (L1)."}, {"n": "a-7", "nombre": "Conducto colédoco", "rosa": true, "seguro": true, "nota": "Colédoco: pasa por DETRÁS de D1 y por la cabeza del páncreas hasta la papila; a la dcha de la hepática propia y delante de la porta."}, {"n": "a-32", "nombre": "Vena porta", "rosa": true, "seguro": true}, {"n": "a-49", "nombre": "Vena esplénica", "rosa": true, "seguro": true}, {"n": "a-4", "nombre": "Cuerpo del páncreas", "rosa": true, "seguro": true}, {"n": "a-27", "nombre": "Vena hepática media", "rosa": false, "seguro": true}, {"n": "a-42", "nombre": "Vena hepática derecha", "rosa": false, "seguro": true}, {"n": "a-47", "nombre": "Glándula suprarrenal derecha", "rosa": true, "seguro": true}, {"n": "a-2", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "a-24", "nombre": "Glándula suprarrenal izquierda", "rosa": true, "seguro": true}, {"n": "a-53", "nombre": "Cola del páncreas", "rosa": true, "seguro": true}, {"n": "a-33", "nombre": "Segmento posterior del lóbulo hepático derecho", "rosa": false, "seguro": true}, {"n": "a-19", "nombre": "Flexura cólica izquierda (esplénica)", "rosa": false, "seguro": true}, {"n": "a-48", "nombre": "Músculo serrato anterior", "rosa": false, "seguro": true}, {"n": "b-57", "nombre": "Píloro", "rosa": true, "seguro": true}, {"n": "b-35", "nombre": "Porción pilórica del estómago", "rosa": false, "seguro": true}, {"n": "b-25", "nombre": "Curvatura menor del estómago", "rosa": false, "seguro": true}, {"n": "b-13", "nombre": "Vesícula biliar", "rosa": true, "seguro": true}, AMS) y ramas pancreáticas de la esplénica (dorsal, magna). Linfa → pancreaticoesplénicos/celíacos/mesentéricos superiores.", "trampa": "Situar el colédoco DELANTE de D1 (va detrás); confundir cuello (delante de la porta) con cuerpo (delante de la AMS/aorta); pensar que la cola es retroperitoneal (está en el lig. esplenorrenal con los vasos esplénicos).", "prioridad": 1}, {"key": "S9-p08", "pagina": 8, "item": 4, "tipo": "identifica", "titulo": "TC axial nivel 4 · L1-L2: VMS, vasos renales, pelvis renal, hilio renal completo, grasa peri/pararrenal y Gerota (paneles e-h, lista 1-57)", "que_se_ve": "(e) VMS (52) delante del proceso uncinado, saco tecal (54); (f) pelvis renal izda (39); (g) aorta (2), a. renal izda (22) y v. renal izda (23) cruzando hacia la VCI; (h) recto del abdomen (36), colon transverso (55, dos veces), oblicuo externo (11), VCI (15), a. renal dcha (45) detrás de la VCI, v. renal dcha (46), colon ascendente (3), grasa perirrenal (31), grasa pararrenal (30), cuerpo vertebral (6), psoas (34), grasa del seno renal (56), corteza renal (37), fascia renal (38), colon descendente (9), erectores (10).", "etiquetas": [{"n": "e-52", "nombre": "Vena mesentérica superior", "rosa": true, "seguro": true}, {"n": "e-54", "nombre": "Saco tecal (dural)", "rosa": false, "seguro": true}, {"n": "f-39", "nombre": "Pelvis renal", "rosa": true, "seguro": true, "nota": "Pelvis renal: L1-L2; hilio: vena (delante) - arteria - pelvis (detrás)."}, {"n": "g-2", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "g-23", "nombre": "Vena renal izquierda", "rosa": true, "seguro": true, "nota": "V. renal izda: pasa ENTRE aorta y AMS (cascanueces); recibe la v. testicular/ovárica y la suprarrenal izdas."}, {"n": "g-22", "nombre": "Arteria renal izquierda", "rosa": true, "seguro": true}, {"n": "h-36", "nombre": "Músculo recto del abdomen", "rosa": false, "seguro": true}, {"n": "h-55", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "h-11", "nombre": "Músculo oblicuo externo", "rosa": false, "seguro": true}, {"n": "h-15", "nombre": "Vena cava inferior", "rosa": false, "seguro": true}, {"n": "h-45", "nombre": "Arteria renal derecha", "rosa": true, "seguro": true}, {"n": "h-46", "nombre": "Vena renal derecha", "rosa": true, "seguro": true}, {"n": "h-3", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "h-31", "nombre": "Grasa perirrenal", "rosa": true, "seguro": true, "nota": "Grasa perirrenal: dentro de Gerota; pararrenal fuera."}, {"n": "h-30", "nombre": "Grasa pararrenal", "rosa": true, "seguro": true}, {"n": "h-6", "nombre": "Cuerpo vertebral", "rosa": false, "seguro": true}, {"n": "h-34", "nombre": "Músculo psoas mayor", "rosa": false, "seguro": true}, {"n": "h-56", "nombre": "Grasa del seno renal", "rosa": true, "seguro": true}, {"n": "h-37", "nombre": "Corteza renal", "rosa": false, "seguro": true}, {"n": "h-38", "nombre": "Fascia renal (Gerota)", "rosa": true, "seguro": true}, {"n": "h-9", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "h-10", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}], "examen": [], "pack": "Hilio renal (L1-L2, izdo algo más alto): de delante atrás VENA - ARTERIA - PELVIS. A. renal DCHA más larga, pasa por DETRÁS de la VCI. V. renal IZDA más larga, pasa por DELANTE de la aorta y por DETRÁS de la AMS (cascanueces) y recibe la v. suprarrenal y la gonadal izdas (la gonadal dcha va directa a la VCI). Fascia renal (Gerota) envuelve riñón + suprarrenal + grasa PERIrrenal; fuera queda la grasa PARArrenal (posterior, entre Gerota y la fascia transversalis). Irrigación arterial segmentaria (5 segmentos, arterias terminales). Linfa → lumbares (paraaórticos). Inervación: plexo renal (T10-L1; dolor referido lumbar/inguinal).", "trampa": "'La a. renal izda pasa detrás de la VCI' (es la DERECHA); orden del hilio; qué vena gonadal drena en la renal (la IZQUIERDA).", "prioridad": 1}, {"key": "S9-p09", "pagina": 9, "item": 5, "tipo": "identifica", "titulo": "TC axial nivel 5 · L2-L3: pinza aortomesentérica (AMS/VMS delante de D3-D4), Treitz, vasos renales dchos, vasos testiculares izdos (paneles a-d, lista 1-39)", "que_se_ve": "(a) colon transverso (32), AMS (29, flecha) y VMS (30) por delante del duodeno ascendente (38) y la flexura duodenoyeyunal (39), pilar dcho (25), aorta (1), pilar izdo (14), pelvis renal izda (23), flexura esplénica (13), flexura hepática (24), a. renal dcha (27, flecha), riñón dcho (26); (b) D2 (3), v. renal dcha (28), pilar dcho (25); (c) yeyuno (11), D3 horizontal (7) cruzando entre aorta y AMS, colon descendente (4), erectores (5); (d) colon transverso (32), oblicuo externo (6), VCI (9), aorta (1), v. testicular izda (34, flecha) y a. testicular izda (33, flecha), grasa perirrenal (17), riñón izdo (15), grasa pararrenal (16), dorsal ancho (12), corteza renal (21), fascia renal (22).", "etiquetas": [{"n": "a-32", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "a-29", "nombre": "Arteria mesentérica superior", "rosa": true, "seguro": true, "nota": "AMS rodeada de grasa entre páncreas (delante) y D3 (detrás)."}, {"n": "a-30", "nombre": "Vena mesentérica superior", "rosa": true, "seguro": true}, {"n": "a-38", "nombre": "Duodeno, porción ascendente (4ª)", "rosa": true, "seguro": true}, {"n": "a-39", "nombre": "Flexura duodenoyeyunal (Treitz)", "rosa": true, "seguro": true, "nota": "Treitz: L2 izda, músculo suspensorio del duodeno; límite intestino anterior/medio embrionario."}, {"n": "a-25", "nombre": "Pilar derecho del diafragma", "rosa": false, "seguro": true}, {"n": "a-1", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "a-14", "nombre": "Pilar izquierdo del diafragma", "rosa": false, "seguro": true}, {"n": "a-23", "nombre": "Pelvis renal", "rosa": false, "seguro": true, "nota": "Pelvis renal: la de la izda ligeramente más alta."}, {"n": "a-13", "nombre": "Flexura cólica izquierda (esplénica)", "rosa": false, "seguro": true}, {"n": "a-24", "nombre": "Flexura cólica derecha (hepática)", "rosa": false, "seguro": true}, {"n": "a-27", "nombre": "Arteria renal derecha", "rosa": true, "seguro": true}, {"n": "a-26", "nombre": "Riñón derecho", "rosa": false, "seguro": true}, {"n": "b-3", "nombre": "Duodeno, porción descendente (2ª)", "rosa": true, "seguro": true}, {"n": "b-28", "nombre": "Vena renal derecha", "rosa": true, "seguro": true}, {"n": "b-25", "nombre": "Pilar derecho del diafragma", "rosa": false, "seguro": true}, {"n": "c-11", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "c-7", "nombre": "Duodeno, porción horizontal (3ª)", "rosa": true, "seguro": true, "nota": "D3 cruza L3 por delante de aorta y VCI y por DETRÁS de la AMS/VMS."}, {"n": "c-4", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "c-5", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}, {"n": "d-32", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "d-6", "nombre": "Músculo oblicuo externo", "rosa": false, "seguro": true}, {"n": "d-9", "nombre": "Vena cava inferior", "rosa": false, "seguro": true}, {"n": "d-1", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "d-34", "nombre": "Vena testicular izquierda", "rosa": true, "seguro": true}, {"n": "d-33", "nombre": "Arteria testicular izquierda", "rosa": true, "seguro": true, "nota": "Testicular izda: nace de la aorta (L2); la vena izda drena en la RENAL izda (varicocele izdo)."}, {"n": "d-17", "nombre": "Grasa perirrenal", "rosa": true, "seguro": true}, {"n": "d-15", "nombre": "Riñón izquierdo", "rosa": false, "seguro": true}, {"n": "d-16", "nombre": "Grasa pararrenal", "rosa": true, "seguro": true}, {"n": "d-12", "nombre": "Músculo dorsal ancho", "rosa": false, "seguro": true}, {"n": "d-21", "nombre": "Corteza renal", "rosa": false, "seguro": true}, {"n": "d-22", "nombre": "Fascia renal (Gerota)", "rosa": true, "seguro": true}], "examen": [], "pack": "AMS (L1) desciende por delante del proceso uncinado y de D3 y por detrás del cuello del páncreas, con la VMS a su DERECHA; entre AMS y aorta quedan pinzadas la v. renal izda (arriba) y D3 (abajo) → síndrome de Wilkie. D4 asciende a la izda de la aorta hasta Treitz (L2). Ramas de la AMS: pancreaticoduodenal inferior, yeyunales e ileales (izda), ileocólica, cólica dcha, cólica media (dcha). Vasos gonadales: a. testicular ← aorta L2, desciende sobre el psoas cruzando por delante del uréter; v. testicular izda → v. renal izda (varicocele izdo por drenaje en ángulo recto); dcha → VCI.", "trampa": "VMS a la derecha de la AMS (no a la izda); Treitz a la izda de L2; v. gonadal izda en la renal (dcha en la VCI).", "prioridad": 1}, {"key": "S9-p10", "pagina": 10, "item": 6, "tipo": "identifica", "titulo": "TC axial nivel 6 · L3: polos renales inferiores, psoas y cuadrado lumbar, 12ª costilla, yeyuno vs íleon, pared abdominal (paneles e-h, lista 1-39)", "que_se_ve": "(e) colon transverso (32), colon descendente (4), psoas (18), cuadrado lumbar (19), fascia renal (22); (f) 12ª costilla (36, flecha); (g) colon ascendente (2), yeyuno (11) con pliegues, saco tecal (31), erectores (5); (h) recto del abdomen (20), transverso del abdomen (35), oblicuo interno (10), íleon (8), VCI (9), psoas (18), cuadrado lumbar (19), fascia subcutánea (37).", "etiquetas": [{"n": "e-32", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "e-4", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "e-18", "nombre": "Músculo psoas mayor", "rosa": true, "seguro": true}, {"n": "e-22", "nombre": "Fascia renal (Gerota)", "rosa": false, "seguro": true}, {"n": "e-19", "nombre": "Músculo cuadrado lumbar", "rosa": true, "seguro": true, "nota": "Cuadrado lumbar: lateral al psoas, detrás del riñón y del colon."}, {"n": "f-36", "nombre": "12ª costilla", "rosa": true, "seguro": true}, {"n": "g-11", "nombre": "Yeyuno", "rosa": true, "seguro": true}, {"n": "g-2", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "g-31", "nombre": "Saco tecal (dural)", "rosa": false, "seguro": true}, {"n": "g-5", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}, {"n": "h-20", "nombre": "Músculo recto del abdomen", "rosa": false, "seguro": true}, {"n": "h-35", "nombre": "Músculo transverso del abdomen", "rosa": true, "seguro": true}, {"n": "h-8", "nombre": "Íleon", "rosa": true, "seguro": true}, {"n": "h-10", "nombre": "Músculo oblicuo interno", "rosa": true, "seguro": true}, {"n": "h-9", "nombre": "Vena cava inferior", "rosa": false, "seguro": true}, {"n": "h-18", "nombre": "Músculo psoas mayor", "rosa": false, "seguro": true}, {"n": "h-19", "nombre": "Músculo cuadrado lumbar", "rosa": false, "seguro": true, "nota": "Cuadrado lumbar: lateral al psoas, detrás del riñón y del colon."}, {"n": "h-37", "nombre": "Fascia subcutánea", "rosa": false, "seguro": true}], "examen": [], "pack": "Pared posterior: psoas mayor (medial, sobre los cuerpos vertebrales; el uréter y los vasos gonadales descienden sobre él), cuadrado lumbar (lateral, de la 12ª costilla a la cresta ilíaca; detrás del riñón/colon), erectores (detrás de las apófisis transversas). Pared anterolateral de fuera adentro: oblicuo externo → oblicuo interno → transverso; recto del abdomen anterior en su vaina. Yeyuno vs íleon en TC: yeyuno en el cuadrante superior izdo, pared gruesa con válvulas conniventes; íleon en cuadrante inferior dcho, pared fina, asas 'vacías'. Riñón: polo inferior a L3, 2-3 cm por encima de la cresta.", "trampa": "Confundir psoas (medial) con cuadrado lumbar (lateral); qué asa tiene válvulas conniventes visibles (yeyuno).", "prioridad": 1}, {"key": "S9-p11", "pagina": 11, "item": 7, "tipo": "identifica", "titulo": "TC axial nivel 7 · L3-L4: AMI, arterias lumbares, íleon/yeyuno, ramas yeyunales de la AMS, uréter dcho, pared abdominal (paneles a-d, lista 1-39)", "que_se_ve": "(a) colon transverso (5), yeyuno (13), ramas yeyunales de la AMS (32, dos veces), aorta (1), cuerpo vertebral (16), dorsal ancho (9); (b) colon transverso (5), colon ascendente (3), a. lumbar (21, flecha) saliendo de la cara posterior de la aorta, 12ª costilla (15), erectores (23); (c) colon ascendente (3), VCI (2), AMI (17, flecha) naciendo de la aorta, colon descendente (4); (d) recto del abdomen (18), yeyuno (13), íleon (14), AMI (17, flecha), VCI (2), aorta (1), uréter dcho (37, flecha) sobre el psoas, psoas dcho (7), psoas izdo (6), cuadrado lumbar (8), transverso (12), oblicuo interno (10), oblicuo externo (11).", "etiquetas": [{"n": "a-5", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "a-13", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "a-32", "nombre": "Ramas yeyunales de la arteria mesentérica superior", "rosa": true, "seguro": true}, {"n": "a-1", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "a-16", "nombre": "Cuerpo vertebral", "rosa": false, "seguro": true, "nota": "La bifurcación aórtica es en L4 (plano supracrestal)."}, {"n": "a-9", "nombre": "Músculo dorsal ancho", "rosa": false, "seguro": true}, {"n": "b-5", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "b-3", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "b-21", "nombre": "Arteria lumbar", "rosa": true, "seguro": true}, {"n": "b-15", "nombre": "12ª costilla", "rosa": false, "seguro": true}, {"n": "b-23", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}, {"n": "c-17", "nombre": "Arteria mesentérica inferior", "rosa": true, "seguro": true, "nota": "AMI: nace de la aorta a nivel de L3, a la izda, a 3-4 cm de la bifurcación."}, {"n": "c-2", "nombre": "Vena cava inferior", "rosa": false, "seguro": true}, {"n": "c-3", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "c-4", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "d-18", "nombre": "Músculo recto del abdomen", "rosa": false, "seguro": true}, {"n": "d-13", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "d-14", "nombre": "Íleon", "rosa": false, "seguro": true}, {"n": "d-17", "nombre": "Arteria mesentérica inferior", "rosa": true, "seguro": true, "nota": "AMI: nace de la aorta a nivel de L3, a la izda, a 3-4 cm de la bifurcación."}, {"n": "d-2", "nombre": "Vena cava inferior", "rosa": false, "seguro": true}, {"n": "d-1", "nombre": "Aorta", "rosa": false, "seguro": true}, {"n": "d-37", "nombre": "Uréter derecho", "rosa": true, "seguro": true}, {"n": "d-12", "nombre": "Músculo transverso del abdomen", "rosa": false, "seguro": true}, {"n": "d-11", "nombre": "Músculo oblicuo externo", "rosa": false, "seguro": true}, {"n": "d-10", "nombre": "Músculo oblicuo interno", "rosa": false, "seguro": true}, {"n": "d-7", "nombre": "Músculo psoas derecho", "rosa": true, "seguro": true}, {"n": "d-6", "nombre": "Músculo psoas izquierdo", "rosa": true, "seguro": true}, {"n": "d-8", "nombre": "Músculo cuadrado lumbar", "rosa": false, "seguro": true}], "examen": [], "pack": "AMI: nace de la cara anterior izda de la aorta en L3 → cólica izda (flexura esplénica/descendente), sigmoideas y rectal superior; su vena (VMI) sube a la izda para unirse a la esplénica. Arterias lumbares (4 pares) salen de la cara posterior de la aorta. Uréter: retroperitoneal sobre el psoas, medial a los vasos gonadales, cruza la bifurcación ilíaca (estrechamiento medio) tras la unión pieloureteral. Aorta a la izda de la VCI, ambas delante de los cuerpos vertebrales; la VCI se forma en L5.", "trampa": "Nivel de la AMI (L3) vs AMS (L1) vs celíaco (T12); el uréter cruza los vasos ilíacos por DELANTE.", "prioridad": 1}, {"key": "S9-p12", "pagina": 12, "item": 8, "tipo": "identifica", "titulo": "TC axial nivel 8 · L4-L5: bifurcación aórtica e ilíacas comunes, ombligo, ciego/apéndice/íleon terminal, vasos testiculares, uréter izdo, hueso ilíaco (paneles e-h, lista 1-39)", "que_se_ve": "(e) ombligo (24), íleon (14), ramas ileales de la AMS (33), apéndice (30, flecha) junto al ciego; (f) a. ilíaca común dcha (25) e izda (27, flechas) tras la bifurcación, vasos testiculares dchos (38, flecha), a. ileocólica (31), colon descendente (4); (g) recto del abdomen (18), colon transverso (5), íleon (14), colon ascendente (3), a. apendicular (19), a. testicular izda (34, flecha), v. testicular izda (35, flecha), uréter izdo (36, flecha), yeyuno (13), psoas dcho (7), v. lumbar (20, flecha), cuerpo vertebral (16), psoas izdo (6), cuadrado lumbar (8), erectores (23), colon descendente (4); (h) ciego (29), íleon terminal (39), v. ilíaca común dcha (26, flecha), v. ilíaca común izda (28, flecha) pasando detrás de la a. ilíaca común dcha, hueso ilíaco (22).", "etiquetas": [{"n": "e-24", "nombre": "Ombligo", "rosa": false, "seguro": true}, {"n": "e-14", "nombre": "Íleon", "rosa": false, "seguro": true}, {"n": "e-33", "nombre": "Ramas ileales de la arteria mesentérica superior", "rosa": true, "seguro": true}, {"n": "e-30", "nombre": "Apéndice vermiforme", "rosa": true, "seguro": true, "nota": "Apéndice: base en la confluencia de las tenias del ciego; a. apendicular ← ileocólica ← AMS."}, {"n": "f-38", "nombre": "Vasos testiculares derechos", "rosa": true, "seguro": true}, {"n": "f-25", "nombre": "Arteria ilíaca común derecha", "rosa": true, "seguro": true}, {"n": "f-27", "nombre": "Arteria ilíaca común izquierda", "rosa": true, "seguro": true}, {"n": "f-31", "nombre": "Arteria ileocólica", "rosa": true, "seguro": true, "nota": "Ileocólica: última rama derecha de la AMS; da apendicular, cecales, cólica."}, {"n": "f-4", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "g-18", "nombre": "Músculo recto del abdomen", "rosa": false, "seguro": true}, {"n": "g-5", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "g-14", "nombre": "Íleon", "rosa": false, "seguro": true}, {"n": "g-3", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "g-19", "nombre": "Arteria apendicular", "rosa": true, "seguro": true, "nota": "A. apendicular: rama de la ileocólica, en el mesoapéndice."}, {"n": "g-34", "nombre": "Arteria testicular izquierda", "rosa": true, "seguro": true}, {"n": "g-36", "nombre": "Uréter izquierdo", "rosa": true, "seguro": true, "nota": "Uréter: desciende sobre el psoas, cruza los vasos ilíacos a la altura de la bifurcación (referencia en TC)."}, {"n": "g-13", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "g-7", "nombre": "Músculo psoas derecho", "rosa": false, "seguro": true}, {"n": "g-20", "nombre": "Vena lumbar", "rosa": false, "seguro": true}, {"n": "g-16", "nombre": "Cuerpo vertebral", "rosa": false, "seguro": true, "nota": "La bifurcación aórtica es en L4 (plano supracrestal)."}, {"n": "g-35", "nombre": "Vena testicular izquierda", "rosa": true, "seguro": true}, {"n": "g-6", "nombre": "Músculo psoas izquierdo", "rosa": false, "seguro": true}, {"n": "g-4", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "g-8", "nombre": "Músculo cuadrado lumbar", "rosa": false, "seguro": true}, {"n": "g-23", "nombre": "Músculos erectores de la columna", "rosa": false, "seguro": true}, {"n": "h-39", "nombre": "Íleon terminal", "rosa": true, "seguro": true}, {"n": "h-29", "nombre": "Ciego", "rosa": true, "seguro": true}, {"n": "h-26", "nombre": "Vena ilíaca común derecha", "rosa": true, "seguro": true, "nota": "La v. ilíaca común izda pasa por DETRÁS de la a. ilíaca común dcha (síndrome de May-Thurner); las ilíacas se unen en L5 para formar la VCI."}, {"n": "h-28", "nombre": "Vena ilíaca común izquierda", "rosa": true, "seguro": true}, {"n": "h-22", "nombre": "Hueso ilíaco", "rosa": false, "seguro": true}], "examen": [], "pack": "Bifurcación aórtica en L4 (plano supracrestal, a nivel del ombligo) en ilíacas comunes; VCI se forma en L5 por la unión de las ilíacas comunes, con la izda pasando por DETRÁS de la a. ilíaca común dcha (May-Thurner). Ciego en fosa ilíaca dcha, con la válvula ileocecal e íleon terminal entrando por su cara medial; apéndice en la confluencia de las tenias (posición retrocecal

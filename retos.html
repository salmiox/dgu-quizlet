 "S11-p16", "S11-p17", "S11-p18", "S11-p19", "S11-p20", "S11-p21", "S11-p22", "S11-p23", "S11-p24", "S11-p25", "S11-p26", "S11-p27", "S7-p02", "S7-p03", "S7-p04", "S7-p05", "S7-p06", "S7-p07", "S7-p08", "S7-p09", "S7-p10", "S7-p11", "S7-p12", "S7-p13", "S7-p14", "S7-p15", "S7-p16", "S7-p17", "S7-p18", "S8-p02", "S8-p03", "S8-p04", "S8-p05", "S8-p06", "S8-p07", "S8-p08", "S8-p09", "S8-p10", "S8-p11", "S8-p12", "S8-p13", "S8-p14", "S9-p02", "S9-p03", "S9-p04", "S9-p05", "S9-p06", "S9-p07", "S9-p08", "S9-p09", "S9-p10", "S9-p11", "S9-p12"], "examimg": ["enero-01", "enero-02", "enero-03", "enero-04", "enero-05", "enero-06", "enero-07", "enero-08", "enero-09", "enero-10", "enero-11", "enero-12", "enero-13", "enero-14", "enero-15", "enero-16", "enero-17", "enero-18", "enero-19", "enero-20", "mayo-01", "mayo-02", "mayo-03", "mayo-04", "mayo-05", "mayo-06", "mayo-07", "mayo-08", "mayo-09", "mayo-10", "mayo-11", "mayo-12", "mayo-13", "mayo-14", "mayo-15", "mayo-16", "mayo-17", "mayo-18", "mayo-19", "mayo-20", "mayo-21"], "marcas": {"S7": [{"fuente_alumno": "W7", "pagina": 3, "seminario_oficial": "S7", "imagen": "Radiografía dental selectiva (periapical) de un molar: el alumno rodea con línea discontinua el diente y marca CORONA, CANAL RADICULAR, TABIQUE INTERRADICULAR y RAÍZ", "texto_marca": "EXAMEN la estructura marcada está irrigada por… (en rojo, junto a la imagen 3; el texto añade: 'el foramen apical permite la entrada de vasos y nervios')", "respuesta": "La pulpa/raíz dental recibe su irrigación por el foramen apical desde las arterias alveolares, ramas de la ARTERIA MAXILAR (rama terminal de la carótida externa). En la imagen la corona está arriba y las raíces abajo → molar INFERIOR → arteria alveolar inferior (a. maxilar, 1ª porción; nervio alveolar inferior de V3). Si el profe pone un molar superior (como en el examen mayo-2026 P63, versión inervación) → arterias alveolares superiores posteriores (a. maxilar, 3ª porción) / ramos alveolares superiores del n. maxilar V2.", "confianza": "alta"}, {"fuente_alumno": "W7", "pagina": 2, "seminario_oficial": "S7", "imagen": "Ortopantomografía adulto (imagen 1): el alumno marca SENO MAXILAR, PALADAR DURO (línea discontinua), ARCADA SUPERIOR y ARCADA INFERIOR", "texto_marca": "Estructuras señaladas a mano en rojo sobre la ortopantomografía (sin la palabra EXAMEN, pero es la imagen tipo de identificación de estructuras)", "respuesta": "Reconocer en la panorámica: seno maxilar (radiolucente por encima de las raíces de molares/premolares superiores), paladar duro (línea radiopaca horizontal), arcadas dentarias superior e inferior, rama y cuerpo mandibular, cóndilos. En el niño (imagen 2) coexisten dientes deciduos y permanentes en formación.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 2, "seminario_oficial": "S7", "imagen": "Ortopantomografía — indicaciones/contraindicaciones", "texto_marca": "En negrita: 'delantal plomado'; 'contraindicado en embarazadas'; 'podemos hacer ortopantomografía a una niña siempre que esté protegida'", "respuesta": "Indicación principal: patología odontológica y periodontal (raíces, hueso alveolar) y, colateralmente, morfología mandibular. Contraindicada en embarazadas; siempre delantal plomado para proteger gónadas.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 6, "seminario_oficial": "S7", "imagen": "Sialografía lateral de glándula submandibular (imagen 11, con leyenda 1 cánula, 2 conducto submandibular, 3 contraste en boca, 4 ángulo de la mandíbula, 5 glándula)", "texto_marca": "En negrita: 'Si la glándula atraviesa el borde inferior de la mandíbula es la SUBMANDIBULAR, si está por detrás de la rama de la mandíbula es la PARÓTIDA'. Cánula en la carúncula sublingual (conducto de Wharton)", "respuesta": "Criterio de identificación en sialografía: parénquima por debajo del borde inferior del cuerpo mandibular = submandibular (conducto de Wharton, desemboca en la carúncula sublingual); parénquima por detrás de la rama mandibular = parótida (conducto de Stenon, desemboca frente al 2º molar superior). Este criterio cayó en mayo-2026 (P64).", "confianza": "alta"}, {"fuente_alumno": "W7", "pagina": 7, "seminario_oficial": "S7", "imagen": "Sialografía parotídea (imagen 13, con esquema de árbol ductal): conducto de Stenon rodeado en rojo; imagen 12 ectasia acinar 'en bolitas'; imagen 15 'doble contorno' con flechas", "texto_marca": "Anotaciones: 'STENON' rodeado; 'DOBLE CONTORNO' con flechas; en negrita 'conducto de Stenon (desemboca a nivel del segundo molar superior)', 'ectasia', 'signo del doble contorno', 'litiasis'", "respuesta": "Stenon: cruza el masetero, perfora el buccinador y desemboca frente al 2º molar superior. Imagen 'en bolitas' = ectasia acinar post-parotiditis. Defecto de repleción o signo del doble contorno = tumor intraductal hasta demostrar lo contrario (2ª opción: litiasis → dolor, sin xerostomía porque compensan las otras glándulas). Glándula parótida accesoria sobre el conducto, sin clínica.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 7, "seminario_oficial": "S7", "imagen": "Fotos clínicas de parotiditis (imágenes 14 y 16 ampliadas en rojo)", "texto_marca": "Subrayado 'Parotiditis'; negrita 'paramixovirus', 'orquitis', 'triple vírica'", "respuesta": "Parotiditis = paramixovirus; cuadro viral de vías altas → a los 2 días fiebre 40 ºC y tumefacción dolorosa. Complicación en adolescentes: orquitis (receptor del virus en células de Sertoli) → posible esterilidad. 30-35 % asintomáticas. Prevención: vacuna triple vírica.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 8, "seminario_oficial": "S7", "imagen": "Esofagograma con bario (imagen 19): el alumno marca con letras A-D en rojo y líneas discontinuas los estrechamientos del esófago cervical/torácico", "texto_marca": "A) Dilatación broncoaórtica · B) Impresión del tronco braquiocefálico y el cayado aórtico · C) Dilatación cricoaórtica · D) Esfínter esofágico superior o cricofaríngeo. Negritas: 'estrechez', 'bronco-aórtica', 'diafragma'", "respuesta": "Tres estrecheces fisiológicas del esófago: (1) cricofaríngea/EES, C6, la más estrecha, difícil de pillar por la deglución; (2) broncoaórtica, T4-T5, impresiones del cayado aórtico y bronquio principal izquierdo; (3) diafragmática/hiato esofágico, T10. Entre ellas, dilataciones cricoaórtica y broncodiafragmática. Una impresión se distingue de una masa por su posición constante. Paciente siempre en ayunas.", "confianza": "alta"}, {"fuente_alumno": "W7", "pagina": 9, "seminario_oficial": "S7", "imagen": "Esofagograma con estenosis irregular (imagen 20): anotaciones en rojo 'DOBLE CONTORNO' y 'SIGNO DE LA MORDEDURA DE MANZANA'; imagen 21 divertículo de Zenker", "texto_marca": "Negritas: 'doble contorno', 'mordedura de manzana' → 'será tumor hasta que se demuestre lo contrario'; 'triángulo superior de Killian (divertículo faringoesofágico de Zenker)'; 'halitosis'", "respuesta": "Signo de la mordedura de manzana (apple-core) = defecto de repleción irregular por carcinoma esofágico; clínica disfagia progresiva de meses → gastroscopia + biopsia + TAC. Imagen sacular en unión faringoesofágica = divertículo de Zenker, por pulsión a través del triángulo de Killian (entre constrictor inferior y cricofaríngeo), clínica de halitosis/regurgitación. En los hiatos no se forman divertículos.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 9, "seminario_oficial": "S7", "imagen": "Endoscopias de esófago (imágenes 22-25): esofagitis, Barrett, tumor, candidiasis", "texto_marca": "En rojo: 'MIR: empiezan a salir imágenes de endoscopias'; 'MIR: en Asia la causa más frecuente de esófago de Barrett es el consumo excesivo de comida ahumada y té hirviendo'", "respuesta": "Esofagitis (eritema irregular, causa más frecuente reflujo) vs Barrett (metaplasia extensa, biopsia obligada) vs tumor (crecimiento irregular) vs candidiasis (placas blancas en inmunodeprimidos/quimioterapia, dolorosa). Marcado como MIR, no como examen de Bermúdez.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 11, "seminario_oficial": "S7", "imagen": "TEGD del estómago (imágenes 28-30): FUNDUS, INCISURA ANGULAR, CANAL GÁSTRICO (línea discontinua), PÍLORO, ANTRO, BULBO DUODENAL, y segmentación 1A-4A del antro/cuerpo", "texto_marca": "Estructuras gástricas rotuladas a mano; negrita 'decúbito supino o posición de Trendelenburg' (contraste en fundus)", "respuesta": "Contraste acumulado en fundus → paciente en decúbito supino/Trendelenburg; contraste en antro-cuerpo con fundus aireado → bipedestación o prono. Píloro se dirige arriba, derecha y atrás; contraste en bulbo duodenal = píloro permeable. Identificar cardias, fundus, cuerpo, incisura angular, antro, canal pilórico, bulbo. Valorar sobre todo las zonas SIN contraste (defectos de repleción).", "confianza": "media"}], "S8": [{"fuente_alumno": "W7", "pagina": 13, "seminario_oficial": "S8", "imagen": "Esplenoportografía (imagen 35): el alumno delimita el HÍGADO con línea discontinua roja", "texto_marca": "Anotación 'HÍGADO' y contorno hepático dibujado", "respuesta": "Contraste inyectado en el bazo por el reborde subcostal izquierdo → vena esplénica → vena porta → ramificación intrahepática. Las mesentéricas no se ven por la dirección del flujo; solo se opacifican (flujo invertido) en hipertensión portal severa.", "confianza": "media"}, {"fuente_alumno": "W7", "pagina": 13, "seminario_oficial": "S8", "imagen": "CPRE (imagen 36): rótulos a mano CATÉTER, RAMAS DERECHAS / IZQUIERDAS, HEPÁTICO COMÚN, CÍSTICO, VESÍCULA BILIAR, COLÉDOCO, WIRSUNG; recuadro rojo discontinuo con el recorrido de la sonda", "texto_marca": "Recuadro destacado: 'boca → istmo de las fauces → orofaringe → laringofaringe → esfínter cricofaríngeo → esófago → cardias → estómago → píloro → bulbo → 2ª porción del duodeno → papila duodenal mayor (será la segunda; si solo vemos una, es esa)'", "respuesta": "La papila duodenal mayor (de Vater) está en la cara posteromedial de la 2ª porción del duodeno, donde confluyen colédoco y Wirsung (ampolla de Vater); la menor (Santorini) queda unos 2 cm proximal y es la primera que se ve. En la imagen: cístico plegado (válvulas de Heister), vesícula parcialmente llena → litiasis biliar. Indicación CPRE: patología biliopancreática (pancreatitis crónica, colecistitis). En mayo-2026 cayó la identificación de vías biliares en CPRE (P80).", "confianza": "alta"}, {"fuente_alumno": "W7", "pagina": 14, "seminario_oficial": "S8", "imagen": "ColangioRM (imagen 38): CÍSTICO, WIRSUNG, ACCESORIO DE SANTORINI, AMPOLLA DE VATER (rodeada); imagen 37 CPRE con flecha al conducto de Santorini", "texto_marca": "Negrita 'accesorio de Santorini que desemboca en la papila duodenal menor (la primera que se observa cuando entramos a la segunda porción del duodeno)'", "respuesta": "Conducto pancreático principal (Wirsung) + colédoco → ampolla de Vater → papila mayor. Conducto accesorio (Santorini) → papila menor, más proximal. ColangioRM: igual información que CPRE pero no invasiva, contraste detectado por RM y supresión digital del fondo.", "confianza": "media"}, {"fuente_alumno": "W8", "pagina": 3, "seminario_oficial": "S8", "imagen": "Enema opaco (imagen 5): marco cólico rotulado CIEGO, ASCENDENTE, FLEXURA HEPÁTICA, FLEXURA ESPLÉNICA, DESCENDENTE; imagen 6 con ÍLEON TERMINAL, CIEGO, COLON ILIOPÉLVICO", "texto_marca": "EXAMEN (en rojo) — 'La válvula de Bauhin está aguantando porque no entra contraste a nivel del íleon (EXAMEN). En la imagen 6 sí que vemos que hay reflujo a nivel de la válvula de Bauhin'", "respuesta": "Válvula de Bauhin = válvula ileocecal. En un enema opaco competente el contraste llena ciego y marco cólico pero NO pasa al íleon (imagen 5); si se opacifica el íleon terminal (imagen 6) hay reflujo/incompetencia. No conviene forzar su apertura (subir la bolsa) porque se contamina el íleon con flora cólica. Estructuras a identificar: ciego, ascendente, flexura hepática, transverso, flexura esplénica, descendente, sigma, recto.", "confianza": "alta"}, {"fuente_alumno": "W8", "pagina": 2, "seminario_oficial": "S8", "imagen": "Tránsito intestinal (imagen 1): rótulos ESÓFAGO/ESTÓMAGO, PÍLORO, BULBO DUODENAL, 2ª-3ª-4ª PORCIÓN del duodeno, ASAS YEYUNALES, ASAS ILEALES, COLON", "texto_marca": "Identificación completa del marco duodenal y las asas; negrita 'patrón radiológico' (yeyuno 'en pluma de ave', íleon más sólido)", "respuesta": "Marco duodenal en C alrededor de la cabeza pancreática: bulbo, 2ª porción descendente (papilas), 3ª horizontal (cruza por delante de aorta/VCI y detrás de vasos mesentéricos superiores), 4ª ascendente hasta el ángulo de Treitz. Yeyuno: pliegues circulares altos y numerosos → patrón plumoso, hipocondrio izquierdo; íleon: pliegues escasos, patrón más liso/sólido, fosa ilíaca derecha.", "confianza": "media"}, {"fuente_alumno": "W8", "pagina": 6, "seminario_oficial": "S8", "imagen": "Enema opaco con defecto de repleción en colon ascendente (imagen 8): círculo rojo 'SIGNO DE MORDEDURA DE MANZANA'", "texto_marca": "Negrita 'signo de mordedura de manzana, defecto de repleción. Es un cáncer de colon ascendente hasta que se demuestre lo contrario. Es más probable que sangre que que obstruya'", "respuesta": "Estenosis anular irregular = carcinoma. El colon derecho tiene mayor calibre y contenido líquido → los tumores sangran (anemia, sangre oculta) más que obstruyen; el izquierdo, más estrecho y con heces sólidas, obstruye. Enema de doble contraste (bario residual + aire tras evacuar) hoy se pide para divertículos, no para cáncer.", "confianza": "media"}, {"fuente_alumno": "W8", "pagina": 7, "seminario_oficial": "S8", "imagen": "TAC abdominal con contraste (fase arterial)", "texto_marca": "EXIGIBLE (en rojo): Hígado, bazo, estómago, páncreas, arterias (aorta, VCI, AMS, AMI, VMS)", "respuesta": "Lista mínima que el profesor exige identificar en cortes axiales: hígado (lóbulos der/izq/caudado), bazo, estómago, páncreas, aorta, VCI, tronco celíaco y sus ramas, AMS/VMS, AMI, vena porta, riñones, colon. Fase arterial = adquisición 30-45 s tras contraste IV: arterias brillantes, VCI aún sin realce (densidad similar a hígado). Convención de colores en las láminas: arterias rojo, venas azul, resto amarillo.", "confianza": "alta"}, {"fuente_alumno": "W8", "pagina": 11, "seminario_oficial": "S8", "imagen": "Cortes axiales TAC a nivel de páncreas/duodeno (imágenes 20-21): VMS y AMS rodeadas en azul/rojo, PÁNCREAS, 4ª PORCIÓN DUODENO, VENAS RENALES, RIÑONES, COLON TRANSVERSO", "texto_marca": "Texto destacado al pie: 'Los vasos mesentéricos superiores quedan por delante del páncreas en un corte más inferior y por detrás en un corte más superior (puesto que se originan posterior a este). La vena mesentérica superior siempre es más derecha que la arteria'", "respuesta": "AMS nace de la aorta (L1) por detrás del cuello del páncreas y desciende por delante de la 3ª porción duodenal y el proceso uncinado; la VMS acompaña a la AMS por su DERECHA y se une a la esplénica detrás del cuello pancreático para formar la porta. Pinza aortomesentérica: vena renal izquierda y 3ª porción del duodeno pasan entre aorta y AMS.", "confianza": "alta"}, {"fuente_alumno": "W8", "pagina": 8, "seminario_oficial": "S8", "imagen": "Cortes TAC supramesocólicos (imágenes 14-19): HÍGADO, ESTÓMAGO, BAZO, AORTA, VCI, VENAS HEPÁTICAS, ARTERIA HEPÁTICA, TRONCO CELÍACO, A. ESPLÉNICA, V. PORTA, VESÍCULA, GLÁNDULAS SUPRARRENALES, LIGAMENTO FALCIFORME, FLEXURAS CÓLICAS", "texto_marca": "Rótulos exhaustivos a mano (amarillo = órganos, rojo = arterias, azul = venas) siguiendo la lámina del profesor", "respuesta": "Orden craneocaudal que hay que reconocer: (1) cúpula hepática + venas hepáticas → VCI; (2) ligamento falciforme separando lóbulo izq/der, estómago y bazo; (3) tronco celíaco (T12) con ramas hepática común, esplénica y gástrica izquierda; (4) vena porta y vesícula; (5) AMS/VMS con páncreas y venas renales; (6) AMI (L3) e ilíacas. VCI siempre a la derecha de la aorta.", "confianza": "media"}, {"fuente_alumno": "W8", "pagina": 13, "seminario_oficial": "S8", "imagen": "Cortes TAC pélvicos (imágenes 24-26): rotulado 'ILÍACAS'; láminas con arterias/venas ilíacas externas, psoas, glúteos, sigma", "texto_marca": "Anotación 'ILÍACAS' sobre la bifurcación", "respuesta": "La aorta se bifurca en L4 en ilíacas comunes; las venas ilíacas confluyen en la VCI en L5 por detrás de la ilíaca común derecha. Ilíaca externa sobre el psoas → femoral bajo el ligamento inguinal.", "confianza": "media"}]}};
const RS_LAM="_laminas/";
const rs_E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function rs_lb(src,cap){

function rs_isDig(slug){return (RS.meta.grupos[1].fuentes||[]).includes(slug);}
function rs_dist(){

    return `<div class="rs-row" onclick="rs_go('${s}')"><div><b>${rs_E(f.nombre||s)}</b><small>${rs_E(f.preguntas||"")}</small></div><div class="rs-bar"><i class="${d?"dig":""}" style="width:${Math.round(100*(f.img2026||0)/mx)}%"></i></div><div class="rs-n">${f.img2026||0}<small style="display:block;font-weight:500;color:#8a98a8">de ${f.de||""}</small></div></div>`;}).join("")).join("");

function rs_go(s){RS_ST.src=s;rs_save();renderRetos();window.scrollTo({top:0});}
function rs_examHTML(p){

  const exs=ex.map(e=>`<figure class="rs-fig exam"><img data-src="${RS_LAM}exam/${e.img_key}.jpg" alt="" onclick="rs_lb(this.src,'<b>Lámina del examen</b> · ${rs_E(e.examen)} · imagen ${rs_E(e.imagen)}')"><figcaption>🖼 tal cual salió en el examen · ${rs_E(e.examen)} · imagen ${rs_E(e.imagen)}</figcaption></figure>`).join("");

function rs_lblHTML(p,i){

}
function rs_tapAll(btn){
  const ul=btn.closest(".rs-lbl").querySelector(".rs-et");const on=!ul.querySelector(".rs-nm.cz");

function rs_qHTML(p,i){

  return `<div class="rs-q"><div class="rs-qe">❓ ${rs_F(q.enunciado)}</div>${opsH}${ops.length?"":`<button class="rs-show" onclick="this.closest('.rs-q').classList.add('done')">Ver respuesta</button>`}<div class="rs-rz"><b>${q.respuesta?`Respuesta: ${rs_E(q.respuesta)}. `:""}</b>${rs_F(q.razonamiento||"")}</div></div>`;
}
function rs_pick(el){const q=el.closest(".rs-q");if(q.classList.contains("done"))return;el.classList.add("pick");q.classList.add("done");}
function rs_card(p){

function rs_nav(){

function rs_lazy(){
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const im=e.target;im.src=im.dataset.src;io.unobserve(im);}});},{rootMargin:"600px"});
  app.querySelectorAll("img[data-src]").forEach(im=>io.observe(im));
}
function rs_applyFilter(){
  let n=0;app.querySelectorAll(".rs-card").forEach(c=>{const ok=+c.dataset.pr>=RS_ST.minPr;c.classList.toggle("hid",!ok);if(ok)n++;});
  const el=$("rsCnt");if(el)el.textContent=`${n} láminas`;
}
function renderRetos(){
  const M=RS.meta;
  const hm=(location.hash||"").match(/^#retos=([A-Za-z0-9]+)/);if(hm&&RS.fuentes[hm[1]]){RS_ST.src=hm[1];history.replaceState(null,"","#retos");}
  if(!RS_ST.src||!RS.fuentes[RS_ST.src])RS_ST.src=null;
  const head=`<div class="rs-hero"><h2>🔬 Retos anatómicos y seminarios</h2><p>${rs_F(M.lema)}</p><div class="rs-chips">${(M.cifras||[]).map(c=>`<div class="rs-chip"><b>${rs_E(c.dato)}</b>${rs_E(c.valor)}</div>`).join("")}</div></div>
  <details class="rs-sec" ${RS_ST.src?"":"open"}><summary>📊 <span>De dónde salen las imágenes del examen</span><span class="rs-chev">▶</span></summary><div class="rs-body"><div class="rs-dist">${rs_dist()}</div></div></details>
  <details class="rs-sec"><summary>🗣 <span>Cómo pregunta Bermúdez con una imagen</span><span class="rs-chev">▶</span></summary><div class="rs-body"><ul class="rs-como">${(M.como_pregunta||[]).map(x=>`<li>${rs_F(x)}</li>`).join("")}</ul></div></details>
  <div class="rs-nav">${rs_nav()}</div>`;
  let body="";
  if(RS_ST.src){
    const F=RS.fuentes[RS_ST.src],f=M.fuentes[RS_ST.src]||{};
    const pags=(F.paginas||[]).filter(p=>p.tipo!=="omitir");
    body=`<div class="rs-tools"><b>Mostrar:</b>
      <label><input type="radio" name="rsPr" value="3" ${RS_ST.minPr===3?"checked":""} onchange="RS_ST.minPr=3;rs_save();rs_applyFilter()">🔴 solo lo que cayó</label>
      <label><input type="radio" name="rsPr" value="2" ${RS_ST.minPr===2?"checked":""} onchange="RS_ST.minPr=2;rs_save();rs_applyFilter()">🔴+🟠 cayó y candidatas</label>
      <label><input type="radio" name="rsPr" value="1" ${RS_ST.minPr<=1?"checked":""} onchange="RS_ST.minPr=1;rs_save();rs_applyFilter()">todo</label>
      <label><input type="checkbox" ${RS_ST.tapar?"checked":""} onchange="RS_ST.tapar=this.checked;rs_save();renderRetos()">🙈 nombres tapados (autoevaluación)</label>
      <span class="rs-cnt" id="rsCnt"></span></div>
    <div class="rs-src ${rs_isDig(RS_ST.src)?"dig":""}"><h2>${rs_E(f.nombre||F.titulo||RS_ST.src)}<small>${rs_E(f.sub||"")}</small></h2>
      <div class="rs-resumen"><b>📊 En el examen:</b> ${rs_F(F.resumen_examen||"")}${f.nota?`<div style="margin-top:4px">${rs_F(f.nota)}</div>`:""}</div>
      ${(RS.marcas[RS_ST.src]||[]).length?`<details class="rs-sec" style="padding:10px 14px;box-shadow:none;border:1px solid #f1c40f;background:#fffbea"><summary style="font-size:14px;color:#7a5b00">🔎 <span>Lo que el profe dijo en clase que cae (apuntes de alumnos, ${(RS.marcas[RS_ST.src]||[]).length} marcas)</span><span class="rs-chev">▶</span></summary><div class="rs-body"><table class="es-tbl"><tr><th>Imagen</th><th>Marca del alumno</th><th>Respuesta</th></tr>${RS.marcas[RS_ST.src].map(m=>`<tr><td>${rs_E(m.imagen)}</td><td><b>${rs_E(m.texto_marca)}</b>${m.confianza==="media"?' <span style="color:#e67e22">(confianza media)</span>':""}</td><td>${rs_F(m.respuesta)}</td></tr>`).join("")}</table></div></details>`:""}
      ${pags.map(rs_card).join("")}</div>`;
  }else{
    body=`<div class="rs-src" style="text-align:center;color:#67788c;font-size:14px">👆 Elige un seminario o reto. Empieza por los de más imágenes: <b>S10, S11</b> (GU) y <b>S8, Reto 2 dig</b> (digestivo).</div>`;
  }
  app.innerHTML=`<div class="rs-wrap">${head}${body}<div class="rs-foot">Fuentes: PDFs del Campus (seminarios S7-S11, retos R1-R3, prácticas P1-P3) · evidencia de examen: <i>analisis/recta-final-2026-09/F2</i> y <i>analisis-2026-hojas-imagenes</i> · ${rs_E(M.fecha||"")}</div></div>`;
  rs_lazy();rs_applyFilter();
}

renderRetos();
</script></body></html>

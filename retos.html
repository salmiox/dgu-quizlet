seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P1 (opción b)", "imagen": 17, "clave": "c", "que_pregunto": "Imagen 17 = arteriografía de un riñón (R1-GU p19, ítem 18 'Identifica las arterias segmentarias'; ésta es la versión Prometheus): A = a. segmentaria superior, B = anterosuperior, C = anteroinferior, D = inferior → cierta, y combinada con la img 1 → clave c ('a y b correctas').", "img_key": "mayo-17"}], "pack": "Árbol arterial: aorta → a. renal (L1-L2) → rama anterior/prepiélica (4 segmentarias: superior, anterosuperior, anteroinferior, inferior) + rama posterior/retropiélica (segmentaria posterior, ÚNICA) → interlobares (columnas de Bertin) → arqueadas (base de pirámides) → interlobulillares → arteriolas aferentes → glomérulo → eferentes → capilares peritubulares / vasa recta. Las segmentarias son TERMINALES sin anastomosis (segmentos de Graves) → infarto cuneiforme si se ocluyen. Venas: interlobulillares → arqueadas → interlobares → v. renal (SÍ anastomosan). Arterias polares/accesorias en 25-30 % (p17). Otras ramas de la a. renal: suprarrenal inferior, ureteral, capsulares.", "trampa": "Cambiar una segmentaria por otra en la lista ('posterior' por anteroinferior) o preguntar cuál falta en la placa (la POSTERIOR, que no se ve en AP porque queda detrás de la pelvis). Confundir el orden interlobar/arqueada/interlobulillar.", "prioridad": 3}, {"key": "S10-p16", "pagina": 16, "item": null, "tipo": "imagen", "titulo": "Angio-TC renal: reconstrucción coronal de la aorta con ambas arterias renales + MIP axial", "que_se_ve": "Izquierda: angio-TC (VR en escala de grises) coronal: aorta abdominal vertical en el centro y las dos arterias renales saliendo lateralmente hacia los hilios (la derecha más larga, cruzando hacia el riñón derecho); ambos riñones con textura granular. Derecha: MIP axial '[AH]' a la altura de L1-L2: aorta redonda por delante del cuerpo vertebral, de la que salen las dos arterias renales (flechas blancas) hacia los hilios; por encima, el tronco celíaco/AMS y ramas hepáticas y esplénicas; por delante del cuerpo vertebral, la aorta; el arco posterior de la vértebra abajo.", "etiquetas": [{"n": "flecha izda", "nombre": "Arteria renal derecha en su origen aórtico (trayecto largo, retrocava)", "rosa": false, "seguro": true}, {"n": "flecha dcha", "nombre": "Arteria renal izquierda en su origen aórtico (más corta; nace algo más alta)", "rosa": false, "seguro": true}, {"n": "vaso central", "nombre": "Aorta abdominal (sección redonda, anterior e izquierda de la columna)", "rosa": false, "seguro": true}, {"n": "ramas superiores", "nombre": "Tronco celíaco / a. mesentérica superior y sus ramas (hepática, esplénica) proyectadas en el MIP", "rosa": false, "seguro": false}], "pack": "A. renal ← aorta a nivel del disco L1-L2, justo por debajo de la AMS. Derecha: más larga, pasa POR DETRÁS de la VCI, de la v. renal dcha y de la cabeza del páncreas/D2. Izquierda: más corta, por detrás de la v. renal izda y del cuerpo del páncreas. Cada una da: suprarrenal inferior, ramas ureterales, capsulares y luego segmentarias en el hilio (por detrás de la vena, por delante de la pelvis). Flujo renal ≈ 20-25 % del gasto cardíaco.", "trampa": "Preguntar el nivel vertebral de origen (L1-L2, no L3) o la relación de la a. renal derecha con la VCI (por DETRÁS).", "prioridad": 2}, {"key": "S10-p17", "pagina": 17, "item": null, "tipo": "imagen", "titulo": "Angio-TC renal: variantes — arterias renales múltiples/accesorias (flechas)", "que_se_ve": "Izquierda: cuatro reconstrucciones VR en color (aorta y riñones anaranjados) en distintas proyecciones, mostrando el pedículo arterial renal de cada lado. Derecha: VR en blanco donde las flechas señalan DOS arterias renales a cada lado saliendo de la aorta (arterias renales múltiples / accesorias, típicamente una polar inferior).", "etiquetas": [{"n": "flechas dcha (2)", "nombre": "Dos arterias renales derechas (principal + accesoria/polar) naciendo de la aorta", "rosa": false, "seguro": true}, {"n": "flechas izda (2)", "nombre": "Dos arterias renales izquierdas (principal + accesoria/polar)", "rosa": false, "seguro": true}], "pack": "Arterias renales accesorias/supernumerarias en 25-30 % de la población (más frecuentes a la izquierda): persisten de las arterias mesonéfricas embrionarias; suelen ser polares (entran por el polo sin pasar por el hilio) y NO anastomosan — su lesión produce infarto del segmento. Importancia clínica: una a. polar inferior que cruza por delante de la unión pieloureteral puede causar hidronefrosis; imprescindible mapearlas antes de trasplante/nefrectomía o cirugía aórtica.", "trampa": "Preguntar si las accesorias son 'extrahiliares' (sí, polares) o si tienen anastomosis (no, son terminales); porcentaje aproximado (≈25-30 %).", "prioridad": 2}, {"key": "S10-p18", "pagina": 18, "item": null, "tipo": "imagen", "titulo": "Angio-TC coronal de abdomen-pelvis (LA IMAGEN 2 DEL EXAMEN DE MAYO) + VR de aorta e ilíacas", "que_se_ve": "Izquierda: TC coronal con contraste en fase arterial: hígado arriba a la izquierda, bazo arriba a la derecha, ambos riñones con sus pedículos (la arteria renal sale de la aorta hacia cada hilio), aorta abdominal central con calcificaciones ateromatosas en la bifurcación, ilíacas comunes tortuosas, pelvis ósea abajo. En el examen se marcaron letras (A-E): B = aorta, E = arteria renal izquierda (el examen intentó colarla como 'vena renal izda'). Derecha: cuatro VR en color de la aorta abdominal con las arterias renales, riñones e ilíacas (aneurisma/tortuosidad aortoilíaca).", "etiquetas": [{"n": "B", "nombre": "Aorta abdominal (la opción a decía 'B = aorta; E = vena renal izda' — la mitad de E era falsa)", "rosa": true, "seguro": true, "nota": "Letras añadidas en el anexo del examen."}, {"n": "E", "nombre": "ARTERIA renal izquierda (no la vena): en el hilio se sitúa POR DETRÁS de la vena renal ipsilateral", "rosa": true, "seguro": true}, {"n": "A/C/D", "nombre": "Resto de letras del examen no recuperadas en la transcripción (probablemente riñón/hígado/bazo/ilíaca)", "rosa": true, "seguro": false}], "examen": [{"examen": "mayo 2026", "pregunta": "P18", "imagen": 2, "clave": "b", "que_pregunto": "a) B = aorta; E = vena renal izda (FALSA, E es la arteria); b) la estructura E se sitúa normalmente POR DETRÁS de la vena renal ipsilateral (CLAVE, orden V-A-P); c) la celda renal está formada por las 2 hojas de la CÁPSULA renal (FALSA: fascia renal de Gerota/Zuckerkandl); d) el riñón dcho se relaciona con hígado, flexura cólica dcha, fascia retroduodenopancreática y BAZO (FALSA: el bazo es del izquierdo).", "img_key": "mayo-02"}], "pack": "Pedículo renal de delante a atrás: VENA → ARTERIA → PELVIS/uréter. V. renal izda: larga, pasa por DELANTE de la aorta y por DEBAJO de la AMS (pinza aortomesentérica → 'cascanueces'), recibe v. gonadal izda, v. suprarrenal izda y a veces lumbar ascendente; v. renal dcha corta → VCI (la gonadal dcha va directa a la VCI). Celda renal = fascia renal (hoja anterior prerrenal de Gerota + posterior retrorrenal de Zuckerkandl) con grasa perirrenal dentro y grasa pararrenal fuera; la cápsula fibrosa está pegada al parénquima. Relaciones anteriores del riñón dcho: hígado (área desnuda/receso de Morrison), D2 y fascia retroduodenopancreática (Treitz), flexura cólica dcha, suprarrenal; del izdo: bazo, estómago, cola de páncreas, flexura cólica izda, yeyuno.", "trampa": "Vena por arteria; cápsula por fascia; bazo con el riñón derecho. Puede repetir con la p14 (MPR coronal) como placa gemela.", "prioridad": 3}, {"key": "S10-p19", "pagina": 19, "item": null, "tipo": "teoria", "titulo": "Urografía intravenosa: esquema de la técnica (ADAM)", "que_se_ve": "Ilustración didáctica en inglés: se inyecta contraste yodado en una vena del brazo ('dye is injected, and an X-ray is taken') y se obtienen radiografías seriadas; esquema del aparato urinario (kidney, ureter, bladder, con el riñón en corte mostrando el sistema colector) y una placa pequeña con Kidney, Renal pelvis y Ureter rotulados.", "etiquetas": [{"n": "Kidney", "nombre": "Riñón (parénquima realzado en fase nefrográfica)", "rosa": false, "seguro": true}, {"n": "Renal pelvis", "nombre": "Pelvis renal (con cálices mayores y menores)", "rosa": false, "seguro": true}, {"n": "Ureter", "nombre": "Uréter (sobre las apófisis transversas lumbares y el psoas)", "rosa": false, "seguro": true}, {"n": "Bladder", "nombre": "Vejiga urinaria", "rosa": false, "seguro": true}], "pack": "Fundamento: contraste yodado i.v. → filtrado en el glomérulo (no secretado) → concentrado en túbulos (nefrograma) → excretado a cálices, pelvis, uréter y vejiga (pielograma). Requiere función renal conservada (creatinina) y está contraindicado en alergia al yodo/insuficiencia renal; hoy sustituida en gran parte por la UroTAC (p13).", "trampa": "Preguntar la diferencia urografía IV (contraste endovenoso, anterógrado) vs pielografía retrógrada (cateterismo ureteral por cistoscopia) vs uretrografía retrógrada (por el meato).", "prioridad": 1}, {"key": "S10-p20", "pagina": 20, "item": null, "tipo": "tecnica", "titulo": "Urografía intravenosa: indicaciones y 5 fases (simple, nefrográfica, excretora, ureteral, vaciamiento)", "que_se_ve": "Diapo negra: INDICACIONES (anatomía de sistemas colectores y uréteres — en negrita —, litiasis renal o ureteral, valorar función renal, hematuria, anomalías congénitas complicadas, seguimiento quirúrgico) y cinco radiografías numeradas: 1 radiografía simple (control previo), 2 fase nefrográfica (inmediata: siluetas renales densas), 3 fase excretora (5 min: cálices y pelvis opacificados), 4 fase ureteral (30 min: uréteres y vejiga llenos), 5 fase de vaciamiento (30 min, postmiccional: vejiga residual).", "etiquetas": [{"n": "1", "nombre": "Radiografía simple de abdomen (placa de control previa al contraste: litiasis radiopaca, siluetas)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Fase nefrográfica (inmediata, 1-3 min): realce del parénquima renal", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Fase excretora / pielográfica (5 min): cálices, infundíbulos y pelvis", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Fase ureteral (30 min): uréteres completos + vejiga llena", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Fase de vaciamiento (postmiccional, 30 min): residuo vesical, reflujo", "rosa": false, "seguro": true}], "pack": "Anatomía que se valora en cada fase: nefrográfica → tamaño/forma/posición renal (T12-L3, izquierdo más alto); excretora → 7-14 cálices menores con la papila en cúpula ('copa'), 2-3 cálices mayores, pelvis intra/extrarrenal; ureteral → los 3 estrechamientos (unión pieloureteral, cruce de los vasos ilíacos en el estrecho superior, porción intramural) y los uréteres cruzando las puntas de las apófisis transversas lumbares; vaciamiento → capacidad y residuo. El uréter abdominal se irriga en mosaico (renal, gonadal, aorta, ilíaca común) y el pélvico por ilíaca interna (vesicales, rectal media, uterina/vaginal).", "trampa": "Preguntar el tiempo o el nombre de la fase (nefrográfica inmediata / excretora 5 min / ureteral y vaciamiento 30 min) o cuál es la indicación principal (anatomía de colectores y uréteres). No mezclar con las fases de la UroTAC (p13).", "prioridad": 2}, {"key": "S10-p21", "pagina": 21, "item": null, "tipo": "imagen", "titulo": "Urografía IV, fase ureteral/vaciamiento, con leyenda 1-10 (LA IMAGEN 3 DEL EXAMEN DE MAYO)", "que_se_ve": "Dos copias de la misma urografía AP: izquierda sin marcas (= imagen 3 del examen) y derecha con números 1-10 y leyenda impresa: pelvis y cálices del riñón derecho, infundíbulos, polo inferior derecho, uréter derecho descendiendo sobre el psoas (línea discontinua = línea del psoas), pelvis izquierda, uréter izquierdo, vejiga con contraste en la pelvis e impronta del útero en su cúpula (paciente mujer).", "etiquetas": [{"n": "1", "nombre": "Pelvis del riñón derecho", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Cálices (menores, con la impronta en copa de las papilas)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Infundíbulos (cálices mayores, unen los menores con la pelvis)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Polo inferior del riñón derecho", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Uréter derecho", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Pelvis del riñón izquierdo", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Línea de psoas (borde lateral del psoas mayor; el uréter la cruza en oblicuo)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Uréter izquierdo", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Vejiga", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Impronta del útero en la vejiga (muesca en la cúpula vesical = paciente ♀)", "rosa": false, "seguro": true}, {"n": "A-E (examen)", "nombre": "A = uréter izquierdo · B = uréter derecho · C = pelvis renal derecha · D = cáliz · E = vejiga", "rosa": true, "seguro": true, "nota": "Letras del anexo de mayo; la placa está en posición anatómica (la derecha del paciente a la izquierda de la imagen)."}], "examen": [{"examen": "mayo 2026", "pregunta": "P22", "imagen": 3, "clave": "d", "que_pregunto": "a) A uréter izdo, B uréter dcho, C pelvis dcha, D cáliz, E vejiga (CIERTA); b) la porción abdominal de A y B está irrigada por a. renal, gonadales y aorta ÚNICAMENTE (FALSA: también ilíacas comunes); c) A y B cruzan POR DETRÁS del conducto deferente en el hombre y POR DETRÁS de la a. uterina en la mujer (CIERTA); d) a y c correctas ← CLAVE.", "img_key": "mayo-03"}], "pack": "Uréter (25-30 cm, retroperitoneal, sobre el psoas; cruza por delante de los vasos ilíacos en el estrecho superior — el derecho la ilíaca externa, el izquierdo la ilíaca común): 3 estrechamientos = unión pieloureteral, cruce ilíaco, porción intramural. Cruces pélvicos: en ♂ el conducto deferente pasa POR DELANTE/ENCIMA del uréter (uréter por detrás); en ♀ la a. uterina pasa POR DELANTE/ENCIMA en la base del lig. ancho, ~2 cm lateral al cérvix ('el agua pasa bajo el puente'). Irrigación en mosaico: abdominal ← ramas ureterales de a. renal + a. gonadal + aorta + ilíaca común; pélvico ← ilíaca interna (vesical superior/inferior, rectal media, uterina/vaginal); anastomosis longitudinal en la adventicia (no desperitonizar). Venas satélites → renal, gonadal, ilíacas. Linfa: superior → lumbares; medio → ilíacos comunes; inferior → ilíacos internos/externos. Inervación: plexos renal, aórtico e hipogástrico (T11-L2 y S2-S4); dolor referido al dermatoma T11-L2 (fosa lumbar → ingle → escroto/labio mayor).", "trampa": "'Únicamente' en la irrigación; invertir el cruce (uréter por DELANTE del deferente/uterina = falso); y no ver que hay dos opciones ciertas (a + c → d). Lateralidad: A es el uréter IZQUIERDO (derecha de la imagen).", "prioridad": 3}, {"key": "S10-p22", "pagina": 22, "item": null, "tipo": "imagen", "titulo": "Urografía IV, fase ureteral: dos placas con uréteres completos y vejiga", "que_se_ve": "Dos urografías AP en fase ureteral. Izquierda (marcada 'R' a la derecha del paciente): pelvis y cálices de ambos riñones a la altura de L1-L2, ambos uréteres descendiendo en todo su trayecto lumbar cruzando las apófisis transversas hasta la vejiga, que aparece con contraste tenue tras el pubis. Derecha: paciente distinto con contraste más concentrado en pelvis/cálices y uréteres (derecho completo hasta la vejiga), vejiga poco llena. Placa gemela de la p21, sin leyenda.", "etiquetas": [{"n": "sin números", "nombre": "Pelvis renales y cálices (L1-L2) · uréteres lumbares (sobre las puntas de las apófisis transversas y el psoas) · cruce de la articulación sacroilíaca (vasos ilíacos) · uréter pélvico curvándose hacia el trígono · vejiga", "rosa": false, "seguro": true}], "pack": "Trayecto radiológico del uréter: nace en la unión pieloureteral (L2), baja vertical sobre las puntas de las apófisis transversas lumbares (dentro de la línea del psoas), cruza la articulación sacroilíaca (= vasos ilíacos, 2.º estrechamiento), se curva lateralmente hacia la espina ciática y vuelve medial para entrar oblicuo en la vejiga (3.º estrechamiento). Peristaltismo: el calibre variable (segmentos llenos y vacíos) es normal en la placa. Un cálculo se detiene típicamente en los 3 estrechamientos.", "trampa": "Que ponga letras nuevas sobre esta placa (mismo formato que P22): uréter dcho vs izdo, pelvis, cálices, vejiga; o que pregunte los 3 estrechamientos.", "prioridad": 2}, {"key": "S10-p23", "pagina": 23, "item": null, "tipo": "tecnica", "titulo": "Anatomía radiológica de la uretra masculina: uretra posterior/anterior, uretrografía retrógrada, indicaciones", "que_se_ve": "Diapo negra 'Anatomía radiológica: Uretra masculina · Método de estudio: uretrografía retrógrada (también por urocistografía miccional)'. Arriba izquierda: esquema sagital de la uretra con rótulos: uretra POSTERIOR (roja: prostática + membranosa) y ANTERIOR (azul: bulbar + peneana hasta el meato), verumontanum, conducto de la glándula de Cowper, fosa navicular, meato. Abajo izquierda: técnica de uretrografía retrógrada (A: sonda con balón en la fosa navicular; B: inyección directa con jeringa cónica en el meato). Derecha: uretrografía retrógrada oblicua rotulada: U. prostática, U. membranosa ('estenosis fisiológica'), U. bulbar, U. peneana. Abajo: 'Indicaciones: estenosis, fístula, anomalías congénitas, trauma · Contraindicaciones: IVU aguda o instrumentación reciente'.", "etiquetas": [{"n": "Uretra posterior", "nombre": "Uretra posterior = prostática + membranosa (intrapélvica, rodeada por próstata y esfínter externo)", "rosa": false, "seguro": true}, {"n": "Uretra anterior", "nombre": "Uretra anterior = bulbar + peneana/esponjosa (dentro del cuerpo esponjoso)", "rosa": false, "seguro": true}, {"n": "Uretra prostática", "nombre": "Uretra prostática (3-4 cm, la más ancha y dilatable; cresta uretral con el colículo seminal en la cara posterior)", "rosa": false, "seguro": true}, {"n": "Verumontanum", "nombre": "Colículo seminal: utrículo prostático en el centro + 2 conductos eyaculadores a los lados; senos prostáticos laterales con los conductillos prostáticos", "rosa": false, "seguro": true}, {"n": "Uretra membranosa", "nombre": "Uretra membranosa (1-1,5 cm, la más ESTRECHA y menos distensible; atraviesa el diafragma urogenital rodeada por el esfínter uretral externo estriado) — 'estenosis fisiológica' en la placa", "rosa": false, "seguro": true}, {"n": "Conducto de la glándula Cowper", "nombre": "Conductos de las glándulas bulbouretrales (Cowper), que están en el espacio perineal profundo junto a la membranosa y desembocan en la uretra BULBAR", "rosa": false, "seguro": true}, {"n": "Uretra bulbar", "nombre": "Uretra bulbar (porción más dilatada de la esponjosa, en el bulbo del pene; localización más frecuente de estenosis y de rotura por caída a horcajadas)", "rosa": false, "seguro": true}, {"n": "Uretra peneana", "nombre": "Uretra peneana/esponjosa (15 cm, en el cuerpo esponjoso, con las lagunas de Morgagni y glándulas de Littré)", "rosa": false, "seguro": true}, {"n": "Fosa navicular", "nombre": "Fosa navicular (dilatación en el glande, antes del meato)", "rosa": false, "seguro": true}, {"n": "Meato", "nombre": "Meato uretral externo (orificio más estrecho de toda la uretra tras la membranosa)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P24", "imagen": 5, "clave": "c", "que_pregunto": "La placa del examen fue la de p24, pero los conceptos (B = prostática con los conductos eyaculadores en su cara posterior; C = membranosa; D = bulbar; E = esponjosa) están explicados en ESTA página.", "img_key": "mayo-05"}], "pack": "Uretra ♂ (18-20 cm): intramural/preprostática (esfínter interno liso, simpático — evita eyaculación retrógrada) → prostática → membranosa → esponjosa (bulbar + peneana). Irrigación: posterior ← ramas prostáticas de a. vesical inferior y rectal media (← ilíaca interna); membranosa + esponjosa ← a. del bulbo del pene, a. uretral y a. dorsal del pene (← pudenda INTERNA ← ilíaca interna). Venoso: posterior → plexo vesicoprostático (Santorini) → ilíaca interna; anterior → v. dorsal profunda del pene → Santorini. Linfa: posterior → ilíacos internos; esponjosa → inguinales profundos (y externos). Inervación: plexo prostático (autónomo) y n. pudendo (esfínter externo, sensibilidad de la anterior). Lesiones: rotura de pelvis → membranosa (sobre el diafragma); caída a horcajadas → bulbar.", "trampa": "Preguntar cuál es la porción más estrecha (membranosa; el meato es el 2.º), la más ancha/dilatable (prostática), dónde desembocan Cowper (bulbar, NO membranosa), qué segmentos son 'posterior' (prostática + membranosa) o la contraindicación de la uretrografía (infección urinaria aguda).", "prioridad": 2}, {"key": "S10-p24", "pagina": 24, "item": null, "tipo": "imagen", "titulo": "Uretrografía retrógrada masculina (Prometheus) con leyenda 1-11 (LA IMAGEN 5 DEL EXAMEN DE MAYO)", "que_se_ve": "Radiografía oblicua de la uretra de un varón con contraste retrógrado: panel izquierdo sin marcas (= imagen 5 del examen, con letras A-E añadidas: A vejiga, B u. prostática, C u. membranosa, D u. bulbar, E u. esponjosa) y panel derecho con el contorno dibujado y 11 números. Se ve la vejiga llena arriba, el orificio interno, la uretra prostática y membranosa estrechas, el bulbo dilatado y la esponjosa hasta el balón del catéter en la fosa navicular; sínfisis del pubis por delante.", "etiquetas": [{"n": "1", "nombre": "Vejiga urinaria", "rosa": false, "seguro": true, "nota": "= A del examen"}, {"n": "2", "nombre": "Orificio interno de la uretra (cuello vesical, esfínter interno liso)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Porción prostática de la uretra", "rosa": false, "seguro": true, "nota": "= B del examen: en su cara posterior desembocan los conductos eyaculadores (colículo) y los conductillos prostáticos (senos)"}, {"n": "4", "nombre": "Difusión del medio de contraste en las glándulas prostáticas (reflujo a los conductillos prostáticos)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Porción membranosa de la uretra (la más estrecha, en el diafragma urogenital)", "rosa": false, "seguro": true, "nota": "= C del examen"}, {"n": "6", "nombre": "Porción esponjosa de la uretra (peniana)", "rosa": false, "seguro": true, "nota": "= E del examen; D = bulbar (n.º 9)"}, {"n": "7", "nombre": "Localización del colículo seminal (veru montanum): utrículo prostático + orificios de los conductos eyaculadores", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Sínfisis del pubis", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Bulbo uretral (uretra bulbar, la porción más dilatada de la anterior; reciben los conductos de Cowper)", "rosa": false, "seguro": true, "nota": "= D del examen"}, {"n": "10", "nombre": "Lagunas uretrales (de Morgagni, con las glándulas de Littré)", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Catéter con globo en la fosa navicular (técnica retrógrada)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P24", "imagen": 5, "clave": "c", "que_pregunto": "a) A vejiga, B u. prostática, C u. membranosa, D u. bulbar, E u. esponjosa (CIERTA); b) la cara posterior de B presenta los orificios de los conductos eyaculadores y de los conductillos prostáticos (CIERTA); c) TODAS correctas ← CLAVE; d) todas falsas. La misma uretrografía en versión atlas está en R1-GU p22 (ítem 21).", "img_key": "mayo-05"}], "pack": "Cara posterior de la uretra prostática: cresta uretral → colículo seminal (veru montanum) con el utrículo prostático (resto mülleriano) en el centro y los 2 orificios de los conductos eyaculadores a los lados; a ambos lados de la cresta, los senos prostáticos con 20-30 conductillos prostáticos. Irrigación de la prostática ← ramas prostáticas de vesical inferior + rectal media (ilíaca interna); de la membranosa y esponjosa ← a. del bulbo y a. uretral (pudenda INTERNA). Venas → plexo de Santorini → ilíaca interna. Linfa: prostática/membranosa → ilíacos internos; esponjosa → inguinales profundos. Esfínteres: interno liso en el cuello (2) y externo estriado en la membranosa (5), n. pudendo.", "trampa": "'Todas correctas' cuando a y b son ciertas. Cambiar el orden bulbar/membranosa (la membranosa está ENTRE prostática y bulbar) o decir que los eyaculadores desembocan en la membranosa. En R1-GU p21 la misma uretra se usa para el caso del catéter forzado (lesión de la membranosa/esfínter externo).", "prioridad": 3}, {"key": "S10-p25", "pagina": 25, "item": null, "tipo": "imagen", "titulo": "Uretrografía retrógrada masculina: dos proyecciones oblicuas (gemela de p24)", "que_se_ve": "Dos uretrografías oblicuas de varón sin rótulos: vejiga muy opacificada arriba; de ella sale la uretra prostática (estrecha, vertical), la membranosa (punto más estrecho al pasar el diafragma urogenital, bajo la sínfisis) y luego la uretra anterior (bulbar, con la curva bajo el pubis, y peniana) hasta el meato, en forma de S. Panel derecho con el pene más extendido, mostrando mejor la bulbar y la peniana.", "etiquetas": [{"n": "sin números", "nombre": "Vejiga · uretra prostática · uretra membranosa (estrechamiento fisiológico) · uretra bulbar (dilatación bajo el pubis) · uretra peniana hasta el meato", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P24", "imagen": 5, "clave": "c", "que_pregunto": "Placa gemela de la imagen 5 (S10 p24). Si repite con ésta, las letras serán las mismas: vejiga → prostática → membranosa → bulbar → esponjosa.", "img_key": "mayo-05"}], "pack": "Curvaturas de la uretra ♂: curva subpúbica (fija, cóncava hacia arriba, entre membranosa y bulbar) y curva prepúbica (móvil, desaparece al elevar el pene — por eso se tracciona el pene para sondar). El ángulo penoescrotal es donde se acoda la sonda. Uretra anterior ← pudenda interna; posterior ← vesical inferior/rectal media.", "trampa": "Reconocer los segmentos SIN leyenda y con la placa girada; distinguir el estrechamiento fisiológico de la membranosa de una estenosis patológica (p26).", "prioridad": 2}, {"key": "S10-p26", "pagina": 26, "item": null, "tipo": "imagen", "titulo": "Uretrografía retrógrada: estrechamiento focal señalado con flecha roja", "que_se_ve": "Uretrografía retrógrada oblicua (vejiga llena arriba a la derecha, uretra descendiendo hacia la izquierda): el contraste rellena la uretra posterior y un segmento bulbar ancho y, en el punto de la flecha roja, hay un estrechamiento focal abrupto entre ese segmento y la uretra peniana distal (a la izquierda, más fina). Interpretación: estenosis uretral en la uretra bulbar/unión bulbopeniana (localización más frecuente de las estenosis postraumáticas/postinfecciosas); alternativamente el profesor puede usarla como ejemplo del estrechamiento de la membranosa.", "etiquetas": [{"n": "flecha roja", "nombre": "Estrechamiento de la luz uretral en la uretra bulbar / unión bulbopeniana (estenosis uretral)", "rosa": true, "seguro": false, "nota": "Sin leyenda en la diapo; identificación por criterio radiológico. Si Bermúdez la usa como 'estenosis fisiológica' se referiría a la membranosa."}], "pack": "Estenosis uretral: causas = traumatismo (caída a horcajadas → bulbar; fractura de pelvis → membranosa), infección (uretritis gonocócica → bulbar), iatrogenia (sondaje, cistoscopia → membranosa/bulbar). La uretrografía retrógrada es la técnica de elección para localizarla; contraindicada en infección aguda. Por encima de la estenosis la uretra se dilata y el contraste puede refluir a glándulas de Cowper/Littré y a los cuerpos esponjoso/cavernoso.", "trampa": "Preguntar qué porción está estenosada (bulbar, la más frecuente) o la indicación de la técnica (estenosis, fístula, trauma).", "prioridad": 1}, {"key": "S10-p27", "pagina": 27, "item": null, "tipo": "imagen", "titulo": "Cistouretrografía femenina AP: vejiga y uretra ♀ (LA IMAGEN 6 DEL EXAMEN DE MAYO)", "que_se_ve": "Dos placas AP casi idénticas de una mujer con vejiga muy opacificada (contorno liso, ligeramente triangular, apoyada sobre el suelo pélvico) de la que sale caudalmente la uretra femenina como un trazo corto (3-4 cm), recto y fino en la línea media, terminando en el vestíbulo. Detrás se ven sacro, alas ilíacas, cabezas femorales y la sínfisis. En el examen: A = vejiga, B = uretra.", "etiquetas": [{"n": "A", "nombre": "Vejiga urinaria (llena de contraste)", "rosa": true, "seguro": true, "nota": "Letras del anexo del examen."}, {"n": "B", "nombre": "Uretra femenina (3-4 cm, recta, adosada a la cara ANTERIOR de la vagina; meato en el vestíbulo entre clítoris y orificio vaginal)", "rosa": true, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P25", "imagen": 6, "clave": "d", "que_pregunto": "a) B se relaciona con la cara POSTERIOR de la vagina (FALSA: anterior); b) el esfínter uretral interno se sitúa en la porción intramural de A (FALSA: en la mujer no hay esfínter interno liso bien individualizado; el continente es el externo estriado); c) B está irrigada por a. pudenda EXTERNA y vaginal (FALSA: pudenda INTERNA + vaginal); d) TODAS FALSAS ← CLAVE.", "img_key": "mayo-06"}], "pack": "Uretra ♀: 3-4 cm, del cuello vesical al vestíbulo, atraviesa el diafragma urogenital (esfínter uretral externo estriado + compresor de la uretra y esfínter uretrovaginal), pegada a la cara ANTERIOR de la vagina (tabique uretrovaginal); glándulas parauretrales de Skene desembocan junto al meato. Irrigación ← a. pudenda INTERNA + a. vaginal (+ vesical inferior), todas de la ilíaca interna. Venas → plexos vesical/vaginal → v. ilíaca interna. Linfa → ilíacos internos y sacros (NUNCA inguinales, a diferencia de la esponjosa ♂). Inervación: plexo vesical (porción proximal) + n. pudendo (esfínter externo, sensibilidad). Clínica: uretra corta y recta → ITU frecuentes (caso R1-GU p12); incontinencia de esfuerzo por debilidad del suelo pélvico.", "trampa": "Posterior/anterior de la vagina; pudenda externa/interna; 'esfínter interno' en la mujer. Cada opción lleva UN adjetivo cambiado → 'todas falsas'.", "prioridad": 3}]}, "S11": {"fuente": "S11", "titulo": "Seminario S11 · Anatomía radiológica del aparato reproductor (próstata, testículo, pene, útero, ovario, HSG, mama)", "resumen_examen": "Fuente nº 2 del examen de mayo 2026: 6 de las 21 imágenes del anexo son placas LITERALES de este PDF (F2 §3.1: img 16 = p4 [compuesta con S10 p3/p4/p7], img 12 = p5, img 11 = p7 [impresa sin pregunta], img 14 = p11, img 15 = p12, img 9 = p27/p26), y otras 2 son gemelas exactas de láminas de este seminario reutilizadas en los Retos GU (img 10 = p19 = R2-GU p17; img 8 = familia p22-23 = R2-GU p19). Bermúdez usa la eco como 'decorado': la pregunta es siempre de anatomía (etiquetado A-D + irrigación/drenaje/relaciones/ligamentos) con una trampa por opción (epónimo cruzado, lateralidad, rama madre cambiada, 'todas correctas'). Páginas que AÚN no han caído y son candidatas fuertes (F2 §3.2): p8 (eco transrectal etiquetada: zonas de McNeal, veru montanum), p13 (eco de pene), p21 (sonohisterografía), p24 (eco mamaria: Cooper, grasa retromamaria), p17-18 (USG pélvico transabdominal y posiciones uterinas), p10 (anatomía ecográfica escrotal etiquetada).", "paginas": [{"key": "S11-p01", "pagina": 1, "item": 0, "tipo": "omitir", "titulo": "Portada — Anatomía Radiológica Aparato Reproductor S11 (Bermúdez)", "prioridad": 0}, {"key": "S11-p02", "pagina": 2, "item": 0, "tipo": "omitir", "titulo": "Índice general (masculino: eco próstata/escrotal/pene · femenino: eco útero, sonohisterografía, ovarios, mama; HSG; mamografía)", "prioridad": 0}, {"key": "S11-p03", "pagina": 3, "item": 0, "tipo": "omitir", "titulo": "Índice aparato genital masculino + foto de transductor convexo", "prioridad": 0}, {"key": "S11-p04", "pagina": 4, "item": 1, "tipo": "tecnica", "titulo": "Ecografía de próstata: vía suprapúbica (izq) y vía transrectal (dcha) — fotos de técnica", "que_se_ve": "Dos fotografías clínicas. Izquierda: varón en decúbito supino, transductor convexo de baja frecuencia apoyado en hipogastrio (vía suprapúbica/transabdominal, vejiga llena como ventana acústica); el explorador muestra la impresión de la eco. Derecha: paciente en decúbito lateral izquierdo con caderas y rodillas flexionadas, el explorador introduce la sonda endocavitaria por el ano (ecografía TRANSRECTAL). Es la foto D de la imagen 16 del examen de mayo.", "etiquetas": [{"n": "izq", "nombre": "Ecografía suprapúbica (transabdominal) de próstata — transductor convexo 3-5 MHz en hipogastrio, vejiga llena como ventana", "rosa": false, "seguro": true, "nota": "En el examen fue la foto C de la img 16 (compuesta con S10 p7)."}, {"n": "dcha", "nombre": "Ecografía transrectal de próstata — decúbito lateral izdo (Sims), sonda endocavitaria de alta frecuencia 7-10 MHz", "rosa": false, "seguro": true, "nota": "Foto D de la img 16: solo la pared rectal separa la sonda de la próstata → máxima resolución; vía de la biopsia prostática."}], "examen": [{"examen": "mayo 2026", "pregunta": "P21", "imagen": 16, "clave": "d", "que_pregunto": "Imagen compuesta de 4 fotos de técnica (A = riñón dcho S10 p3, B = riñón izdo S10 p4, C = suprapúbica S10 p7, D = transrectal = ESTA foto). Correcta d: 'la vía D permite visualizar la próstata con mayor resolución que la vía C'. Las opciones a/b hablaban de planos transversales renales que no corresponden a la foto y la c de vejiga en plano longitudinal.", "img_key": "mayo-16"}], "pack": "Física que justifica la clave: a menor distancia sonda-órgano y mayor frecuencia (7-10 MHz transrectal frente a 3-5 MHz suprapúbica) → mayor resolución y menor penetración. Relaciones de la próstata que hacen posible la vía transrectal: cara posterior separada del recto solo por la fascia rectoprostática (Denonvilliers) → es también la vía del tacto rectal. Próstata: bajo la vejiga, ENCIMA del diafragma urogenital (m. transverso profundo del periné), detrás de la sínfisis (espacio retropúbico de Retzius), delante del recto. Irrigación (pack repetido en P14): ramas prostáticas de a. vesical INFERIOR (principal) + a. rectal media + a. pudenda interna ← todas de la a. ilíaca interna.", "trampa": "Atribuir a la foto suprapúbica 'mayor resolución' o afirmar que la transrectal usa la vejiga como ventana. También etiquetar la foto D como 'transperineal'. Regla: transrectal = más resolución, suprapúbica = más campo/menos definición.", "prioridad": 3}, {"key": "S11-p05", "pagina": 5, "item": 2, "tipo": "identifica", "titulo": "Ecografía suprapúbica de próstata, 2 cortes con calipers (4,67 cm / 4,53 cm) = imagen 12 del examen de mayo = R3-GU p17", "que_se_ve": "Eco transabdominal (suprapúbica) en escala de grises, dos paneles. Panel izq: corte sagital — de arriba abajo pared abdominal (bandas ecogénicas), vejiga anecoica (negra) y bajo su base la próstata como masa ovalada hipoecoica homogénea medida con calipers (cajetín '1 4,67 cm / 2 4,53 cm'). Panel dcho: corte transversal, vejiga arriba y próstata redondeada debajo. Próstata de tamaño NORMAL (≈4 cm; volumen ≈ 20-25 cm³).", "etiquetas": [{"n": "A", "nombre": "Vejiga urinaria (anecoica, ventana acústica)", "rosa": true, "seguro": true, "nota": "Letras según el etiquetado del examen de mayo (img 12)."}, {"n": "B", "nombre": "Pared abdominal anterior (piel, grasa, recto del abdomen, fascia)", "rosa": true, "seguro": true}, {"n": "C", "nombre": "Próstata de tamaño NORMAL (hipoecoica homogénea, bajo la base vesical)", "rosa": true, "seguro": true, "nota": "La a) del examen la llamaba 'significativamente patológica' → falsa."}, {"n": "1", "nombre": "Caliper 1 = 4,67 cm (diámetro prostático, corte sagital)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Caliper 2 = 4,53 cm (segundo diámetro)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P14", "imagen": 12, "clave": "b", "que_pregunto": "a) A vejiga, B pared abdominal, C próstata 'de tamaño significativamente patológico' → FALSA (tamaño conservado). b) CORRECTA: C irrigada por ramas prostáticas de a. vesical inferior, hemorroidal (rectal) media y pudenda interna. c) 'bajo la vejiga y bajo el m. transverso profundo del periné' → falsa (está ENCIMA del diafragma urogenital). d) 'HBP en la zona periférica' → falsa (HBP = zona de TRANSICIÓN; periférica = carcinoma).", "img_key": "mayo-12"}], "pack": "IRRIGACIÓN: ramas prostáticas ← a. vesical INFERIOR (principal) + a. rectal (hemorroidal) media + a. pudenda interna ← a. ilíaca interna. VENOSO: plexo venoso prostático/vesicoprostático (Santorini, recibe la v. dorsal profunda del pene) → vv. ilíacas INTERNAS + comunicación con plexos vertebrales (Batson → metástasis óseas vertebrales). LINFA: ganglios ilíacos internos y sacros (algunos ilíacos externos). INERVACIÓN: plexo prostático ← plexo hipogástrico inferior (simpático L1-L2 + parasimpático S2-S4, nn. esplácnicos pélvicos). RELACIONES: base contra el cuello vesical, vértice sobre el diafragma urogenital; anterior sínfisis (Retzius), posterior recto (fascia de Denonvilliers), atravesada por la uretra prostática y los conductos eyaculadores (desembocan en el colículo seminal/veru montanum). ZONAS de McNeal: transición (periuretral, HBP), central (eyaculadores), periférica (posterior, 70 %, carcinoma, palpable). Volumen ecográfico = L × A × H × 0,52 (normal ≈ 20-25 cm³, 'castaña').", "trampa": "Cambiar la rama madre: 'vesical SUPERIOR' o 'pudenda EXTERNA'; 'plexo vesicoprostático → ilíaca externa' (M26 P15, falsa); HBP en zona periférica; próstata 'bajo' el diafragma urogenital; llamar patológica a una próstata normal.", "prioridad": 3}, {"key": "S11-p06", "pagina": 6, "item": 3, "tipo": "imagen", "titulo": "Próstata normal vs hiperplasia prostática (esquema) + eco suprapúbica con calipers 1-2-3 (medida del volumen)", "que_se_ve": "Izquierda: dos esquemas de vejiga abierta en coronal — 'Próstata normal' (glándula pequeña bajo el cuello vesical) y 'Hiperplasia prostática' (lóbulos agrandados que protruyen en la base vesical y comprimen la uretra prostática). Derecha: eco suprapúbica GE en dos paneles: panel izq corte transversal con caliper 1 (diámetro transverso), panel dcho corte sagital con calipers 2 (longitudinal) y 3 (anteroposterior) en cruz — los tres diámetros para calcular el volumen prostático (elipsoide × 0,52).", "etiquetas": [{"n": "Próstata normal", "nombre": "Próstata normal (esquema): ≈ 20 g / 20-25 cm³, 4 × 3 × 2 cm ('castaña')", "rosa": false, "seguro": true}, {"n": "Hiperplasia prostática", "nombre": "Hiperplasia benigna: crecimiento de la zona de TRANSICIÓN (periuretral) → obstrucción de la uretra prostática, lóbulo medio que protruye en la vejiga", "rosa": false, "seguro": true}, {"n": "1", "nombre": "Caliper 1: diámetro transverso de la próstata (corte transversal)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Caliper 2: diámetro longitudinal/craneocaudal (corte sagital)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Caliper 3: diámetro anteroposterior (corte sagital)", "rosa": false, "seguro": true}], "examen": [], "pack": "Mismo pack que p5. Extra de esta lámina: HBP = zona de transición (McNeal) → comprime la uretra prostática → síntomas obstructivos; el tacto rectal palpa la zona PERIFÉRICA (posterior), donde asienta el carcinoma. Volumen = D1 × D2 × D3 × 0,52. La uretra prostática recibe en el colículo seminal (veru montanum) los conductos eyaculadores (= vesícula seminal + ampolla del deferente) y el utrículo prostático; los conductos prostáticos desembocan en los senos prostáticos laterales a la cresta uretral.", "trampa": "'La HBP asienta en la zona periférica' (falso) / 'el carcinoma en la transicional' (falso). 'El tacto rectal palpa la cara anterior' (falso: posterior). Confundir los tres calipers con 'tres lóbulos'.", "prioridad": 2}, {"key": "S11-p07", "pagina": 7, "item": 4, "tipo": "identifica", "titulo": "Ecografía suprapúbica de próstata con calipers: D 4,24 / 4,92 cm, D 4,89 cm, V 53,41 cm³ = imagen 11 del examen de mayo (reserva)", "que_se_ve": "Eco transabdominal en escala de grises, dos paneles. Izq: corte transversal — pared abdominal arriba, vejiga anecoica, próstata redondeada hipoecoica debajo con calipers en cruz (+D 4,24 cm, ×D 4,92 cm). Dcha: corte sagital oblicuo con vejiga, próstata y caliper #D 4,89 cm; el equipo calcula el volumen V = 53,41 cm³ (≈ 4,24 × 4,92 × 4,89 × 0,52). Próstata AGRANDADA (> 25-30 cm³ → hiperplasia).", "etiquetas": [{"n": "+D 4,24 cm", "nombre": "Diámetro transverso (panel izq)", "rosa": false, "seguro": true}, {"n": "×D 4,92 cm", "nombre": "Diámetro anteroposterior (panel izq)", "rosa": false, "seguro": true}, {"n": "#D 4,89 cm", "nombre": "Diámetro longitudinal (panel dcho)", "rosa": false, "seguro": true}, {"n": "V 53,41 cm³", "nombre": "Volumen prostático calculado (elipsoide × 0,52) → próstata aumentada de tamaño (HBP)", "rosa": false, "seguro": true}, {"n": "vejiga", "nombre": "Vejiga urinaria (anecoica, arriba de la próstata)", "rosa": false, "seguro": true}, {"n": "próstata", "nombre": "Próstata (masa hipoecoica bajo la base vesical, en el panel dcho se ve la uretra prostática como línea)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "sin pregunta en la permutación transcrita (reserva)", "imagen": 11, "clave": "—", "que_pregunto": "La placa se imprimió en el anexo (img 11) pero ninguna pregunta de la permutación transcrita la usó → casi seguro es lámina de otra permutación o reserva. Preparar con el mismo pack que la img 12 (P14): irrigación, relaciones, zonas de McNeal, volumen.", "img_key": "mayo-11"}], "pack": "Idéntico al de p5: irrigación vesical inferior + rectal media + pudenda interna (ilíaca interna); plexo de Santorini → ilíaca interna (+ Batson); linfa ilíacos internos/sacros; relaciones vejiga-arriba / diafragma urogenital-abajo / recto-detrás / sínfisis-delante. Esta lámina añade el dato de VOLUMEN: 53 cm³ = agrandada (HBP de la zona de transición); normal 20-25 cm³.", "trampa": "La trampa del tamaño puede ir en los dos sentidos: aquí SÍ es patológica (53 cm³), en p5 NO (4,6 cm normal). No memorizar 'la próstata de la eco siempre es normal'; leer el cajetín de volumen.", "prioridad": 3}, {"key": "S11-p08", "pagina": 8, "item": 5, "tipo": "identifica", "titulo": "USG transrectal de próstata: posición, esquema sagital y ecos longitudinal/transversal ETIQUETADOS (zonas, uretra, veru montanum)", "que_se_ve": "Lámina compuesta 'USG Transrectal'. Arriba izq: foto del paciente en decúbito lateral cubierto con sábana. Abajo izq: esquema sagital de pelvis masculina (Vejiga, Próstata, Recto, Ano, Sonda de ecografía transrectal). Derecha: dos ecografías transrectales con leyenda impresa: 'Próstata (longitudinal)' y 'Próstata (transversal)', cada una con un esquema en miniatura de la orientación del transductor. Es la lámina de anatomía zonal de McNeal en eco — candidata fuerte (nunca ha caído).", "etiquetas": [{"n": "L1", "nombre": "Zona central / Glándula interna (longitudinal)", "rosa": false, "seguro": true, "nota": "Zona central = rodea los conductos eyaculadores; junto con la transicional forma la 'glándula interna' ecográfica."}, {"n": "L2", "nombre": "Vesícula seminal / Conducto eyaculador (longitudinal, posterosuperior a la próstata)", "rosa": false, "seguro": true, "nota": "Conducto eyaculador = unión de conducto de la vesícula seminal + ampolla del deferente; atraviesa la zona central hasta el veru montanum."}, {"n": "L3", "nombre": "Zona periférica (longitudinal, posterior, pegada a la mucosa rectal)", "rosa": false, "seguro": true, "nota": "70 % del tejido glandular; asiento del carcinoma; es lo que palpa el tacto rectal."}, {"n": "L4", "nombre": "Uretra prostática (longitudinal)", "rosa": false, "seguro": true}, {"n": "L5", "nombre": "Veromontanum (colículo seminal) — rodeado con un círculo", "rosa": false, "seguro": true, "nota": "Donde desembocan los conductos eyaculadores y el utrículo prostático; divide la uretra prostática en proximal y distal."}, {"n": "L6", "nombre": "Mucosa rectal (longitudinal, la línea más cercana a la sonda)", "rosa": false, "seguro": true}, {"n": "T1", "nombre": "Vejiga urinaria (transversal, arriba)", "rosa": false, "seguro": true}, {"n": "T2", "nombre": "Estroma anterior fibromuscular (hiperecoico) (transversal)", "rosa": false, "seguro": true, "nota": "Cara anterior no glandular de la próstata, se continúa con el esfínter uretral."}, {"n": "T3", "nombre": "Esfínter uretral (hipoecoico) (transversal)", "rosa": false, "seguro": true}, {"n": "T4", "nombre": "Uretra (transversal, círculo central)", "rosa": false, "seguro": true}, {"n": "T5", "nombre": "Zona central / Transicional (transversal, periuretral)", "rosa": false, "seguro": true, "nota": "Zona de transición = HBP."}, {"n": "T6", "nombre": "Cápsula quirúrgica (transversal)", "rosa": false, "seguro": true, "nota": "Límite ecográfico entre glándula interna (transición/central) y zona periférica; NO es la cápsula anatómica."}, {"n": "T7", "nombre": "Zona periférica (transversal, en herradura posterior)", "rosa": false, "seguro": true}, {"n": "T8", "nombre": "Mucosa rectal (transversal)", "rosa": false, "seguro": true}, {"n": "esq", "nombre": "Esquema sagital: Vejiga · Próstata · Recto · Ano · Sonda de ecografía (transrectal)", "rosa": false, "seguro": true}], "examen": [], "pack": "Zonas de McNeal: PERIFÉRICA (70 %, posterolateral, carcinoma, palpable por tacto rectal), CENTRAL (25 %, rodea los eyaculadores, en cuña desde la base al veru), TRANSICIÓN (5 %, periuretral, HBP), estroma fibromuscular anterior (no glandular). Uretra prostática: cresta uretral con el colículo seminal (veru montanum) donde desembocan los 2 conductos eyaculadores y el utrículo prostático; senos prostáticos laterales reciben los conductos prostáticos. Vesículas seminales: posterosuperiores a la próstata, entre vejiga y recto, laterales a las ampollas del deferente; irrigadas por a. vesical inferior y rectal media; drenan al plexo vesicoprostático. Esfínter uretral externo (estriado) rodea la uretra membranosa justo bajo el vértice prostático → continencia; el esfínter interno (liso, cuello vesical) evita la eyaculación retrógrada. Irrigación/venoso/linfa: ver p5.", "trampa": "Intercambiar zona periférica ↔ transición (cáncer ↔ HBP); 'cápsula quirúrgica = cápsula anatómica'; 'los conductos eyaculadores desembocan en la uretra membranosa' (falso: en la prostática, en el veru); llamar 'transperineal' a la transrectal.", "prioridad": 2}, {"key": "S11-p09", "pagina": 9, "item": 6, "tipo": "tecnica", "titulo": "Ecografía escrotal: técnica (decúbito supino, toalla bajo el escroto, pene sobre el abdomen) + esquema ADAM", "que_se_ve": "Diapositiva de texto sobre fondo oscuro con 4 puntos de técnica y un esquema (ADAM) de la región inguinoescrotal con el transductor lineal apoyado sobre el escroto elevado por una toalla entre los muslos; etiquetas 'Transductor' y 'Escroto'.", "etiquetas": [{"n": "Transductor", "nombre": "Transductor lineal de alta frecuencia (7-12 MHz) apoyado sobre el escroto", "rosa": false, "seguro": true}, {"n": "Escroto", "nombre": "Escroto elevado sobre una toalla colocada entre los muslos; pene apartado sobre el abdomen", "rosa": false, "seguro": true}, {"n": "texto", "nombre": "Paciente en decúbito supino · se eleva el escroto con una toalla sobre los muslos · se coloca el pene sobre el abdomen · se pregunta por zonas dolorosas y nódulos palpables", "rosa": false, "seguro": true}], "examen": [], "pack": "El escroto es superficial → sonda lineal de alta frecuencia (máxima resolución, poca penetración). Capas del escroto de fuera adentro (lo que atraviesa el haz): piel → dartos (músculo liso, simpático) → fascia espermática externa (oblicuo externo) → cremáster y fascia cremastérica (oblicuo interno/transverso) → fascia espermática interna (fascia transversalis) → túnica vaginal (parietal → cavidad virtual → visceral) → túnica albugínea → parénquima testicular. Irrigación escrotal: aa. escrotales anteriores ← pudenda externa ← femoral; aa. escrotales posteriores ← perineal ← pudenda interna; a. cremastérica ← epigástrica inferior. Linfa de la piel escrotal → inguinales SUPERFICIALES (el testículo → lumboaórticos). Inervación: n. ilioinguinal + r. genital del genitofemoral (anterior), nn. escrotales posteriores del pudendo + r. perineal del cutáneo femoral posterior (posterior). Varicocele: se explora en bipedestación con Valsalva.", "trampa": "Mezclar la linfa del escroto (inguinal) con la del testículo (lumbar). Pudenda externa ↔ interna entre cara anterior y posterior.", "prioridad": 1}, {"key": "S11-p10", "pagina": 10, "item": 7, "tipo": "identifica", "titulo": "Anatomía ecográfica de la región escrotal ETIQUETADA: testículo longitudinal/transversal, polo superior, apéndice epididimario, Doppler", "que_se_ve": "Lámina compuesta (sin número de página) con 6 ecografías rotuladas y miniaturas de la posición de la sonda: 'Testículo (Longitudinal)' con Mediastino testicular y Testículo; recuadro con 'Septos testiculares' (flechas) y 'Túnica albugínea'; 'Testículo polo superior (Longitudinal)' con Cabeza del epidídimo; eco con 'Apéndice epididimario' (flecha); 'Testículo (Transversal)' con Pared escrotal, Cuerpo del epidídimo, Mediastino testicular, Testículo; 'Modo Doppler' (color) mostrando vasos intratesticulares.", "etiquetas": [{"n": "Testículo", "nombre": "Testículo: parénquima homogéneo de ecogenicidad media, ovoide (4-5 × 3 × 2,5 cm)", "rosa": false, "seguro": true}, {"n": "Mediastino testicular", "nombre": "Mediastino testicular: banda lineal ecogénica en el eje longitudinal (engrosamiento posterior de la albugínea con la rete testis)", "rosa": false, "seguro": true, "nota": "Letra A de la img 15 del examen (p12)."}, {"n": "Septos testiculares", "nombre": "Septos/tabiques testiculares: finas líneas ecogénicas que salen del mediastino y dividen el parénquima en 250-300 lobulillos", "rosa": false, "seguro": true}, {"n": "Túnica albugínea", "nombre": "Túnica albugínea: cápsula fibrosa ecogénica que envuelve el testículo", "rosa": false, "seguro": true}, {"n": "Cabeza del epidídimo", "nombre": "Cabeza del epidídimo: estructura triangular/ovoide iso-ligeramente hiperecoica sobre el polo SUPERIOR del testículo (formada por los conductillos EFERENTES)", "rosa": false, "seguro": true, "nota": "Letra B de la img 14 del examen (p11)."}, {"n": "Apéndice epididimario", "nombre": "Apéndice epididimario (resto del conducto mesonéfrico de Wolff), pequeña excrecencia en la cabeza del epidídimo; el apéndice testicular (hidátide de Morgagni) es resto de Müller", "rosa": false, "seguro": true}, {"n": "Pared escrotal", "nombre": "Pared escrotal (piel + dartos + fascias espermáticas + cremáster)", "rosa": false, "seguro": true}, {"n": "Cuerpo del epidídimo", "nombre": "Cuerpo del epidídimo: en el borde POSTEROLATERAL del testículo, más hipoecoico que la cabeza", "rosa": false, "seguro": true}, {"n": "Modo Doppler", "nombre": "Doppler color: flujo de ramas de la a. testicular (capsulares y centrípetas, y a veces a. transmediastínica); útil en torsión (ausencia de flujo) y orquiepididimitis (hiperemia)", "rosa": false, "seguro": true}], "examen": [], "pack": "IRRIGACIÓN triple anastomosada (Jahrisch): a. TESTICULAR ← aorta abdominal (L2, origen embrionario) + a. del conducto DEFERENTE ← vesical superior/inferior ← ilíaca interna + a. CREMASTÉRICA ← epigástrica inferior ← ilíaca externa. VENOSO: plexo pampiniforme (rodea la a. testicular en el cordón, termorregulación) → v. testicular: IZDA → v. renal izda (ángulo recto → varicocele izdo 90 %), DCHA → VCI (ángulo agudo). LINFA: testículo y epidídimo → ganglios lumboaórticos (L1-L2), NUNCA inguinales (esos son los del escroto). INERVACIÓN: plexo testicular (simpático T10-T11 con la a. testicular → dolor referido periumbilical) . Vía del esperma: túbulos seminíferos → túbulos rectos → rete testis (en el mediastino) → 10-12 conductillos EFERENTES (cabeza del epidídimo) → conducto epididimario (cuerpo, cola) → conducto deferente (asciende por el cordón, cruza el uréter por delante y por encima, ampolla) → conducto eyaculador.", "trampa": "'Conductillos AFERENTES' (son eferentes, M26 P8c); 'v. testicular izda → renal contralateral' (M26 P7d); 'linfa testicular → inguinal'; confundir el mediastino testicular (línea ecogénica intratesticular) con el epidídimo (extratesticular).", "prioridad": 2}, {"key": "S11-p11", "pagina": 11, "item": 8, "tipo": "identifica", "titulo": "Ecografía escrotal: transversal de ambos testículos (GE 'SCROTAL') y longitudinal Philips 'TESTICLE' con cabeza del epidídimo = imagen 14 del examen de mayo = R3-GU p19", "que_se_ve": "Dos ecos. Izq (GE LOGIQ, 'SCROTAL', sonda lineal 12L): corte transversal de la bolsa escrotal con los dos testículos ovoides de ecogenicidad homogénea separados por el tabique escrotal, rodeados por la pared escrotal ecogénica. Dcha (Philips, rótulo 'TESTICLE'): corte longitudinal de un testículo homogéneo; en su polo superior (izq de la imagen) una estructura triangular heterogénea = cabeza del epidídimo; alrededor, la pared escrotal. Es literalmente la imagen 14 del examen.", "etiquetas": [{"n": "A", "nombre": "Testículo (parénquima homogéneo)", "rosa": true, "seguro": true, "nota": "Letras del etiquetado del examen (img 14, panel dcho)."}, {"n": "B", "nombre": "Cabeza del epidídimo (polo superior del testículo) — NO el cordón espermático", "rosa": true, "seguro": true, "nota": "La a) del examen decía 'B = cordón espermático' → falsa."}, {"n": "C", "nombre": "Escroto / pared escrotal (o túnica vaginal según la letra del examen)", "rosa": true, "seguro": false, "nota": "El etiquetado exacto de C y D no está en la transcripción; data_A: 'C/D = escroto/túnica vaginal según etiqueta'."}, {"n": "D", "nombre": "Túnica vaginal / escroto (según etiqueta del examen)", "rosa": true, "seguro": false}, {"n": "izq", "nombre": "Panel izq: corte transversal de ambos testículos con tabique escrotal en el centro (misma familia que p12 dcha)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P7", "imagen": 14, "clave": "c", "que_pregunto": "a) 'A testículo, B cordón espermático, C cavidad vaginal, D escroto' → falsa (B es la cabeza del epidídimo). b) 'A izdo más bajo por mayor longitud de B' → hecho real (cordón izdo más largo) pero falso aplicado a estas letras. c) CORRECTA: A irrigado por a. testicular (aorta), a. del conducto deferente (vesical sup/inf) y a. cremastérica (epigástrica inf), anastomosadas. d) 'v. testicular izda drena en la v. renal CONTRALATERAL' → falsa (ipsilateral).", "img_key": "mayo-14"}], "pack": "IRRIGACIÓN: a. testicular ← aorta (bajo las renales, L2) · a. deferencial ← vesical superior o inferior ← ilíaca interna · a. cremastérica ← epigástrica inferior ← ilíaca externa; las tres se anastomosan (Jahrisch) → la ligadura de la testicular no siempre infarta el testículo. VENOSO: plexo pampiniforme → v. testicular izda → v. RENAL IZDA (ángulo recto); v. testicular dcha → VCI. LINFA: lumboaórticos L2 (metástasis del cáncer de testículo = retroperitoneo, no ingle). INERVACIÓN: plexo testicular (T10-T11) → dolor referido a epigastrio/periumbilical. Testículo izdo más bajo (cordón más largo). Epidídimo: cabeza (eferentes) en el polo superior, cuerpo y cola en el borde posterolateral; cola se continúa con el deferente.", "trampa": "Rama madre cambiada (cremastérica 'de la aorta', testicular 'de la ilíaca'); 'contralateral' por ipsilateral; B llamado 'cordón espermático'; 'cavidad vaginal' como si fuera visible (es virtual salvo hidrocele).", "prioridad": 3}, {"key": "S11-p12", "pagina": 12, "item": 9, "tipo": "identifica", "titulo": "Ecografía escrotal: longitudinal con calipers y flecha (mediastino) + transversal de ambos testículos (fila superior = imagen 15 del examen de mayo); fila inferior: eco con flecha + Doppler color", "que_se_ve": "Fila superior (= img 15): panel izq corte longitudinal de un testículo con calipers 1-1 (longitud) y 2-2 (altura) y una flecha blanca oblicua señalando una línea ecogénica intratesticular = mediastino testicular; por debajo, una banda ecogénica curva = pared escrotal/túnicas. Panel dcho ('RTL'): corte transversal de ambos testículos separados por el tabique escrotal (banda ecogénica central), con pared escrotal alrededor y finos tabiques intratesticulares. Fila inferior (pequeña): izq, eco escala de grises con flecha blanca sobre una estructura tubular ecogénica lineal; dcha, Doppler color con un vaso rojo intratesticular (flujo arterial).", "etiquetas": [{"n": "A", "nombre": "Mediastino testicular (línea ecogénica intratesticular señalada por la flecha)", "rosa": true, "seguro": true, "nota": "Letras del examen (img 15)."}, {"n": "B", "nombre": "Escroto (pared escrotal) — NO 'pared abdominal anterior'", "rosa": true, "seguro": true}, {"n": "C", "nombre": "Tabique escrotal (septum del dartos que separa los dos hemiescrotos; panel transversal)", "rosa": true, "seguro": true}, {"n": "D", "nombre": "Tabiques (septos) testiculares (líneas finas que dividen el parénquima en lobulillos)", "rosa": true, "seguro": true}, {"n": "1", "nombre": "Caliper 1-1: diámetro longitudinal del testículo", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Caliper 2-2: diámetro anteroposterior del testículo", "rosa": false, "seguro": true}, {"n": "inf-izq", "nombre": "Flecha inferior izq: estructura lineal ecogénica — probablemente mediastino testicular / túnica albugínea en otro corte", "rosa": false, "seguro": false, "nota": "Sin leyenda en la diapo; podría ser también el epidídimo o un vaso. Verificar si el profe la comenta."}, {"n": "inf-dcha", "nombre": "Doppler color: arteria intratesticular (rama centrípeta / transmediastínica de la a. testicular)", "rosa": false, "seguro": false}], "examen": [{"examen": "mayo 2026", "pregunta": "P8", "imagen": 15, "clave": "b", "que_pregunto": "a) 'A mediastino, B PARED ABDOMINAL ANTERIOR, C tabique escrotal, D tabiques testiculares' → falsa por un rótulo. b) CORRECTA: A mediastino testicular, B escroto, C tabique escrotal, D tabiques testiculares. c) 'la cabeza del epidídimo está formada por los conductos AFERENTES' → falsa (eferentes). d) 'A y C correctas' → falsa.", "img_key": "mayo-15"}], "pack": "ESTRUCTURA: túnica albugínea → mediastino testicular (engrosamiento posterior, contiene la rete testis y por donde entran vasos y nervios) → 250-300 tabiques/lobulillos con 1-4 túbulos seminíferos cada uno → túbulos rectos → rete testis → 10-12 conductillos EFERENTES → cabeza del epidídimo. ESCROTO: tabique escrotal formado por el dartos (rafe escrotal en la piel); cada hemiescroto tiene su túnica vaginal propia (hidrocele unilateral). Irrigación/venoso/linfa del testículo: ver p11 (testicular + deferencial + cremastérica; v. izda → renal izda; linfa lumbar). Escroto: pudenda externa (ant) / perineal-pudenda interna (post); linfa inguinal superficial.", "trampa": "Una sola letra cambiada entre opciones casi idénticas (a vs b); aferentes/eferentes; confundir tabique ESCROTAL (dartos, entre testículos) con tabiques TESTICULARES (intraparenquimatosos, de la albugínea).", "prioridad": 3}, {"key": "S11-p13", "pagina": 13, "item": 10, "tipo": "identifica", "titulo": "Ecografía de pene: abordaje ventral, dorsal y lateral — esquema del corte transversal (cuerpos cavernosos, cuerpo esponjoso/uretra, vasos dorsales) y silueta 'Mickey Mouse'", "que_se_ve": "Tres filas (VENTRAL / DORSAL / LATERAL y/o oblicua lateral), cada una con: foto de la posición de la sonda lineal sobre el pene, esquema en color del corte transversal del pene, la eco transversal real y una silueta negra tipo 'Mickey Mouse'. En el esquema: dos círculos azules grandes = cuerpos cavernosos (con un punto rojo central cada uno = a. cavernosa/profunda del pene) separados por el tabique intercavernoso; un círculo amarillo más pequeño con punto rojo y azul = cuerpo esponjoso con la uretra (esponjosa) dentro; en el lado dorsal, entre la piel y la albugínea, elipse azul (v. dorsal profunda) con puntos rojos a los lados (aa. dorsales) y elipse azul más superficial (v. dorsal superficial); pequeños vasos laterales. En abordaje ventral el cuerpo esponjoso queda arriba (cerca de la sonda); en dorsal, abajo; en lateral, a un lado. Sin leyenda impresa.", "etiquetas": [{"n": "azul ×2", "nombre": "Cuerpos cavernosos (pares, dorsales), cada uno con la a. profunda/cavernosa del pene en su centro; envueltos por la túnica albugínea gruesa y unidos por el tabique pectiniforme", "rosa": false, "seguro": true}, {"n": "amarillo", "nombre": "Cuerpo esponjoso (impar, ventral) que contiene la uretra esponjosa (punto azul/rojo central); termina en el glande", "rosa": false, "seguro": true}, {"n": "elipse azul dorsal + puntos rojos", "nombre": "Paquete dorsal profundo bajo la fascia de Buck: v. dorsal PROFUNDA (central, impar) + aa. dorsales del pene (pares, laterales) + nn. dorsales (los más laterales)", "rosa": false, "seguro": true, "nota": "Orden de medial a lateral: vena – arteria – nervio."}, {"n": "elipse azul superficial", "nombre": "V. dorsal SUPERFICIAL del pene (entre fascia superficial/dartos peneano y fascia de Buck) → v. pudenda externa → v. safena magna", "rosa": false, "seguro": false, "nota": "Identificada por posición en el esquema (por encima del paquete profundo); sin rótulo."}, {"n": "puntos laterales", "nombre": "Vasos circunflejos / ramas laterales (pequeños vasos periféricos del esquema)", "rosa": false, "seguro": false}, {"n": "Mickey", "nombre": "Silueta 'Mickey Mouse': las dos orejas = cuerpos cavernosos, la cabeza = cuerpo esponjoso (ventral: cabeza arriba; dorsal: cabeza abajo; lateral: de perfil)", "rosa": false, "seguro": true}, {"n": "VENTRAL / DORSAL / LATERAL", "nombre": "Abordajes de la sonda lineal: ventral (pene sobre el abdomen, sonda por la cara uretral), dorsal, lateral u oblicuo lateral", "rosa": false, "seguro": true}], "examen": [], "pack": "CAPAS del pene de fuera adentro: piel → fascia superficial (dartos peneano, con la v. dorsal superficial) → fascia PROFUNDA de BUCK (engloba los 3 cuerpos y, bajo ella, la v. dorsal profunda + aa. dorsales + nn. dorsales) → túnica albugínea (gruesa en cavernosos, fina en esponjoso). IRRIGACIÓN: TODO ← a. pudenda INTERNA ← ilíaca interna: aa. profundas/cavernosas (→ aa. helicinas, erección), aa. dorsales (piel, glande), a. del bulbo (bulbo, uretra esponjosa, Cowper), a. uretral; la piel superficial también ← pudenda EXTERNA ← femoral. VENOSO: v. dorsal profunda → plexo prostático (Santorini) → ilíaca interna; v. dorsal superficial → pudenda externa → safena magna; vv. profundas/cavernosas → pudenda interna. LINFA: piel/prepucio → inguinales superficiales; glande y uretra → inguinales profundos e ilíacos. INERVACIÓN: n. dorsal del pene (rama terminal del pudendo, S2-S4) sensitivo; erección parasimpática (nn. esplácnicos pélvicos/erigentes S2-S4 → plexo prostático → nn. cavernosos); eyaculación simpática (L1-L2). LIGAMENTOS: fundiforme (de la línea alba, superficial) y suspensorio (de la sínfisis, a la fascia de Buck) — M26 P12 preguntó los ligamentos del pene. Uretra masculina: prostática → membranosa (esfínter externo, la más estrecha y menos distensible) → esponjosa (bulbar + peneana, fosa navicular).", "trampa": "'Las aa. dorsales van bajo la fascia superficial en contacto con la piel' (falso: bajo Buck, M26 P12); 'la uretra va en los cuerpos cavernosos' (va en el esponjoso); erección simpática / eyaculación parasimpática (al revés); v. dorsal profunda → v. safena (es la superficial).", "prioridad": 2}, {"key": "S11-p14", "pagina": 14, "item": 0, "tipo": "omitir", "titulo": "Índice aparato genital femenino + foto de transductor convexo", "prioridad": 0}, {"key": "S11-p15", "pagina": 15, "item": 11, "tipo": "tecnica", "titulo": "Ecografía de útero: esquemas transabdominal (vejiga como ventana) y transvaginal (sonda endocavitaria) — Terese Winslow", "que_se_ve": "Dos ilustraciones sagitales de pelvis femenina. Izq 'Transabdominal Ultrasound': transductor convexo sobre el hipogastrio, haz ('Sound Waves') que atraviesa la vejiga llena hasta el útero; rótulos Vagina, Ovary, Uterus, Cervix. Dcha 'Transvaginal Ultrasound': mano enguantada introduce la sonda endocavitaria en la vagina, con recuadro de la paciente en posición ginecológica; rótulos Bladder, Uterus, Ovary, Fallopian tube, Rectum.", "etiquetas": [{"n": "Ultrasound Transducer", "nombre": "Transductor convexo transabdominal (3-5 MHz)", "rosa": false, "seguro": true}, {"n": "Sound Waves", "nombre": "Haz de ultrasonidos atravesando la vejiga llena (ventana acústica)", "rosa": false, "seguro": true}, {"n": "Vagina", "nombre": "Vagina", "rosa": false, "seguro": true}, {"n": "Ovary", "nombre": "Ovario (en la fosa ovárica, lateral al útero)", "rosa": false, "seguro": true}, {"n": "Uterus", "nombre": "Útero (en anteversión-anteflexión sobre la vejiga)", "rosa": false, "seguro": true}, {"n": "Cervix", "nombre": "Cérvix uterino (protruye en el fórnix vaginal)", "rosa": false, "seguro": true}, {"n": "Bladder", "nombre": "Vejiga urinaria (delante e inferior al cuerpo uterino)", "rosa": false, "seguro": true}, {"n": "Fallopian tube", "nombre": "Trompa uterina (de Falopio) en el borde superior libre del lig. ancho", "rosa": false, "seguro": true}, {"n": "Rectum", "nombre": "Recto (detrás del útero, separado por el fondo de saco rectouterino de Douglas)", "rosa": false, "seguro": true}], "examen": [], "pack": "Transabdominal: vejiga LLENA como ventana acústica, mayor campo, menor definición; transvaginal: sonda de 5-9 MHz directamente en el fórnix vaginal, vejiga VACÍA, menor campo, mayor definición (1er trimestre, ovarios pequeños, endometrio). RELACIONES del útero que se ven en el esquema: anterior → vejiga (fondo de saco vesicouterino); posterior → recto vía fondo de saco RECTOUTERINO (Douglas, el más declive del peritoneo ♀, culdocentesis por el fórnix posterior) y asas de delgado/sigma; laterales → lig. ancho con la a. uterina cruzando POR DELANTE y encima del uréter ('el agua bajo el puente'). Posición fisiológica: anteversión (cérvix-vagina ≈ 90°) + anteflexión (cuerpo-cérvix ≈ 120°).", "trampa": "'Transvaginal con vejiga llena' (falso); 'transabdominal tiene mayor resolución' (falso); 'fondo de saco rectovesical' en la mujer (no existe: M26 P27).", "prioridad": 1}, {"key": "S11-p16", "pagina": 16, "item": 12, "tipo": "tecnica", "titulo": "Ginecología · Ultrasonido: eco transabdominal vs transvaginal (7 MHz) + tabla comparativa", "que_se_ve": "Fondo negro. Arriba: miniatura de un corte sagital anatómico de pelvis femenina. Izq: eco transabdominal — vejiga anecoica grande arriba y detrás/debajo el útero hipoecoico (menor definición). Dcha: eco transvaginal (equipo a 7,0 MHz, 'EV') — útero en corte longitudinal con la línea endometrial ecogénica y gran detalle. Abajo, tabla rosa: Transabdominal (vejiga como ventana acústica · mayor campo de acción · menor definición) vs Transvaginal (directo en vagina · menor campo de acción · mayor definición).", "etiquetas": [{"n": "Transabdominal", "nombre": "Vejiga como ventana acústica · Mayor campo de acción · Menor definición", "rosa": false, "seguro": true}, {"n": "Transvaginal", "nombre": "Directo en vagina · Menor campo de acción · Mayor definición (7 MHz)", "rosa": false, "seguro": true}, {"n": "eco izq", "nombre": "Eco transabdominal: vejiga llena (anecoica) y útero detrás", "rosa": false, "seguro": true}, {"n": "eco dcha", "nombre": "Eco transvaginal longitudinal del útero: miometrio + línea endometrial ecogénica", "rosa": false, "seguro": true}], "examen": [], "pack": "Misma lógica física que próstata (P21 mayo): sonda más cerca + más frecuencia = más definición y menos campo. En ecografía ginecológica el útero se mide en longitudinal (fondo-cérvix ≈ 7-8 cm en nulípara) y el endometrio como línea ecogénica central (grosor varía con el ciclo). Relaciones útero: ver p15. La transvaginal permite ver los ovarios (fosa ovárica: delante ilíaca externa, detrás uréter + ilíaca INTERNA, techo obliterado del umbilical) y el fondo de saco de Douglas (líquido libre).", "trampa": "Invertir las columnas de la tabla ('transvaginal = mayor campo'). Preguntar 'cuál es la ventana acústica de la transabdominal' → vejiga LLENA.", "prioridad": 2}, {"key": "S11-p17", "pagina": 17, "item": 13, "tipo": "identifica", "titulo": "Anatomía ecográfica útero y anexos — USG pélvico transabdominal ETIQUETADO (longitudinal y transversal; ovarios derecho e izquierdo)", "que_se_ve": "Lámina compuesta. Izq: fotos de la sonda en 'Pelvis longitudinal' y 'Pelvis transversal' y texto '1er método de elección para valorar órganos pélvicos'. Centro arriba (longitudinal): Vejiga anecoica, Útero detrás con Endometrio (línea ecogénica), Cérvix y Canal vaginal (línea ecogénica que continúa hacia abajo-derecha). Centro abajo (transversal): Vejiga, Útero central con Endometrio, y a cada lado Ovario Der y Ovario Izq (con folículos anecoicos). Dcha: dos ecos con Vejiga y Ovario Der / Ovario Izq señalados con flechas amarillas.", "etiquetas": [{"n": "Vejiga", "nombre": "Vejiga urinaria llena (anecoica) — ventana acústica de la vía transabdominal", "rosa": false, "seguro": true}, {"n": "Endometrio", "nombre": "Endometrio: línea/banda ecogénica central de la cavidad uterina", "rosa": false, "seguro": true}, {"n": "Útero", "nombre": "Útero (miometrio hipoecoico homogéneo), en anteversión sobre la vejiga", "rosa": false, "seguro": true}, {"n": "Cérvix", "nombre": "Cérvix uterino (porción inferior, se continúa con la vagina)", "rosa": false, "seguro": true}, {"n": "Canal vaginal", "nombre": "Canal vaginal: línea ecogénica (mucosas en contacto) que sigue al cérvix hacia abajo", "rosa": false, "seguro": true}, {"n": "Ovario Der", "nombre": "Ovario derecho (lateral al útero, con folículos anecoicos)", "rosa": false, "seguro": true}, {"n": "Ovario Izq", "nombre": "Ovario izquierdo", "rosa": false, "seguro": true}, {"n": "Pelvis longitudinal / transversal", "nombre": "Posición de la sonda convexa suprapúbica en plano sagital y axial", "rosa": false, "seguro": true}, {"n": "1er método de elección", "nombre": "La ecografía es el primer método de elección para valorar los órganos pélvicos", "rosa": false, "seguro": true}], "examen": [], "pack": "ÚTERO — irrigación triple: a. uterina ← ilíaca interna (cruza por delante/encima del uréter en la base del lig. ancho, lig. cardinal de Mackenrodt) + a. del lig. redondo ← epigástrica inferior ← ilíaca EXTERNA + a. ovárica ← aorta (anastomosis útero-ovárica). Venoso: plexo uterovaginal → vv. uterinas → ilíaca interna. Linfa segmentaria: fondo → lumboaórticos (con ovario) y algo a inguinales superficiales (vía lig. redondo); cuerpo → ilíacos externos; cérvix → ilíacos internos/externos, obturadores y sacros. Inervación: plexo uterovaginal (Frankenhäuser) ← plexo hipogástrico inferior. OVARIO: a. ovárica ← aorta (lig. suspensorio) + rama ovárica de la uterina; v. ovárica izda → renal izda, dcha → VCI; linfa lumbar; fijación = lig. suspensorio (pared) + lig. propio (útero) + lig. infundíbulo-ovárico/mesoovario. VAGINA: a. vaginal ← ilíaca interna (o uterina) + ramas de uterina, rectal media y pudenda interna; relaciones: delante vejiga/uretra (tabique vesicovaginal y uretrovaginal), detrás recto (tabique rectovaginal) y fórnix posterior con Douglas.", "trampa": "Tabique rectovaginal atribuido al ÚTERO (es de la vagina, M26 P33b); a. del lig. redondo 'de la ilíaca interna' (es de la epigástrica inferior ← ilíaca externa); uréter 'por delante' de la uterina (va por detrás/debajo).", "prioridad": 2}, {"key": "S11-p18", "pagina": 18, "item": 14, "tipo": "identifica", "titulo": "Posiciones del útero en eco pélvica: anteflexión-anteversión (fisiológica), retroflexión, retroversión — F, V, Cx", "que_se_ve": "Tres columnas. Arriba, esquemas sagitales de la pelvis: 'Anteflexión / Anteversión' (útero inclinado hacia delante sobre la vejiga), 'Retroflexión' (cuerpo doblado hacia atrás sobre el cérvix) y 'Retroversión' (todo el útero inclinado hacia atrás). Abajo, las ecos transabdominales sagitales correspondientes con rótulos F (fondo), V (vejiga), Cx (cérvix) y calipers 1-2 con distancias (Dist = 8,08 cm / 4,24 cm; 7,68 cm / 3,51 cm). Texto: 'Posición fisiológica más usual' y 'Variantes de posición: Flexión = relación del cuerpo con cérvix; Versión = relación de cérvix con vagina'.", "etiquetas": [{"n": "F", "nombre": "Fondo uterino", "rosa": false, "seguro": true}, {"n": "V", "nombre": "Vejiga urinaria (anecoica, delante del útero)", "rosa": false, "seguro": true}, {"n": "Cx", "nombre": "Cérvix uterino", "rosa": false, "seguro": true}, {"n": "1 / 2", "nombre": "Calipers: 1 = longitud uterina (fondo-cérvix ≈ 8 cm), 2 = diámetro anteroposterior (≈ 4 cm)", "rosa": false, "seguro": true}, {"n": "Anteflexión Anteversión", "nombre": "Posición fisiológica más usual: cuerpo flexionado hacia delante sobre el cérvix (anteflexión) y cérvix inclinado hacia delante respecto a la vagina (anteversión) — el útero descansa sobre la vejiga", "rosa": false, "seguro": true}, {"n": "Retroflexión", "nombre": "Cuerpo uterino doblado hacia ATRÁS respecto al cérvix", "rosa": false, "seguro": true}, {"n": "Retroversión", "nombre": "Útero entero (eje cérvix-vagina) inclinado hacia ATRÁS, hacia el recto/Douglas", "rosa": false, "seguro": true}], "examen": [], "pack": "DEFINICIONES: VERSIÓN = ángulo cérvix–vagina (≈ 90°, anteversión); FLEXIÓN = ángulo cuerpo–cérvix (≈ 120-170°, anteflexión). Lo mantienen los medios de fijación: lig. redondo (anteversión; a. del lig. redondo ← epigástrica inferior; va por el conducto inguinal a los labios mayores), ligs. cardinales/cervicales transversos de Mackenrodt (sostén principal, contienen la a. uterina y el uréter), ligs. uterosacros (tiran del cérvix hacia atrás → anteversión), lig. pubocervical, lig. ancho (mesometrio, mesosálpinx, mesoovario) y suelo pélvico (elevador del ano, diafragma urogenital). Retroversión: el fondo cae en el Douglas; en ecografía transabdominal el fondo se aleja de la vejiga (peor ventana).", "trampa": "Intercambiar las definiciones de versión (cérvix-vagina) y flexión (cuerpo-cérvix); 'el lig. redondo mantiene la retroversión' (mantiene la anteversión); 'lig. ancho = principal sostén' (es el cardinal/Mackenrodt + suelo pélvico).", "prioridad": 2}, {"key": "S11-p19", "pagina": 19, "item": 15, "tipo": "identifica", "titulo": "USG transvaginal ETIQUETADO: útero longitudinal (fondo, endometrio, cuerpo, cérvix), cérvix, útero transversal, ovario edad reproductiva vs postmenopausia = imagen 10 del examen de mayo = R2-GU p17", "que_se_ve": "Lámina compuesta 'Anatomía ecográfica – Útero y anexos – USG Transvaginal'. Arriba izq 'Útero longitudinal' (= img 10 del examen): útero en sector con flechas a Fondo Útero (izq), Endometrio (línea ecogénica central), Cuerpo Útero (miometrio) y Cérvix (dcha). Arriba dcha 'Cérvix longitudinal'. Recuadro INDICACIONES: embarazo 1er trimestre, ovarios pequeños (PQ), cualquier evaluación 'con mayor resolución'. Abajo izq 'Útero transversal' con Endometrio y Útero. Abajo dcha 'Ovario longitudinal y transversal' en edad reproductiva (folículos anecoicos con calipers 1-4 de 0,5-1 cm) y 'Postmenopausia' (ovario pequeño, flecha, 1,24 cm). Texto VOLUMEN OVÁRICO: edad reproductiva 10 cc (5-15, máx 20); postmenopausia 6 cc (en 30 % ya no visibles).", "etiquetas": [{"n": "A", "nombre": "Fondo uterino (Fondo Útero)", "rosa": true, "seguro": true, "nota": "Letras del examen (img 10) = rosas 1-4 de R2-GU p17."}, {"n": "B", "nombre": "Endometrio (línea ecogénica central de la cavidad)", "rosa": true, "seguro": true}, {"n": "C", "nombre": "Cuerpo uterino (miometrio)", "rosa": true, "seguro": true}, {"n": "D", "nombre": "Cérvix uterino", "rosa": true, "seguro": true}, {"n": "Cérvix longitudinal", "nombre": "Cérvix en corte longitudinal transvaginal: canal cervical como línea ecogénica", "rosa": false, "seguro": true}, {"n": "Útero transversal – Endometrio / Útero", "nombre": "Corte transversal del cuerpo: endometrio central ecogénico rodeado de miometrio", "rosa": false, "seguro": true}, {"n": "Ovario edad reproductiva", "nombre": "Ovario con múltiples folículos anecoicos (calipers 1-4: 0,53-1,0 cm); volumen 10 cc (5-15, máx 20)", "rosa": false, "seguro": true}, {"n": "Postmenopausia", "nombre": "Ovario atrófico sin folículos (flecha), ≈ 6 cc; en el 30 % de las mujeres ya no es visible", "rosa": false, "seguro": true}, {"n": "INDICACIONES", "nombre": "Transvaginal: embarazo 1er trimestre · ovarios pequeños · cualquier evaluación con mayor resolución", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P33", "imagen": 10, "clave": "d", "que_pregunto": "a) A fondo, B endometrio, C cuerpo, D cérvix → cierta. b) 'se relaciona posteriormente con recto, Douglas, asas de delgado y el tabique úterovaginal/rectovaginal' → FALSA (el tabique rectovaginal es relación de la VAGINA). c) irrigado por a. uterina (ilíaca interna), a. del lig. redondo (epigástrica inf ← ilíaca externa) y a. ovárica (aorta) → cierta. d) CORRECTA: a y c.", "img_key": "mayo-10"}], "pack": "ÚTERO — irrigación triple: a. UTERINA ← ilíaca interna (rama principal; cruza por delante y encima del uréter ≈ 2 cm lateral al cérvix; ramas ascendente/helicinas, cervicovaginal, tubárica y ovárica) + a. del LIG. REDONDO ← epigástrica inferior ← ilíaca EXTERNA + a. OVÁRICA ← aorta. Venoso: plexo venoso uterovaginal → vv. uterinas → v. ilíaca interna (y vía plexo pampiniforme ovárico → v. ovárica). Linfa: fondo/cuerpo alto → lumboaórticos (+ inguinales superficiales por el lig. redondo), cuerpo → ilíacos externos, cérvix → ilíacos internos, obturadores, sacros. Inervación: plexo uterovaginal ← hipogástrico inferior (simpático T10-L2 dolor del cuerpo; parasimpático S2-S4 cérvix). Relaciones: anterior vejiga (vesicouterino), posterior recto (rectouterino de Douglas) + asas; laterales lig. ancho, uréter, a. uterina. Capas: perimetrio (peritoneo), miometrio, endometrio (capa funcional que se descama + basal). OVARIO: volumen 10 cc reproductiva / 6 cc menopausia; a. ovárica ← aorta; fosa de Krause.", "trampa": "Tabique rectovaginal 'del útero' (M26 P33b); a. del lig. redondo 'de la ilíaca interna'; 'uréter delante de la uterina'; 'linfa del cérvix → lumboaórticos'.", "prioridad": 3}, {"key": "S11-p20", "pagina": 20, "item": 16, "tipo": "imagen", "titulo": "Ecografía transvaginal de útero sin etiquetas: corte longitudinal y corte transverso (gemela de p19)", "que_se_ve": "Dos ecografías transvaginales en sector (marcador de sonda arriba). Izq 'Corte longitudinal': útero en anteversión con la banda endometrial ecogénica curva en el centro rodeada de miometrio; a la derecha, líneas ecogénicas oblicuas = cérvix/canal vaginal. Dcha 'Corte Transverso': útero redondeado con el endometrio como banda ecogénica horizontal central; en el ángulo superior izq pequeña zona anecoica (vaso/asa/folículo). Sin rótulos: sirve para autoevaluar lo aprendido en p19.", "etiquetas": [{"n": "long-centro", "nombre": "Endometrio (banda ecogénica central) — corte longitudinal", "rosa": false, "seguro": true}, {"n": "long-alrededor", "nombre": "Miometrio del cuerpo uterino (hipoecoico homogéneo)", "rosa": false, "seguro": true}, {"n": "long-izq", "nombre": "Fondo uterino (extremo izquierdo del corte longitudinal)", "rosa": false, "seguro": false, "nota": "Orientación deducida por continuidad con p19 (fondo a la izquierda, cérvix a la derecha)."}, {"n": "long-dcha", "nombre": "Cérvix / porción inferior (extremo derecho, líneas ecogénicas oblicuas)", "rosa": false, "seguro": false}, {"n": "transv-centro", "nombre": "Endometrio en corte transversal (banda horizontal ecogénica)", "rosa": false, "seguro": true}, {"n": "transv-alrededor", "nombre": "Miometrio (cuerpo uterino en axial)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P33 (misma familia)", "im

El XII es motor de la LENGUA, no del paladar; su lesión desvía la lengua (hacia el lado lesionado), no la úvula."}, {"letra": "d", "texto": "Glosofaríngeo izquierdo.", "correcta": false, "razon": "El IX solo inerva un músculo (estilofaríngeo) y es sobre todo sensitivo (1/3 posterior de la lengua, faringe, seno carotídeo); no mueve el velo del paladar."}, {"letra": "e", "texto": "Glosofaríngeo derecho.", "correcta": false, "razon": "Misma razón: el IX no inerva la musculatura del paladar blando; además el lado sería el equivocado."}], "respuesta": "a", "razonamiento": "Todos los músculos del paladar blando reciben inervación motora del vago (fibras del accesorio craneal que viajan con el X por el plexo faríngeo), salvo el tensor del velo del paladar (V3). En una parálisis unilateral del vago el hemivelo del lado lesionado queda caído y, al fonar, el elevador del velo del lado sano tira de la úvula hacia SU lado: la úvula se desvía hacia el lado SANO. Úvula a la derecha → vago IZQUIERDO lesionado. Regla contraria a la lengua: el hipogloso desvía la lengua hacia el lado LESIONADO (geniogloso sano empuja)."}, "examen": [], "pack": "Paladar blando: elevador del velo, m. de la úvula, palatogloso y palatofaríngeo = vago (plexo faríngeo); tensor del velo = n. mandibular (V3, n. del pterigoideo medial). Sensibilidad: n. palatinos menores (V2) + IX. Irrigación: a. palatina descendente (menor) ← maxilar, palatina ascendente ← facial. Lengua: motor XII (salvo palatogloso = X).", "trampa": "Lateralidad: úvula → lado SANO (vago), lengua → lado LESIONADO (hipogloso). Bermúdez lo combina en el mismo examen (P68 enero: hipogloso).", "prioridad": 2}, {"key": "R1D-p09", "pagina": 9, "item": 8, "tipo": "identifica", "titulo": "Nervios del suelo de la boca: lingual, cuerda del tímpano, ganglio submandibular, hipogloso, a. lingual", "que_se_ve": "Dos esquemas (tipo Gray/Netter) de la hemimandíbula vista desde medial: arriba con la lengua y las glándulas (1-3), abajo la mandíbula transparente con los nervios lingual e hipogloso y la a. lingual (1, 2, 4, 5). Rosas: 1 y 4.", "etiquetas": [{"n": "1", "nombre": "Nv. lingual.", "rosa": true, "seguro": true, "nota": "Rama de V3; sensibilidad general 2/3 anteriores; cruza el conducto de Wharton por encima; lleva la cuerda del tímpano hasta el ganglio submandibular."}, {"n": "2", "nombre": "Nv. Cuerda del tímpano.", "rosa": false, "seguro": true, "nota": "Rama del facial (VII): gusto 2/3 anteriores + parasimpático preganglionar para submandibular y sublingual; se une al lingual en la fosa infratemporal."}, {"n": "3", "nombre": "Ganglio submandibular", "rosa": false, "seguro": true, "nota": "Colgado del n. lingual sobre el hiogloso; sinapsis parasimpática → glándulas submandibular y sublingual."}, {"n": "4", "nombre": "Nv. hipogloso.", "rosa": true, "seguro": true, "nota": "XII: motor de la lengua; entra por el triángulo submandibular, sobre el hiogloso, POR DEBAJO del conducto de Wharton y del n. lingual."}, {"n": "5", "nombre": "Art. lingual.", "rosa": false, "seguro": true, "nota": "Rama de la carótida externa a nivel del asta mayor del hioides; pasa MEDIAL al hiogloso (el XII va lateral)."}], "examen": [{"examen": "enero 2026", "pregunta": "P68", "imagen": 6, "clave": "d", "que_pregunto": "Imagen 6 = esta lámina con letras; C = n. hipogloso (rosa 4). 'A y C correctas' (d): la lesión del XII desvía la lengua hacia el lado afectado al protruir (a) y produce atrofia a largo plazo (c); NO da sensibilidad (b falsa).", "img_key": "enero-06"}, {"examen": "enero 2026", "pregunta": "P68 (clon del caso 9, p10)", "imagen": null, "clave": "d", "que_pregunto": "El razonamiento es el del caso 9 de este reto: lengua desviada a la derecha = hipogloso derecho.", "img_key": null}], "pack": "Triángulo submandibular sobre el hiogloso, de arriba abajo: n. lingual (+ ganglio submandibular) → conducto de Wharton → n. hipogloso; la a. lingual pasa profunda (medial) al hiogloso y la v. lingual/hipogloso superficiales. Hipogloso: sale por el canal del hipogloso, desciende entre carótida interna y yugular, cruza la carótida externa por fuera (a nivel del origen de la occipital) y entra en la lengua; en su trayecto se le une C1 (asa cervical, geniohioideo/tirohioideo). Riesgo quirúrgico: endarterectomía carotídea, disección cervical, submandibulectomía.", "trampa": "Atribuir sensibilidad al XII (motor puro); invertir la desviación (lengua → lado LESIONADO); pedir 'cuál va por encima del conducto' (lingual) vs 'por debajo' (hipogloso).", "prioridad": 3}, {"key": "R1D-p10", "pagina": 10, "item": 9, "tipo": "caso", "titulo": "Caso 9 · Lengua desviada tras endarterectomía carotídea", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 55 años ingresa en el hospital con una hipertensión importante (190/110 mmHg) e hipercolesterolemia (250 mg/dl). Se queja de dolor de cabeza y mareos. Las radiografías revelan una oclusión del 90% de las dos arterias carótidas comunes. Se realiza una endarterectomía carotídea. Durante la exploración postoperatoria del lado derecho se observa que la lengua se desvía hacia la derecha cuando se le pide que la saque. ¿Cuál de los siguientes nervios es, probablemente, el que ha resultado dañado en la operación?", "opciones": [{"letra": "a", "texto": "Glosofaríngeo derecho.", "correcta": false, "razon": "El IX no es motor de la lengua (solo estilofaríngeo); su lesión daría pérdida de gusto/sensibilidad del 1/3 posterior y del reflejo nauseoso, no desviación."}, {"letra": "b", "texto": "Hipogloso derecho.", "correcta": true, "razon": "CORRECTA. El XII cruza la bifurcación carotídea (pasa por fuera de las carótidas interna/externa, a la altura de la a. occipital) y es el nervio que más se lesiona en la endarterectomía. Con el geniogloso derecho paralizado, el geniogloso IZQUIERDO sano empuja la lengua hacia la DERECHA = lado lesionado."}, {"letra": "c", "texto": "Hipogloso izquierdo.", "correcta": false, "razon": "Su lesión desviaría la lengua hacia la izquierda; además la cirugía descrita es del lado derecho."}, {"letra": "d", "texto": "Lingual izquierdo.", "correcta": false, "razon": "El n. lingual es sensitivo (V3): su lesión da anestesia de los 2/3 anteriores de la hemilengua, no desviación; y el lado es el contrario."}, {"letra": "e", "texto": "Vago izquierdo.", "correcta": false, "razon": "El vago desvía la ÚVULA (hacia el lado sano) y da disfonía por el laríngeo recurrente; no mueve la lengua (excepto el palatogloso). Lado además incorrecto."}], "respuesta": "b", "razonamiento": "El geniogloso es el músculo que PROTRUYE la lengua tirando de ella hacia delante y hacia la línea media contralateral; cada geniogloso empuja su hemilengua hacia el lado opuesto. Si el hipogloso derecho está lesionado, el geniogloso derecho no actúa y el izquierdo, sin oposición, desvía la punta hacia la DERECHA: la lengua se desvía hacia el lado LESIONADO. El hipogloso pasa por el triángulo carotídeo, cruzando lateralmente las carótidas interna y externa justo por encima de la bifurcación: por eso es el nervio típicamente lesionado en la endarterectomía carotídea (con el vago y el laríngeo superior)."}, "examen": [{"examen": "enero 2026", "pregunta": "P68", "imagen": 6, "clave": "d", "que_pregunto": "Clon con imagen: nervio C de la imagen 6 (hipogloso) → su lesión desvía la lengua hacia el lado afectado y produce atrofia; a y c correctas (d).", "img_key": "enero-06"}], "pack": "N. hipogloso (XII): sale por el canal del hipogloso (occipital), desciende medial a la yugular interna y a la carótida interna, gira hacia delante cruzando por FUERA la carótida interna y externa por debajo del vientre posterior del digástrico (a nivel del origen de la a. occipital), pasa sobre el hiogloso y bajo el conducto de Wharton hasta el geniogloso. Lleva C1 (asa cervical: geniohioideo, tirohioideo). Motor de todos los músculos de la lengua salvo el palatogloso (X). Lesión periférica: desviación al lado lesionado + atrofia + fasciculaciones.", "trampa": "Lateralidad (lengua → lado de la lesión, al revés que la úvula); ofrecer 'lingual' como si fuera motor; decir que el XII pasa 'medial' a la carótida (pasa lateral/por fuera).", "prioridad": 3}, {"key": "R1D-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Dentición y seno maxilar / conducto mandibular (esquema lateral)", "que_se_ve": "Esquema del maxilar y la mandíbula en visión lateral con los grupos dentarios agrupados por corchetes (1-4), el seno maxilar sombreado (5, rosa) y el trayecto del conducto mandibular (6).", "etiquetas": [{"n": "1", "nombre": "Incisivos.", "rosa": false, "seguro": true, "nota": "2 por hemiarcada (8 en total); inferiores drenan a submentonianos."}, {"n": "2", "nombre": "Canino.", "rosa": false, "seguro": true, "nota": "1 por hemiarcada; la raíz más larga (eminencia canina)."}, {"n": "3", "nombre": "Premolares", "rosa": false, "seguro": true, "nota": "2 por hemiarcada; no existen en la dentición decidua (ahí hay molares temporales)."}, {"n": "4", "nombre": "Molares.", "rosa": false, "seguro": true, "nota": "3 por hemiarcada; el 3º es el cordal. Fórmula definitiva 2-1-2-3 = 32 piezas; decidua 2-1-0-2 = 20."}, {"n": "5", "nombre": "Seno maxilar.", "rosa": true, "seguro": true, "nota": "Antro de Highmore: suelo en relación con las raíces de premolares y molares superiores (sinusitis odontógena, fístula oroantral tras extracción); drena al meato medio; inervación V2 (alveolares superiores, infraorbitario)."}, {"n": "6", "nombre": "Canal mandibular.", "rosa": false, "seguro": true, "nota": "Conducto del n. y a./v. alveolares inferiores desde el agujero mandibular (língula/espina de Spix, lugar de la anestesia troncular) hasta el agujero mentoniano (bajo el 2º premolar)."}], "examen": [], "pack": "Arcada superior: ramos alveolares superiores (V2) + aa. alveolares superiores/infraorbitaria (← maxilar); linfa a submandibulares. Arcada inferior: n. y a. alveolares inferiores (V3 / maxilar) por el canal mandibular → mentoniano; linfa submandibulares (incisivos → submentonianos). Seno maxilar: el mayor de los paranasales, drena al meato medio por el hiato semilunar; su suelo está por debajo del suelo nasal en el adulto, de ahí que las raíces molares lo perforen.", "trampa": "Relación seno maxilar-raíces molares superiores; 'los premolares existen en la dentición temporal' (no); confundir agujero mandibular (entrada, anestesia) con mentoniano (salida).", "prioridad": 2}, {"key": "R1D-p12", "pagina": 12, "item": 11, "tipo": "identifica", "titulo": "Disección del suelo de la boca y glándulas salivares (Rohen) + esquema lateral de las glándulas", "que_se_ve": "Izquierda: fotografía de disección (Rohen) de la hemicara/suelo de la boca vista desde lateral-inferior tras retirar la mandíbula parcialmente, con números 3, 4, 5, 6, 7, 13, 20, 21, 30, 31, 32, 33, 34, 35. Derecha: esquema lateral de la cabeza con las tres glándulas salivares (parótida naranja, submandibular rosa/roja, sublingual verde) y los números 3, 4, 7, 13, 21, 33, 34. Sin rosas. La diapo lista 5, 6, 7, 13, 21, 30, 31, 33, 34.", "etiquetas": [{"n": "3", "nombre": "Conducto submandibular (Wharton)", "rosa": false, "seguro": false, "nota": "No listado; en la disección aparece junto al n. lingual (5) y en el esquema sale de la gl. submandibular hacia delante."}, {"n": "4", "nombre": "Glándula submandibular", "rosa": false, "seguro": false, "nota": "No listado; en el esquema es la masa bajo la lengua por encima del milohioideo (7)."}, {"n": "5", "nombre": "Nv. Lingual.", "rosa": false, "seguro": true, "nota": "Aparece dos veces en la disección (tramo alto y tramo sobre el hiogloso, cruzando el conducto)."}, {"n": "6", "nombre": "Nv. Hipogloso.", "rosa": false, "seguro": true, "nota": "Por debajo del conducto y del lingual, entrando en la lengua."}, {"n": "7", "nombre": "Ms. Milohioideo.", "rosa": false, "seguro": true, "nota": "Diafragma oral; separa la celda submandibular (abajo) de la sublingual (arriba)."}, {"n": "13", "nombre": "gl. Parótida.", "rosa": false, "seguro": true, "nota": "Naranja en el esquema, preauricular; conducto de Stenon (33)."}, {"n": "20", "nombre": "Ganglio submandibular", "rosa": false, "seguro": false, "nota": "No listado; pequeña estructura colgada del n. lingual (5) sobre el hiogloso."}, {"n": "21", "nombre": "Gl. sublingual.", "rosa": false, "seguro": true, "nota": "Verde en el esquema, la más anterior, bajo el pliegue sublingual, sobre el milohioideo."}, {"n": "30", "nombre": "Ms. buccinador.", "rosa": false, "seguro": true, "nota": "Pared lateral del vestíbulo; lo perfora el conducto de Stenon frente al 2º molar superior; n. facial (motor)."}, {"n": "31", "nombre": "Lengua.", "rosa": false, "seguro": true}, {"n": "32", "nombre": "Cuerpo de la mandíbula (borde inferior) / vientre anterior del digástrico", "rosa": false, "seguro": false, "nota": "No listado; línea que acaba en el borde inferior seccionado de la disección."}, {"n": "33", "nombre": "conducto Stenon.", "rosa": false, "seguro": true, "nota": "Conducto parotídeo: ~5 cm, cruza el masetero 1 dedo bajo el arco cigomático."}, {"n": "34", "nombre": "Ms masetero.", "rosa": false, "seguro": true, "nota": "Sobre él discurre Stenon; inervado por V3."}, {"n": "35", "nombre": "Mm. geniogloso/geniohioideo (inserción en las espinas mentonianas)", "rosa": false, "seguro": false, "nota": "No listado; línea sobre la cara interna de la sínfisis mandibular."}], "examen": [], "pack": "Parótida: a. carótida externa (se bifurca dentro en temporal superficial y maxilar), v. retromandibular, n. facial (plano de parotidectomía), parasimpático IX → ótico → auriculotemporal; linfa parotídeos. Submandibular: a. facial, parasimpático VII (cuerda del tímpano → lingual → ganglio submandibular); Wharton a la carúncula. Sublingual: a. sublingual (lingual) + submentoniana (facial); mismos nervios que la submandibular; conductos de Rivinus/Bartholin. Conducto de Stenon: masetero → buccinador → vestíbulo (2º molar superior).", "trampa": "Lámina 'Identifica' AÚN NO caída (F2 §3.2: candidata caliente). Trampas: qué conducto pertenece a qué glándula, qué nervio pasa por encima/debajo de Wharton, y qué músculo perfora Stenon (buccinador, no masetero).", "prioridad": 2}, {"key": "R1D-p13", "pagina": 13, "item": 12, "tipo": "caso", "titulo": "Caso 12 · Anestesia para caries de molar mandibular", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Un paciente de 38 años es atendido en la clínica dental por dolor agudo dental. El dentista encuentra una caries penetrante que afecta al molar mandibular. ¿Cuál de los siguientes nervios necesitará anestesiar el dentista para eliminar la caries del molar?", "opciones": [{"letra": "a", "texto": "Lingual.", "correcta": false, "razon": "El n. lingual da la sensibilidad de los 2/3 anteriores de la lengua, suelo de la boca y ENCÍA LINGUAL, pero no de la pulpa dentaria."}, {"letra": "b", "texto": "Alveolar inferior.", "correcta": true, "razon": "CORRECTA. El n. alveolar inferior (rama de V3) entra por el agujero mandibular y recorre el conducto mandibular dando el plexo dental inferior a todos los dientes mandibulares (molares, premolares y, por su n. incisivo, canino e incisivos). Es el bloqueo troncular del dentista (espina de Spix)."}, {"letra": "c", "texto": "Bucal.", "correcta": false, "razon": "El n. bucal (V3) es sensitivo de la mejilla y de la encía VESTIBULAR de los molares inferiores; no inerva el diente."}, {"letra": "d", "texto": "Mentoniano.", "correcta": false, "razon": "Rama terminal del alveolar inferior que sale por el agujero mentoniano: inerva labio inferior, mentón y encía vestibular anterior, no los molares."}, {"letra": "e", "texto": "Milohioideo.", "correcta": false, "razon": "Rama motora del alveolar inferior (antes de entrar en el canal) para milohioideo y vientre anterior del digástrico; no es sensitivo dental."}], "respuesta": "b", "razonamiento": "La sensibilidad de los dientes mandibulares depende del n. alveolar inferior, rama del n. mandibular (V3), que atraviesa el conducto mandibular desde el agujero mandibular (en la cara interna de la rama, protegido por la língula o espina de Spix) hasta el agujero mentoniano. Dentro del canal da el plexo dental inferior (molares y premolares) y termina en n. incisivo + n. mentoniano. Para trabajar en un molar inferior el odontólogo hace un bloqueo troncular del alveolar inferior en la espina de Spix (con frecuencia se anestesian también el lingual y el bucal por vecindad, lo que explica la lengua y la mejilla 'dormidas'). En la arcada superior el equivalente son los ramos alveolares superiores del n. maxilar (V2)."}, "examen": [{"examen": "enero 2026", "pregunta": "P63", "imagen": 1, "clave": "d", "que_pregunto": "Versión ESPEJADA con imagen: caries en un molar SUPERIOR izdo (estructura B de la imagen 1, panorámica de p4) → ramos alveolares superiores, rama del n. maxilar (V2). El profesor cambia la arcada y añade el facial como distractor.", "img_key": "enero-01"}], "pack": "N. mandibular (V3) → tronco posterior → n. alveolar inferior (+ n. milohioideo motor antes del agujero) → conducto mandibular → plexo dental inferior → n. mentoniano (agujero mentoniano, bajo el 2º premolar) + n. incisivo. Acompañado por la a. alveolar inferior (← maxilar). Encía: lingual = n. lingual; vestibular molar = n. bucal; vestibular anterior = mentoniano. Arcada superior: alveolares superiores post/medio/ant de V2 (infraorbitario).", "trampa": "Espejo arcada superior/inferior (V2 vs V3); confundir encía (lingual/bucal/mentoniano) con diente (alveolar); colar el facial.", "prioridad": 3}, {"key": "R1D-p14", "pagina": 14, "item": 13, "tipo": "identifica", "titulo": "Corte sagital de cabeza y cuello: nasofaringe, orofaringe, laringofaringe (esquema tipo Netter)", "que_se_ve": "Esquema sagital medio de cabeza y cuello con las tres porciones de la faringe coloreadas (nasofaringe rosa, orofaringe naranja, laringofaringe violeta), fosas nasales, paladar, lengua, epiglotis, laringe, tráquea y esófago. Números 1-17; rosas: 1-8, 10, 11, 13. Listados 1-8, 10-13.", "etiquetas": [{"n": "1", "nombre": "Orificio faríngeo de la trompa auditiva.", "rosa": true, "seguro": true, "nota": "En la pared lateral de la nasofaringe, ~1 cm por detrás del cornete inferior, a nivel del paladar duro; vía de la otitis media (caso 17)."}, {"n": "2", "nombre": "Amígdala faríngea.", "rosa": true, "seguro": true, "nota": "Adenoides, en el techo/pared posterior de la nasofaringe; hipertrofia → obstrucción NASAL (no orofaríngea, distractor de P67)."}, {"n": "3", "nombre": "Rodete tubárico.", "rosa": true, "seguro": true, "nota": "Torus tubarius: relieve del cartílago de la trompa por detrás/encima del orificio; amígdala tubárica."}, {"n": "4", "nombre": "Receso faríngeo.", "rosa": true, "seguro": true, "nota": "Fosa de Rosenmüller, detrás del rodete tubárico: asiento típico del carcinoma de cavum."}, {"n": "5", "nombre": "Rodete del elevador.", "rosa": true, "seguro": true, "nota": "Torus levatorius: relieve del m. elevador del velo del paladar por debajo del orificio tubárico."}, {"n": "6", "nombre": "Pliegue palatofaríngeo.", "rosa": true, "seguro": true, "nota": "Arco/pilar posterior, límite entre orofaringe y cavidad oral hacia atrás."}, {"n": "7", "nombre": "Pliegue salpingofaríngeo.", "rosa": true, "seguro": true, "nota": "Desde el rodete tubárico desciende por la pared lateral; contiene el m. salpingofaríngeo (elevador de la faringe, X)."}, {"n": "8", "nombre": "Amígdala palatina.", "rosa": true, "seguro": true, "nota": "En la fosa tonsilar de la orofaringe."}, {"n": "9", "nombre": "Orofaringe (pared posterior)", "rosa": false, "seguro": false, "nota": "No listado; línea sobre la zona naranja de la orofaringe, por detrás de la amígdala palatina."}, {"n": "10", "nombre": "Entrada laríngea.", "rosa": true, "seguro": true, "nota": "Aditus laríngeo, por detrás de la epiglotis; la laringofaringe se extiende desde aquí hasta el cricoides (C6)."}, {"n": "11", "nombre": "Esófago.", "rosa": true, "seguro": true, "nota": "Comienza en el borde inferior del cricoides (C6), por detrás de la tráquea."}, {"n": "12", "nombre": "Tráquea.", "rosa": false, "seguro": true, "nota": "Delante del esófago, desde C6 hasta la carina (T4-T5)."}, {"n": "13", "nombre": "Vallecula.", "rosa": true, "seguro": true, "nota": "Depresión entre la raíz de la lengua y la epiglotis, a cada lado del pliegue glosoepiglótico medio; sensibilidad n. laríngeo interno (X); donde se apoya la pala del laringoscopio."}, {"n": "14", "nombre": "Raíz de la lengua (amígdala lingual)", "rosa": false, "seguro": false, "nota": "No listado; línea que acaba en la parte posterior del dorso lingual."}, {"n": "15", "nombre": "Cuerpo de la lengua (musculatura intrínseca)", "rosa": false, "seguro": false, "nota": "No listado."}, {"n": "16", "nombre": "Paladar duro", "rosa": false, "seguro": true, "nota": "No listado; línea sobre el paladar óseo."}, {"n": "17", "nombre": "Cavidad nasal (cornetes)", "rosa": false, "seguro": true, "nota": "No listado; corchete que abarca los cornetes de la fosa nasal."}], "examen": [{"examen": "enero 2026", "pregunta": "P67 (sin imagen, contenido de esta lámina)", "imagen": null, "clave": "d", "que_pregunto": "'B y C correctas': el cierre del istmo de las fauces se produce por los arcos del paladar blando y el ascenso de la lengua; los constrictores son EXTERNOS respecto a los longitudinales y empujan el bolo. Falsa la a: la hipertrofia adenoidea obstruye la NASOfaringe, no la orofaringe.", "img_key": null}], "pack": "Faringe: nasofaringe (base del cráneo → paladar blando; trompa, adenoides, Rosenmüller), orofaringe (paladar blando → epiglotis/hioides; amígdalas palatinas, vallécula), laringofaringe (epiglotis → C6/cricoides; senos piriformes). Músculos: constrictores superior/medio/inferior (capa EXTERNA circular, propulsan) e internos longitudinales estilofaríngeo (IX), palatofaríngeo y salpingofaríngeo (X) que elevan. Inervación motora: plexo faríngeo (X con fibras del XI craneal) salvo estilofaríngeo (IX); sensitiva: nasofaringe V2, orofaringe IX, laringofaringe X (laríngeo interno). Irrigación: a. faríngea ascendente (carótida externa), palatina ascendente (facial), ramas de la maxilar y tiroideas. Linfa: retrofaríngeos y cervicales profundos. Cricofaríngeo = EES; triángulo de Killian (divertículo de Zenker) entre tirofaríngeo y cricofaríngeo.", "trampa": "Lámina 'Identifica' AÚN NO caída (F2 §3.2). Trampas: dónde está el receso faríngeo (detrás del rodete tubárico, cáncer de cavum); nivel del orificio tubárico (paladar duro/cornete inferior); adenoides en la nasofaringe; capa externa = constrictores.", "prioridad": 2}, {"key": "R1D-p15", "pagina": 15, "item": 14, "tipo": "caso", "titulo": "Caso 14 · Anquiloglosia", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Un niño de 4 años que sufre anquiloglosia acude al logopeda. La exploración física recomienda una intervención quirúrgica pediátrica. ¿Cuál de las siguientes es la más apropiada en este caso?", "opciones": [{"letra": "a", "texto": "Extirpación del rafe pterigomaxilar.", "correcta": false, "razon": "El rafe pterigomandibular es la unión tendinosa entre buccinador y constrictor superior; nada que ver con la movilidad de la lengua."}, {"letra": "b", "texto": "Extirpación del gancho pterigoideo bilateralmente.", "correcta": false, "razon": "El hámulo pterigoideo es la polea del tensor del velo del paladar; se secciona (fractura del hámulo) en cirugías del paladar hendido, no en la anquiloglosia."}, {"letra": "c", "texto": "Corte del frenillo lingual.", "correcta": true, "razon": "CORRECTA. La anquiloglosia ('lengua anclada') es un frenillo lingual corto/grueso que fija la punta de la lengua al suelo de la boca e impide protruirla y elevarla (dificultad de succión, dislalias). Tratamiento: frenotomía/frenulectomía."}, {"letra": "d", "texto": "Reparación del paladar.", "correcta": false, "razon": "La palatoplastia es para el paladar hendido (fallo de fusión de las apófisis palatinas), que da rinolalia y regurgitación nasal, no anquiloglosia."}, {"letra": "e", "texto": "Remoción del segmento central del hueso hioides.", "correcta": false, "razon": "La resección del cuerpo del hioides forma parte de la técnica de Sistrunk para el quiste del conducto tirogloso; no interviene en la fijación de la lengua."}], "respuesta": "c", "razonamiento": "El frenillo lingual es el pliegue mucoso medio que une la cara ventral de la lengua al suelo de la boca (ver lámina p6, nº 7). Cuando es demasiado corto, la lengua no puede protruir más allá de los incisivos ni elevarse hacia el paladar: anquiloglosia, con problemas de lactancia y de articulación (l, r, t, d). La solución es seccionar el frenillo (frenotomía), teniendo cuidado con las carúnculas sublinguales (conductos de Wharton) y las venas linguales profundas que están a ambos lados. Las demás opciones corresponden a otras patologías: paladar hendido (b, d), quiste tirogloso (e) o estructuras sin relación (a)."}, "examen": [{"examen": "enero 2026", "pregunta": "P62", "imagen": 5, "clave": "d", "que_pregunto": "Opción a de P62: 'la anquiloglosia es consecuencia de la estructura A (frenillo lingual) corta' = verdadera, dentro de un 'todas correctas'.", "img_key": "enero-05"}], "pack": "Frenillo lingual: línea media del suelo de la boca; a cada lado, carúnculas sublinguales (Wharton), pliegues sublinguales (Rivinus), v. lingual profunda y pliegue fimbriado. Irrigación de la zona: a. sublingual (← lingual) y submentoniana (← facial); sensibilidad n. lingual (V3). Hámulo pterigoideo = polea del tensor del velo (V3).", "trampa": "Ofrecer la sección del hámulo (paladar) o el hioides (Sistrunk) como cirugía de la lengua; preguntar qué se lesiona al cortar el frenillo (carúncula/Wharton, venas linguales profundas).", "prioridad": 2}, {"key": "R1D-p16", "pagina": 16, "item": 15, "tipo": "identifica", "titulo": "Esófago: estrechamientos fisiológicos y relaciones (esquema anterior)", "que_se_ve": "Esquema frontal de faringe-laringe-tráquea-esófago hasta el estómago con el cayado aórtico, el bronquio izquierdo y el diafragma. Números 1-8; rosas 1-5 (listados); 6, 7, 8 sin lista.", "etiquetas": [{"n": "1", "nombre": "Unión faringoesofágica (EES).", "rosa": true, "seguro": true, "nota": "Estrechamiento cricofaríngeo, C6, 15 cm de los incisivos; el más estrecho; cerrado en reposo."}, {"n": "2", "nombre": "Cayado aórtico.", "rosa": true, "seguro": true, "nota": "Impronta aórtica en el flanco izdo del esófago, T4, ~22,5 cm."}, {"n": "3", "nombre": "Bronquio principal izdo.", "rosa": true, "seguro": true, "nota": "Cruza por delante del esófago, ~27,5 cm; con el arco forma el estrechamiento broncoaórtico."}, {"n": "4", "nombre": "Hiato esofágico.", "rosa": true, "seguro": true, "nota": "T10, pilar derecho del diafragma; estrechamiento diafragmático/EEI, ~40 cm."}, {"n": "5", "nombre": "Diafragma.", "rosa": true, "seguro": true, "nota": "Segmento abdominal del esófago de 1-2 cm por debajo, hasta el cardias (T11)."}, {"n": "6", "nombre": "Tráquea", "rosa": false, "seguro": true, "nota": "No listado; anillos cartilaginosos por delante del esófago desde C6 a la carina."}, {"n": "7", "nombre": "Cartílago cricoides", "rosa": false, "seguro": true, "nota": "No listado; anillo completo bajo el tiroides, nivel C6 = origen del esófago."}, {"n": "8", "nombre": "Faringe (laringofaringe / constrictor inferior)", "rosa": false, "seguro": true, "nota": "No listado; parte más alta del esquema, sobre el cricoides."}], "examen": [{"examen": "enero 2026", "pregunta": "P69", "imagen": 7, "clave": "c", "que_pregunto": "La pregunta usó el esofagograma gemelo (p17) con letras A (EES) y B (estrechamiento aórtico): 'B corresponde al estrechamiento aórtico' (c). Falsas: EES 'abierto en reposo' (a), 'A delante de la tráquea' (b), 'B irrigado por la a. bronquial superior' (d).", "img_key": "enero-07"}], "pack": "Esófago (25 cm, C6→T11): cervical (detrás de la tráquea, n. recurrentes en el surco traqueoesofágico; a. tiroidea inferior; venas tiroideas inferiores; linfa cervicales profundos), torácico (mediastino superior y posterior; ramas esofágicas de la aorta y bronquiales; venas ácigos/hemiácigos; linfa mediastínicos posteriores y traqueobronquiales; plexo esofágico del vago), abdominal (a. gástrica izda + frénica inferior izda; v. gástrica izda → porta = anastomosis porto-cava → varices; linfa gástricos izdos → celíacos; troncos vagales anterior=izdo y posterior=dcho). Estrechamientos: 15 / 22,5 / 27,5 / 40 cm.", "trampa": "'EES abierto en reposo'; 'esófago delante de la tráquea'; qué vaso irriga cada tercio; nivel del hiato (T10) vs aórtico (T12) vs cava (T8).", "prioridad": 3}, {"key": "R1D-p17", "pagina": 17, "item": 16, "tipo": "identifica", "titulo": "Esofagogramas baritados (tres proyecciones): segmentos y estrechamientos", "que_se_ve": "Tres radiografías con bario del esófago (proyección AP/oblicuas). En la primera: corchete 1 = segmento cervical, corchete 2 = segmento torácico, flecha 3 = EES (muesca cricofaríngea) y flecha 4 = impronta broncoaórtica. Las otras dos placas muestran el esófago torácico completo con la impronta del arco aórtico y el paso del hiato. Sin rosas; los 4 números listados.", "etiquetas": [{"n": "1", "nombre": "Segmento cervical.", "rosa": false, "seguro": true, "nota": "C6-T1, ~5 cm, detrás de la tráquea; a. tiroidea inferior."}, {"n": "2", "nombre": "Segmento torácico.", "rosa": false, "seguro": true, "nota": "T1-T10, ~20 cm; se desvía a la izquierda por encima del arco, vuelve a la línea media y cruza de nuevo a la izquierda por delante de la aorta al bajar al hiato."}, {"n": "3", "nombre": "EES.", "rosa": false, "seguro": true, "nota": "Esfínter esofágico superior = cricofaríngeo, la muesca posterior en la columna de bario a nivel de C6; cerrado en reposo (evita aerofagia); divertículo de Zenker justo encima."}, {"n": "4", "nombre": "Estrechamiento broncoaórtico.", "rosa": false, "seguro": true, "nota": "Impronta del arco aórtico (T4) y del bronquio principal izdo en el flanco izquierdo del esófago; no confundir con impronta de la aurícula izquierda (más baja, anterior)."}], "examen": [{"examen": "enero 2026", "pregunta": "P69", "imagen": 7, "clave": "c", "que_pregunto": "Imagen 7 = esofagograma con letras A (arriba = EES/cricofaríngeo) y B (medio = estrechamiento aórtico). Clave c: 'B corresponde al estrechamiento aórtico'. Trampas: EES abierto en reposo (no), A delante de la tráquea (no, detrás), B irrigado por la 'bronquial superior' (no: ramas esofágicas de la aorta).", "img_key": "enero-07"}], "pack": "Estrechamientos: cricofaríngeo C6/15 cm (EES, el más estrecho) → broncoaórtico T4/22,5-27,5 cm → diafragmático T10/40 cm (EEI). Irrigación por tercios: tiroidea inferior / aorta torácica + bronquiales / gástrica izda + frénica inferior izda. Venas: tiroideas inferiores / ácigos-hemiácigos / gástrica izda (porta). Inervación: recurrentes (cervical) y plexo esofágico vagal + simpático. Relaciones del torácico: delante tráquea → bronquio izdo → aurícula izda; detrás columna, aorta, ácigos, conducto torácico.", "trampa": "Pedir a qué nivel vertebral o a cuántos cm está cada marcador; 'el EES está abierto en reposo'; qué estructura hace la impronta (aorta/bronquio vs aurícula izquierda).", "prioridad": 3}, {"key": "R1D-p18", "pagina": 18, "item": 17, "tipo": "caso", "titulo": "Caso 17 · Faringitis que se extiende al oído medio", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Un niño de 7 años con fiebre alta acude al pediatra. Se queja de dolor en el oído. La garganta aparece roja e inflamada, lo cual confirma el diagnóstico de faringitis. ¿Cuál de las siguientes estructuras proporciona un camino para que la infección se extienda a la cavidad timpánica (oído medio)?", "opciones": [{"letra": "a", "texto": "Coanas.", "correcta": false, "razon": "Las coanas comunican las fosas nasales con la nasofaringe; no llevan al oído medio."}, {"letra": "b", "texto": "Meato acústico interno.", "correcta": false, "razon": "Conducto del peñasco por el que pasan VII y VIII hacia el oído interno; no comunica con la faringe ni con la caja timpánica."}, {"letra": "c", "texto": "Meato acústico externo.", "correcta": false, "razon": "Conducto del oído externo, separado de la caja por la membrana timpánica; una faringitis no llega por ahí."}, {"letra": "d", "texto": "Trompa auditiva.", "correcta": true, "razon": "CORRECTA. La trompa de Eustaquio (faringotimpánica) comunica la nasofaringe (orificio faríngeo, lámina p14 nº 1) con la caja del tímpano; en el niño es más corta, ancha y horizontal, por lo que las infecciones faríngeas ascienden con facilidad → otitis media aguda."}, {"letra": "e", "texto": "Receso faríngeo.", "correcta": false, "razon": "La fosa de Rosenmüller es un fondo de saco de la nasofaringe DETRÁS del rodete tubárico; es un sitio de tumores de cavum, no una vía hacia el oído."}], "respuesta": "d", "razonamiento": "La trompa auditiva (de Eustaquio) mide ~3,5-4 cm, con un tercio óseo (peñasco) y dos tercios cartilaginosos; se abre en la pared lateral de la nasofaringe por el orificio faríngeo, rodeado por el rodete tubárico y la amígdala tubárica, y su función es igualar la presión de la caja timpánica (se abre con el tensor y el elevador del velo al tragar). Es la vía natural de propagación de las infecciones de la nasofaringe al oído medio; en el niño, por ser corta y horizontal y por la hipertrofia adenoidea que la obstruye, la otitis media es frecuente. Su mucosa la inerva el plexo timpánico (IX), lo que explica el dolor de oído referido en faringitis y amigdalitis."}, "examen": [], "pack": "Trompa auditiva: orificio faríngeo a nivel del paladar duro/cornete inferior; rodete tubárico por detrás y arriba; receso faríngeo (Rosenmüller) por detrás; pliegue salpingofaríngeo hacia abajo; rodete del elevador por debajo. Músculos que la abren: tensor del velo (V3) y elevador del velo (X). Irrigación faríngea ascendente y palatina ascendente; inervación IX (plexo timpánico) → otalgia refleja en amigdalitis y tras amigdalectomía.", "trampa": "Dar el receso faríngeo (Rosenmüller) como vía al oído; confundir meato acústico interno (VII/VIII) con la trompa.", "prioridad": 2}]}, "R2D": {"fuente": "R2D", "titulo": "Reto 2 digestivo · Supracólico (regiones, estómago, hígado, vías biliares, tronco celíaco, tránsito)", "resumen_examen": "Es la fuente digestiva más rentable del examen de enero 2026: de las 20 imágenes del anexo, 6 salieron literalmente de aquí (img 8 = p11 hígado cara visceral → P77/P78; img 9 = p7 tránsito gastroduodenal → P6 y P74; img 12 = p13 colangiografía (con S8 p2) → P80; img 13 = p15 arteriografía celíaca → P5; img 15 = p9 tránsito yeyuno-íleon (con S8 p11) → P3 y P9; img 19/20 = p5/p17 vísceras supramesocólicas → P19 + lámina de reserva sin pregunta). Además la Q4 de enero (pinza aortomesentérica, D3) es un clon sin imagen del caso 13 (p14). Bermúdez pregunta con la lámina cambiando los números por letras A-F y monta 3-4 opciones tipo 'X = estructura' + 'todas falsas', o cuelga de la estructura su irrigación/relación posterior (colédoco detrás de D1, cortas para el fundus, lig. redondo = v. umbilical). Aún NO han caído como imagen: p3 (9 regiones abdominales) y p17 (arterias del estómago Netter, la más probable para una rotación); los casos clínicos 1 (hepática propia), 5 (bolsa omental), 7 (colédoco), 9 (v. gástrica izda), 11/15 (bazo) y 17 (ganglios celíacos) son candidatos a clon sin imagen igual que lo fue el 13.", "paginas": [{"key": "R2D-p01", "pagina": 1, "item": 0, "tipo": "omitir", "titulo": "Portada · Reto 2 Sistema digestivo Supracólico (Bermúdez)", "prioridad": 0}, {"key": "R2D-p02", "pagina": 2, "item": 1, "tipo": "caso", "titulo": "Caso 1 · Pinzamiento del ligamento hepatoduodenal en colecistectomía", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones.", "etiquetas": [], "pregunta": {"enunciado": "Durante una colecistectomía laparoscópica programada en una mujer de 47 años, el residente pinzó accidentalmente el ligamento hepatoduodenal en vez de la arteria cística. ¿Cuál de los siguientes vasos estaría muy probablemente ocluido en esta lesión iatrogénica?", "opciones": [{"letra": "a", "texto": "Arteria mesentérica superior.", "correcta": false, "razon": "La AMS nace de la aorta a nivel de L1, por detrás del cuello del páncreas, y baja por delante de D3: es retroperitoneal, no viaja en el ligamento hepatoduodenal."}, {"letra": "b", "texto": "Arteria hepática propia.", "correcta": true, "razon": "El borde libre del omento menor (lig. hepatoduodenal) contiene la tríada portal: a. hepática propia (izquierda y delante), colédoco (derecha y delante) y v. porta (detrás). Pinzarlo = maniobra de Pringle: se ocluye la hepática propia (y la porta)."}, {"letra": "c", "texto": "Arteria esplénica.", "correcta": false, "razon": "La esplénica corre tortuosa por el borde superior del páncreas hacia el hilio del bazo, dentro del lig. esplenorrenal; nada que ver con el pedículo hepático."}, {"letra": "d", "texto": "Arteria hepática común.", "correcta": false, "razon": "La hepática común va desde el tronco celíaco hasta el origen de la gastroduodenal, por detrás de la bolsa omental/borde superior de D1; al entrar en el ligamento hepatoduodenal ya se llama hepática PROPIA. Es la trampa de nomenclatura preferida de Bermúdez."}, {"letra": "e", "texto": "Vena cava inferior.", "correcta": false, "razon": "La VCI queda POR DETRÁS del hiato de Winslow (límite posterior), retroperitoneal; no está dentro del ligamento, aunque un dedo en el hiato la toca por detrás."}], "respuesta": "b", "razonamiento": "El ligamento hepatoduodenal es la parte derecha, libre, del omento menor y forma el límite ANTERIOR del foramen omental (hiato de Winslow). Contiene la tríada portal: vena porta detrás, conducto colédoco delante-derecha y arteria hepática propia delante-izquierda, además del plexo hepático y linfáticos. Al pinzarlo en bloque (maniobra de Pringle) se ocluye la a. hepática propia y la porta, es decir todo el aflujo sanguíneo hepático; la hepática común no está dentro porque cambia de nombre en el origen de la gastroduodenal. La cística (rama de la hepática derecha, en el triángulo de Calot) era el vaso que había que pinzar."}, "examen": [], "pack": "Lig. hepatoduodenal = tríada: porta (detrás) ← VMS + esplénica; a. hepática propia (izda) ← hepática común ← tronco celíaco; colédoco (dcha) ← hepático común + cístico. Límites del hiato de Winslow: anterior lig. hepatoduodenal, posterior VCI, superior lóbulo caudado, inferior D1. Dedo en el hiato: cava detrás, porta delante (P1 enero 2026).", "trampa": "Hepática común vs hepática PROPIA (cambia de nombre al dar la gastroduodenal) y 'la VCI está por delante del dedo' (está por DETRÁS).", "prioridad": 2}, {"key": "R2D-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Regiones del abdomen (9 regiones) y planos de referencia (Prometheus)", "que_se_ve": "Esquema anatómico de tórax-abdomen visto de frente con el esqueleto y las vísceras transparentadas; dos líneas verticales (medioclaviculares) y dos horizontales (planos subcostal y transtubercular) dividen la pared en 9 regiones numeradas 1-9; 10, 11 y 12 señalan las líneas.", "etiquetas": [{"n": "1", "nombre": "Hipocondrio derecho", "rosa": true, "seguro": true, "nota": "Hígado (lóbulo dcho), vesícula, flexura cólica dcha, polo superior del riñón dcho."}, {"n": "2", "nombre": "Epigastrio", "rosa": true, "seguro": true, "nota": "Lóbulo izdo hepático, estómago (cuerpo/antro), píloro, D1-D2, páncreas, tronco celíaco; dolor referido de estómago/duodeno/páncreas (T5-T9)."}, {"n": "3", "nombre": "Hipocondrio izquierdo", "rosa": false, "seguro": true, "nota": "Bazo, fundus gástrico, cola de páncreas, flexura cólica izda; fracturas costales 9-10 izdas → bazo (caso 11)."}, {"n": "4", "nombre": "Flanco derecho (región lateral derecha)", "rosa": false, "seguro": true, "nota": "Colon ascendente, riñón dcho, asas de delgado."}, {"n": "5", "nombre": "Mesogastrio (región umbilical)", "rosa": true, "seguro": true, "nota": "D3-D4, yeyuno-íleon, raíz del mesenterio, aorta y AMS/AMI; dolor referido de intestino medio (T10)."}, {"n": "6", "nombre": "Flanco izquierdo (región lateral izquierda)", "rosa": true, "seguro": true, "nota": "Colon descendente, riñón izdo."}, {"n": "7", "nombre": "Fosa ilíaca derecha (región inguinal derecha)", "rosa": true, "seguro": true, "nota": "Ciego, apéndice (McBurney), íleon terminal, ovario/uréter dchos."}, {"n": "8", "nombre": "Hipogastrio (región púbica)", "rosa": true, "seguro": true, "nota": "Vejiga llena, útero, sigma/recto, íleon; dolor referido de intestino posterior (T11-L1)."}, {"n": "9", "nombre": "Fosa ilíaca izquierda (región inguinal izquierda)", "rosa": false, "seguro": true, "nota": "Colon sigmoide (diverticulitis), ovario/uréter izdos."}, {"n": "10", "nombre": "Líneas medioclaviculares (verticales)", "rosa": false, "seguro": false, "nota": "El corchete 10 abarca las dos líneas verticales que bajan desde el punto medio de la clavícula hasta el punto medio del ligamento inguinal."}, {"n": "11", "nombre": "Plano transtubercular / intertubercular (horizontal inferior)", "rosa": false, "seguro": false, "nota": "Une los tubérculos de las crestas ilíacas, nivel L5. En otras nomenclaturas se usa el plano interespinoso (EIAS)."}, {"n": "12", "nombre": "Plano subcostal (horizontal superior)", "rosa": false, "seguro": false, "nota": "Une los bordes inferiores del 10.º cartílago costal, nivel L3 (frente al plano transpilórico L1, que pasa por píloro, cuello pancreático, hilios renales y origen de la AMS)."}], "examen": [], "pack": "Planos: transpilórico (L1: píloro, cuello del páncreas, hilios renales, origen de la AMS, flexura duodenoyeyunal), subcostal (L3, borde costal 10), transumbilical (L3-L4, origen de la AMI/bifurcación aórtica L4), transtubercular (L5). Las 9 regiones nacen de cruzar dos verticales medioclaviculares con subcostal + transtubercular. Hígado = hipocondrio dcho + epigastrio + parte del hipocondrio izdo (trampa de P78 enero: 'únicamente hipocondrio dcho' es falso).", "trampa": "Lateralidad (la imagen está de frente: el 1 a la izquierda del dibujo es el hipocondrio DERECHO) y confundir flanco (región lateral) con fosa ilíaca (región inguinal). Lámina 'Identifica' que todavía no ha caído.", "prioridad": 2}, {"key": "R2D-p04", "pagina": 4, "item": 3, "tipo": "caso", "titulo": "Caso 3 · Malrotación intestinal con vólvulo del intestino medio (recién nacida)", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico pediátrico tipo test con 5 opciones. La diapo dice 'makotación' (errata por malrotación).", "etiquetas": [], "pregunta": {"enunciado": "Una niña de 2 días de vida con fiebre es examinada por el equipo pediátrico. Mediante técnicas de imagen se detecta una malrotación del intestino delgado sin fijación de los mesenterios. Los vasos alrededor de la unión duodenoyeyunal están obstruidos y el intestino tiene riesgo de gangrenarse. ¿Qué situación de las siguientes se ha producido para causar la obstrucción?", "opciones": [{"letra": "a", "texto": "Atresia diafragmática.", "correcta": false, "razon": "Un defecto/hernia diafragmática congénita da vísceras en el tórax y distrés respiratorio, no una malrotación con vasos mesentéricos estrangulados."}, {"letra": "b", "texto": "Ciego subhepático.", "correcta": false, "razon": "Es la consecuencia de una rotación incompleta (el ciego no desciende a la FID); por sí solo no obstruye ni comprime vasos, solo despista el diagnóstico de apendicitis."}, {"letra": "c", "texto": "Vólvulo de intestino medio.", "correcta": true, "razon": "Sin fijación del mesenterio, la raíz es muy corta y todo el intestino medio cuelga de la AMS; gira sobre ese pedículo (vólvulo), se estrangulan los vasos en torno a la unión duodenoyeyunal y hay isquemia/gangrena. Urgencia quirúrgica (Ladd)."}, {"letra": "d", "texto": "Duplicación del intestino.", "correcta": false, "razon": "Es una masa quística/tubular adosada al intestino; puede obstruir por compresión, pero no explica la malrotación ni la torsión vascular."}, {"letra": "e", "texto": "Megacolon congénito.", "correcta": false, "razon": "Hirschsprung = ausencia de células ganglionares en el colon distal → obstrucción funcional del intestino POSTERIOR, no isquemia del intestino medio."}], "respuesta": "c", "razonamiento": "Durante la 6.ª-10.ª semana el asa del intestino medio se hernia, rota 270° antihorarios alrededor del eje de la AMS y vuelve a la cavidad; después el mesenterio se fija a la pared posterior desde la flexura duodenoyeyunal (izda de L2) hasta la unión ileocecal (raíz de ~15 cm). Si la rotación es incompleta no hay fijación, la raíz mesentérica es un pedículo estrecho y el intestino puede volvularse alrededor de la AMS: se comprimen los vasos mesentéricos junto a la unión duodenoyeyunal, hay obstrucción y riesgo de necrosis. Las bandas de Ladd (peritoneo desde el ciego mal situado al hígado) pueden además comprimir D2."}, "examen": [], "pack": "Intestino medio (AMS): D3-D4, yeyuno, íleon, ciego, apéndice, ascendente y 2/3 del transverso; intestino anterior (tronco celíaco): esófago-D2 + hígado, páncreas, bazo; intestino posterior (AMI): 1/3 distal del transverso a recto superior. Raíz del mesenterio: de la flexura duodenoyeyunal (izda L2) a la FID, cruza D3, aorta, VCI, uréter dcho, psoas.", "trampa": "Confundir vólvulo del intestino medio (neonato, malrotación, AMS) con vólvulo de sigma/ciego del adulto (P16 enero, se volvulan sigma y ciego).", "prioridad": 2}, {"key": "R2D-p05", "pagina": 5, "item": 4, "tipo": "identifica", "titulo": "Cavidad abdominal in situ, piso supramesocólico (Sobotta) — omento mayor retirado", "que_se_ve": "Dibujo de la cavidad abdominal abierta vista de frente: hígado, vesícula, estómago con el omento menor tenso entre la curvatura menor y el hígado, colon transverso y marco cólico con el delgado recogido. Números 1-9; rosas 1, 2, 3, 4, 8, 9.", "etiquetas": [{"n": "1", "nombre": "Lóbulo hepático izquierdo", "rosa": true, "seguro": true, "nota": "Cruza la línea media hasta el epigastrio/hipocondrio izdo; separado del dcho en la cara diafragmática por el lig. falciforme."}, {"n": "2", "nombre": "Omento menor (lig. hepatogástrico + hepatoduodenal)", "rosa": true, "seguro": true, "nota": "Del surco del lig. venoso y porta hepatis a la curvatura menor y D1. Pared anterior de la bolsa omental; su borde libre derecho = lig. hepatoduodenal con la tríada portal."}, {"n": "3", "nombre": "Curvatura menor gástrica", "rosa": true, "seguro": true, "nota": "Irrigada por gástrica izda (celíaco) y gástrica dcha (hepática propia) que se anastomosan en ella."}, {"n": "4", "nombre": "Estómago (cuerpo)", "rosa": true, "seguro": true, "nota": "Cara anterior: hígado, diafragma, pared abdominal. Cara posterior: bolsa omental (lecho gástrico: páncreas, bazo, riñón/suprarrenal izdos, mesocolon transverso)."}, {"n": "5", "nombre": "Colon descendente", "rosa": false, "seguro": true, "nota": "A la derecha del dibujo = lado izdo del paciente; retroperitoneal secundario (Toldt)."}, {"n": "6", "nombre": "Colon ascendente", "rosa": false, "seguro": true, "nota": "Lado derecho del paciente, bajo la flexura cólica dcha (hepática)."}, {"n": "7", "nombre": "Curvatura mayor gástrica (borde inferior del estómago, hacia el píloro)", "rosa": false, "seguro": false, "nota": "La línea acaba en el borde inferior del estómago junto al antro; de aquí colgaría el omento mayor (retirado en el dibujo). Alternativa: región antro-pilórica."}, {"n": "8", "nombre": "Foramen omental (hiato de Winslow)", "rosa": true, "seguro": true, "nota": "Detrás del lig. hepatoduodenal; único acceso a la bolsa omental. Límites: anterior lig. hepatoduodenal, posterior VCI, superior lóbulo caudado, inferior D1."}, {"n": "9", "nombre": "Vesícula biliar (fondo)", "rosa": true, "seguro": true, "nota": "Fondo asoma bajo el borde hepático en la unión del 9.º cartílago costal con el borde lateral del recto dcho (punto de Murphy)."}], "examen": [{"examen": "enero 2026", "pregunta": "sin pregunta (lámina de reserva del anexo)", "imagen": 20, "clave": "—", "que_pregunto": "La imagen 20 del anexo era esta misma lámina con letras A/B sobre omento menor/estómago, pero en la permutación transcrita ninguna pregunta la usó. La lista impresa en la diapo es la respuesta: hay que saberla entera.", "img_key": "enero-20"}, {"examen": "enero 2026", "pregunta": "P19", "imagen": 19, "clave": "d", "que_pregunto": "Según hojas-imagenes la img 19 (vísceras supramesocólicas con letras A-C) deriva de esta página; P19 preguntaba 'A = a. esplénica / B = VMS / C = VMI' y la clave fue 'todas falsas'. data_A la vincula alternativamente a p17. Preparar ambas.", "img_key": "enero-19"}], "pack": "Omento menor: hepatogástrico (entre sus hojas: a. gástricas izda y dcha, ramas del vago) + hepatoduodenal (porta detrás, colédoco dcha, hepática propia izda). Bolsa omental = transcavidad de los epiplones: delante omento menor + estómago + lig. gastrocólico; detrás páncreas y retroperitoneo; arriba caudado; se abre por el hiato de Winslow. Hígado: a. hepática propia (25 %) + porta (75 %); venoso → suprahepáticas → VCI; linfa → ganglios hepáticos → celíacos; inervación plexo hepático (vago + simpático T7-T9) y frénico (cápsula).", "trampa": "Preguntar por el hiato de Winslow con 'todas falsas' (P19 enero) o 'introduciendo el dedo…' (P1 enero): la VCI está DETRÁS del dedo y la porta DELANTE; el límite superior es el CAUDADO, no el cuadrado.", "prioridad": 3}, {"key": "R2D-p06", "pagina": 6, "item": 5, "tipo": "caso", "titulo": "Caso 5 · Úlcera perforada de pared posterior gástrica → bolsa omental", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones sobre espacios peritoneales.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 55 años ingresó en el hospital con dolor abdominal intenso. La gastroscopia y la TC revelaron una úlcera perforada en la pared posterior del estómago. ¿Dónde se desarrollaría inicialmente con más probabilidad una peritonitis?", "opciones": [{"letra": "a", "texto": "Espacio subhepático derecho.", "correcta": false, "razon": "Está entre la cara visceral del lóbulo dcho y el colon/riñón; recibe el contenido de una perforación ANTERIOR de D1 o de la vesícula, no de la pared posterior del estómago."}, {"letra": "b", "texto": "Espacio hepatorrenal (de Morison).", "correcta": false, "razon": "Parte posterosuperior del subhepático dcho, el punto más declive del abdomen supramesocólico en decúbito: se afecta secundariamente cuando el líquido sale de la bolsa omental por el hiato de Winslow, no inicialmente."}, {"letra": "c", "texto": "Bolsa omental (saco menor).", "correcta": true, "razon": "La cara posterior del estómago forma la pared anterior de la bolsa omental (transcavidad de los epiplones); una perforación posterior vierte directamente ahí → peritonitis localizada en el saco menor (y puede alcanzar el páncreas)."}, {"letra": "d", "texto": "Espacio subfrénico derecho.", "correcta": false, "razon": "Entre diafragma y cara diafragmática del lóbulo dcho; típico de abscesos tras apendicitis/colecistitis por la circulación del líquido por el surco paracólico dcho."}, {"letra": "e", "texto": "Saco mayor.", "correcta": false, "razon": "Una perforación de la pared ANTERIOR gástrica sí vierte al saco mayor (peritonitis generalizada); la posterior queda contenida en el saco menor."}], "respuesta": "c", "razonamiento": "La bolsa omental es el receso de la cavidad peritoneal situado detrás del estómago y del omento menor y delante del páncreas y del retroperitoneo; comunica con el saco mayor solo por el hiato de Winslow. Su pared anterior está formada, de arriba abajo, por el omento menor, la cara posterior del estómago y el lig. gastrocólico. Por tanto, una úlcera de la pared posterior perfora hacia la bolsa omental (o penetra en el páncreas, erosionando la a. esplénica) y la peritonitis comienza contenida en el saco menor; solo después drena por el hiato al espacio subhepático/Morison."}, "examen": [], "pack": "Bolsa omental: límites → anterior omento menor + estómago + lig. gastrocólico; posterior peritoneo parietal sobre páncreas, aorta, riñón/suprarrenal izdos; superior lóbulo caudado y diafragma; izda ligs. gastroesplénico y esplenorrenal; recesos superior (tras el caudado) e inferior (entre las hojas del omento mayor). Úlcera posterior de D1 → sangra por la a. GASTRODUODENAL; úlcera posterior gástrica → a. esplénica/páncreas.", "trampa": "Morison (hepatorrenal) como respuesta 'lista': es el espacio más declive donde se ACUMULA después, pero no donde empieza. Pared anterior vs posterior del estómago cambia la respuesta (saco mayor vs menor).", "prioridad": 2}, {"key": "R2D-p07", "pagina": 7, "item": 6, "tipo": "identifica", "titulo": "Tránsito esofagogastroduodenal baritado (Rx AP, doble contraste)", "que_se_ve": "Radiografía anteroposterior de abdomen superior con bario: esófago distal, estómago con el fundus lleno de bario (paciente en supino), cuerpo con pliegues, antro, bulbo duodenal, D2 con pliegues y flexura duodenoyeyunal. Números 1-7 rosas.", "etiquetas": [{"n": "1", "nombre": "Porción superior del duodeno (D1, bulbo)", "rosa": true, "seguro": true, "nota": "Nivel L1, intraperitoneal en sus 2-3 cm iniciales; por detrás: colédoco (porción retroduodenal), a. gastroduodenal y v. porta → P6 enero (clave colédoco)."}, {"n": "2", "nombre": "Antro pilórico", "rosa": true, "seguro": true, "nota": "Irrigado por gástrica dcha (curvatura menor) y gastroomental dcha; linfa → ganglios pilóricos/hepáticos → celíacos (caso 17)."}, {"n": "3", "nombre": "Esófago (porción abdominal / unión gastroesofágica)", "rosa": true, "seguro": true, "nota": "Atraviesa el hiato en T10; vv. esofágicas → gástrica izda ↔ ácigos (varices, caso 9)."}, {"n": "4", "nombre": "Fundus gástrico", "rosa": true, "seguro": true, "nota": "El bario se acumula aquí = paciente en decúbito SUPINO (P74 enero). Irrigado por las aa. gástricas cortas (vasa brevia) de la esplénica."}, {"n": "5", "nombre": "Cuerpo gástrico", "rosa": true, "seguro": true, "nota": "Pliegues longitudinales; cara posterior = lecho gástrico a través de la bolsa omental."}, {"n": "6", "nombre": "Flexura duodenoyeyunal (ángulo de Treitz)", "rosa": true, "seguro": true, "nota": "A la izda de L2, suspendida por el músculo suspensorio del duodeno (lig. de Treitz); origen de la raíz del mesenterio."}, {"n": "7", "nombre": "Porción descendente del duodeno (D2)", "rosa": true, "seguro": true, "nota": "L1-L3, retroperitoneal (fascia de Treitz); papilas mayor (Vater) y menor; relaciones posteriores = hilio/vasos renales y uréter DERECHOS (P3 enero)."}], "examen": [{"examen": "enero 2026", "pregunta": "P6", "imagen": 9, "clave": "d", "que_pregunto": "Misma placa con letras A-F. '¿Qué se sitúa por detrás del segmento F (= D1)?' → conducto colédoco (porción retroduodenal, junto a la a. gastroduodenal); hilio renal y uréter son relaciones de D2.", "img_key": "enero-09"}, {"examen": "enero 2026", "pregunta": "P74", "imagen": 9, "clave": "a", "que_pregunto": "'La región A (fundus) está irrigada por las arterias cortas, ramas de la esplénica' (cierta). Falsas: B (curvatura mayor) tiene el epiplón MAYOR, no el menor; el paciente está en supino (bario en el fundus), no en prono; F está en L1-L2, no en L3.", "img_key": "enero-09"}], "pack": "Estómago: curvatura menor ← gástrica izda (tronco celíaco) + gástrica dcha (hepática propia); curvatura mayor ← gastroomental dcha (gastroduodenal ← hepática común) + gastroomental izda (esplénica); fundus ← aa. cortas (esplénica) + a. gástrica posterior. Venas homónimas → porta (gástricas), esplénica (cortas, gastroomental izda) y VMS (gastroomental dcha). Linfa → 4 territorios (gástricos izdos/dchos, gastroomentales, pancreatoesplénicos, pilóricos) → celíacos. Inervación: vagos anterior (izdo) y posterior (dcho), simpático T6-T9 vía esplácnico mayor y plexo celíaco.", "trampa": "Decúbito prono/supino según dónde cae el bario; 'F a nivel de L3'; epiplón menor en la curvatura mayor; relación posterior de D1 (colédoco, gastroduodenal, porta) vs D2 (riñón/uréter dchos).", "prioridad": 3}, {"key": "R2D-p08", "pagina": 8, "item": 7, "tipo": "caso", "titulo": "Caso 7 · Tumor de cabeza de páncreas con ictericia obstructiva", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 49 años presenta dolor abdominal agudo e ictericia. Los estudios radiológicos muestran un tumor en la cabeza del páncreas. ¿Cuál de las siguientes estructuras está muy probablemente obstruida?", "opciones": [{"letra": "a", "texto": "Conducto colédoco.", "correcta": true, "razon": "Su porción retropancreática/intrapancreática desciende por un surco o túnel en la cara posterior de la cabeza del páncreas antes de desembocar en D2: un tumor de cabeza lo comprime → ictericia obstructiva indolora con vesícula palpable (Courvoisier)."}, {"letra": "b", "texto": "Conducto hepático común.", "correcta": false, "razon": "Está en el hilio hepático/lig. hepatoduodenal, por encima de la desembocadura del cístico, lejos del páncreas; se dilata retrógradamente pero no es lo obstruido."}, {"letra": "c", "texto": "Conducto cístico.", "correcta": false, "razon": "Va del cuello vesicular al hepático común dentro del lig. hepatoduodenal; su obstrucción (cálculo) da cólico/colecistitis SIN ictericia."}, {"letra": "d", "texto": "Conducto pancreático accesorio.", "correcta": false, "razon": "Santorini también pasa por la cabeza (papila menor, más arriba), pero su obstrucción no produce ictericia; la clínica biliar obliga a elegir el colédoco."}, {"letra": "e", "texto": "Arteria hepática propia.", "correcta": false, "razon": "Está en el pedículo hepático, por encima de D1; su oclusión daría isquemia hepática, no ictericia obstructiva."}], "respuesta": "a", "razonamiento": "El colédoco tiene cuatro porciones: supraduodenal (en el lig. hepatoduodenal), retroduodenal (detrás de D1, con la gastroduodenal), retropancreática (surco en la cara posterior de la cabeza del páncreas, delante de la VCI) e intramural (atraviesa la pared posteromedial de D2 uniéndose al Wirsung en la ampolla de Vater, esfínter de Oddi). Un carcinoma de la cabeza engloba la porción retropancreática y bloquea el drenaje biliar: ictericia, coluria, acolia y vesícula dilatada indolora. Con frecuencia comprime también el Wirsung (signo del doble conducto en TC)."}, "examen": [], "pack": "Cabeza del páncreas: irrigada por las arcadas pancreatoduodenales superiores (gastroduodenal ← hepática común ← celíaco) e inferiores (AMS); relaciones: marco duodenal, colédoco detrás, VCI y v. renal izda por detrás, VMS/porta en el cuello, proceso uncinado detrás de la AMS/VMS. Linfa → pancreatoduodenales, pilóricos → celíacos y mesentéricos superiores. Tumor de cuello → comprime porta/VMS; tumor de cola → bazo (caso 15).", "trampa": "Hepático común o cístico como 'vía biliar' genérica; solo el colédoco se relaciona con el páncreas. Tumor de cola de páncreas → bazo, no ictericia.", "prioridad": 2}, {"key": "R2D-p09", "pagina": 9, "item": 8, "tipo": "identifica", "titulo": "Tránsito baritado de intestino delgado (yeyuno-íleon) con estómago", "que_se_ve": "Radiografía AP de abdomen con bario en estómago, yeyuno (hemiabdomen superior izdo, pliegues de Kerckring en 'pila de monedas') e íleon (hemiabdomen inferior dcho/pelvis, calibre menor, pliegues borrados). Tres números rosas 1-3, con dos flechas para el 1 y para el 3.", "etiquetas": [{"n": "1", "nombre": "Yeyuno", "rosa": true, "seguro": true, "nota": "2/5 proximales, cuadrante superior izdo, pared gruesa, válvulas conniventes altas, arcadas simples con vasa recta largos, poca grasa mesentérica."}, {"n": "2", "nombre": "Estómago", "rosa": true, "seguro": true, "nota": "Silueta blanca en el centro-superior con el antro y el bulbo hacia la derecha."}, {"n": "3", "nombre": "Íleon", "rosa": true, "seguro": true, "nota": "3/5 distales, FID y pelvis, pared fina, placas de Peyer, arcadas múltiples con vasa recta cortos, más grasa en el meso; termina en la válvula ileocecal."}], "examen": [{"examen": "enero 2026", "pregunta": "P9", "imagen": 15, "clave": "d", "que_pregunto": "Imagen 15 (tránsito con letras): B = yeyuno, C = íleon, ambos móviles, tras el delantal de los epiplones y fijos a la pared posterior por la raíz del mesenterio → TODAS correctas (d). La placa del examen es la de S8 p11, gemela de ésta.", "img_key": "enero-15"}, {"examen": "enero 2026", "pregunta": "P3", "imagen": 15, "clave": "c", "que_pregunto": "Segmento D (= D2) señala la FALSA: 'se relaciona con el uréter IZDO' (es el derecho). Ciertas: desembocan las vías biliopancreáticas; fijo por la fascia de Treitz; el mesocolon transverso se adhiere a su cara anterior separando supra/infracólico.", "img_key": "enero-15"}], "pack": "Yeyuno-íleon: irrigación aa. yeyunales e ileales ← AMS (arcadas y vasa recta); drenaje venoso → VMS → porta; linfa → ganglios yuxtaintestinales → mesentéricos superiores → tronco intestinal → cisterna del quilo; inervación vagos (parasimpático), esplácnicos menor/torácicos T9-T10 vía plexo mesentérico superior (dolor periumbilical). Raíz del mesenterio: 15 cm, de la flexura duodenoyeyunal (izda L2) a la unión ileocecal, cruzando D3, aorta, VCI, uréter dcho y psoas.", "trampa": "Uréter izdo por dcho en D2; yeyuno/íleon invertidos por posición en la placa; 'todas correctas' cuando cada opción por separado es cierta.", "prioridad": 3}, {"key": "R2D-p10", "pagina": 10, "item": 9, "tipo": "caso", "titulo": "Caso 9 · Varices esofágicas por hipertensión portal: anastomosis porto-cava", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones (venas tributarias de la porta).", "etiquetas": [], "pregunta": {"enunciado": "Un hombre alcohólico de 58 años ingresa en el hospital por vómitos con sangre de color rojo oscuro (hematemesis). La endoscopia revela rotura de varices esofágicas por hipertensión portal. ¿Cuál de las siguientes venas tributarias del sistema porta se anastomosa con las venas cavas para causar las varices?", "opciones": [{"letra": "a", "texto": "Esplénica.", "correcta": false, "razon": "Recoge bazo, gástricas cortas, gastroomental izda, pancreáticas y VMI; se une a la VMS para formar la porta detrás del cuello del páncreas. No forma la anastomosis esofágica (sus anastomosis son retroperitoneales, de Retzius)."}, {"letra": "b", "texto": "Gastroomental izquierda.", "correcta": false, "razon": "Drena la curvatura mayor hacia la v. esplénica; no alcanza el esófago."}, {"letra": "c", "texto": "Gástrica izquierda.", "correcta": true, "razon": "Sus ramas esofágicas (submucosa del esófago abdominal) se anastomosan con las vv. esofágicas tributarias de la ácigos/hemiácigos → cava superior. Con hipertensión portal la sangre se desvía por ahí y las venas submucosas se dilatan: varices esofágicas."}, {"letra": "d", "texto": "Hepática izquierda.", "correcta": false, "razon": "Las venas hepáticas (suprahepáticas) drenan el hígado a la VCI: son POST-sinusoidales, no tributarias de la porta."}, {"letra": "e", "texto": "Gástrica derecha.", "correcta": false, "razon": "Drena la parte pilórica de la curvatura menor a la porta; no tiene ramas esofágicas."}], "respuesta": "c", "razonamiento": "El sistema porta carece de válvulas, por lo que cuando la resistencia intrahepática aumenta (cirrosis) la sangre refluye hacia las anastomosis porto-sistémicas: (1) esofágica: v. gástrica izda ↔ vv. esofágicas de la ácigos → varices esofágicas (hematemesis, la más grave); (2) rectal: v. rectal superior (VMI) ↔ rectales media/inferior (ilíaca interna/pudenda) → varices rectales; (3) paraumbilical: vv. paraumbilicales del lig. redondo ↔ epigástricas superficiales → cabeza de medusa; (4) retroperitoneal (vv. de Retzius): cólicas/duodenales ↔ lumbares, renales. La tributaria responsable de las varices esofágicas es la gástrica izquierda (coronaria estomáquica)."}, "examen": [], "pack": "V. porta = VMS + esplénica (detrás del cuello del páncreas, L2); recibe gástricas izda y dcha, císticas, paraumbilicales; la VMI drena en la esplénica (o en el ángulo). La porta va DETRÁS de la a. hepática y el colédoco en el lig. hepatoduodenal. Recanalización de la v. umbilical en la hipertensión portal (lig. redondo, P77 enero).", "trampa": "Hepática izquierda (vena suprahepática, drena a la VCI) puesta entre 'tributarias de la porta'; gástrica derecha por izquierda.", "prioridad": 2}, {"key": "R2D-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Hígado, cara visceral (Sobotta): lóbulos, fisuras en H, porta hepatis", "que_se_ve": "Dibujo de la cara visceral (inferior-posterior) del hígado con la vesícula (verde), la VCI (azul) y los elementos del porta hepatis; los surcos en H delimitan cuadrado (delante), caudado (detrás), lóbulos dcho e izdo. Números 1-11; rosas 1, 3, 4, 5, 6, 7, 8.", "etiquetas": [{"n": "1", "nombre": "Lóbulo cuadrado", "rosa": true, "seguro": true, "nota": "Entre la fosa de la vesícula y la fisura del lig. redondo, por delante del porta hepatis. Funcionalmente pertenece al lóbulo IZQUIERDO (segmento IVb)."}, {"n": "2", "nombre": "Conducto hepático común / vía biliar en el porta hepatis", "rosa": false, "seguro": false, "nota": "La línea acaba en el conducto verde que sale del hilio hacia la vesícula; en Sobotta este punto corresponde al conducto hepático común (o al cístico, según la altura). Tríada: vía biliar a la derecha, arteria a la izquierda, porta detrás."}, {"n": "3", "nombre": "Fisura del ligamento redondo (fisura umbilical)", "rosa": true, "seguro": true, "nota": "Brazo anterior del surco sagital izdo; contiene el lig. redondo = v. umbilical izda obliterada, que llega a la rama izda de la porta (P77 enero)."}, {"n": "4", "nombre": "Lóbulo izquierdo", "rosa": true, "seguro": true, "nota": "A la izquierda del surco sagital izdo (falciforme/redondo/venoso); impresiones gástrica y esofágica."}, {"n": "5", "nombre": "Fisura del ligamento venoso (de Arancio)", "rosa": true, "seguro": true, "nota": "Brazo posterior del surco sagital izdo; el lig. venoso = ductus venosus obliterado, que unía la v. umbilical con la VCI (P78 enero). Inserción del omento menor."}, {"n": "6", "nombre": "Lóbulo caudado (de Spiegel)", "rosa": true, "seguro": true, "nota": "Entre la fisura del lig. venoso y la VCI, detrás del porta hepatis; forma el límite SUPERIOR del hiato de Winslow y el techo de la bolsa omental (receso superior). Segmento I, drena directo a la VCI."}, {"n": "7", "nombre": "Porta hepatis (hilio hepático)", "rosa": true, "seguro": true, "nota": "Travesaño de la H: entran porta y a. hepática propia (ramas dcha/izda), salen conductos hepáticos dcho/izdo; plexo nervioso y linfáticos."}, {"n": "8", "nombre": "Lóbulo derecho", "rosa": true, "seguro": true, "nota": "A la derecha de la fosa vesicular y la VCI; impresiones cólica, renal, suprarrenal y duodenal; área desnuda en la cara posterior."}, {"n": "9", "nombre": "Vena porta hepática (rama en el hilio) / elemento posterior del pedículo", "rosa": false, "seguro": false, "nota": "Línea larga desde arriba-izda hasta la estructura azul del hilio: encaja con la v. porta (el vaso más grueso y posterior de la tríada). Alternativa: a. hepática propia."}, {"n": "10", "nombre": "Vesícula biliar (cuerpo/fondo)", "rosa": false, "seguro": false, "nota": "Señala la víscera verde alojada en la fosa vesicular, brazo anterior del surco sagital dcho."}, {"n": "11", "nombre": "Cuello de la vesícula / conducto cístico", "rosa": false, "seguro": false, "nota": "Línea paralela a la 10 que llega a la porción estrecha de la vesícula hacia el hilio. En Sobotta suele rotularse 'collum vesicae biliaris' o 'ductus cysticus'."}], "examen": [{"examen": "enero 2026", "pregunta": "P77", "imagen": 8, "clave": "b", "que_pregunto": "Misma lámina con letras A-C: 'B en el adulto está formada por la vena umbilical obliterada' = lig. redondo (cierta). A no era el caudado (límite superior del hiato) y C no era el lóbulo dcho; 'todas falsas' era la trampa.", "img_key": "enero-08"}, {"examen": "enero 2026", "pregunta": "P78 (apoyo, sin imagen)", "imagen": 8, "clave": "a", "que_pregunto": "'El lig. venoso de Arancio comunica la VCI con la v. umbilical' (cierta). Falsas: hígado únicamente en hipocondrio dcho; cara diafragmática con la cava SUPERIOR; el hígado asciende en inspiración (desciende).", "img_key": "enero-08"}], "pack": "Hígado: aporte 75 % porta + 25 % a. hepática propia (← hepática común ← tronco celíaco; hepática dcha da la cística en el triángulo de Calot); drenaje venoso vv. hepáticas dcha, media e izda → VCI (el caudado drena aparte a la VCI); linfa superficial → ganglios hepáticos/celíacos y frénicos/mediastínicos (área desnuda); inervación plexo hepático (vago anterior + simpático) y n. frénico dcho (cápsula → dolor en hombro dcho). Ligamentos: falciforme (redondo en su borde libre), coronario y triangulares (área desnuda), omento menor (en el surco venoso y el hilio).", "trampa": "Redondo (v. umbilical, brazo ANTERIOR) vs venoso de Arancio (ductus venosus, brazo POSTERIOR); cuadrado (delante, lóbulo funcional izdo) vs caudado (detrás, techo del hiato de Winslow); 'la VCS' por VCI.", "prioridad": 3}, {"key": "R2D-p12", "pagina": 12, "item": 11, "tipo": "caso", "titulo": "Caso 11 · Fractura de costillas 9-10 izquierdas con hemoperitoneo: rotura esplénica", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico de traumatismo con 5 opciones.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 45 años ingresa en el hospital después de chocar con el coche contra un árbol al salirse de la autopista por un temporal de lluvia. Llevaba el cinturón de seguridad. En el examen radiológico se observa que ha sufrido fracturas de la novena y décima costillas del lado izquierdo y que tiene una hemorragia intraabdominal. La exploración física revela shock hipovolémico e hipotensión progresiva. ¿Cuál de los siguientes órganos se ha lesionado con mayor probabilidad para causar estos signos clínicos?", "opciones": [{"letra": "a", "texto": "Hígado.", "correcta": false, "razon": "Se lesiona con fracturas de las costillas DERECHAS (7.ª-11.ª); solo el lóbulo izdo llega al hipocondrio izdo y no es lo típico."}, {"letra": "b", "texto": "Páncreas.", "correcta": false, "razon": "Retroperitoneal y profundo (L1-L2); se lesiona por compresión contra la columna (manillar, cinturón), no por costillas 9-10 laterales, y da hemorragia retroperitoneal/pancreatitis, no hemoperitoneo masivo."}, {"letra": "c", "texto": "Riñón izquierdo.", "correcta": false, "razon": "Retroperitoneal, protegido por la grasa perirrenal y fascia de Gerota (costillas 11-12); su lesión da hematuria y hematoma retroperitoneal, no hemorragia intraperitoneal con shock."}, {"letra": "d", "texto": "Bazo.", "correcta": true, "razon": "Ocupa el hipocondrio izdo bajo las costillas 9-11 izdas, cápsula fina y parénquima muy vascularizado (a. esplénica): la víscera abdominal que más se rompe en traumatismos cerrados; sangra al saco mayor → shock hipovolémico."}, {"letra": "e", "texto": "Íleon.", "correcta": false, "razon": "Asas móviles en mesogastrio/pelvis; el cinturón puede desgarrarlas pero no hay relación con las costillas 9-10 y provoca peritonitis más que shock hemorrágico rápido."}], "respuesta": "d", "razonamiento": "El bazo se sitúa en el hipocondrio izquierdo, con su eje mayor paralelo a la 10.ª costilla, entre la 9.ª y la 11.ª, separado de ellas por el diafragma y el receso costodiafragmático. Es intraperitoneal (ligs. gastroesplénico y esplenorrenal) y recibe la a. esplénica, rama gruesa del tronco celíaco; su cápsula es delgada. Una fractura de costillas 9-10 izquierdas lacera el bazo (o el diafragma) y la sangre cae libremente al saco mayor → hemoperitoneo, dolor en hombro izdo por irritación frénica (signo de Kehr) y shock hipovolémico progresivo. El riñón y el páncreas son retroperitoneales y sangran al retroperitoneo."}, "examen": [], "pack": "Bazo: a. esplénica (tronco celíaco) → ramas terminales segmentarias (esplenectomía parcial) + cortas y gastroomental izda; v. esplénica → porta (recibe VMI); linfa → ganglios pancreatoesplénicos → celíacos; inervación plexo celíaco (simpático). Relaciones: diafragma y costillas 9-11 (cara diafragmática), estómago, riñón izdo, flexura cólica izda, cola de páncreas en el hilio (lig. esplenorrenal). Ligamentos: gastroesplénico (cortas + gastroomental izda) y esplenorrenal (vasos esplénicos + cola del páncreas).", "trampa": "Riñón izdo (retroperitoneal → hematuria, no hemoperitoneo); hígado si el enunciado cambia a costillas DERECHAS.", "prioridad": 2}, {"key": "R2D-p13", "pagina": 13, "item": 12, "tipo": "identifica", "titulo": "Vías biliares extrahepáticas: esquema + colangiografía", "que_se_ve": "Arriba, esquema de vesícula (verde), conductos hepáticos dcho/izdo, hepático común, cístico, colédoco y duodeno con la papila (numerados 1-7 en negro). Abajo, colangiografía con contraste en el árbol biliar; rosas 2, 5 y 6 sobre la radiografía.", "etiquetas": [{"n": "1", "nombre": "Vesícula biliar (fondo y cuerpo)", "rosa": false, "seguro": true, "nota": "Solo en el esquema. 7-10 cm, 30-50 mL; fondo, cuerpo, infundíbulo (bolsa de Hartmann) y cuello."}, {"n": "2", "nombre": "Conducto cístico", "rosa": true, "seguro": true, "nota": "Del cuello vesicular al hepático común (válvula espiral de Heister); con el hepático común y el borde hepático forma el triángulo de Calot, donde va la a. cística (rama de la hepática DERECHA)."}, {"n": "3", "nombre": "Conducto hepático derecho", "rosa": false, "seguro": true, "nota": "Solo en el esquema (rama superior-izquierda del dibujo = lado derecho del paciente)."}, {"n": "4", "nombre": "Conducto hepático izquierdo", "rosa": false, "seguro": true, "nota": "Solo en el esquema (rama que va hacia la derecha del dibujo = lado izquierdo del paciente)."}, {"n": "5", "nombre": "Conducto hepático común", "rosa": true, "seguro": true, "nota": "Unión de hepáticos dcho + izdo en el porta hepatis; discurre en el lig. hepatoduodenal a la DERECHA de la a. hepática propia y delante de la porta."}, {"n": "6", "nombre": "Conducto colédoco", "rosa": true, "seguro": true, "nota": "Hepático común + cístico, POR ENCIMA de D1; porciones supraduodenal, retroduodenal, retropancreática, intramural; desemboca en D2 con el Wirsung (ampolla de Vater, esfínter de Oddi)."}, {"n": "7", "nombre": "Papila duodenal mayor (ampolla hepatopancreática de Vater)", "rosa": false, "seguro": true, "nota": "Solo en el esquema: mancha amarilla en la pared posteromedial de D2; la papila menor (Santorini) queda 2 cm por encima."}], "examen": [{"examen": "enero 2026", "pregunta": "P80", "imagen": 12, "clave": "d", "que_pregunto": "CPRE (placa literal de S8 p2; ésta es la gemela con esquema). Letras A (hepático común), B (colédoco), E (vesícula): 'A queda a la IZDA de la bifurcación de la hepática propia' (falso, va a la derecha), 'E irrigada por la cística rama de la hepática IZDA' (falso, derecha), 'B se origina por debajo de D1' (falso, se forma por encima y desemboca en D2) → TODAS FALSAS.", "img_key": "enero-12"}], "pack": "Vesícula y vías: a. cística ← hepática dcha (Calot) ← hepática propia; venas císticas → porta/rama dcha o directamente al hígado; linfa → ganglio cístico (Lund/Mascagni) → hepáticos → celíacos; inervación plexo celíaco/hepático (simpático T7-T9, dolor epigástrico) + vago + frénico dcho (hombro dcho). Colédoco en el lig. hepatoduodenal: derecha-delante; a. hepática propia: izquierda-delante; porta: detrás. Leyenda de la CPRE de S8 p2: 1 colédoco · 2 hepático común · 3 cístico · 4 duodeno · 5 endoscopio · 6 vesícula · 7 ampolla de Vater · 8 yeyuno · 9 hepático izdo · 10 cuello vesicular · 11 Wirsung · 12 hepático dcho · 13 estómago.", "trampa": "Lado de la vía biliar en el pedículo (DERECHA); origen de la cística (hepática DERECHA); 'se origina' vs 'desemboca'; hepático común ≠ colédoco (el límite es la desembocadura del cístico).", "prioridad": 3}, {"key": "R2D-p14", "pagina": 14, "item": 13, "tipo": "caso", "titulo": "Caso 13 · Pinza aortomesentérica (síndrome de Wilkie): D3 comprimida", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones. CLONADO sin imagen en la Q4 de enero 2026.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 44 años ingresa en urgencias con vómitos abundantes y deshidratación. Las imágenes radiológicas demuestran que parte del intestino está comprimido entre la aorta abdominal y la arteria mesentérica superior. ¿Cuál de las siguientes estructuras intestinales estará muy probablemente comprimida?", "opciones": [{"letra": "a", "texto": "Segunda porción del duodeno.", "correcta": false, "razon": "D2 desciende vertical a la DERECHA de L1-L3, lateral a la VCI y delante del hilio renal dcho; no cruza la línea media ni pasa bajo la AMS."}, {"letra": "b", "texto": "Colon transverso.", "correcta": false, "razon": "Intraperitoneal, anterior, colgado del mesocolon transverso; la AMS pasa por DETRÁS de él (entre las hojas del mesocolon pasan las cólicas), no lo aprisiona contra la aorta."}, {"letra": "c", "texto": "Tercera porción del duodeno.", "correcta": true, "razon": "D3 (horizontal, L3) cruza de derecha a izquierda por delante de la VCI y la aorta y por DETRÁS de la AMS y la VMS, justo bajo el origen de la arteria (ángulo aortomesentérico normal 38-65°, <25° en Wilkie). Al perder grasa mesentérica el ángulo se cierra y D3 queda pinzada."}, {"letra": "d", "texto": "Primera porción del duodeno.", "correcta": false, "razon": "D1 está en L1, a la derecha, anterolateral; por detrás tiene colédoco, gastroduodenal y porta, no la AMS."}, {"letra": "e", "texto": "Yeyuno.", "correcta": false, "razon": "Comienza en la flexura duodenoyeyunal, a la izquierda de L2, y es intraperitoneal y móvil; no está fijado entre aorta y AMS."}], "respuesta": "c", "razonamiento": "La AMS nace de la aorta en L1 y desciende por delante de la porción horizontal del duodeno (D3) y del proceso uncinado del páncreas, entrando en la raíz del mesenterio. D3 es la única víscera que cruza el compás formado por la aorta (detrás) y la AMS (delante); también lo hace la v. renal izquierda (síndrome del cascanueces). Si el ángulo aortomesentérico se cierra (adelgazamiento rápido, escoliosis, cirugía) el duodeno queda comprimido: vómitos biliosos posprandiales, distensión gástrica y deshidratación = síndrome de la arteria mesentérica superior (Wilkie). La Q4 de enero 2026 repitió literalmente este caso con las opciones a-d (clave c)."}, "examen": [{"examen": "enero 2026", "pregunta": "Q4 (sin imagen)", "imagen": 0, "clave": "c", "que_pregunto": "'¿Cuál de las siguientes estructuras intestinales puede comprometerse entre la AMS y la aorta?' a) D2 b) colon transverso c) D3 d) D1 → c, tercera porción del duodeno. Clon literal de este caso.", "img_key": ""}], "pack": "Duodeno: D1 (L1, bulbo; detrás colédoco, gastroduodenal, porta), D2 (L1-L3, papilas; detrás riñón/uréter dchos), D3 (L3, cruza VCI y aorta bajo la AMS), D4 (asciende a la izda de L2 hasta Treitz). Irrigación: arcadas pancreatoduodenales superiores (gastroduodenal ← hepática común) e inferiores (AMS): frontera celíaco/AMS en la papila mayor. Venas → porta/VMS; linfa → pancreatoduodenales → pilóricos/celíacos y mesentéricos superiores; inervación vago + esplácnicos (plexos celíaco y mesentérico superior).", "trampa": "Preguntar por la estructura VENOSA pinzada (v. renal izquierda, cascanueces) o cambiar 'AMS' por 'AMI'. También el nivel: D3 en L3, no L1.", "prioridad"

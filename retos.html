r; solo da al pene la piel (vía pudendas externas), no el tejido eréctil. Su oclusión da claudicación, no impotencia directa (aunque el síndrome de Leriche —oclusión aortoilíaca bilateral— sí asocia impotencia, por afectar las ilíacas internas)."}, {"letra": "b", "texto": "Epigástrica inferior.", "correcta": false, "razon": "Rama de la ilíaca externa para la pared abdominal; da la a. cremastérica al cordón espermático, no a los cuerpos cavernosos."}, {"letra": "c", "texto": "Umbilical.", "correcta": false, "razon": "Rama de la ilíaca interna que da las aa. vesicales superiores y la a. del conducto deferente; no irriga el tejido eréctil."}, {"letra": "d", "texto": "Pudenda interna.", "correcta": true, "razon": "Rama de la división anterior de la a. ilíaca interna; sale por el foramen isquiático mayor, rodea la espina isquiática, entra por el menor al canal de Alcock y da a. del bulbo, a. uretral, a. profunda del pene (aa. helicinas → sinusoides cavernosos) y a. dorsal del pene. Sin flujo por ella no hay erección."}, {"letra": "e", "texto": "Circunfleja superficial y profunda.", "correcta": false, "razon": "Las circunflejas ilíacas (superficial ← femoral; profunda ← ilíaca externa) irrigan la pared abdominal y la región inguinal, no el pene."}], "respuesta": "d", "razonamiento": "La erección es un fenómeno vascular parasimpático (nn. cavernosos, S2-S4, plexo pélvico → NO → relajación del músculo liso de las aa. helicinas y trabéculas) que llena los sinusoides de los cuerpos cavernosos con sangre de la a. PROFUNDA del pene, rama terminal de la a. PUDENDA INTERNA (← a. ilíaca interna). La albugínea comprime las venas emisarias (mecanismo venooclusivo) y mantiene la rigidez. Una placa de ateroma en la pudenda interna (o en su tronco, la ilíaca interna) reduce el flujo arterial de entrada = disfunción eréctil arteriogénica, la causa orgánica más frecuente en fumadores/dislipémicos. Ninguna de las otras arterias aporta sangre al tejido eréctil: las pudendas EXTERNAS (femoral) solo van a piel y túnicas superficiales."}, "examen": [], "pack": "A. pudenda interna ← a. ilíaca interna → ramas: a. rectal inferior, a. perineal (escrotales posteriores), a. del bulbo del pene (bulbo, uretra esponjosa, Cowper), a. uretral, a. profunda del pene (helicinas, erección), a. dorsal del pene (glande, piel, prepucio; bajo Buck). Nervio acompañante: n. pudendo (canal de Alcock). Venas: v. dorsal profunda → plexo prostático → ilíaca interna; vv. profundas del pene → vv. pudendas internas.", "trampa": "Pudenda INTERNA (eréctil, ilíaca interna) vs pudenda EXTERNA (piel, femoral): la trampa favorita de Bermúdez (M26 P9, P25). También: la erección es PARASIMPÁTICA (S2-S4) y la eyaculación SIMPÁTICA (L1-L2): 'Point and Shoot'.", "prioridad": 2}, {"key": "R3G-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Pelvis masculina, corte sagital paramediano real (Rohen-Yokochi): recto, vejiga, próstata, pene y testículo", "que_se_ve": "Fotografía de pieza anatómica (Rohen) en corte sagital de la pelvis masculina; anterior a la DERECHA (pubis 12, pene colgando con el glande 20 abajo a la derecha), posterior a la izquierda (recto 2 y canal anal 4-5-6-5-4). Baja resolución. Rosas: 2, 3, 7, 8, 10, 12, 14, 15, 16, 17, 18, 20; en negro: 4, 5, 6, 11, 13, 19. Los números 1 y 9 del atlas quedan fuera del recorte.", "etiquetas": [{"n": "2", "nombre": "Recto (ampolla rectal)", "rosa": true, "seguro": true, "nota": "Gran masa parda posterior; delante de él, tabique rectovesical (Denonvilliers) y vesículas seminales; por tacto rectal se palpa la próstata."}, {"n": "3", "nombre": "Ampolla del conducto deferente / vesícula seminal (entre vejiga y recto, bajo la reflexión peritoneal)", "rosa": true, "seguro": false, "nota": "La línea acaba en un pequeño tubo pálido en el fondo del saco rectovesical, justo detrás de la base vesical. Alternativa: fondo de saco rectovesical / uréter terminal."}, {"n": "4", "nombre": "Músculo esfínter externo del ano (dos líneas: a cada lado del canal anal)", "rosa": false, "seguro": false, "nota": "Estriado, n. pudendo (rectal inferior); la disposición 4-5-6-5-4 es el canal anal en corte: externo-interno-luz-interno-externo."}, {"n": "5", "nombre": "Músculo esfínter interno del ano (dos líneas)", "rosa": false, "seguro": false, "nota": "Liso, involuntario, engrosamiento de la capa circular del recto; simpático lo contrae."}, {"n": "6", "nombre": "Canal anal (luz)", "rosa": false, "seguro": false, "nota": "Línea pectínea: arriba AMI/porta/ilíacos internos, abajo pudenda interna/cava/inguinales superficiales."}, {"n": "7", "nombre": "Bulbo del pene (cuerpo esponjoso) bajo la membrana perineal", "rosa": true, "seguro": false, "nota": "Masa oscura eréctil en el periné anterior, entre canal anal y raíz del pene. Alternativa: glándula bulbouretral (Cowper) / uretra bulbar."}, {"n": "8", "nombre": "Testículo (con túnica albugínea) dentro del escroto", "rosa": true, "seguro": true, "nota": "Ovoide pálido rodeado de las túnicas escrotales abajo; el corte es paramediano y lo incluye. Linfa → lumbares; a. testicular ← aorta."}, {"n": "10", "nombre": "Vejiga urinaria (vacía, pared plegada; dos líneas: vértice/cara superior y cuerpo)", "rosa": true, "seguro": true, "nota": "Detrás de la sínfisis y del espacio de Retzius; peritoneo solo en su cara superior."}, {"n": "11", "nombre": "Cuello de la vejiga / orificio uretral interno (uretra intramural)", "rosa": false, "seguro": false, "nota": "Zona entre vejiga y base de la próstata; esfínter interno liso."}, {"n": "12", "nombre": "Sínfisis del pubis (cuerpo del pubis con hueso esponjoso)", "rosa": true, "seguro": true, "nota": "Por detrás: espacio retropúbico de Retzius (caso 7); por debajo: ligamento arqueado y paso de la v. dorsal profunda del pene."}, {"n": "13", "nombre": "Uretra prostática / base de la próstata bajo el cuello vesical", "rosa": false, "seguro": false, "nota": "Dudoso por resolución; alternativa: plexo venoso prostático (Santorini) retropúbico."}, {"n": "14", "nombre": "Próstata", "rosa": true, "seguro": false, "nota": "Masa fibromuscular pálida bajo el cuello vesical y detrás de la sínfisis, encima del diafragma urogenital. ← a. vesical inferior + rectal media + pudenda interna."}, {"n": "15", "nombre": "Uretra membranosa (atravesando el esfínter uretral externo / diafragma urogenital)", "rosa": true, "seguro": false, "nota": "Segmento más corto y estrecho; se rompe en la fractura de pelvis. Alternativa: glándula bulbouretral (Cowper), que está a su lado en el espacio perineal profundo."}, {"n": "16", "nombre": "Cuerpo cavernoso del pene", "rosa": true, "seguro": true, "nota": "Tejido eréctil rojizo grueso del dorso del pene, desde el pilar hasta el glande; a. profunda del pene en su interior."}, {"n": "17", "nombre": "Cuerpo esponjoso del pene", "rosa": true, "seguro": false, "nota": "Banda ventral más pálida bajo el cuerpo cavernoso; contiene la uretra esponjosa. Alternativa: uretra esponjosa."}, {"n": "18", "nombre": "Uretra esponjosa (luz dentro del cuerpo esponjoso, en el cuerpo del pene; flecha)", "rosa": true, "seguro": false, "nota": "Alternativa: cuerpo esponjoso. 17 y 18 se reparten cuerpo esponjoso / uretra esponjosa."}, {"n": "19", "nombre": "Prepucio / piel del pene", "rosa": false, "seguro": true, "nota": "Pliegue cutáneo que cubre el glande; frenillo en la cara ventral."}, {"n": "20", "nombre": "Glande del pene", "rosa": true, "seguro": true, "nota": "Expansión del cuerpo esponjoso; irrigado por la a. dorsal del pene; linfa → inguinales profundos (y superficiales)."}], "examen": [{"examen": "mayo 2026", "pregunta": "(sin pregunta directa; gemela)", "imagen": 18, "clave": "—", "que_pregunto": "La img 18 de mayo era la lámina gemela de R1-GU p16 (pelvis ♂ sagital Rohen, rosas 3,10,14,15,17) y quedó de reserva sin pregunta en la permutación transcrita. Preparar esta p11 como si fuera a caer: lista A-D con recto, vejiga, próstata, uretra, cuerpos eréctiles y una etiqueta cambiada.", "img_key": "mayo-18"}], "pack": "Relaciones sagitales ♂ de delante atrás: sínfisis → espacio retropúbico (Retzius) → vejiga → conductos deferentes/vesículas seminales → tabique rectovesical (Denonvilliers) → recto; el peritoneo forma el fondo de saco RECTOVESICAL (en el varón NO hay rectouterino/Douglas: trampa M26 P27). Próstata bajo la vejiga y ENCIMA del diafragma urogenital (M26 P14c falsa). Irrigación: próstata y vesículas ← a. vesical inferior + rectal media (ilíaca interna); deferente ← a. del deferente ← vesical superior/umbilical; recto ← rectal superior (AMI) + media (ilíaca interna) + inferior (pudenda interna); cuerpos eréctiles ← pudenda interna. Venas: plexo vesicoprostático (Santorini, recibe la v. dorsal profunda del pene) → v. ilíaca interna, con comunicación al plexo vertebral interno (Batson → metástasis vertebrales del cáncer de próstata). Linfa: próstata → ilíacos internos y sacros; testículo → lumbares; escroto/piel del pene → inguinales superficiales; glande → inguinales profundos.", "trampa": "Lateralidad de la foto (anterior a la derecha). Uretra MEMBRANOSA = fractura de pelvis (orina al espacio perineal profundo); uretra ESPONJOSA/bulbar = caída a horcajadas (orina al espacio perineal superficial: escroto, pene, pared abdominal; no al muslo por la fascia lata). Y 'fondo de saco rectouterino en un varón'.", "prioridad": 2}, {"key": "R3G-p12", "pagina": 12, "item": 11, "tipo": "caso", "titulo": "Caso 11 · Carcinoma de próstata (PSA, úvula vesical): linfadenectomía de ilíacos internos", "que_se_ve": "Diapositiva de texto con caso clínico y 4 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 68 años ingresa con disuria, nicturia y micción urgente y dolorosa. La RM muestra engrosamiento e irregularidad de la úvula vesical debido a hipertrofia prostática. Las pruebas de laboratorio muestran PSA elevado, lo cual sugiere un carcinoma de próstata. Se realiza una prostatectomía. ¿Cuál de los siguientes nódulos linfáticos debe extirparse durante la prostatectomía?", "opciones": [{"letra": "a", "texto": "Ilíacos internos.", "correcta": true, "razon": "La linfa de la próstata (y de las vesículas seminales, uretra prostática y membranosa) va a los ganglios ILÍACOS INTERNOS (y sacros), siguiendo sus arterias (vesical inferior, rectal media, pudenda interna, todas de la ilíaca interna); de ahí a ilíacos comunes y lumbares. La linfadenectomía pélvica del cáncer de próstata incluye obturadores/ilíacos internos y externos."}, {"letra": "b", "texto": "Inguinales superficiales.", "correcta": false, "razon": "Reciben la piel del periné, escroto, piel del pene, uretra esponjosa distal y miembro inferior; no la próstata."}, {"letra": "c", "texto": "Inguinales profundos.", "correcta": false, "razon": "Reciben el glande, la uretra esponjosa y los inguinales superficiales; no la próstata."}, {"letra": "d", "texto": "Glúteos.", "correcta": false, "razon": "Los ganglios glúteos (superiores/inferiores) son satélites de las aa. glúteas y drenan la región glútea; no son primera estación de la próstata."}], "respuesta": "a", "razonamiento": "Regla general de la pelvis: cada víscera drena su linfa a los ganglios que acompañan a su arteria. La próstata está irrigada por ramas de la a. ilíaca INTERNA (vesical inferior, rectal media, pudenda interna) → sus linfáticos van a los ganglios ilíacos internos (hipogástricos) y sacros, con alguna vía a los ilíacos externos/obturadores; luego ilíacos comunes → lumbares. La úvula vesical es el relieve del trígono, detrás del orificio uretral interno, que la HBP del lóbulo medio levanta (obstrucción). Diseminación hematógena: plexo de Santorini → plexo vertebral interno (Batson) → metástasis osteoblásticas en columna lumbar y pelvis."}, "examen": [{"examen": "mayo 2026", "pregunta": "P14", "imagen": 12, "clave": "b", "que_pregunto": "Con la eco de próstata (p17) preguntó la irrigación: vesical inferior + rectal media + pudenda interna (todas de la ilíaca interna) — mismo tronco por el que van sus linfáticos a ilíacos internos.", "img_key": "mayo-12"}], "pack": "Linfa GU ♂ resumida: testículo → LUMBARES (L2) · escroto y piel del pene → INGUINALES SUPERFICIALES · glande y uretra esponjosa → INGUINALES PROFUNDOS · próstata, vesículas, uretra posterior, vejiga (cuello) → ILÍACOS INTERNOS (+ sacros) · vejiga (cuerpo) → ilíacos externos · deferente → ilíacos externos e internos.", "trampa": "Poner 'inguinales' a la próstata (piel) o 'lumbares' (eso es el testículo). Zonas: cáncer = PERIFÉRICA (posterior, tacto rectal); HBP = TRANSICIÓN (periuretral, obstrucción).", "prioridad": 3}, {"key": "R3G-p13", "pagina": 13, "item": 12, "tipo": "identifica", "titulo": "Pelvis masculina, corte sagital medio (dibujo Sobotta): deferente, uréter, vesícula seminal, próstata, testículo", "que_se_ve": "Dibujo de atlas del hemipelvis masculina en corte sagital, anterior a la izquierda: vejiga (14) con el conducto deferente (1) arqueando sobre ella hasta la ampolla (12) junto a la vesícula seminal (11), próstata (10), recto cortado arriba y descendiendo detrás, ano con sus músculos (7-8), pubis con el cordón (2-3), raíz del pene (4-5) y testículo (6). Números 1-15 en negro, sin rosas.", "etiquetas": [{"n": "1", "nombre": "Conducto deferente (porción pélvica, cruza sobre la cara superolateral de la vejiga)", "rosa": false, "seguro": true, "nota": "Desde el anillo inguinal profundo cruza los vasos ilíacos externos, va subperitoneal por la pared lateral y pasa por ENCIMA del uréter ('agua bajo el puente') hasta la base vesical."}, {"n": "2", "nombre": "Ligamento suspensorio del pene / sínfisis del pubis (cara anterior)", "rosa": false, "seguro": false, "nota": "Estructura fibrosa pálida por delante del cuerpo del pubis en la raíz del pene. Alternativa: espacio retropúbico."}, {"n": "3", "nombre": "Cordón espermático / conducto deferente en el conducto inguinal (junto al pubis)", "rosa": false, "seguro": false, "nota": "Punto donde el deferente sale del anillo inguinal superficial hacia el escroto; alternativa: sínfisis del pubis."}, {"n": "4", "nombre": "Cuerpo cavernoso del pene (raíz, dorsal)", "rosa": false, "seguro": false, "nota": "Estructura eréctil dorsal en la raíz del pene, cortada; alternativa: v. dorsal profunda / bulbo."}, {"n": "5", "nombre": "Cuerpo esponjoso del pene / bulbo del pene", "rosa": false, "seguro": false, "nota": "Estructura ventral bajo el cavernoso, con la uretra esponjosa."}, {"n": "6", "nombre": "Testículo", "rosa": false, "seguro": true, "nota": "Dentro de la túnica vaginal y las túnicas escrotales; epidídimo posterior. Linfa → lumbares."}, {"n": "7", "nombre": "Músculo esfínter externo del ano / músculo elevador del ano (dos líneas sobre el músculo perianal)", "rosa": false, "seguro": false, "nota": "Masa muscular estriada alrededor del canal anal, n. pudendo."}, {"n": "8", "nombre": "Centro tendinoso del periné (cuerpo perineal) / canal anal", "rosa": false, "seguro": false, "nota": "La línea acaba en el punto fibroso blanquecino entre la próstata-bulbo y el ano."}, {"n": "9", "nombre": "Recto (ampolla rectal, detrás de próstata y vesículas seminales)", "rosa": false, "seguro": false, "nota": "Separado de la próstata por el tabique rectovesical (Denonvilliers): tacto rectal."}, {"n": "10", "nombre": "Próstata", "rosa": false, "seguro": true, "nota": "Bajo el cuello vesical, sobre el diafragma urogenital; perforada por los conductos eyaculadores que desembocan en el colículo."}, {"n": "11", "nombre": "Vesícula seminal (glándula vesiculosa)", "rosa": false, "seguro": true, "nota": "5 cm, detrás de la vejiga y delante del recto, lateral a la ampolla del deferente; 70 % del semen (fructosa). ← vesical inferior + rectal media; linfa → ilíacos internos."}, {"n": "12", "nombre": "Ampolla del conducto deferente (unión con el conducto excretor de la vesícula → conducto eyaculador)", "rosa": false, "seguro": false, "nota": "Alternativa: uréter terminal en su cruce con el deferente."}, {"n": "13", "nombre": "Uréter (tramo pélvico llegando a la base de la vejiga, cruzado por encima por el deferente)", "rosa": false, "seguro": false, "nota": "En ♂ lo cruza el deferente; en ♀ la a. uterina (M26 P22). Alternativa: peritoneo del fondo de saco rectovesical."}, {"n": "14", "nombre": "Vejiga urinaria", "rosa": false, "seguro": true, "nota": "Cara superior peritonizada; fondo de saco rectovesical detrás."}, {"n": "15", "nombre": "Conducto deferente (mismo arco, porción posterior) / peritoneo parietal sobre la vejiga", "rosa": false, "seguro": false, "nota": "La línea acaba sobre el mismo tubo que 1, más posterior; posiblemente 1 y 15 reparten deferente / uréter o deferente / peritoneo."}], "examen": [], "pack": "Vía espermática pélvica: deferente (40 cm, luz de 0,5 mm y pared muscular gruesa; ← a. del deferente ← vesical superior/umbilical ← ilíaca interna, NUNCA de la ilíaca externa) → ampolla → + conducto excretor de la vesícula seminal = conducto eyaculador (2 cm) → perfora la próstata → colículo seminal de la uretra PROSTÁTICA. Vesículas y ampollas: entre vejiga y recto (Denonvilliers), palpables por tacto rectal si están inflamadas; ← vesical inferior + rectal media; venas → plexo vesicoprostático → ilíaca interna; linfa → ilíacos internos (deferente también externos). Uréter ♂: cruzado por encima por el deferente cerca de la base vesical.", "trampa": "'El deferente pasa por DEBAJO del uréter' (falso: por encima). 'Los conductos eyaculadores desembocan en la uretra membranosa' (falso: prostática, en el colículo). 'Deferente irrigado por la ilíaca externa' (falso).", "prioridad": 2}, {"key": "R3G-p14", "pagina": 14, "item": 13, "tipo": "identifica", "titulo": "Pelvis masculina, corte coronal (frontal) real a nivel de cabezas femorales, vejiga, próstata y bulbo del pene (Rohen-Yokochi)", "que_se_ve": "Fotografía de pieza (Rohen) en corte coronal: arriba la vejiga (gran cavidad parda) entre los dos acetábulos y cabezas femorales; en el centro la próstata con la hendidura de la uretra prostática, bajo ella el diafragma urogenital y, en la línea media inferior, el bulbo del pene (masa oscura); a los lados obturador interno y elevador del ano. Baja resolución. Rosas: 5, 6, 11, 16; en negro: 1, 2, 3, 4, 7, 8, 9, 10, 12, 13, 14, 15.", "etiquetas": [{"n": "1", "nombre": "Acetábulo (techo, hueso coxal)", "rosa": false, "seguro": true, "nota": "Cartílago articular y hueso ilíaco sobre la cabeza femoral."}, {"n": "2", "nombre": "Vejiga urinaria (cavidad y pared)", "rosa": false, "seguro": true, "nota": "Peritoneo solo en la cara superior; venas → plexo vesical → ilíacas internas + Batson."}, {"n": "3", "nombre": "Cabeza del fémur", "rosa": false, "seguro": true, "nota": "Referencia: el corte pasa por la articulación coxofemoral, lateral a la pelvis menor."}, {"n": "4", "nombre": "Orificio uretral interno / cuello de la vejiga (flecha)", "rosa": false, "seguro": true, "nota": "Esfínter interno liso (simpático); la úvula vesical está justo detrás."}, {"n": "5", "nombre": "Próstata (lóbulo lateral)", "rosa": true, "seguro": true, "nota": "Masa bilobulada bajo el cuello vesical, atravesada por la uretra; caras inferolaterales contra el elevador del ano. ← vesical inferior + rectal media + pudenda interna (M26 P14)."}, {"n": "6", "nombre": "Uretra prostática (hendidura media dentro de la próstata)", "rosa": true, "seguro": false, "nota": "Alternativa: colículo seminal / cresta uretral. Es la porción más ancha; recibe eyaculadores y conductillos prostáticos."}, {"n": "7", "nombre": "Músculo elevador del ano (pubococcígeo) / fascia pélvica lateral a la próstata", "rosa": false, "seguro": false, "nota": "Pared lateral: entre próstata y obturador interno, con el arco tendinoso de la fascia pélvica."}, {"n": "8", "nombre": "Plexo venoso prostático (Santorini) / fascia prostática (llave)", "rosa": false, "seguro": false, "nota": "Vasos oscuros periprostáticos; recibe la v. dorsal profunda del pene → ilíaca interna."}, {"n": "9", "nombre": "Uretra (unión prostática-membranosa) / vértice de la próstata", "rosa": false, "seguro": false, "nota": "Línea media justo bajo la próstata."}, {"n": "10", "nombre": "Diafragma urogenital: m. transverso profundo del periné / esfínter uretral externo (llave)", "rosa": false, "seguro": false, "nota": "Estriado, n. pudendo; entre él y la membrana perineal, la uretra membranosa y Cowper."}, {"n": "11", "nombre": "Músculo bulboesponjoso / pilar del pene con isquiocavernoso (lateral al bulbo)", "rosa": true, "seguro": false, "nota": "La llave señala el tejido lateral-inferior al bulbo: bulboesponjoso (que lo envuelve) o el crus del pene. Alternativa: membrana perineal."}, {"n": "12", "nombre": "Vesícula seminal / ampolla del deferente (lado derecho, base de la próstata)", "rosa": false, "seguro": false, "nota": "Estructura junto al cuello vesical-base prostática en el lado derecho de la foto; alternativa: uréter terminal / plexo venoso."}, {"n": "13", "nombre": "Plexo venoso prostático / vasos vesicales (llave, lado derecho)", "rosa": false, "seguro": false, "nota": "Vasos oscuros entre próstata y pared pélvica."}, {"n": "14", "nombre": "Músculo elevador del ano (lado derecho)", "rosa": false, "seguro": false, "nota": "Fibras que descienden desde la pared lateral hacia la próstata (m. puboprostático/pubococcígeo)."}, {"n": "15", "nombre": "Músculo obturador interno", "rosa": false, "seguro": false, "nota": "Gran músculo de la pared lateral de la pelvis bajo el acetábulo; sobre su fascia, el canal de Alcock con el n. pudendo y vasos pudendos internos."}, {"n": "16", "nombre": "Bulbo del pene (cuerpo esponjoso)", "rosa": true, "seguro": true, "nota": "Masa eréctil oscura, impar, en la línea media bajo la membrana perineal; envuelta por el bulboesponjoso; ← a. del bulbo (pudenda interna)."}], "examen": [], "pack": "Próstata en coronal: bilobulada bajo el cuello vesical, atravesada por la uretra prostática; caras inferolaterales sobre el elevador del ano (fascia pélvica y plexo de Santorini), vértice sobre el diafragma urogenital; el bulbo del pene queda debajo de la membrana perineal en la línea media. Irrigación: a. vesical INFERIOR (principal) + rectal media + pudenda interna ← ilíaca interna. Venas: plexo prostático (recibe la v. dorsal profunda del pene) → v. ilíaca INTERNA (M26 P15: 'externa' era falso) + comunicación con plexo vertebral interno (Batson). Linfa: ilíacos internos y sacros. Bulbo: a. del bulbo ← pudenda interna; v. del bulbo → pudenda interna. Inervación de próstata: plexo prostático (hipogástrico inferior: simpático L1-L2 para la eyaculación, parasimpático S2-S4).", "trampa": "'Próstata bajo la vejiga y bajo el transverso profundo del periné' (falso: está ENCIMA del diafragma urogenital, M26 P14c). Zona periférica = carcinoma, zona de transición = HBP. La uretra membranosa (no el bulbo) es el segmento más corto y estrecho.", "prioridad": 2}, {"key": "R3G-p15", "pagina": 15, "item": 14, "tipo": "identifica", "titulo": "Testículo y epidídimo abiertos: lobulillos, tabiques, rete testis, conductillos eferentes y conducto deferente (Sobotta/Netter)", "que_se_ve": "Dibujo de atlas: testículo seccionado con la albugínea (4) y los tabiques (5) que delimitan lobulillos (3) que convergen en el mediastino con la rete testis (6); una pinza levanta la cabeza del epidídimo mostrando los conductillos eferentes (7); el epidídimo (2: cabeza, cuerpo y cola, tres líneas) se continúa con el conducto deferente (1). Vasos del cordón en rojo/azul. Números 1-7 en negro, sin rosas.", "etiquetas": [{"n": "1", "nombre": "Conducto deferente", "rosa": false, "seguro": true, "nota": "Continúa la cola del epidídimo; asciende MEDIAL al epidídimo en el cordón; 40 cm, pared muscular gruesa (se palpa como cordón duro)."}, {"n": "2", "nombre": "Epidídimo (cabeza, cuerpo y cola: tres líneas)", "rosa": false, "seguro": true, "nota": "Conducto único de 6 m plegados en el borde POSTERIOR del testículo; cabeza en el polo superior (formada por los conos eferentes), cola en el inferior."}, {"n": "3", "nombre": "Lobulillos testiculares (túbulos seminíferos contorneados)", "rosa": false, "seguro": true, "nota": "250-300 lobulillos con 1-4 túbulos cada uno; espermatogénesis (Sertoli) y Leydig intersticiales."}, {"n": "4", "nombre": "Túnica albugínea", "rosa": false, "seguro": true, "nota": "Cápsula fibrosa gruesa e inextensible; por fuera, túnica vaginal visceral. Su engrosamiento posterior = mediastino (M26 P8: 'A = mediastino testicular')."}, {"n": "5", "nombre": "Tabiques testiculares (septula testis)", "rosa": false, "seguro": true, "nota": "Prolongaciones de la albugínea desde el mediastino que separan los lobulillos (M26 P8: 'D = tabiques testiculares')."}, {"n": "6", "nombre": "Red testicular (rete testis) en el mediastino del testículo", "rosa": false, "seguro": true, "nota": "Laberinto de conductos en el mediastino que recibe los túbulos rectos; en eco es la banda ecogénica posterior."}, {"n": "7", "nombre": "Conductillos eferentes (conos eferentes) → cabeza del epidídimo", "rosa": false, "seguro": true, "nota": "12-15 conductillos que salen del polo superior de la rete testis y forman los lobulillos (conos) de la cabeza del epidídimo. Trampa M26 P8c: 'aferentes' era falso."}], "examen": [{"examen": "mayo 2026", "pregunta": "P8", "imagen": 15, "clave": "b", "que_pregunto": "Eco testicular ×2 (S11 p12): A = mediastino testicular, B = escroto, C = tabique escrotal, D = tabiques testiculares. La opción c hablaba de conductillos 'aferentes' (son EFERENTES). Esta lámina es la versión de atlas de esas mismas estructuras.", "img_key": "mayo-15"}], "pack": "Vía espermática: túbulos seminíferos contorneados → túbulos rectos → rete testis (mediastino) → conductillos EFERENTES (cabeza del epidídimo) → conducto del epidídimo (cuerpo, cola) → conducto deferente → ampolla → conducto eyaculador → uretra prostática. Irrigación (triple, anastomosis de Jahrisch): a. testicular ← aorta (L2) + a. deferencial ← vesical superior/inferior ← ilíaca interna + a. cremastérica ← epigástrica inferior ← ilíaca externa (M26 P7). Venas: plexo pampiniforme → v. testicular: derecha → VCI, izquierda → v. renal izquierda. Linfa: testículo y epidídimo → LUMBARES paraaórticos; escroto → inguinales superficiales. Inervación: plexo testicular (simpático T10-T11: dolor referido periumbilical; el testículo 'nació' en L2 y bajó por el gubernáculo).", "trampa": "Eferentes vs aferentes; 'cabeza del epidídimo en el polo inferior' (es el SUPERIOR); 'el deferente asciende lateral al epidídimo' (es MEDIAL). Hidrocele = túnica vaginal (peritoneo), no albugínea.", "prioridad": 3}, {"key": "R3G-p16", "pagina": 16, "item": 15, "tipo": "caso", "titulo": "Caso 15 · Cáncer testicular: primera estación ganglionar = lumbares paraaórticos", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 22 años ingresa con dolor en la ingle y emisión de sangre en el semen. Mediante RM y biopsia se diagnostica cáncer testicular. ¿Cuál de los siguientes nódulos linfáticos es el primer afectado en caso de metástasis?", "opciones": [{"letra": "a", "texto": "Ilíaco interno.", "correcta": false, "razon": "Reciben próstata, vesículas, vejiga (cuello), uretra posterior, recto medio; no el testículo."}, {"letra": "b", "texto": "Ilíaco externo.", "correcta": false, "razon": "Reciben el cuerpo de la vejiga, el deferente en parte y los inguinales; no son primera estación del testículo."}, {"letra": "c", "texto": "Inguinal superficial.", "correcta": false, "razon": "Distractor clásico: reciben la PIEL del escroto, del pene y del periné (y miembro inferior). El testículo no es piel."}, {"letra": "d", "texto": "Inguinal profundo.", "correcta": false, "razon": "Reciben el glande y la uretra esponjosa, además de los superficiales; no el testículo."}, {"letra": "e", "texto": "Lumbar paraaórtico.", "correcta": true, "razon": "El testículo se origina en el retroperitoneo a nivel de L2 y desciende por el conducto inguinal arrastrando sus vasos y linfáticos: la linfa sube con la v. testicular por el cordón espermático hasta los ganglios LUMBARES (paraaórticos/preaórticos, L1-L2), no a los inguinales."}], "respuesta": "e", "razonamiento": "Regla de oro del testículo: 'nació en L2 y lo conserva todo': arteria testicular directa de la aorta abdominal (L2), vena testicular a la VCI (derecha) o a la v. renal izquierda (izquierda), y linfáticos que acompañan a los vasos testiculares por el cordón espermático y el anillo inguinal profundo hasta los ganglios lumbares (lateroaórticos derechos/preaórticos e izquierdos junto al hilio renal). Por eso un seminoma metastatiza primero al retroperitoneo (adenopatías paraaórticas en TC), y las metástasis inguinales solo aparecen si el tumor invade la piel escrotal o tras cirugía escrotal previa (por eso la orquiectomía es INGUINAL, nunca transescrotal). El escroto, en cambio, drena a inguinales superficiales (M26 P9). La hemospermia del enunciado es un dato de relleno."}, "examen": [{"examen": "mayo 2026", "pregunta": "P9", "imagen": 0, "clave": "—", "que_pregunto": "Pregunta de vascularización/linfa escrotal: escroto → inguinales superficiales; escrotales anteriores ← pudenda externa, posteriores ← perineal ← pudenda interna. El par testículo (lumbares) vs escroto (inguinales) es el contraste que Bermúdez explota.", "img_key": ""}], "pack": "Linfa: testículo/epidídimo → lumbares paraaórticos (L1-L2) · escroto → inguinales superficiales · glande → inguinales profundos · próstata → ilíacos internos. Arteria testicular ← aorta L2; vena izquierda → renal izquierda; dolor testicular referido a T10-T11 (periumbilical).", "trampa": "'Inguinal' para el testículo (es para el escroto/piel). La orquiectomía por tumor se hace por vía inguinal para no abrir vías linfáticas escrotales.", "prioridad": 2}, {"key": "R3G-p17", "pagina": 17, "item": 16, "tipo": "imagen", "titulo": "Ecografía suprapúbica de vejiga y próstata (calibradores 4,67 × 4,53 cm) — IMAGEN 12 de mayo 2026", "que_se_ve": "Doble ecografía transabdominal suprapúbica: a la izquierda corte sagital y a la derecha transversal; arriba la pared abdominal (bandas ecogénicas), en el centro la vejiga llena anecoica (ventana acústica) y bajo ella la próstata hipoecoica-heterogénea entre los calibradores (1: 4,67 cm; 2: 4,53 cm). Sin números ni rosas; es la misma placa que S11 p5 y la imagen 12 del examen de mayo 2026.", "etiquetas": [{"n": "A", "nombre": "Vejiga urinaria llena (cavidad anecoica con refuerzo posterior)", "rosa": false, "seguro": true, "nota": "Letra usada en el examen de mayo (img 12). Ventana acústica obligatoria para la vía suprapúbica."}, {"n": "B", "nombre": "Pared abdominal anterior (piel, subcutáneo, rectos/aponeurosis)", "rosa": false, "seguro": true, "nota": "Bandas ecogénicas superiores."}, {"n": "C", "nombre": "Próstata (entre calibradores, 4,67 × 4,53 cm)", "rosa": false, "seguro": true, "nota": "En el examen, la a) la llamaba 'significativamente patológica' = falsa (tamaño conservado). Volumen = L×A×H×0,52 (normal 20-25 cm³)."}], "pregunta": {"enunciado": "Identifica las estructuras de la imagen", "opciones": [], "respuesta": "", "razonamiento": "Eco suprapúbica (transductor convex 3,5-5 MHz apoyado sobre el pubis, angulado caudalmente para pasar bajo la sínfisis, con vejiga llena): de arriba abajo pared abdominal → vejiga anecoica → base vesical/cuello → próstata (hipoecoica, homogénea, con la cápsula como línea ecogénica) → recto. Los calibradores miden dos diámetros de la próstata (4,67 y 4,53 cm); con el tercero se calcula el volumen (elipsoide × 0,52). Es una vía de cribado: para valorar zonas (periférica vs transición), veru montanum, vesículas seminales o guiar biopsia se usa la eco TRANSRECTAL (7-10 MHz, más resolución: M26 P21)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P14", "imagen": 12, "clave": "b", "que_pregunto": "Sobre esta imagen: CORRECTA 'la estructura C (próstata) está irrigada por ramas de la a. vesical inferior, la a. rectal (hemorroidal) media y la a. pudenda interna'. Falsas: a) 'C de tamaño patológico'; c) 'próstata bajo la vejiga y bajo el transverso profundo del periné' (está ENCIMA); d) 'HBP en la zona periférica' (es la de transición; la periférica es la del carcinoma).", "img_key": "mayo-12"}, {"examen": "mayo 2026", "pregunta": "(reserva)", "imagen": 11, "clave": "—", "que_pregunto": "Img 11 = S11 p7, eco de próstata gemela con volumen 53 cm³ (agrandada); sin pregunta en la permutación transcrita. Mismo pack.", "img_key": "mayo-11"}], "pack": "Próstata: ramas prostáticas de la a. VESICAL INFERIOR (principal) + a. rectal media + a. pudenda interna, las tres de la a. ilíaca interna. Venas: plexo venoso prostático de Santorini (rodea la glándula, recibe la v. dorsal profunda del pene) → vv. ilíacas INTERNAS; comunica con el plexo vertebral interno (Batson) → metástasis óseas vertebrales. Linfa → ilíacos internos y sacros (caso 11). Inervación: plexo prostático del hipogástrico inferior (simpático L1-L2 = eyaculación; parasimpático S2-S4). Relaciones: bajo la vejiga, ENCIMA del diafragma urogenital, detrás de la sínfisis (Retzius), delante del recto (tacto rectal), atravesada por la uretra prostática y los conductos eyaculadores. Zonas de McNeal: transición (HBP), periférica (70 % de carcinomas), central.", "trampa": "Intercambiar zona de HBP (TRANSICIÓN) y de cáncer (PERIFÉRICA); 'bajo el transverso profundo del periné'; llamar 'patológica' a una próstata normal; poner 'vesical superior' o 'pudenda externa' en la irrigación; 'plexo vesicoprostático → ilíaca EXTERNA' (M26 P15).", "prioridad": 3}, {"key": "R3G-p18", "pagina": 18, "item": 17, "tipo": "caso", "titulo": "Caso 17 · Trombosis de las venas del testículo izquierdo: primer destino = vena renal izquierda", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 35 años ingresa tras recibir una patada en la ingle jugando a fútbol. En la exploración física el testículo izquierdo se encuentra inflamado. Una RM muestra la coagulación de la sangre en las venas que drenan el testículo. ¿A cuál de las siguientes venas puede pasar un trombo en primer lugar a partir del área lesionada?", "opciones": [{"letra": "a", "texto": "Vena cava inferior.", "correcta": false, "razon": "Es donde desemboca DIRECTAMENTE la v. testicular DERECHA; la izquierda llega a la cava solo después de pasar por la v. renal izquierda."}, {"letra": "b", "texto": "Vena renal izquierda.", "correcta": true, "razon": "El plexo pampiniforme izquierdo → v. testicular izquierda → desemboca en ángulo recto en la v. RENAL IZQUIERDA → VCI. Un trombo del testículo izquierdo alcanza primero la v. renal izquierda."}, {"letra": "c", "texto": "Epigástrica inferior izquierda.", "correcta": false, "razon": "Recibe la v. cremastérica (venas de las cubiertas del cordón), un drenaje accesorio y menor; no es la vía principal del testículo. Va a la ilíaca externa."}, {"letra": "d", "texto": "Pudenda interna izquierda.", "correcta": false, "razon": "Drena periné, pene profundo y escroto posterior; no el testículo."}, {"letra": "e", "texto": "Vena ilíaca izquierda.", "correcta": false, "razon": "Ni la ilíaca externa ni la interna reciben la v. testicular; el drenaje gonadal es retroperitoneal alto (renal izquierda / cava)."}], "respuesta": "b", "razonamiento": "Las venas del testículo forman el plexo pampiniforme (8-12 venas alrededor de la a. testicular en el cordón, termorregulación contracorriente), que se reduce a 3-4 venas en el conducto inguinal y a una v. testicular en el retroperitoneo, ascendiendo con la arteria por delante del psoas y el uréter. La DERECHA desemboca en la cara anterolateral de la VCI en ángulo agudo; la IZQUIERDA en la v. RENAL IZQUIERDA en ángulo recto (mayor presión hidrostática, menos válvulas: varicocele izquierdo, caso 5). Un trombo de origen testicular izquierdo pasa por tanto primero a la v. renal izquierda, luego a la VCI, aurícula derecha y arteria pulmonar (embolia)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P7", "imagen": 14, "clave": "c", "que_pregunto": "Opción d falsa: 'la v. testicular izquierda drena en la v. renal contralateral'. Exactamente el dato de este caso (ipsilateral).", "img_key": "mayo-14"}], "pack": "V. testicular derecha → VCI · izquierda → v. renal izquierda (que además pasa por la pinza aortomesentérica y recibe la v. suprarrenal izquierda). Vías venosas accesorias del cordón: v. cremastérica → epigástrica inferior (ilíaca externa); v. del deferente → vesical (ilíaca interna). Arteria: a. testicular ← aorta L2.", "trampa": "'Cava inferior' para el lado IZQUIERDO (es el derecho); 'renal contralateral'; 'ilíaca'. Lee siempre el lado.", "prioridad": 3}, {"key": "R3G-p19", "pagina": 19, "item": 18, "tipo": "imagen", "titulo": "Ecografía escrotal: transversal de ambos testículos + longitudinal de un testículo con la cabeza del epidídimo — IMAGEN 14 de mayo 2026", "que_se_ve": "Dos ecografías escrotales con sonda lineal de alta frecuencia: izquierda (LOGIQ, 'SCROTAL') corte transversal de ambos testículos, ovoides de ecogenicidad media homogénea separados por el tabique escrotal; derecha (Philips, 'TESTICLE') corte longitudinal de un testículo con la cabeza del epidídimo triangular, algo más ecogénica, en el polo superior. Sin números ni rosas; misma placa que S11 p11 y la imagen 14 del examen de mayo 2026.", "etiquetas": [{"n": "A", "nombre": "Testículo (parénquima homogéneo de ecogenicidad media; albugínea como línea ecogénica)", "rosa": false, "seguro": true, "nota": "Letra usada en el examen de mayo (img 14): 'A irrigada por a. testicular, a. del deferente y a. cremastérica anastomosadas' = correcta."}, {"n": "B", "nombre": "Cabeza del epidídimo (polo superior, isoecoica o algo más ecogénica)", "rosa": false, "seguro": true, "nota": "En el examen la opción que la llamaba 'cordón espermático' era falsa."}, {"n": "C", "nombre": "Escroto / túnicas escrotales y tabique escrotal", "rosa": false, "seguro": false, "nota": "Paredes ecogénicas; entre ambos testículos el tabique (dartos)."}, {"n": "D", "nombre": "Túnica vaginal (línea virtual; si hay líquido anecoico = hidrocele)", "rosa": false, "seguro": false, "nota": "Normalmente solo una mínima lámina de líquido."}], "pregunta": {"enunciado": "Identifica el órgano de la imagen", "opciones": [], "respuesta": "", "razonamiento": "Son los TESTÍCULOS en ecografía escrotal (sonda lineal 7-12 MHz, la vía de elección: superficial, no necesita ventana). El testículo normal es ovoide, 4-5 × 3 × 2,5 cm, de ecogenicidad media y textura fina homogénea; la albugínea es una fina línea ecogénica y el mediastino testicular una banda ecogénica posterior (M26 P8 'A = mediastino'). La cabeza del epidídimo se ve en el polo superior como una estructura triangular iso/ligeramente hiperecogénica (imagen derecha); cuerpo y cola son más finos y posteriores. Con Doppler se valora el flujo de la a. testicular (ausente en torsión, aumentado en orquiepididimitis) y el plexo pampiniforme (> 2-3 mm y que crece con Valsalva = varicocele, izquierdo)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P7", "imagen": 14, "clave": "c", "que_pregunto": "Sobre esta imagen: CORRECTA 'A (testículo) irrigada por la a. testicular (aorta), la a. del conducto deferente (vesical) y la a. cremastérica (epigástrica inferior), anastomosadas'. Falsas: a) etiquetado A-D cambiado; b) testículo izquierdo más bajo (cierto) pero aplicado a letras erróneas (B no es el cordón); d) 'v. testicular izquierda → renal CONTRALATERAL'.", "img_key": "mayo-14"}, {"examen": "mayo 2026", "pregunta": "P8", "imagen": 15, "clave": "b", "que_pregunto": "Eco testicular gemela (S11 p12): A mediastino testicular, B escroto, C tabique escrotal, D tabiques testiculares; 'conductillos aferentes' era la trampa (son eferentes).", "img_key": "mayo-15"}], "pack": "Triple irrigación anastomosada del testículo (Jahrisch): a. TESTICULAR ← aorta (L2) + a. DEFERENCIAL ← vesical superior/inferior ← ilíaca interna + a. CREMASTÉRICA ← epigástrica inferior ← ilíaca externa. Venas: plexo pampiniforme → v. testicular: derecha → VCI, izquierda → v. renal izquierda (varicocele izquierdo). Linfa: testículo → lumbares paraaórticos; escroto → inguinales superficiales. Inervación: plexo testicular (T10-T11, dolor referido periumbilical); escroto anterior por ilioinguinal y genitofemoral, posterior por pudendo y cutáneo femoral posterior. Envolturas: piel → dartos → fascia espermática externa → cremáster → fascia espermática interna → túnica vaginal → albugínea.", "trampa": "Rama madre cambiada en la terna arterial (cremastérica 'de la aorta', testicular 'de la ilíaca'); 'renal contralateral'; llamar 'cordón espermático' a la cabeza del epidídimo; linfa testicular 'inguinal'.", "prioridad": 3}, {"key": "R3G-p20", "pagina": 20, "item": 19, "tipo": "caso", "titulo": "Caso 19 · Testículos palpables en el conducto inguinal: criptorquidia", "que_se_ve": "Diapositiva de texto con caso clínico y 4 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un niño de 1 año ingresa en la clínica pediátrica porque sus padres no le palpan los testículos en el escroto. El pediatra explora al niño y le palpa los testículos en el conducto inguinal. ¿Cuál de los siguientes términos describe esta alteración?", "opciones": [{"letra": "a", "texto": "Seudohermafroditismo.", "correcta": false, "razon": "Genitales externos discordantes con las gónadas (p. ej., 46XY con testículos y genitales femeninos por insensibilidad a andrógenos); aquí hay testículos y un niño fenotípicamente normal."}, {"letra": "b", "texto": "Hermafroditismo verdadero.", "correcta": false, "razon": "Presencia simultánea de tejido testicular y ovárico (ovotestis); rarísimo y no se define por la posición del testículo."}, {"letra": "c", "texto": "Criptorquidia.", "correcta": true, "razon": "Testículo no descendido: se detuvo en su trayecto (abdominal, inguinal —el más frecuente— o prepúbico) y no ha llegado al escroto al año de vida. Palpable en el conducto inguinal = criptorquidia inguinal."}, {"letra": "d", "texto": "Hiperplasia suprarrenal congénita.", "correcta": false, "razon": "Déficit de 21-hidroxilasa con exceso de andrógenos suprarrenales: virilización de niñas (seudohermafroditismo femenino) y pérdida salina; no explica testículos inguinales."}], "respuesta": "c", "razonamiento": "El testículo se forma en el retroperitoneo (L2) y desciende guiado por el gubernáculo: fase transabdominal hasta el anillo inguinal profundo (hasta la semana 25-28) y fase inguinoescrotal por el conducto inguinal hasta el escroto (semanas 28-35), acompañado del proceso vaginal del peritoneo. Si el descenso se detiene, el testículo queda en abdomen, conducto inguinal (70 %) o raíz del escroto = CRIPTORQUIDIA (3 % de recién nacidos a término, 1 % al año; la mayoría desciende espontáneamente en los primeros 6 meses). Se trata con orquidopexia antes de los 12-18 meses porque la temperatura abdominal daña la espermatogénesis (infertilidad) y aumenta el riesgo de tumor germinal (también en el testículo contralateral) y de torsión. Distinguir del testículo retráctil (reflejo cremastérico exagerado, baja con maniobras) y del ectópico (fuera del trayecto normal: perineal, femoral, púbico)."}, "examen": [], "pack": "Descenso testicular: gubernáculo (ligamento escrotal en el adulto), proceso vaginal (túnica vaginal; si persiste: hernia inguinal indirecta congénita / hidrocele comunicante), fases transabdominal (INSL3) e inguinoescrotal (andrógenos, n. genitofemoral). Las cubiertas del cordón derivan de la pared abdominal: fascia espermática externa (oblicuo externo), cremáster (oblicuo interno), fascia espermática interna (transversalis).", "trampa": "Criptorquidia vs testículo retráctil (normal, baja al escroto) vs ectópico. El testículo criptorquídico tiene MÁS riesgo de tumor aunque se opere.", "prioridad": 1}, {"key": "R3G-p21", "pagina": 21, "item": 20, "tipo": "identifica", "titulo": "Corte transversal del cuerpo del pene, pieza real (Rohen-Yokochi): fascias, paquete dorsal, cuerpos cavernosos y esponjoso", "que_se_ve": "Fotografía de un corte transversal del cuerpo del pene (Rohen): arriba (dorso) la piel, las fascias y el paquete neurovascular dorsal (v. dorsal profunda impar en el centro, aa. dorsales a los lados); en el centro los dos cuerpos cavernosos rodeados por la gruesa túnica albugínea y separados por el tabique, cada uno con su a. profunda; abajo (ventral) el cuerpo esponjoso con la luz estrellada de la uretra esponjosa. Rosas: 27, 28, 30 (izda), 31, 32, 12, 26, 11, 34 (arriba dcha); en negro: 29, 30 (dcha), 33, 34 (abajo izda).", "etiquetas": [{"n": "27", "nombre": "Piel del pene", "rosa": true, "seguro": true, "nota": "Fina, sin grasa, muy móvil; ← aa. pudendas EXTERNAS (femoral); linfa → inguinales superficiales."}, {"n": "28", "nombre": "Vena dorsal profunda del pene", "rosa": true, "seguro": true, "nota": "ÚNICA, en la línea media, BAJO la fascia de Buck; drena cuerpos cavernosos y glande → pasa bajo el ligamento arqueado del pubis → plexo venoso prostático (Santorini) → v. ilíaca interna."}, {"n": "29", "nombre": "Arteria dorsal del pene (par, a cada lado de la vena dorsal profunda)", "rosa": false, "seguro": true, "nota": "Rama terminal de la a. pudenda interna; bajo Buck; irriga glande, prepucio y piel (M26 P12a: 'bajo la fascia superficial' era falso). Más lateral aún, el n. dorsal del pene (pudendo)."}, {"n": "30", "nombre": "Túnica albugínea del cuerpo cavernoso (señalada a ambos lados)", "rosa": true, "seguro": true, "nota": "Gruesa (2 mm), blanca, inextensible: rigidez y mecanismo venooclusivo de la erección; su rotura = fractura de pene (M26 P3)."}, {"n": "31", "nombre": "Tabique del pene (septum pectiniforme) entre ambos cuerpos cavernosos", "rosa": true, "seguro": true, "nota": "Incompleto en el cuerpo (pectiniforme: deja comunicar ambos cavernosos); completo en la raíz."}, {"n": "32", "nombre": "Arteria profunda del pene (a. cavernosa)", "rosa": true, "seguro": true, "nota": "Central en cada cuerpo cavernoso; da las aa. helicinas a los sinusoides (erección, parasimpático S2-S4, diana del sildenafil). ← a. pudenda interna."}, {"n": "12", "nombre": "Cuerpo cavernoso del pene", "rosa": true, "seguro": true, "nota": "Par, dorsal; tejido eréctil trabecular; sus raíces son los pilares (crura) sobre las ramas isquiopubianas (M26 P12c: 'pilares del cuerpo esponjoso' era falso)."}, {"n": "26", "nombre": "Uretra esponjosa (luz estrellada dentro del cuerpo esponjoso)", "rosa": true, "seguro": true, "nota": "15 cm; glándulas de Littré; ← a. del bulbo y a. uretral (pudenda interna); linfa → inguinales profundos."}, {"n": "11", "nombre": "Cuerpo esponjoso del pene", "rosa": true, "seguro": true, "nota": "Impar, ventral; albugínea fina (no comprime la uretra en erección); bulbo detrás, glande delante."}, {"n": "34", "nombre": "Fascia profunda del pene (fascia de Buck)", "rosa": true, "seguro": false, "nota": "Señalada dos veces: arriba a la derecha (rosa) inmediatamente superficial al paquete dorsal profundo, y abajo a la izquierda (negro) envolviendo el cuerpo esponjoso. Engloba los tres cuerpos eréctiles y el paquete dorsal profundo. Alternativa: túnica albugínea del cuerpo esponjoso en la marca inferior."}, {"n": "33", "nombre": "Fascia superficial del pene (dartos peneano / tela subcutánea)", "rosa": false, "seguro": false, "nota": "Capa laxa entre piel y Buck, por donde va la v. dorsal SUPERFICIAL (→ v. pudenda externa → safena magna). Alternativa: fascia de Buck si 34 inferior fuera la albugínea del esponjoso."}], "pregunta": {"enunciado": "Identifica las estructuras", "opciones": [], "respuesta": "", "razonamiento": "De fuera adentro en el dorso: 27 piel → 33 fascia superficial (dartos; contiene la v. dorsal superficial, no marcada) → 34 fascia profunda de Buck → bajo Buck el paquete dorsal: 28 v. dorsal profunda (impar, central) con 29 aa. dorsales a cada lado (y los nn. dorsales más laterales) → 30 túnica albugínea de los 12 cuerpos cavernosos, unidos por el 31 tabique pectiniforme, cada uno con su 32 a. profunda central. Ventralmente el 11 cuerpo esponjoso, de albugínea fina, rodea la 26 uretra esponjosa (luz estrellada). Buck rodea los tres cuerpos como una vaina común: por eso un hematoma por fractura de pene con Buck íntegra queda confinado al pene ('berenjena') y si Buck se rompe la sangre difunde por la fascia de Colles a escroto y periné ('alas de mariposa') — M26 P3."}, "examen": [{"examen": "mayo 2026", "pregunta": "P3", "imagen": 0, "clave": "b", "que_pregunto": "Sin imagen pero con este molde: traumatismo peneano, señale la FALSA → b) decía que un hematoma confinado al pene indica rotura de Buck (falso: Buck ÍNTEGRA lo confina; rota = difusión a escroto/periné en alas de mariposa). Ciertas: dolor intenso con chasquido y detumescencia; sangrado contenido bajo Buck.", "img_key": ""}, {"examen": "mayo 2026", "pregunta": "P12", "imagen": 0, "clave": "b", "que_pregunto": "Sin imagen: a) 'bajo la fascia superficial van las aa. dorsales' = falsa (bajo la superficial solo la v. dorsal SUPERFICIAL; el paquete profundo va bajo Buck) — exactamente la capa 33 vs 34 de esta lámina.", "img_key": ""}], "pack": "Irrigación del pene: a. pudenda interna ← a. ilíaca interna → a. profunda (helicinas, erección), a. dorsal (glande, piel, prepucio; bajo Buck), a. del bulbo (bulbo, uretra esponjosa, Cowper) y a. uretral; piel y túnicas superficiales ← aa. pudendas EXTERNAS ← femoral. Venas: v. dorsal PROFUNDA (bajo Buck, impar) → plexo prostático → ilíaca interna; v. dorsal SUPERFICIAL (sobre Buck, en el dartos) → v. pudenda externa → safena magna/femoral; vv. profundas de los cavernosos → vv. pudendas internas. Linfa: piel/prepucio → inguinales superficiales; glande y uretra esponjosa → inguinales profundos (y ilíacos internos). Nervios: n. dorsal del pene (pudendo, sensitivo, bajo Buck, lateral a las arterias); nn. cavernosos (parasimpático S2-S4 del plexo prostático → erección); simpático L1-L2 → eyaculación.", "trampa": "V. dorsal PROFUNDA (única, bajo Buck, → Santorini/ilíaca interna) vs SUPERFICIAL (sobre Buck, → pudenda externa/femoral); 'aa. dorsales bajo la fascia superficial'; 'a. profunda en el dorso' (está DENTRO del cavernoso); 'hematoma confinado = Buck rota'; 'pilares del cuerpo esponjoso'.", "prioridad": 3}]}, "S10": {"fuente": "S10", "titulo": "Seminario S10 · Anatomía radiológica del aparato urinario (Rx GU I)", "resumen_examen": "Es la fuente nº 1 del examen de mayo 2026: 7 de las 21 imágenes del anexo salieron literalmente de este PDF (img 1 = p6 eco renal, img 2 = p18 angio-TC coronal, img 3 = p21 urografía, img 4 = p8 eco vesical, img 5 = p24 uretrografía ♂, img 6 = p27 cistouretrografía ♀, img 16 = collage de p3+p4+p7+S11 p4) y una octava (img 17, arterias segmentarias) es la versión atlas de la p15. Con ellas Bermúdez pregunta siempre lo mismo: (1) emparejar letras A-E con la estructura, (2) colgar de la estructura protagonista su irrigación/drenaje venoso/relación (arteria detrás de la vena, uréter detrás del deferente y de la uterina, plexo vesical → ilíaca interna + plexos vertebrales por vv. sacras, uretra ♀ ← pudenda INTERNA) y (3) el formato 'A y B correctas' / 'todas falsas'. Páginas que todavía NO han caído y son candidatas calientes: p13-14 (UroTAC: fases, 'mejor fase para tumores = nefrográfica', litos en fase simple, VR/MPR/MIP), p11-12 (Rx simple de abdomen con leyenda; la img 10 de enero era de atlas externo y ésta es la del profe), p9 (fórmula del volumen vesical), p16-17 (angio-TC con arterias renales accesorias), p20 (fases de la urografía IV) y p23 (esquema uretra anterior/posterior con verumontanum y Cowper).", "paginas": [{"key": "S10-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada · Anatomía Radiológica Aparato Urinario S10 (Bermúdez)", "prioridad": 0}, {"key": "S10-p02", "pagina": 2, "item": null, "tipo": "omitir", "titulo": "Índice (ultrasonografía renal/vesical · Rx simple · UroTAC · arteriografía · angio-TC · urografía · uretrografía ♂/♀ · gammagrafía)", "prioridad": 0}, {"key": "S10-p03", "pagina": 3, "item": null, "tipo": "tecnica", "titulo": "Técnica de ecografía renal: riñón DERECHO", "que_se_ve": "Dos fotos clínicas de un varón en decúbito supino con toalla sobre la pelvis; el explorador apoya el transductor convexo en el flanco/hipocondrio derecho, en posición subcostal-intercostal (plano longitudinal-oblicuo). Es la foto A de la imagen 16 del examen de mayo.", "etiquetas": [{"n": "título", "nombre": "RIÑÓN DERECHO", "rosa": false, "seguro": true, "nota": "Sin números: la pregunta es sobre la vía de acceso, no sobre estructuras."}], "examen": [{"examen": "mayo 2026", "pregunta": "P21", "imagen": 16, "clave": "d", "que_pregunto": "Collage de 4 fotos de técnica (A = esta foto, riñón dcho; B = p4 riñón izdo; C = p7 vejiga suprapúbica; D = S11 p4 próstata transrectal). Opciones a/b decían que A y B ven el riñón en plano 'transversal' (falso: la sonda va longitudinal al eje renal, oblicua bajo el reborde costal); c decía que C ve la vejiga en 'longitudinal' (Bermúdez la dio por falsa); la correcta d: la vía D (transrectal) ve la próstata con MAYOR RESOLUCIÓN que la vía C (suprapúbica).", "img_key": "mayo-16"}], "pack": "Riñón derecho: se explora con el HÍGADO como ventana acústica (paciente en supino o decúbito lateral izquierdo, sonda de 3-5 MHz subcostal/intercostal, inspiración mantenida para bajar el riñón). Relaciones que se ven en la misma ventana: receso hepatorrenal (Morrison, el espacio más declive del supramesocólico en supino), flexura cólica derecha y D2 por delante. Vascular: a. renal dcha ← aorta (L1-L2), más larga, pasa POR DETRÁS de la VCI; v. renal dcha corta → VCI directamente (la v. gonadal dcha va a la VCI, no a la renal).", "trampa": "Decir que la sonda en flanco 've el riñón en plano transversal' (la exploración básica es longitudinal, siguiendo el eje mayor oblicuo del riñón) o intercambiar las ventanas: hígado = riñón DERECHO, bazo = riñón IZQUIERDO.", "prioridad": 3}, {"key": "S10-p04", "pagina": 4, "item": null, "tipo": "tecnica", "titulo": "Técnica de ecografía renal: riñón IZQUIERDO", "que_se_ve": "Dos fotos clínicas: el mismo varón en decúbito lateral derecho (o supino girado), el explorador de bata azul coloca la sonda en el flanco izquierdo, más posterior e intercostal que en el lado derecho. Es la foto B de la imagen 16 del examen de mayo.", "etiquetas": [{"n": "título", "nombre": "RIÑÓN IZQUIERDO", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P21", "imagen": 16, "clave": "d", "que_pregunto": "Foto B del collage. La opción b ('la vía B permite visualizar el riñón izdo en un plano transversal') era falsa; la correcta fue d (transrectal > suprapúbica para la próstata).", "img_key": "mayo-16"}], "pack": "Riñón izquierdo: más alto que el derecho (T11-L2 frente a T12-L3) y más difícil de ver porque el BAZO es una ventana peor que el hígado y el gas del colon descendente/estómago se interpone → se explora por vía posterolateral/intercostal con el paciente en decúbito lateral derecho. Relaciones anteriores: bazo, cola de páncreas, estómago, flexura cólica izquierda y yeyuno. Vascular: v. renal izda LARGA, cruza por DELANTE de la aorta bajo la AMS (pinza aortomesentérica, síndrome del cascanueces) y recibe la v. gonadal izda y la v. suprarrenal izda; a. renal izda más corta, nace algo más arriba.", "trampa": "Colar el bazo entre las relaciones del riñón derecho (M26 P18 d) o afirmar plano 'transversal' para la vía B. Recordar también que el riñón izquierdo está MÁS ALTO.", "prioridad": 3}, {"key": "S10-p05", "pagina": 5, "item": null, "tipo": "imagen", "titulo": "Ecografía renal normal: corteza, pirámides, seno renal (CEC), cálices y pelvis", "que_se_ve": "Dos ecografías renales longitudinales en escala de grises con las estructuras rotuladas. Izquierda: corteza (hipoecoica/isoecoica, periférica), pirámides renales (hipoecoicas, triangulares, flechas) y el centro del elipse renal = seno renal (hiperecogénico, delimitado con línea discontinua). Derecha: 'aspecto normal en un paciente hidratado' con cálices y pelvis renal ligeramente distendidos (anecoicos) dentro del seno.", "etiquetas": [{"n": "Corteza", "nombre": "Corteza renal (hipo/isoecoica respecto al hígado; contiene los corpúsculos renales y las columnas de Bertin entre pirámides)", "rosa": false, "seguro": true}, {"n": "Pirámides renales", "nombre": "Pirámides de Malpighi (médula, hipoecoicas, vértice = papila hacia el cáliz menor)", "rosa": false, "seguro": true}, {"n": "CEC", "nombre": "Centro del elipse renal = SENO RENAL: vasos, tejido conectivo, GRASA del seno y pelvis renal (hiperecogénico)", "rosa": false, "seguro": true, "nota": "Texto literal de la opción a de M26 P1: 'la estructura D está formada por vasos, tejido conectivo, adiposo y la pelvis renal'."}, {"n": "Cálices", "nombre": "Cálices menores/mayores (anecoicos si hay hidratación o ectasia)", "rosa": false, "seguro": true}, {"n": "Pelvis renal", "nombre": "Pelvis renal (anecoica, en el seno; se continúa con el uréter en la unión pieloureteral)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P1", "imagen": 1, "clave": "c", "que_pregunto": "La placa del examen fue la de p6, pero la definición del seno renal de la opción a ('vasos, tejido conectivo, adiposo y la pelvis renal') es el texto literal de ESTA página. a y b eran ciertas → c.", "img_key": "mayo-01"}], "pack": "Patrón ecográfico normal: corteza isoecoica o algo hipoecoica respecto al hígado (si es más ecogénica = nefropatía), pirámides hipoecoicas (no confundir con quistes/hidronefrosis), seno hiperecogénico por la GRASA. Contenido del seno = pelvis, cálices, vasos segmentarios/interlobares, linfáticos, nervios y grasa. Hilio de delante a atrás: Vena → Arteria → Pelvis/uréter (VAP). Tamaño normal 10-12 cm de eje mayor; diferencia >1,5 cm entre riñones = patológico.", "trampa": "Preguntar de qué está formado el seno renal cambiando un componente (p. ej. 'cápsula fibrosa' o 'columnas de Bertin' en vez de grasa/pelvis) o rotular una pirámide hipoecoica como 'cáliz dilatado'.", "prioridad": 3}, {"key": "S10-p06", "pagina": 6, "item": null, "tipo": "imagen", "titulo": "Ecografía renal derecha (Toshiba): modo B + Doppler color (LA IMAGEN 1 DEL EXAMEN DE MAYO)", "que_se_ve": "Pantalla de ecógrafo Toshiba 'ABDOMEN' con dos paneles del riñón derecho en corte longitudinal a través del hígado: izquierda modo B (hígado arriba-izquierda como ventana, línea fina de la interfase = receso hepatorrenal de Morrison, riñón con corteza periférica y seno central hiperecogénico), derecha el mismo corte con Doppler color mostrando el árbol arterial intrarrenal (segmentarias → interlobares → arqueadas) en rojo/amarillo. El examen añadió letras: A hígado, B receso de Morrison, C corteza renal, D seno renal.", "etiquetas": [{"n": "A", "nombre": "Hígado (ventana acústica del riñón derecho)", "rosa": true, "seguro": true, "nota": "Letras añadidas por el profesor en el anexo del examen, no impresas en la diapo."}, {"n": "B", "nombre": "Receso hepatorrenal (bolsa de Morrison): interfase hígado-riñón, lugar más declive del abdomen supramesocólico en decúbito supino (líquido libre)", "rosa": true, "seguro": true}, {"n": "C", "nombre": "Corteza renal", "rosa": true, "seguro": true}, {"n": "D", "nombre": "Seno renal (vasos + tejido conectivo + grasa + pelvis renal)", "rosa": true, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P1", "imagen": 1, "clave": "c", "que_pregunto": "Señale la correcta: a) img 1: A hígado, B Morrison, C corteza, D seno renal, formado por vasos, conectivo, grasa y pelvis (CIERTA); b) img 17: A a. segmentaria superior, B anterosuperior, C anteroinferior, D inferior (CIERTA); c) a y b correctas ← CLAVE; d) todas falsas.", "img_key": "mayo-01"}], "pack": "Riñón: a. renal ← aorta (L1-L2) → rama prepiélica (4 segmentarias: superior, anterosuperior, anteroinferior, inferior) + rama retropiélica (segmentaria posterior, única) → interlobares (en las columnas de Bertin) → arqueadas (base de las pirámides, lo que el Doppler pinta en arco) → interlobulillares → aferentes. Venas: v. renal (delante de la arteria) → VCI; la izquierda recibe gonadal y suprarrenal. Linfa → nodos lumbares (aórticos laterales/cavales). Inervación: plexo renal (simpático T10-L1 — dolor referido a lumbar/inguinal — y vago).", "trampa": "Bermúdez enlaza DOS imágenes en una pregunta (img 1 + img 17): hay que validar ambas para elegir 'a y b correctas'. Confundir Morrison (hepatorrenal, derecha) con el receso esplenorrenal (izquierda).", "prioridad": 3}, {"key": "S10-p07", "pagina": 7, "item": null, "tipo": "tecnica", "titulo": "Técnica de ecografía vesical: vía suprapúbica", "que_se_ve": "Dos fotos clínicas 'Vejiga': el transductor convexo se apoya en el hipogastrio justo por encima de la sínfisis del pubis, con el paciente en decúbito supino y la vejiga llena (izquierda: corte transversal; derecha: sonda en la línea media sobre el pubis, inclinada hacia la pelvis, corte longitudinal/sagital). Es la foto C de la imagen 16 del examen de mayo.", "etiquetas": [{"n": "título", "nombre": "Vejiga — vía suprapúbica (transabdominal)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P21", "imagen": 16, "clave": "d", "que_pregunto": "Foto C del collage: la opción c ('la vía C permite visualizar la vejiga en plano longitudinal') no fue la clave; la correcta fue d: la vía D (transrectal, S11 p4) ve la próstata con mayor resolución que la vía C (suprapúbica). Nota: en el JSON del banco la razón de la opción c dice 'foto inguino-escrotal en bipedestación', pero la verificación visual (hojas-imagenes) identifica C con ESTA foto suprapúbica; quédate con: suprapúbica = menos resolución para próstata.", "img_key": "mayo-16"}], "pack": "Vía suprapúbica: sonda de baja frecuencia (3-5 MHz) que atraviesa pared abdominal y vejiga LLENA (ventana acústica anecoica) → permite ver vejiga, próstata (base), vesículas seminales, útero/ovarios; menor resolución para la próstata que la vía transrectal (7-10 MHz, solo la pared del recto entre medio). Relaciones que se atraviesan: piel, línea alba/rectos, fascia transversalis, espacio prevesical de Retzius (extraperitoneal), pared vesical.", "trampa": "Preguntar qué vía da MÁS resolución para la próstata (transrectal) o afirmar que la suprapúbica necesita la vejiga vacía (falso: llena).", "prioridad": 3}, {"key": "S10-p08", "pagina": 8, "item": null, "tipo": "imagen", "titulo": "Ecografía vesical suprapúbica: cortes transversal y longitudinal (LA IMAGEN 4 DEL EXAMEN DE MAYO)", "que_se_ve": "Dos ecografías 'Suprapúbico' de una vejiga llena: gran estructura ANECOICA (negra) con refuerzo acústico posterior, delimitada por la pared vesical ecogénica; por encima la pared abdominal (capas ecogénicas) y por debajo/detrás la próstata o el útero y el recto. Panel izquierdo (marca 51/164): corte transversal, vejiga cuadrangular; panel derecho (158/164): corte longitudinal/sagital, vejiga alargada con el cuello hacia abajo.", "etiquetas": [{"n": "anecoica", "nombre": "Vejiga urinaria llena (orina = anecoica, ventana acústica)", "rosa": true, "seguro": true}, {"n": "A / B", "nombre": "En el examen: A = un corte y B = el otro; C se etiquetó en la pared (la opción a decía 'C = pared abdominal' y era falsa)", "rosa": true, "seguro": false, "nota": "Las letras las añadió el profesor en el anexo; no están en la diapo. El análisis de hojas-imagenes no pudo confirmar a qué apuntaba C."}], "examen": [{"examen": "mayo 2026", "pregunta": "P23", "imagen": 4, "clave": "b", "que_pregunto": "a) 'A longitudinal, B transversal, C = pared abdominal, anecoica = vejiga' (FALSA); b) la estructura anecoica drena por vv. vesicales a las ILÍACAS INTERNAS mayormente, con conexión relevante a los plexos vertebrales internos por las vv. SACRAS (CLAVE); c) el simpático contrae el detrusor y relaja el esfínter interno (FALSA, es el parasimpático); d) los lig. puboprostáticos/pubovesicales son los ÚNICOS que estabilizan la vejiga (FALSA: uraco y lig. vesicales laterales).", "img_key": "mayo-04"}], "pack": "Vejiga — arterial: todo ← a. ilíaca interna: aa. vesicales superiores ← a. umbilical (porción permeable) para cara superior; aa. vesicales inferiores (♂) / vaginales (♀) para fondo y cuello; ramas de obturatriz y glútea inferior. Venoso: plexo venoso vesical (comunica con el prostático de Santorini ♂ / uterovaginal ♀) → vv. vesicales → v. ILÍACA INTERNA; vía alternativa SIN válvulas: vv. sacras → plexos venosos vertebrales internos (Batson, que Bermúdez describe sin epónimo) → metástasis vertebrales sin filtro pulmonar. Linfa → ilíacos externos (sobre todo), internos y sacros. Inervación: PARASIMPÁTICO S2-S4 (nn. esplácnicos pélvicos) contrae detrusor + relaja esfínter interno = micción; SIMPÁTICO T11-L2 (n. hipogástrico) relaja detrusor + contrae esfínter interno = llenado/continencia; esfínter externo estriado ← n. pudendo. Fijación: lig. pubovesicales (♀)/puboprostáticos (♂) medial y lateral, uraco (lig. umbilical medio), lig. vesicales laterales, en ♂ el lig. rectovesical.", "trampa": "Invertir simpático/parasimpático; 'únicos ligamentos'; y dar por rara la conexión con los plexos vertebrales (es la CLAVE). Volumen: profundidad × ancho × altura × 0,5 (p9).", "prioridad": 3}, {"key": "S10-p09", "pagina": 9, "item": null, "tipo": "imagen", "titulo": "Ecografía vesical: medición del volumen (fórmula del elipsoide)", "que_se_ve": "'Medición de volumen': dos ecografías suprapúbicas de vejiga llena. Panel A (transversal): calibres A (profundidad, anteroposterior) y B (ancho, transverso) y flechas a los 'Iliac vessels' (vasos ilíacos, anecoicos, laterales a la vejiga). Panel B (longitudinal): calibre A = 'Bladder height' (altura craneocaudal). Fórmula en rojo: PROFUNDIDAD × ANCHO × ALTURA × 0,5.", "etiquetas": [{"n": "Iliac vessels", "nombre": "Vasos ilíacos (a./v. ilíacas externas/internas), estructuras anecoicas tubulares laterales a la vejiga en el corte transversal", "rosa": false, "seguro": true}, {"n": "Bladder length (A) & width (B)", "nombre": "Profundidad (A, anteroposterior) y anchura (B, transversal) de la vejiga en el corte transversal", "rosa": false, "seguro": true}, {"n": "Bladder height (A)", "nombre": "Altura de la vejiga (craneocaudal) en el corte longitudinal", "rosa": false, "seguro": true}, {"n": "fórmula", "nombre": "Volumen vesical ≈ profundidad × ancho × altura × 0,5 (coeficiente del elipsoide 0,52)", "rosa": true, "seguro": true, "nota": "Sirve para residuo postmiccional (>100 mL = retención significativa)."}], "pack": "Relaciones de la vejiga que aparecen en el corte transversal: lateralmente los vasos ilíacos y los mm. obturadores/elevador del ano; por detrás en ♂ vesículas seminales, ampollas deferenciales y recto (fondo de saco rectovesical); en ♀ útero y vagina (fondo de saco vesicouterino). Los uréteres entran por los ángulos posterolaterales del trígono en trayecto oblicuo intramural (mecanismo antirreflujo).", "trampa": "Preguntar la fórmula del volumen (multiplicador 0,5) o qué son las estructuras anecoicas laterales (vasos ilíacos, no uréteres dilatados).", "prioridad": 2}, {"key": "S10-p10", "pagina": 10, "item": null, "tipo": "imagen", "titulo": "Ecografía vesical con Doppler color: chorro ureteral (jet) en el trígono", "que_se_ve": "Tres ecografías suprapúbicas longitudinales oblicuas (sonda C4-1, 2.25 MHz Doppler) de una vejiga llena: en la superior derecha aparece una mancha de color rojo-naranja junto a la pared posteroinferior de la vejiga = jet ureteral (entrada intermitente de orina desde el orificio ureteral hacia la luz, detectable por Doppler); los otros dos paneles son el mismo corte sin jet.", "etiquetas": [{"n": "jet", "nombre": "Chorro (jet) ureteral en el orificio ureteral del trígono vesical — signo de permeabilidad del uréter (su ausencia sugiere obstrucción)", "rosa": false, "seguro": true}, {"n": "pared posterior", "nombre": "Pared posteroinferior de la vejiga (trígono, entre los dos orificios ureterales y el orificio uretral interno)", "rosa": false, "seguro": true}], "pack": "Trígono vesical (Lieutaud): mucosa lisa, sin pliegues, entre los 2 orificios ureterales (unidos por el pliegue interureteral) y el orificio uretral interno; deriva del mesodermo (conductos de Wolff), a diferencia del resto (endodermo del seno urogenital). Porción intramural del uréter = 3.º estrechamiento ureteral y mecanismo valvular antirreflujo. Irrigación del trígono/base ← aa. vesicales inferiores; inervación sensitiva muy rica (dolor/urgencia).", "trampa": "Preguntar qué representa la señal Doppler (jet ureteral = uréter permeable) o dónde desembocan los uréteres (ángulos posterolaterales del trígono, trayecto oblicuo).", "prioridad": 1}, {"key": "S10-p11", "pagina": 11, "item": null, "tipo": "imagen", "titulo": "Radiografía simple de abdomen normal (supino) con leyenda 1-13", "que_se_ve": "Rx simple de abdomen AP en decúbito supino con 13 números rojos y su leyenda impresa: esqueleto (costillas, T12, sacro, sacroilíacas, crestas y cabezas femorales), gas digestivo (cámara gástrica, ángulos esplénico y hepático, transverso, sigmoides, moteado cecal) y la línea del psoas.", "etiquetas": [{"n": "1", "nombre": "Costillas 11", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Cuerpo vertebral (T12)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Aire en cámara gástrica (fundus, bajo el hemidiafragma izdo)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Gas en el colon (ángulo esplénico)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Gas en el colon transverso", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Gas en el colon sigmoides", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Hueso sacro", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Articulación sacroilíaca", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Cabeza femoral", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Moteado cecal (heces con gas en el ciego, fosa ilíaca dcha)", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Cresta ilíaca", "rosa": false, "seguro": true}, {"n": "12", "nombre": "Gas en el colon (ángulo hepático)", "rosa": false, "seguro": true}, {"n": "13", "nombre": "Línea del psoas (borde lateral del m. psoas mayor, desde T12-L1 hasta la pelvis)", "rosa": false, "seguro": true, "nota": "Su borramiento = líquido/masa retroperitoneal, absceso, hematoma."}], "examen": [{"examen": "enero 2026", "pregunta": "(imagen 10, sin pregunta en la permutación transcrita — reserva)", "imagen": 10, "clave": "—", "que_pregunto": "En enero apareció una Rx simple de abdomen AP con letras A-D de un atlas externo (no del campus). La versión del profesor es ESTA página + p12: preparar qué letra es cámara gástrica / psoas / ciego / siluetas renales.", "img_key": "enero-10"}], "pack": "Estructuras del aparato urinario visibles en la Rx simple: siluetas renales (T12-L3, izquierda algo más alta, eje oblicuo paralelo al psoas), línea del psoas (el uréter desciende sobre él, cruzando las apófisis transversas lumbares → trayecto de los cálculos ureterales: punta de las transversas, articulación sacroilíaca, espina ciática = los 3 estrechamientos), vejiga como densidad de agua en la pelvis. Un 90 % de las litiasis urinarias son radiopacas (oxalato/fosfato cálcico); las de ácido úrico son radiotransparentes.", "trampa": "Preguntar la línea del psoas o 'aire en cámara gástrica' con la letra cambiada; confundir el moteado cecal (derecha) con el sigma (izquierda).", "prioridad": 2}, {"key": "S10-p12", "pagina": 12, "item": null, "tipo": "imagen", "titulo": "Radiografía simple de abdomen con contornos: hígado, siluetas renales y línea del psoas (leyenda 1-9)", "que_se_ve": "Misma Rx simple de abdomen AP repetida: izquierda sin marcas; derecha con contornos dibujados (verde = borde del hígado, rosa = siluetas renales derecha e izquierda, blanco discontinuo = líneas del psoas) y leyenda 1-9.", "etiquetas": [{"n": "1", "nombre": "Columna vertebral lumbar", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Las últimas costillas (11.ª-12.ª)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Ilion (alas ilíacas)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Sacro", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Cóccix", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Hígado (borde inferior, contorno verde)", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Riñón derecho (silueta rosa, más bajo)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Riñón izquierdo (silueta rosa, más alto)", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Línea del psoas (bilateral)", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "(imagen 10, reserva)", "imagen": 10, "clave": "—", "que_pregunto": "Misma situación que p11: la Rx simple del examen de enero era de atlas externo; ésta es la del profesor y es candidata.", "img_key": "enero-10"}], "pack": "Riñón derecho más bajo por el hígado (T12-L3) y riñón izquierdo más alto (T11-L2); ambos retroperitoneales, en la celda renal formada por las dos hojas de la FASCIA renal (Gerota anterior, Zuckerkandl posterior), con grasa perirrenal dentro y pararrenal fuera; polos superiores más mediales y posteriores (eje oblicuo). Cara posterior sobre diafragma, psoas, cuadrado lumbar y transverso; los nn. subcostal, iliohipogástrico e ilioinguinal cruzan por detrás.", "trampa": "'El riñón derecho está más alto' (falso); 'celda renal = 2 hojas de la cápsula' (falso: fascia).", "prioridad": 2}, {"key": "S10-p13", "pagina": 13, "item": null, "tipo": "tecnica", "titulo": "UroTAC: indicaciones y las 4 fases (simple, corticomedular, nefrográfica, excretora)", "que_se_ve": "Arriba: 'INDICACIONES: litiasis (uropatía obstructiva), tumores renales y vesicales, trauma, malformaciones congénitas' (↑ sensibilidad, ↑ especificidad). Fila de 4 TC coronales del riñón: A fase simple (previo a contraste), B corticomedular (arterial tardía 30-40 s, corteza muy brillante y médula oscura), C nefrográfica (100-120 s, riñón homogéneo), D excretora (>2 min, contraste blanco en cálices/pelvis). Bocadillos: A = 'fase para observar litos (hiperdensos)'; C = 'mejor fase para valorar tumores renales'. Abajo, las 4 fases en cortes axiales.", "etiquetas": [{"n": "A", "nombre": "Fase simple (sin contraste): litiasis = hiperdensa. Detecta cálculos radiotransparentes en Rx (ácido úrico)", "rosa": true, "seguro": true}, {"n": "B", "nombre": "Fase corticomedular (arterial tardía, 30-40 s): corteza realzada, médula no → diferenciación corticomedular", "rosa": false, "seguro": true}, {"n": "C", "nombre": "Fase nefrográfica (100-120 s): realce homogéneo del parénquima → MEJOR fase para tumores renales (masa hipocaptante)", "rosa": true, "seguro": true}, {"n": "D", "nombre": "Fase excretora (tardía, >2 min): contraste en cálices, pelvis, uréteres y vejiga → urotelio", "rosa": false, "seguro": true}], "pack": "Lo que se ve en cada fase: en la nefrográfica la corteza (glomérulos + túbulos contorneados) y la médula (pirámides con asas de Henle y colectores) se igualan; en la excretora el contraste filtrado dibuja cálices menores (con la papila que se imprime como cúpula), cálices mayores, pelvis y uréter — anatomía equivalente a la urografía pero en 3D. Contraste yodado i.v. → filtración glomerular → excreción: la fase excretora presupone función renal.", "trampa": "Pregunta directa esperable: '¿qué fase es la mejor para tumores renales?' → NEFROGRÁFICA (no la arterial/corticomedular); '¿en qué fase se ven los litos?' → SIMPLE. Confundir los tiempos de la UroTAC (segundos/minutos) con los de la urografía IV de p20 (5/30 min).", "prioridad": 2}, {"key": "S10-p14", "pagina": 14, "item": null, "tipo": "tecnica", "titulo": "UroTAC: reconstrucciones 3D (VR, MPR, MIP) y corte axial en fase excretora", "que_se_ve": "Arriba: reconstrucción de volumen (VR) 3D de ambos riñones, uréteres y vejiga en fase excretora (3 vistas), 'útiles para valorar anatomía (malformaciones, ectasia del sistema colector o uréteres)'. Abajo izquierda: imagen multiplanar coronal (MPR) del abdomen-pelvis con flecha en un uréter; centro: proyección de máxima intensidad (MIP) coronal con pelvis, uréteres y vejiga blancos sobre la columna y la pelvis ósea; derecha: TC axial a la altura de los hilios renales en fase excretora (pelvis renales con contraste, aorta y VCI por delante de la columna).", "etiquetas": [{"n": "VR", "nombre": "Representación de volumen (Volume Rendering) 3D del sistema colector", "rosa": false, "seguro": true}, {"n": "MPR", "nombre": "Imágenes multiplanares (reconstrucción coronal a partir de los axiales); la flecha señala el uréter derecho", "rosa": false, "seguro": false}, {"n": "MIP", "nombre": "Proyección de máxima intensidad: solo los vóxeles más densos (contraste en pelvis, uréteres y vejiga)", "rosa": false, "seguro": true}, {"n": "axial", "nombre": "TC axial fase excretora: riñones con pelvis realzadas, aorta (izda) y VCI (dcha) prevertebrales, asas con gas por delante", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P18", "imagen": 2, "clave": "b", "que_pregunto": "La imagen 2 (TC coronal con letras) se atribuye a S10 p18 panel izquierdo; esta MPR coronal es la alternativa gemela. Contenido preguntado: la arteria renal (E) va POR DETRÁS de la vena renal ipsilateral.", "img_key": "mayo-02"}], "pack": "En el corte axial de los hilios (L1-L2): de delante a atrás VENA renal → ARTERIA renal → pelvis; la v. renal izda cruza por delante de la aorta y por debajo de la AMS; la a. renal dcha pasa por detrás de la VCI. Malformaciones que la VR demuestra: riñón en herradura (polos inferiores fusionados por delante de la aorta, atrapado bajo la AMI), duplicidad pieloureteral (uréter del pielón superior desemboca más medial e inferior: regla de Weigert-Meyer), uréter retrocavo, ectopia pélvica.", "trampa": "Preguntar qué reconstrucción es cada imagen (VR / MPR / MIP) o usar el axial para preguntar el orden vena-arteria-pelvis.", "prioridad": 2}, {"key": "S10-p15", "pagina": 15, "item": null, "tipo": "imagen", "titulo": "Arteriografía renal derecha (Prometheus) con leyenda 1-7: segmentarias, interlobares, arqueadas, interlobulillares", "que_se_ve": "Radiografía AP de arteriografía selectiva de la a. renal derecha (catéter por la aorta): panel izquierdo sin marcas y panel derecho con el árbol arterial dibujado y numerado 1-7 (leyenda impresa). Se ve el tronco de la a. renal desde la aorta (nivel L2, 'L II'), su división en segmentarias, y las ramas intrarrenales hasta la corteza; también el uréter derecho contorneado y la a. suprarrenal inferior naciendo del tronco renal. Versión atlas de la imagen 17 del examen (que es R1-GU p19).", "etiquetas": [{"n": "1", "nombre": "Arterias arqueadas (base de las pirámides, límite corticomedular)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Arterias interlobulillares (radiales corticales → aferentes glomerulares)", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Arterias interlobares (en las columnas renales de Bertin, entre pirámides)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Arteria suprarrenal inferior (rama de la a. renal; las otras dos suprarrenales: superior ← frénica inferior, media ← aorta)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Arteria renal derecha (← aorta a nivel L1-L2, pasa por detrás de la VCI)", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Arterias segmentarias (superior/apical, anterosuperior, anteroinferior, inferior desde la rama prepiélica; posterior desde la retropiélica)", "rosa": true, "seguro": true}, {"n": "7", "nombre": "Uréter derecho", "rosa": false, "

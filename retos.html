agen": 10, "clave": "d", "que_pregunto": "La placa del examen fue p19 (etiquetada) = R2-GU p17; esta p20 es la versión sin rótulos. Si la usa, pedirá el mismo etiquetado fondo/endometrio/cuerpo/cérvix + irrigación triple.", "img_key": "mayo-10"}], "pack": "Idéntico a p19: a. uterina (ilíaca interna) + a. del lig. redondo (epigástrica inferior/ilíaca externa) + a. ovárica (aorta); plexo uterovaginal → ilíaca interna; linfa segmentaria; relaciones vejiga/Douglas/lig. ancho-uréter.", "trampa": "Confundir corte longitudinal con transversal por la forma del endometrio (curvo-alargado = longitudinal; banda corta central = transversal).", "prioridad": 2}, {"key": "S11-p21", "pagina": 21, "item": 17, "tipo": "identifica", "titulo": "Sonohisterografía: suero salino en la cavidad (endometrio normal), pólipos endometriales, hiperplasia endometrial; indicaciones y contraindicaciones", "que_se_ve": "Lámina compuesta. Arriba izq: eco transvaginal longitudinal ('LONG UTERUS') con la cavidad uterina distendida por 'Soln. salina' (anecoica) que delimita el 'Endometrio normal' (flecha amarilla). Arriba dcha: cavidad distendida con varias masas ecogénicas polipoides que protruyen = 'Pólipos endometriales' (flechas). Abajo dcha: engrosamiento difuso del endometrio = 'Hiperplasia endometrial'. Abajo centro: esquema (Uterus, Catheter, Ultrasound Probe) — catéter por el cérvix instilando suero mientras la sonda transvaginal explora. Texto: INDICACIONES: patología que afecta al endometrio — focal (pólipo, mioma submucoso) vs difusa (hiperplasia). CONTRAINDICACIONES: embarazo, menstruación, infección pélvica activa, hemorragia vaginal excesiva, pacientes con DIU.", "etiquetas": [{"n": "Soln. salina", "nombre": "Suero salino instilado por catéter transcervical que distiende la cavidad uterina (anecoico)", "rosa": false, "seguro": true}, {"n": "Endometrio normal", "nombre": "Endometrio normal: capa lisa y fina que rodea el líquido", "rosa": false, "seguro": true}, {"n": "Pólipos endometriales", "nombre": "Pólipos endometriales: masas ecogénicas pediculadas que protruyen en la cavidad (lesión FOCAL)", "rosa": false, "seguro": true}, {"n": "Hiperplasia endometrial", "nombre": "Hiperplasia endometrial: engrosamiento DIFUSO del endometrio", "rosa": false, "seguro": true}, {"n": "Catheter / Uterus / Ultrasound Probe", "nombre": "Esquema: catéter a través del canal cervical + sonda transvaginal", "rosa": false, "seguro": true}, {"n": "INDICACIONES", "nombre": "Patología del endometrio: focal (pólipo, mioma submucoso) vs difusa (hiperplasia)", "rosa": false, "seguro": true}, {"n": "CONTRAINDICACIONES", "nombre": "Embarazo · menstruación · infección pélvica activa · hemorragia vaginal excesiva · pacientes con DIU (las mismas que la HSG)", "rosa": false, "seguro": true}], "examen": [], "pack": "Anatomía que justifica la técnica: el catéter atraviesa orificio cervical externo → canal cervical (endocérvix) → orificio interno → cavidad uterina (triangular, con los dos cuernos donde se abren las trompas); el suero puede salir a la cavidad peritoneal por las trompas si son permeables (como el contraste en la HSG). Capas del útero: endometrio (basal + funcional), miometrio (la capa más gruesa; los miomas submucosos protruyen en la cavidad, intramurales, subserosos), perimetrio. Irrigación endometrial: aa. arqueadas (miometrio) → aa. radiales → aa. basales (capa basal) y aa. espirales (capa funcional, se descaman en la menstruación) — todas ramas de la a. uterina ← ilíaca interna. Vagina y fórnix: la sonda se coloca en el fórnix anterior/posterior.", "trampa": "Confundir sonohisterografía (suero + ecografía transvaginal; ve endometrio) con histerosalpingografía (contraste yodado + Rx; ve cavidad + PERMEABILIDAD tubárica). Pólipo = focal / hiperplasia = difusa (invertirlo). 'Contraindicada en infertilidad' (falso: contraindicaciones = embarazo, menstruación, infección, hemorragia, DIU).", "prioridad": 2}, {"key": "S11-p22", "pagina": 22, "item": 18, "tipo": "imagen", "titulo": "Ecografía de ovarios en la niña: 1 mes, 6 años y 11 años (flechas = folículos) — transabdominal", "que_se_ve": "Tres ecos transabdominales (vejiga llena como ventana, arriba) sobre fondo morado-rojo. 'OVARIO Niña de 1 mes — flechas: folículos' (ovario pequeño con microquistes por estímulo hormonal materno); 'OVARIO Niña de 6 años' (ovario en reposo, sin folículos visibles, pequeño detrás de la vejiga); 'OVARIO Niña de 11 años' (ovario mayor con folículos anecoicos, inicio puberal). Familia de la imagen 8 del examen (ovario con folículos).", "etiquetas": [{"n": "1 mes", "nombre": "Ovario neonatal con folículos (flechas) — microquistes por estrógenos maternos/pico de gonadotropinas ('minipubertad')", "rosa": false, "seguro": true}, {"n": "6 años", "nombre": "Ovario prepuberal en reposo, pequeño (< 1-2 cc), sin folículos visibles", "rosa": false, "seguro": true}, {"n": "11 años", "nombre": "Ovario peripuberal con varios folículos anecoicos (flechas), volumen creciente", "rosa": false, "seguro": true}, {"n": "vejiga", "nombre": "Vejiga llena (banda anecoica superior) = ventana acústica transabdominal en la niña", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P29 (misma familia)", "imagen": 8, "clave": "b", "que_pregunto": "La placa literal fue R2-GU p19 (ovario transvaginal con folículos; gemela de p23 abajo). Aquí el ovario se ve en niñas por vía transabdominal — un buen distractor 'la imagen es transabdominal' SÍ sería verdad en esta lámina pero NO en la del examen.", "img_key": "mayo-08"}], "pack": "OVARIO: a. ovárica ← aorta (bajo las renales), llega por el lig. SUSPENSORIO (infundíbulo-pélvico) + rama ovárica de la a. uterina (por el lig. propio) → anastomosis útero-ovárica. Venoso: plexo pampiniforme → v. ovárica izda → v. renal izda; dcha → VCI. Linfa → lumboaórticos (L1-L2). Inervación: plexo ovárico (T10-T11) → dolor referido periumbilical (como el testículo). Fijación: lig. suspensorio (pared pélvica, vasos), lig. propio/úteroovárico (cuerno uterino), mesoovario (lig. ancho), lig. infundíbulo-ovárico/fimbria ovárica (trompa). Fosa ovárica de Krause (nulípara): límite anterior/superior vasos ilíacos EXTERNOS, posterior uréter + ilíaca INTERNA, techo lig. umbilical obliterado; la multípara lo tiene más bajo (fosa de Claudius). Volumen: 10 cc reproductiva, 6 cc postmenopausia; en la niña < 1-3 cc.", "trampa": "Ilíacos externos/internos intercambiados en la fosa de Krause (M26 P29a); 'v. ovárica izda → VCI'; 'linfa ovárica → inguinal'; transabdominal ↔ transvaginal según la placa.", "prioridad": 2}, {"key": "S11-p23", "pagina": 23, "item": 19, "tipo": "identifica", "titulo": "Ecografía de ovarios: ovario derecho por vía transabdominal (junto al útero) vs ambos ovarios transvaginales con folículos = familia de la imagen 8 del examen (R2-GU p19)", "que_se_ve": "Arriba izq: eco transabdominal — vejiga anecoica en V; bajo ella 'Right ovary during transabdominal ultrasound' (flecha) medido con calipers, y a la derecha el 'Uterus' (masa hipoecoica mayor). Abajo dcha: eco transvaginal (sector con marcador arriba), dos paneles con el ovario derecho e izquierdo mostrando múltiples folículos anecoicos redondeados en la periferia (patrón 'collar de perlas'/ovario en edad reproductiva) — misma iconografía que la imagen 8.", "etiquetas": [{"n": "Right ovary", "nombre": "Ovario derecho visto por vía transabdominal (pequeño, poco definido, detrás de la vejiga)", "rosa": false, "seguro": true}, {"n": "Uterus", "nombre": "Útero (medial al ovario, hipoecoico)", "rosa": false, "seguro": true}, {"n": "A", "nombre": "Ovario con folículos (panel transvaginal) — letra A del examen (img 8)", "rosa": true, "seguro": true}, {"n": "B", "nombre": "Folículo ovárico anecoico (letra B del examen / rosa de R2-GU p19)", "rosa": true, "seguro": false, "nota": "data_A: 'A = ovario, B = folículo'. En esta diapo no hay letras impresas."}, {"n": "vejiga", "nombre": "Vejiga llena (transabdominal, arriba)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P29", "imagen": 8, "clave": "b", "que_pregunto": "a) 'fosa de Krause: límite posterior uréter + ilíacos EXTERNOS' → falsa (internos). b) CORRECTA: A se fija a la pelvis por el lig. suspensorio, al útero por el lig. propio y a la trompa por el lig. infundíbulo-ovárico. c) 'es una eco TRANSABDOMINAL' → falsa (transvaginal: folículos nítidos, sonda en sector cerca del ovario). d) todas → falsa.", "img_key": "mayo-08"}], "pack": "FIJACIÓN del ovario (la clave b): lig. SUSPENSORIO del ovario (infundíbulo-pélvico: pared lateral de la pelvis → ovario, contiene vasos ováricos, linfáticos y plexo ovárico) · lig. PROPIO del ovario (úteroovárico: ovario → cuerno uterino, detrás y debajo de la trompa, dentro del lig. ancho) · lig. INFUNDÍBULO-OVÁRICO / fimbria ovárica (infundíbulo de la trompa → ovario) · mesoovario (al lig. ancho, hoja posterior). IRRIGACIÓN: a. ovárica ← aorta + r. ovárica de la a. uterina. VENOSO: v. ovárica izda → renal izda; dcha → VCI. LINFA: lumboaórticos. Fosa de Krause (nulípara): delante ilíaca externa, detrás uréter + ilíaca interna, techo lig. umbilical obliterado; suelo a. umbilical/obturador. Diferencia transabdominal (arriba: ovario mal definido, vejiga llena) vs transvaginal (abajo: folículos nítidos).", "trampa": "Ilíacos externos ↔ internos (Krause); 'transabdominal' cuando es transvaginal; 'lig. suspensorio va al útero' (va a la pared pélvica); 'lig. propio contiene los vasos ováricos' (los lleva el suspensorio).", "prioridad": 3}, {"key": "S11-p24", "pagina": 24, "item": 20, "tipo": "identifica", "titulo": "Ecografía mamaria ETIQUETADA: dermis, grasa subcutánea, ligamento de Cooper, tejido fibroglandular, grasa retromamaria, músculo pectoral", "que_se_ve": "Eco de mama con sonda lineal, en escala de grises, con capas horizontales de superficie a profundidad rotuladas: Dermis (línea ecogénica superior), Grasa subcutánea (hipoecoica, atravesada por líneas ecogénicas curvas = Ligamento de Cooper), Tejido fibroglandular (banda ecogénica media), Grasa retromamaria (hipoecoica) y Músculo pectoral (bandas fibrilares profundas). Candidata fuerte: no ha caído nunca y la mama entró en mayo (img 21 Netter sagital y img 13 mamografía).", "etiquetas": [{"n": "Dermis", "nombre": "Dermis/piel: línea ecogénica más superficial (2-3 mm)", "rosa": false, "seguro": true}, {"n": "Grasa subcutánea", "nombre": "Grasa subcutánea (premamaria), hipoecoica, entre la piel y la glándula", "rosa": false, "seguro": true}, {"n": "Ligamento de Cooper", "nombre": "Ligamentos suspensorios de Cooper: tabiques fibrosos ecogénicos que van de la fascia superficial/dermis a la fascia pectoral atravesando la grasa (su retracción tumoral → 'piel de naranja'/retracción cutánea)", "rosa": false, "seguro": true}, {"n": "Tejido fibroglandular", "nombre": "Parénquima mamario (15-20 lóbulos → conductos galactóforos → seno lactífero → pezón) + estroma, banda ecogénica media", "rosa": false, "seguro": true}, {"n": "Grasa retromamaria", "nombre": "Grasa retromamaria: entre la glándula y la fascia del pectoral mayor (espacio retromamario de Chassaignac, permite el deslizamiento; la fijación a este plano = tumor avanzado)", "rosa": false, "seguro": true}, {"n": "Músculo pectoral", "nombre": "Músculo pectoral mayor (bandas fibrilares profundas); debajo, pectoral menor y costillas", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P4 (fuente Seminari Mama; contenido compartido)", "imagen": 21, "clave": "a", "que_pregunto": "La img 21 fue la lámina Netter sagital de mama del Seminari_Mama con letras A-E (abordaje por el surco submamario, Cooper, fascia pectoral, niveles de Berg, perforantes de la mamaria interna). Esta eco de S11 es la misma anatomía en capas y el hueco caliente para preguntar 'zonas premamaria / mamaria / retromamaria' (también img 13 mamografía, reserva).", "img_key": "mayo-21"}], "pack": "CAPAS: piel → grasa subcutánea/premamaria con ligamentos de Cooper → glándula (tejido fibroglandular, cola axilar de Spence) → grasa retromamaria → fascia pectoral → pectoral mayor → pectoral menor → serrato anterior/costillas. IRRIGACIÓN: ramas perforantes de la a. torácica interna (mamaria interna) ← subclavia (≈ 60 %, 2ª-4ª intercostales, cuadrantes internos) + ramas mamarias laterales de la a. torácica lateral ← axilar (+ a. toracoacromial) + ramas perforantes de las aa. intercostales posteriores 3ª-5ª ← aorta. VENOSO: vv. homónimas → torácica interna y axilar; plexo venoso subareolar (Haller); anastomosis con vv. intercostales → plexos vertebrales (Batson) → metástasis vertebrales. LINFA: ≈ 75 % → axilares (niveles de Berg I lateral, II detrás, III medial al pectoral MENOR; ganglio de Rotter interpectoral; ganglio centinela), resto → paraesternales/mamaria interna (cuadrantes internos) y contralateral/abdominal (vía Gerota subdiafragmática). INERVACIÓN: ramas cutáneas anteriores y laterales de nn. intercostales 2º-6º (T4 = pezón); n. intercostobraquial (T2) en la axila; n. torácico largo (serrato, escápula alada) y toracodorsal (dorsal ancho) en riesgo en la linfadenectomía.", "trampa": "'Cooper une la glándula al pectoral MENOR' (a la fascia del pectoral mayor/dermis); mamaria interna 'rama de la axilar' (es de la subclavia); niveles de Berg respecto al pectoral MAYOR (es el menor); 'linfa principal → paraesternal' (axilar 75 %).", "prioridad": 2}, {"key": "S11-p25", "pagina": 25, "item": 21, "tipo": "teoria", "titulo": "Histerosalpingografía: esquema de instilación de contraste hidrosoluble por cánula cervical; indicaciones y contraindicaciones", "que_se_ve": "Ilustración 3D (Merck / Julio Herrero): útero seccionado en coronal con la cavidad triangular, trompa derecha con ampolla e infundíbulo/fimbrias abrazando el ovario; por la vagina/cérvix entra una cánula con jeringa. Texto: 'Instilación de medio de contraste hidrosoluble'. INDICACIONES: estudios de infertilidad (negrita), abortos recurrentes, incompetencia cervical, masas en cavidad uterina, malformaciones müllerianas. CONTRAINDICACIONES: embarazo, menstruación, infección pélvica activa, hemorragia vaginal excesiva, pacientes con DIU.", "etiquetas": [{"n": "cánula", "nombre": "Cánula/catéter cervical con jeringa: instila contraste yodado HIDROSOLUBLE a través del orificio cervical externo", "rosa": false, "seguro": true}, {"n": "cavidad", "nombre": "Cavidad uterina triangular (base arriba = fondo con los dos cuernos; vértice abajo = orificio interno → canal cervical)", "rosa": false, "seguro": true}, {"n": "trompa", "nombre": "Trompa uterina: porción intramural → istmo → ampolla → infundíbulo con fimbrias (la fimbria ovárica se fija al ovario)", "rosa": false, "seguro": true}, {"n": "ovario", "nombre": "Ovario abrazado por el infundíbulo", "rosa": false, "seguro": true}, {"n": "INDICACIONES", "nombre": "Infertilidad (principal) · abortos recurrentes · incompetencia cervical · masas en cavidad uterina · malformaciones müllerianas (útero bicorne, septo, didelfo)", "rosa": false, "seguro": true}, {"n": "CONTRAINDICACIONES", "nombre": "Embarazo · menstruación · infección pélvica activa · hemorragia vaginal excesiva · DIU", "rosa": false, "seguro": true}], "examen": [], "pack": "La HSG es una radiografía con contraste: demuestra cavidad uterina y PERMEABILIDAD tubárica (paso de contraste al peritoneo = prueba de Cotte positiva). Recorrido del contraste = vía del espermatozoide: vagina → orificio cervical externo → canal cervical → orificio interno → cavidad → ostium uterino de la trompa → porción intramural (1 cm, la más estrecha) → istmo → ampolla (la más ancha y larga, lugar de la fecundación y del embarazo ectópico más frecuente) → infundíbulo → ostium abdominal → cavidad peritoneal (única comunicación del peritoneo con el exterior en la mujer → salpingitis/peritonitis). Malformaciones müllerianas: los conductos paramesonéfricos (Müller) forman trompas, útero y 2/3 superiores de la vagina; fallo de fusión → útero bicorne/didelfo; fallo de reabsorción del tabique → útero septo.", "trampa": "Contraste 'liposoluble' (hidrosoluble, moderno); 'contraindicada en infertilidad' (es la indicación principal); confundir con sonohisterografía (suero + eco). Embarazo ectópico 'más frecuente en el istmo' (ampolla).", "prioridad": 2}, {"key": "S11-p26", "pagina": 26, "item": 22, "tipo": "identifica", "titulo": "Histerosalpingografía ETIQUETADA: cavidad uterina, canal cervical, zonas de la trompa (intramural, istmo, ámpula, infundíbulo), peritoneo; mioma submucoso (defecto de llenado) y espéculo", "que_se_ve": "Izq: HSG con el contraste dibujando la cavidad uterina triangular (blanca) y el canal cervical hacia abajo; de cada cuerno sale la trompa, rotulada en verde por zonas: Intramural (intersticial), Istmo, Ámpula, Infundíbulo; contraste libre en la pelvis rotulado 'Peritoneo' (= trompas permeables). Dcha: HSG con un 'Defecto de llenado negativo: Mioma submucoso' (imagen redondeada radiolúcida dentro de la cavidad) y 'Espéculo vaginal' (radiopaco abajo). Mismo texto de indicaciones/contraindicaciones que p25.", "etiquetas": [{"n": "Cavidad uterina", "nombre": "Cavidad uterina (triángulo de contraste; base = fondo con cuernos, vértice = orificio interno)", "rosa": false, "seguro": true, "nota": "Letra B de la img 9 del examen."}, {"n": "Canal cervical", "nombre": "Canal cervical (endocérvix, línea de contraste vertical bajo la cavidad; pliegues palmeados)", "rosa": false, "seguro": true}, {"n": "Intramural (intersticial)", "nombre": "Porción intramural/intersticial de la trompa: atraviesa la pared uterina, 1 cm, la más estrecha", "rosa": false, "seguro": true}, {"n": "Istmo", "nombre": "Istmo tubárico: porción medial recta y fina (2-3 cm), pared gruesa", "rosa": false, "seguro": true}, {"n": "Ámpula", "nombre": "Ampolla: porción más larga (5-8 cm) y ancha, tortuosa; lugar de la FECUNDACIÓN y del ectópico más frecuente", "rosa": false, "seguro": true}, {"n": "Infundíbulo", "nombre": "Infundíbulo: extremo lateral en embudo con las fimbrias, se abre a la cavidad peritoneal (ostium abdominal)", "rosa": false, "seguro": true}, {"n": "Peritoneo", "nombre": "Contraste libre en la cavidad peritoneal = trompa PERMEABLE (prueba de Cotte)", "rosa": false, "seguro": true, "nota": "Letra C de la img 9 del examen ('contraste libre en la pelvis')."}, {"n": "Defecto de llenado negativo: Mioma submucoso", "nombre": "Imagen radiolúcida redondeada dentro de la cavidad = mioma submucoso (también pólipo) que desplaza el contraste", "rosa": false, "seguro": true}, {"n": "Espéculo vaginal", "nombre": "Espéculo radiopaco en la vagina durante la instilación", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P32", "imagen": 9, "clave": "c", "que_pregunto": "La placa del examen fue p27 izq (sin rótulos); ésta es la versión etiquetada (y R2-GU p4 la de círculos). a) 'A = trompa de EUSTAQUIO izda' → falsa por epónimo (Falopio). b) 'A posee su meso por debajo del borde superior' → falsa para el profe (trompa + mesosálpinx FORMAN el borde superior libre del lig. ancho). c) CORRECTA: drenaje venoso de la trompa → vv. ováricas + plexo uterovaginal. d) todas → falsa.", "img_key": "mayo-09"}], "pack": "TROMPA (de Falopio; 10-12 cm): zonas de medial a lateral intramural → istmo → ampolla → infundíbulo/fimbrias. Meso = MESOSÁLPINX (parte del lig. ancho); la trompa corre por el borde superior libre del lig. ancho. IRRIGACIÓN doble anastomosada: r. tubárica de la a. UTERINA (← ilíaca interna, medial, por el mesosálpinx) + r. tubárica de la a. OVÁRICA (← aorta, lateral) — 'solamente la uterina' = falso (M26 P31). VENOSO doble (clave c): → vv. OVÁRICAS (lateral; izda → renal izda, dcha → VCI) + → plexo UTEROVAGINAL → v. ilíaca interna (medial). LINFA: con el ovario → lumboaórticos. INERVACIÓN: plexo ovárico + uterovaginal (T10-L2 simpático; S2-S4 parasimpático). Peritoneo: el infundíbulo se abre a la cavidad peritoneal (comunicación exterior-peritoneo exclusiva de la mujer). Ligadura tubárica = istmo.", "trampa": "Epónimo cruzado Eustaquio/Falopio (M26 P32a); 'solamente' en la irrigación (M26 P31); intercambiar el orden de las zonas (istmo lateral a la ampolla); 'fecundación en el istmo'; drenaje venoso 'solo a la ilíaca interna'.", "prioridad": 3}, {"key": "S11-p27", "pagina": 27, "item": 23, "tipo": "identifica", "titulo": "Histerosalpingografía, dos placas sin rótulos — la izquierda es la imagen 9 del examen de mayo (A trompa, B cavidad uterina, C contraste libre)", "que_se_ve": "Izq (placa circular, = img 9): cavidad uterina triangular blanca en el centro de la pelvis, cánula/espéculo por debajo, ambas trompas finas y tortuosas saliendo de los cuernos hacia lateral, con contraste que sale por los infundíbulos y se deposita en la pelvis (trompas permeables); se ven los huesos ilíacos y el sacro. Dcha: otra HSG con cavidad uterina y canal cervical en 'reloj de arena', trompas permeables con derrame peritoneal bilateral abundante (contraste rodeando el ovario). Icono de altavoz (vídeo/audio en el pptx original).", "etiquetas": [{"n": "A", "nombre": "Trompa uterina (de FALOPIO) — la del examen era la 'izda' según la opción a", "rosa": true, "seguro": true, "nota": "Letras de la img 9 del examen (placa izq)."}, {"n": "B", "nombre": "Cavidad uterina (triángulo de contraste)", "rosa": true, "seguro": true}, {"n": "C", "nombre": "Contraste libre en la pelvis/cavidad peritoneal (trompas permeables, Cotte +)", "rosa": true, "seguro": true}, {"n": "cánula", "nombre": "Cánula cervical / espéculo radiopaco bajo el útero", "rosa": false, "seguro": true}, {"n": "dcha", "nombre": "Segunda HSG: cavidad + canal cervical + trompas permeables con derrame peritoneal bilateral", "rosa": false, "seguro": true}, {"n": "hueso", "nombre": "Marco óseo: alas ilíacas, sacro, sínfisis del pubis (referencias de la Rx de pelvis)", "rosa": false, "seguro": true}], "examen": [{"examen": "mayo 2026", "pregunta": "P32", "imagen": 9, "clave": "c", "que_pregunto": "Placa literal. Correcta c: drenaje venoso de A (trompa) → vv. ováricas + plexo uterovaginal. Trampas: a) 'trompa de Eustaquio'; b) 'meso por debajo del borde superior'; d) todas.", "img_key": "mayo-09"}], "pack": "Idéntico a p26: trompa — irrigación doble (r. tubárica de la uterina ← ilíaca interna + r. tubárica de la ovárica ← aorta), venoso doble (vv. ováricas + plexo uterovaginal → ilíaca interna), linfa lumboaórtica, mesosálpinx en el borde superior del lig. ancho, zonas intramural-istmo-ampolla-infundíbulo. ÚTERO (B): a. uterina + lig. redondo + ovárica; plexo uterovaginal; linfa segmentaria. PERITONEO (C): el contraste sale por el ostium abdominal del infundíbulo y se acumula en el fondo de saco rectouterino de Douglas (el más declive en bipedestación).", "trampa": "Preguntar 'qué demuestra el contraste libre' (permeabilidad tubárica, NO perforación); lateralidad de la trompa en la placa (la derecha de la paciente está a la izquierda de la imagen); epónimo Eustaquio/Falopio.", "prioridad": 3}]}, "S7": {"fuente": "S7", "titulo": "Seminario S7 · Anatomía por técnicas de imagen I (dientes, glándulas salivares, esófago, estómago-duodeno, Rx simple de abdomen)", "resumen_examen": "Fuente de peso alto en el bloque digestivo: en enero 2026 salieron de aquí 4 de las 20 imágenes del anexo (img 1 = ortopantomografía p3 → P63 clave d; img 3 = las dos sialografías de la fila inferior de p6 → P64 clave a; img 4 = las 3 fotos de posición de sonda de p8-p10 → P65 clave c; y la img 7 esofagograma sale del Reto 1 p16-17 pero se explica con la lámina p12 → P69 clave c). Bermúdez pregunta con estas láminas INERVACIÓN (V2/V3, XII), RELACIONES de las glándulas (carótida externa dentro de la parótida, Wharton con lingual/hipogloso), TÉCNICA (qué posición de sonda ve qué) y los ESTRECHAMIENTOS esofágicos. Páginas que aún no han caído y son candidatas: p14-p15 (tránsito gastroduodenal con leyenda 1-16, gemelo del S8 p11 que sí cayó como img 9/15) y p16-p17 (Rx simple de abdomen con leyenda 1-13 / 1-20; la img 10 de enero era una Rx simple externa con letras A-D → P73 palpación). Las 4 imágenes de 2026 repetirán casi seguro (el profe clona).", "paginas": [{"key": "S7-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada — Seminario S7, Anatomía por técnicas de imagen I", "prioridad": 0}, {"key": "S7-p02", "pagina": 2, "item": null, "tipo": "tecnica", "titulo": "Dientes · equipo de ortopantomografía (radiografía panorámica)", "que_se_ve": "Dos fotos: paciente con delantal plomado de pie en el ortopantomógrafo (el tubo y el detector giran alrededor de la cabeza) y detalle del posicionamiento con láseres de alineación (plano de Frankfort horizontal, línea media sagital) y mordedor entre los incisivos.", "etiquetas": [], "examen": [], "pack": "Ortopantomografía = radiografía panorámica extraoral: tubo y receptor rotan alrededor del paciente en un plano tomográfico curvo que sigue las arcadas. Ventaja: en una sola placa ambas arcadas, ATM, senos maxilares, conducto mandibular. Limitación: es una proyección 'desplegada' → el lado DERECHO del paciente queda a la IZQUIERDA de la placa (marcada R/L), hay magnificación y superposición en la línea media (columna cervical). Para caries finas se usan periapicales/aleta de mordida (p3 izquierda).", "trampa": "Preguntar por lateralidad: en la panorámica la mitad derecha de la placa es el lado IZQUIERDO del paciente (marca L). El mordedor entre incisivos sale como una banda radiolúcida vertical en la línea media.", "prioridad": 1}, {"key": "S7-p03", "pagina": 3, "item": null, "tipo": "identifica", "titulo": "Dientes · radiografía periapical de un primer premolar (1-12) + ortopantomografía de adulto con leyenda (1-10) y numeración FDI", "que_se_ve": "Izquierda: radiografía periapical (aleta) de un primer premolar inferior con esquema y leyenda 1-12 (partes del diente y del periodonto). Derecha: ortopantomografía de adulto (marcas R/L) sin y con esquema; leyenda 1-10 de estructuras óseas vecinas y los dientes numerados con el sistema de dos dígitos de la FDI (cuadrantes 1 sup dcho, 2 sup izdo, 3 inf izdo, 4 inf dcho; 11-18, 21-28, 31-38, 41-48). ESTA es la panorámica de la IMAGEN 1 de enero 2026 (con letras A-E sobre dientes).", "etiquetas": [{"n": "Rx-1", "nombre": "Espacio del ligamento periodontal", "rosa": false, "seguro": true}, {"n": "Rx-2", "nombre": "Lámina dura (cortical alveolar)", "rosa": false, "seguro": true}, {"n": "Rx-3", "nombre": "Tabique interalveolar", "rosa": false, "seguro": true}, {"n": "Rx-4", "nombre": "Tabique interradicular", "rosa": false, "seguro": true}, {"n": "Rx-5", "nombre": "Esmalte", "rosa": false, "seguro": true}, {"n": "Rx-6", "nombre": "Dentina", "rosa": false, "seguro": true}, {"n": "Rx-7", "nombre": "Corona", "rosa": false, "seguro": true}, {"n": "Rx-8", "nombre": "Cuello", "rosa": false, "seguro": true}, {"n": "Rx-9", "nombre": "Cavidad pulpar de la corona", "rosa": false, "seguro": true}, {"n": "Rx-10", "nombre": "Conducto radicular", "rosa": false, "seguro": true}, {"n": "Rx-11", "nombre": "Raíz", "rosa": false, "seguro": true}, {"n": "Rx-12", "nombre": "Ápice de la raíz", "rosa": false, "seguro": true}, {"n": "OPG-1", "nombre": "Seno maxilar", "rosa": true, "seguro": true, "nota": "Raíces de molares/premolares superiores en relación con su suelo → sinusitis odontógena; inervación V2."}, {"n": "OPG-2", "nombre": "Paladar duro", "rosa": false, "seguro": true}, {"n": "OPG-3", "nombre": "Apófisis estiloides", "rosa": false, "seguro": true}, {"n": "OPG-4", "nombre": "Conducto mandibular", "rosa": true, "seguro": true, "nota": "Lleva el n. alveolar inferior (V3) + a. alveolar inferior → sensibilidad de TODA la arcada inferior; sale por el agujero mentoniano como n. mentoniano."}, {"n": "OPG-5", "nombre": "Asta mayor del hioides", "rosa": false, "seguro": true}, {"n": "OPG-6", "nombre": "Arco cigomático", "rosa": false, "seguro": true}, {"n": "OPG-7", "nombre": "Tubérculo articular (del temporal)", "rosa": false, "seguro": true}, {"n": "OPG-8", "nombre": "Fosa mandibular (cavidad glenoidea)", "rosa": false, "seguro": true}, {"n": "OPG-9", "nombre": "Cabeza (cóndilo) de la mandíbula", "rosa": false, "seguro": true}, {"n": "OPG-10", "nombre": "Apófisis coronoides de la mandíbula", "rosa": false, "seguro": true}, {"n": "FDI", "nombre": "Dientes numerados 11-18 / 21-28 / 31-38 / 41-48 (cuadrante + posición; 8 = tercer molar)", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P63", "imagen": 1, "clave": "d", "img_key": "enero-01", "que_pregunto": "Ortopantomografía con letras A-E; 'caries en la estructura B' (molar SUPERIOR izquierdo — mitad derecha de la placa = lado izdo del paciente) → ¿qué nervios duelen? Clave d: ramos alveolares superiores, rama del n. MAXILAR (V2). Distractores: n. facial (motor, no sensibilidad dental), alveolares inferiores (arcada inferior), mandibular (V3 = arcada inferior)."}], "pack": "Arcada SUPERIOR: ramos alveolares superiores posteriores/medio/anteriores ← n. maxilar (V2) → plexo dental superior; irrigación a. alveolar superior posterior e infraorbitaria ← a. maxilar. Arcada INFERIOR: n. alveolar inferior ← n. mandibular (V3) por el conducto mandibular (OPG-4) → n. mentoniano; a. alveolar inferior ← a. maxilar. Linfa dientes/encías → submandibulares (y submentonianos los incisivos inferiores) → cervicales profundos. El VII NO da sensibilidad dental (motor mímico + gusto por cuerda del tímpano).", "trampa": "V2 arriba / V3 abajo; invertir el lado por la marca R/L; colar el n. facial como sensitivo dental. Si la letra cae en la ARCADA INFERIOR la respuesta pasa a ser alveolar inferior (V3).", "prioridad": 3}, {"key": "S7-p04", "pagina": 4, "item": null, "tipo": "imagen", "titulo": "Dientes · ortopantomografías patológicas (implantes, prótesis, coronas) y caries interproximal (A-D)", "que_se_ve": "Dos panorámicas: una con ausencias dentales, implantes y coronas metálicas radiopacas; otra con rehabilitación protésica extensa (coronas, implantes, barra). Abajo, montaje A-D: A foto de molar aparentemente sano; B radiografía de aleta de mordida con flechas señalando caries interproximales radiolúcidas; C y D el mismo molar abierto mostrando la cavidad de caries (D con pulpa expuesta y sangrado).", "etiquetas": [{"n": "A", "nombre": "Molar con superficie oclusal aparentemente sana", "rosa": false, "seguro": true}, {"n": "B", "nombre": "Aleta de mordida: caries interproximales (flechas) — la radiografía detecta lo que la inspección no ve", "rosa": false, "seguro": true}, {"n": "C", "nombre": "Cavidad de caries abierta (dentina)", "rosa": false, "seguro": true}, {"n": "D", "nombre": "Caries profunda con exposición/hemorragia pulpar", "rosa": false, "seguro": true}], "examen": [], "pack": "Material metálico (implantes de titanio, coronas, amalgama) = muy radiopaco (blanco). Caries = radiolucencia (negro) en esmalte/dentina, típicamente interproximal bajo el punto de contacto; se ve mejor en aleta de mordida que en panorámica. Pulpitis → dolor por V2 (superior) o V3 (inferior).", "trampa": "Usar este tipo de imagen para volver a preguntar la inervación (misma lógica que P63) o pedir qué es una imagen radiopaca artificial.", "prioridad": 1}, {"key": "S7-p05", "pagina": 5, "item": null, "tipo": "tecnica", "titulo": "Glándulas salivares · canulación del conducto de Wharton (sialografía: técnica)", "que_se_ve": "Fotos clínicas: canulación del conducto submandibular con catéter intravenoso 22G en el suelo de la boca (carúncula sublingual, a ambos lados del frenillo) y dilatación con sonda del conducto de Wharton de la glándula submandibular.", "etiquetas": [{"n": "A", "nombre": "Canulación del conducto con catéter IV 22G en la carúncula sublingual", "rosa": false, "seguro": true}, {"n": "B", "nombre": "Dilatación con sonda del conducto de Wharton (submandibular)", "rosa": false, "seguro": true}], "examen": [], "pack": "Sialografía = inyección de contraste yodado por el orificio del conducto y Rx. Conducto de WHARTON (submandibular, ~5 cm): sale de la prolongación profunda de la glándula, corre por el suelo de la boca sobre el milohioideo/hiogloso y desemboca en la CARÚNCULA SUBLINGUAL junto al frenillo; el n. LINGUAL lo cruza (lateral→medial, por debajo y luego por encima) y el HIPOGLOSO va por debajo. Conducto de STENSEN (parótido, ~5 cm): cruza el masetero, perfora el buccinador y se abre frente al 2º MOLAR SUPERIOR. Conductos de Rivinus/Bartholin = sublingual. Litiasis: 80-90 % en la submandibular (saliva mucosa, alcalina, conducto ascendente y largo).", "trampa": "Confundir dónde desemboca cada conducto (Wharton = carúncula junto al frenillo; Stensen = vestíbulo frente al 2º molar superior). Litiasis más frecuente = submandibular, NO parótida.", "prioridad": 2}, {"key": "S7-p06", "pagina": 6, "item": null, "tipo": "identifica", "titulo": "Glándulas salivares · esquema (parótida/submandibular/sublingual) + sialografía submandibular con leyenda 1-5 + las DOS placas de la IMAGEN 3 de enero", "que_se_ve": "Arriba izda: esquema lateral con parótida (rojo) y conducto parotídeo, submandibular (azul) y conducto submandibular, sublingual (verde) y conductos sublinguales. Arriba dcha: sialografía submandibular lateral (Weir-Abrahams) con esquema y leyenda 1-5. Abajo: dos sialografías sin leyenda — abajo-IZDA: conducto largo horizontal a la altura de la arcada dental que cruza la rama y termina en un árbol glandular detrás de la rama mandibular (patrón de conducto de STENSEN: parótida); abajo-DCHA (marcada 'A'): conducto que baja desde el suelo de la boca a una glándula situada bajo el cuerpo/ángulo mandibular delante de la columna cervical (patrón de WHARTON: submandibular). Estas dos placas de la fila inferior son las de la IMAGEN 3 del examen de enero (A = la de abajo-dcha, B = la de abajo-izda).", "etiquetas": [{"n": "Esq", "nombre": "Parotid gland / Parotid duct (Stensen) · Submandibular gland / Submandibular duct (Wharton) · Sublingual gland / Sublingual ducts (Rivinus)", "rosa": false, "seguro": true}, {"n": "1", "nombre": "Cánula (en el orificio del conducto submandibular)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Conducto submandibular (Wharton)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Medio de contraste en la boca", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Ángulo de la mandíbula", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Glándula submandibular", "rosa": true, "seguro": true}, {"n": "inf-izda", "nombre": "Sialografía PAROTÍDEA lateral: conducto de Stensen horizontal al nivel del plano oclusal cruzando la rama; glándula retromandibular", "rosa": false, "seguro": false, "nota": "Mi lectura de la placa; coincide con la clave oficial de P64 (panel B = parótida)."}, {"n": "inf-dcha (A)", "nombre": "Sialografía SUBMANDIBULAR lateral: conducto de Wharton descendiendo desde el suelo de la boca a la glándula bajo la mandíbula", "rosa": false, "seguro": false}], "examen": [{"examen": "enero 2026", "pregunta": "P64", "imagen": 3, "clave": "a", "img_key": "enero-03", "que_pregunto": "Dos sialografías apiladas (A arriba, B abajo). Clave a: 'la glándula del panel inferior (B) se relaciona con la a. carótida externa' → B = PARÓTIDA (la ACE entra en la celda y se bifurca dentro en temporal superficial + maxilar). b falsa (A no es parótida sino submandibular), c falsa (el conducto de B es Stensen, que se relaciona con ramas bucales del facial; el que se relaciona con el hipogloso es Wharton), d falsa (parasimpaticomimético = SIALORREA, no xerostomía). Nota del banco: la placa se leyó ambigua; con la lámina delante, la de abajo-izda de p6 (= panel B) es la parotídea (Stensen cruza la rama) y la de abajo-dcha (= panel A) la submandibular, así que la clave a es coherente."}], "pack": "PARÓTIDA: celda parotídea (fascia parotídea ← fascia cervical profunda); atravesada por n. FACIAL (plano superficial/profundo de parotidectomía), v. retromandibular y a. CARÓTIDA EXTERNA que se bifurca DENTRO (temporal superficial + maxilar; da auricular posterior). Irrigación: ramas de la ACE (temporal superficial, transversa de la cara). Venas → retromandibular. Linfa → parotídeos → cervicales profundos. Parasimpático: IX (n. petroso menor → ganglio ÓTICO → n. auriculotemporal). SUBMANDIBULAR: celda entre vientres del digástrico, a. y v. FACIAL en la celda (la arteria la surca por su cara profunda/superior); irrigación a. facial + submentoniana; linfa → submandibulares; parasimpático VII (cuerda del tímpano → n. lingual → ganglio SUBMANDIBULAR). SUBLINGUAL: a. sublingual (lingual) + submentoniana; mismo ganglio submandibular.", "trampa": "Identificar mal el panel (no te juegues la pregunta ahí): quédate con los 3 conceptos — ACE = parótida; Wharton = lingual/hipogloso; parasimpaticomimético = saliva. Otra trampa: 'n. facial atraviesa la submandibular' (falso: atraviesa la parótida; la submandibular la cruza la a. facial).", "prioridad": 3}, {"key": "S7-p07", "pagina": 7, "item": null, "tipo": "identifica", "titulo": "Glándulas salivares · sialografía parotídea oblicua con leyenda 1-9 + dos ortopantomografías con sialografía parotídea", "que_se_ve": "Arriba dcha: sialografía parotídea en proyección oblicua (Weir-Abrahams) con esquema y leyenda 1-9. Izda y abajo: dos ortopantomografías en las que se ha inyectado contraste en el conducto parotídeo (Stensen): se ve el conducto horizontal cruzando la rama mandibular y el árbol ductal intraglandular detrás de la rama (una en el lado izdo de la placa y otra en el lado dcho).", "etiquetas": [{"n": "1", "nombre": "Orificio del conducto parotídeo (frente al 2º molar superior)", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Cánula", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Ángulo de la mandíbula (contralateral)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Apófisis estiloides", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Apófisis mastoides", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Conducto parotídeo (Stensen)", "rosa": true, "seguro": true}, {"n": "7", "nombre": "Conductos intraglandulares (árbol ductal de la parótida)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Ángulo de la mandíbula (homolateral)", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Base de la mandíbula", "rosa": false, "seguro": true}, {"n": "OPG", "nombre": "Ortopantomografía + sialografía parotídea: Stensen cruza el masetero/rama y se ramifica en la glándula retromandibular", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P64", "imagen": 3, "clave": "a", "img_key": "enero-03", "que_pregunto": "Lámina de apoyo de la img 3: la parótida con su conducto de Stensen (la placa exacta del examen es la fila inferior de p6). Concepto preguntado: parótida ↔ a. carótida externa."}], "pack": "Conducto de STENSEN: sale del borde anterior de la parótida, cruza la cara externa del MASETERO 1 cm bajo el arco cigomático (acompañado de la a. transversa de la cara y ramas bucales del VII), se acoda en el borde anterior del masetero, perfora el BUCCINADOR y la mucosa frente al 2º molar superior. Parótida: relación con estiloides/mastoides/ECM por detrás, rama mandibular por delante; contenido: VII, v. retromandibular, ACE y bifurcación, ganglios. Saliva serosa; parasimpático IX vía ganglio ótico y auriculotemporal (síndrome de Frey tras parotidectomía).", "trampa": "Preguntar por dónde desemboca Stensen (2º molar SUPERIOR) o qué nervio atraviesa la parótida (facial, no hipogloso/lingual).", "prioridad": 3}, {"key": "S7-p08", "pagina": 8, "item": null, "tipo": "identifica", "titulo": "Glándulas salivares · ecografía de la parótida derecha: posición A (preauricular/parotídea) — Fig. 8.27", "que_se_ve": "Esquema y foto de la sonda lineal apoyada delante y debajo del pabellón auricular sobre la rama mandibular (dos posiciones: transversal inmediatamente bajo la oreja y nivel inferior). Dos pares de imágenes eco (cruda / coloreada): panel A justo bajo la oreja, panel B nivel inferior. Esta foto de posición es la 'A' de la IMAGEN 4 de enero.", "etiquetas": [{"n": "PG", "nombre": "Parotid gland — glándula parótida (morado)", "rosa": true, "seguro": true}, {"n": "LN", "nombre": "Lymph node — ganglio intraparotídeo (verde)", "rosa": false, "seguro": true}, {"n": "Mas", "nombre": "Masseter — músculo masetero", "rosa": false, "seguro": true}, {"n": "RM", "nombre": "Ramus mandible — rama de la mandíbula (línea blanca = cortical con sombra)", "rosa": false, "seguro": true}, {"n": "RmV", "nombre": "Retromandibular vein — vena retromandibular (dentro de la parótida)", "rosa": false, "seguro": true}, {"n": "ECA", "nombre": "External carotid artery — a. carótida externa (dentro de la parótida, profunda a la RmV)", "rosa": true, "seguro": true}, {"n": "Scm", "nombre": "Sternocleidomastoid — esternocleidomastoideo (posterior)", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P65", "imagen": 4, "clave": "c", "img_key": "enero-04", "que_pregunto": "Tres fotos de posición de sonda A/B/C. ¿Cuál permite ver el suelo de la boca? Clave c (posición C submentoniana). La posición A (esta página, preauricular sobre la rama) ve la PARÓTIDA: la rama mandibular y el aire oral tapan el suelo de la boca."}], "pack": "Por eco la parótida es homogénea, algo hiperecogénica respecto al músculo; el lóbulo profundo queda tras la rama y es difícil de ver (sombra ósea). Referencia para separar lóbulo superficial/profundo en eco = v. RETROMANDIBULAR (el n. facial no se ve; corre justo lateral a la vena). ACE medial/profunda a la vena. Ganglios intraparotídeos normales (la parótida se encapsula tarde en el embrión y engloba ganglios; la submandibular no).", "trampa": "Preguntar qué estructura marca el plano del facial en eco (v. retromandibular) o qué glándula tiene ganglios en su interior (parótida).", "prioridad": 3}, {"key": "S7-p09", "pagina": 9, "item": null, "tipo": "identifica", "titulo": "Glándulas salivares · ecografía de la submandibular derecha: posición B (laterocervical, bajo el cuerpo mandibular) — Fig. 8.28", "que_se_ve": "Esquema y foto de la sonda apoyada en la región submandibular, bajo el cuerpo de la mandíbula (dos posiciones: mandíbula posterior y anterior). Panel A (posterior), panel B (anterior) y panel C Doppler color de la a. facial. Esta foto de posición es la 'B' de la IMAGEN 4 de enero.", "etiquetas": [{"n": "SG", "nombre": "Submandibular gland — glándula submandibular (morado)", "rosa": true, "seguro": true}, {"n": "SD", "nombre": "Submandibular duct — conducto submandibular (Wharton), saliendo por la cara profunda", "rosa": true, "seguro": true}, {"n": "BM", "nombre": "Body mandible — cuerpo de la mandíbula (línea blanca con sombra)", "rosa": false, "seguro": true}, {"n": "Mas", "nombre": "Masseter — masetero", "rosa": false, "seguro": true}, {"n": "FaA", "nombre": "Facial artery — a. facial (surca la glándula; Doppler en C)", "rosa": false, "seguro": true}, {"n": "My", "nombre": "Mylohyoid — músculo milohioideo (separa la porción superficial de la profunda de la glándula; hace pantalla al suelo de la boca)", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P65", "imagen": 4, "clave": "c", "img_key": "enero-04", "que_pregunto": "Posición B (laterocervical submandibular) es un distractor: ve muy bien la glándula submandibular superficial y la a. facial, pero el MILOHIOIDEO hace de pantalla y el suelo de la boca queda fuera. Clave c."}], "pack": "Submandibular: porción superficial (celda submandibular, bajo el milohioideo) + prolongación profunda que se acoda sobre el borde posterior libre del MILOHIOIDEO y entra en el suelo de la boca acompañada del conducto de Wharton. Relaciones: a. facial en su cara profunda/superior (sale por su borde superior hacia la cara), v. facial superficial, n. hipogloso e n. lingual profundos (sobre hiogloso). Irrigación: facial + submentoniana; linfa: submandibulares; parasimpático VII (cuerda del tímpano → lingual → ganglio submandibular).", "trampa": "Confundir milohioideo con digástrico; decir que en B se ve la glándula sublingual (no: está por encima del milohioideo).", "prioridad": 3}, {"key": "S7-p10", "pagina": 10, "item": null, "tipo": "identifica", "titulo": "Glándulas salivares · ecografía del suelo de la boca: posición C (submentoniana, cabeza en hiperextensión) — Fig. 8.29", "que_se_ve": "Esquema y foto de la sonda apoyada transversalmente bajo el mentón con la cabeza en hiperextensión. Eco transversal del suelo de la boca 'en alas de mariposa': de superficial a profundo, vientres anteriores del digástrico, milohioideo en arco, genihioideos, geniogloso, y las glándulas sublinguales laterales; asteriscos = sombras de los cuerpos mandibulares. Esta foto es la 'C' de la IMAGEN 4 de enero (la respuesta).", "etiquetas": [{"n": "DigM", "nombre": "Digastric muscle — vientre anterior del digástrico (superficial, par)", "rosa": false, "seguro": true}, {"n": "My", "nombre": "Mylohyoid — milohioideo (diafragma oral, en arco)", "rosa": true, "seguro": true}, {"n": "Gh", "nombre": "Geniohyoid — genihioideo (par, por encima del milohioideo)", "rosa": false, "seguro": true}, {"n": "Gg", "nombre": "Genioglossus — geniogloso (par, en la línea media, el más profundo/central)", "rosa": true, "seguro": true}, {"n": "LiG", "nombre": "Lingual gland — glándula sublingual (par, lateral, morado)", "rosa": true, "seguro": true}, {"n": "*", "nombre": "Sombras acústicas de los cuerpos de la mandíbula", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P65", "imagen": 4, "clave": "c", "img_key": "enero-04", "que_pregunto": "'¿Qué posición permite la visualización del suelo de la boca y estructuras anexas?' → c: sonda en posición C (SUBMENTONIANA). Es la ventana para litiasis de Wharton, ránula y glándula sublingual."}], "pack": "Suelo de la boca de superficial a profundo: piel → platisma → digástrico (vientre anterior, V3 n. milohioideo) → MILOHIOIDEO (V3) → GENIHIOIDEO (C1 vía XII) → GENIOGLOSO (XII) y lengua. Glándula sublingual sobre el milohioideo, bajo la mucosa del pliegue sublingual, lateral al conducto de Wharton; n. lingual e hipogloso pasan medial a ella. Irrigación: a. sublingual (lingual) y submentoniana (facial). Lesión del XII → lengua desviada al lado lesionado (geniogloso).", "trampa": "Orden de las capas (milohioideo superficial al genihioideo, geniogloso el más profundo) e inervación (milohioideo V3; genihioideo C1 por el XII; geniogloso XII).", "prioridad": 3}, {"key": "S7-p11", "pagina": 11, "item": null, "tipo": "tecnica", "titulo": "Esófago · esofagograma baritado: preparación y protocolo", "que_se_ve": "Diapositiva de técnica: preparación (ayuno 8 h; contraste baritado o hidrosoluble), tabla proyección PA 120 kV / 30 mAs, 3 esófagos en AP con un trago dividido en dos, material efervescente (doble contraste), repetición en oblicuo izquierdo y 4 proyecciones del estómago (AP supino, decúbito y oblicuos). Imágenes: esófago cervical/torácico en AP, esófago en oblicuo y estómago con doble contraste.", "etiquetas": [{"n": "Prep", "nombre": "Ayuno 8 h · bario (o hidrosoluble tipo gastrografín si se sospecha perforación)", "rosa": false, "seguro": true}, {"n": "PA", "nombre": "120 kV · 30 mAs", "rosa": false, "seguro": true}, {"n": "AP", "nombre": "3 esófagos en AP con trago dividido; efervescente para doble contraste", "rosa": false, "seguro": true}, {"n": "OAI", "nombre": "3 esófagos en oblicuo izquierdo; 4 proyecciones del estómago", "rosa": false, "seguro": true}], "examen": [], "pack": "Contraste BARITADO (sulfato de bario, inerte, mejor detalle mucoso) vs HIDROSOLUBLE yodado (si hay riesgo de perforación/fístula: el bario en mediastino/peritoneo da mediastinitis/peritonitis; el yodado en vía aérea da edema pulmonar). Doble contraste = bario + gas (efervescente) → pliegues mucosos. Proyección oblicua separa el esófago de la columna y del corazón.", "trampa": "'Bario ante sospecha de perforación' (falso: hidrosoluble). El oblicuo es para despegar el esófago de la silueta cardíaca/columna.", "prioridad": 1}, {"key": "S7-p12", "pagina": 12, "item": null, "tipo": "identifica", "titulo": "Esófago · esofagograma con tercios y leyenda 1-7 (impronta del botón aórtico, hiato, diafragma)", "que_se_ve": "Tres esofagogramas baritados (AP y oblicuos) con llaves que dividen el esófago en tercios (4 superior, 5 medio, 6 inferior), flecha 7 sobre la muesca del botón aórtico en el borde izquierdo, 3 = hiato esofágico y 1 = línea del diafragma (punteada roja), 2 = estómago. Misma anatomía que la IMAGEN 7 de enero (que sale del Reto 1 p16-17, con A = estrechamiento cricofaríngeo y B = aórtico).", "etiquetas": [{"n": "1", "nombre": "Diafragma (línea punteada roja)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Estómago", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Hiato esofágico", "rosa": true, "seguro": true, "nota": "T10; tercer estrechamiento, 40 cm de los incisivos; última resistencia de la sonda nasogástrica."}, {"n": "4", "nombre": "Tercio superior (cervical + torácico alto)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Tercio medio", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Tercio inferior", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Impronta del botón aórtico (estrechamiento broncoaórtico)", "rosa": true, "seguro": true, "nota": "T4, 22,5 cm de los incisivos; por debajo el bronquio principal izdo a 27,5 cm."}], "examen": [{"examen": "enero 2026", "pregunta": "P69", "imagen": 7, "clave": "c", "img_key": "enero-07", "que_pregunto": "Esofagograma con A (arriba) y B (medio): 'el segmento B corresponde al estrechamiento aórtico' = c. Falsas: EES 'abierto en reposo' (está tónicamente cerrado), 'A delante de la tráquea' (el esófago va DETRÁS de la tráquea), 'B irrigado por a. bronquial superior' (torácico = ramas esofágicas de la aorta). La placa exacta es R1-dig p17, pero p12 es la lámina explicativa del seminario."}], "pack": "Estrechamientos: 1º CRICOFARÍNGEO/EES (C6, 15 cm, el más estrecho, cerrado en reposo) · 2º BRONCOAÓRTICO (T4 arco aórtico 22,5 cm; bronquio ppal izdo 27,5 cm) · 3º DIAFRAGMÁTICO/hiato (T10, 40 cm). Tercios: superior (cervical + torácico alto; músculo estriado), medio (mixto), inferior (liso). Irrigación: cervical ← a. tiroidea inferior (subclavia); torácico ← ramas esofágicas de la aorta + bronquiales; abdominal ← a. gástrica izda + frénica inferior izda. Venas: tiroideas inferiores / ácigos-hemiácigos / gástrica izda (porta) → anastomosis porto-cava → VARICES. Linfa: cervicales profundos / mediastínicos posteriores y traqueobronquiales / gástricos izdos-celíacos. Inervación: vago (plexo esofágico; el vago izdo pasa a anterior, el dcho a posterior) + simpático T1-T10; recurrentes en el cervical.", "trampa": "'EES abierto en reposo'; 'esófago delante de la tráquea'; olvidar que la impronta del bronquio izdo es distinta de la aórtica (misma región, 5 cm más abajo). También: aurícula izda dilatada comprime el tercio inferior (caso del reto).", "prioridad": 3}, {"key": "S7-p13", "pagina": 13, "item": null, "tipo": "imagen", "titulo": "Esófago · tres proyecciones seriadas del esofagograma torácico (sin etiquetas)", "que_se_ve": "Tres placas oblicuas del esófago torácico repleto de bario, sin leyenda: se aprecia la impronta del arco aórtico en el tercio medio, el trayecto retrocardíaco y la unión esofagogástrica por debajo del diafragma con el fundus.", "etiquetas": [], "examen": [], "pack": "Sirve para practicar: localizar en cada placa la muesca aórtica (borde izquierdo, T4), la impronta del bronquio izquierdo justo debajo, la impronta de la aurícula izquierda (tercio inferior, anterior), el hiato (T10) y el ángulo de His con el fundus. El esófago se desvía a la IZDA en el cuello, vuelve a la línea media en el tórax medio (impronta aórtica) y se desvía de nuevo a la IZDA para cruzar el hiato.", "trampa": "Preguntar qué estructura produce cada muesca (arco aórtico vs bronquio izdo vs aurícula izda) o de qué lado se desvía el esófago en cada nivel.", "prioridad": 1}, {"key": "S7-p14", "pagina": 14, "item": null, "tipo": "identifica", "titulo": "Estómago y duodeno · tránsito baritado con estómago en decúbito supino y prono (etiquetas con nombre)", "que_se_ve": "Izda: dos tránsitos gastroduodenales sin etiquetas (estómago en J con bario en cuerpo/antro; segunda placa con estómago en doble contraste). Dcha: dos placas etiquetadas — arriba en DECÚBITO SUPINO (el bario cae al fundus y el aire sube a cuerpo/antro) y abajo en DECÚBITO PRONO (aire en fundus, bario en cuerpo y antro). Etiquetas: diafragma, fundus gástrico, curvatura menor, curvatura mayor, pliegues gástricos, cuerpo, antro pilórico, píloro, bulbo duodenal.", "etiquetas": [{"n": "Diafragma", "nombre": "Cúpula diafragmática izda por encima del fundus", "rosa": false, "seguro": true}, {"n": "Fundus gástrico", "nombre": "Fundus (por encima del cardias; aire en bipedestación/prono, bario en supino)", "rosa": true, "seguro": true}, {"n": "Curvatura menor", "nombre": "Curvatura menor (borde derecho, cóncavo; omento menor; a. gástricas izda y dcha)", "rosa": true, "seguro": true}, {"n": "Curvatura mayor", "nombre": "Curvatura mayor (borde izdo, convexo; omento mayor; a. gastroomentales y cortas)", "rosa": true, "seguro": true}, {"n": "Pliegues gástricos", "nombre": "Pliegues de la mucosa (rugae), paralelos a la curvatura menor (calle gástrica/Magenstrasse)", "rosa": false, "seguro": true}, {"n": "Cuerpo", "nombre": "Cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "Antro pilórico", "nombre": "Antro pilórico", "rosa": false, "seguro": true}, {"n": "Píloro", "nombre": "Píloro (esfínter, L1 plano transpilórico)", "rosa": false, "seguro": true}, {"n": "Bulbo duodenal", "nombre": "Bulbo (casquete) duodenal = 1ª porción", "rosa": false, "seguro": true}], "examen": [], "pack": "El BARIO cae por gravedad a la parte declive: SUPINO → fundus (posterior/superior) lleno de bario y aire en antro (anterior); PRONO → aire en fundus y bario en antro/cuerpo. Irrigación del estómago (tronco celíaco): curvatura menor = a. gástrica izda (celíaco) + gástrica dcha (hepática propia/común); curvatura mayor = gastroomental izda (esplénica) + gastroomental dcha (gastroduodenal); fundus = arterias gástricas CORTAS y gástrica posterior (esplénica) — cayó en enero P74. Venas homónimas → porta (gástrica izda: varices). Linfa: 4 territorios → celíacos. Vagos: anterior (izdo, rama hepática y n. de Latarjet) y posterior (dcho, rama celíaca).", "trampa": "Preguntar en qué decúbito está el paciente por la distribución del bario (supino = bario en fundus). Irrigación del fundus = cortas (esplénica), no gástrica izda.", "prioridad": 2}, {"key": "S7-p15", "pagina": 15, "item": null, "tipo": "identifica", "titulo": "Estómago y duodeno · tránsito esofagogastroduodenal oblicuo con leyenda 1-16 + duodeno AP con leyenda 1-12 (Weir-Abrahams)", "que_se_ve": "Izda: radiografía oblicua de estómago y duodeno con doble contraste y esquema con 16 números (esófago, cardias, curvaturas, fundus, cuerpo, antro, píloro, bulbo, porciones del duodeno, yeyuno, Kerckring). Dcha: radiografía AP centrada en el duodeno con esquema de 12 números (flexura duodenoyeyunal, porciones I-IV, píloro, Kerckring, yeyuno con contracción peristáltica). Gemela del S8 p11 / R2-dig p9 que cayó como img 15 de enero (P3/P5/P9).", "etiquetas": [{"n": "A-1", "nombre": "Esófago", "rosa": false, "seguro": true}, {"n": "A-2", "nombre": "Pulmón izquierdo", "rosa": false, "seguro": true}, {"n": "A-3", "nombre": "Cardias", "rosa": false, "seguro": true}, {"n": "A-4", "nombre": "Curvatura menor del estómago", "rosa": false, "seguro": true}, {"n": "A-5", "nombre": "Antro pilórico", "rosa": false, "seguro": true}, {"n": "A-6", "nombre": "«Casquete» duodenal (bulbo) — 1ª porción", "rosa": false, "seguro": true}, {"n": "A-7", "nombre": "Orificio pilórico", "rosa": false, "seguro": true}, {"n": "A-8", "nombre": "Porción descendente del duodeno (2ª)", "rosa": true, "seguro": true, "nota": "Recibe colédoco y Wirsung en la papila mayor (Vater); retroperitoneal; delante del hilio renal dcho."}, {"n": "A-9", "nombre": "Porción horizontal del duodeno (3ª)", "rosa": true, "seguro": true, "nota": "Cruza L3 por delante de aorta/VCI y por DETRÁS de los vasos mesentéricos superiores (pinza aortomesentérica)."}, {"n": "A-10", "nombre": "Fondo (fundus) gástrico", "rosa": false, "seguro": true}, {"n": "A-11", "nombre": "Cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "A-12", "nombre": "Pliegues gástricos", "rosa": false, "seguro": true}, {"n": "A-13", "nombre": "Curvatura mayor del estómago", "rosa": false, "seguro": true}, {"n": "A-14", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "A-15", "nombre": "Porción ascendente del duodeno (4ª)", "rosa": false, "seguro": true}, {"n": "A-16", "nombre": "Pliegues circulares (de Kerckring)", "rosa": false, "seguro": true}, {"n": "B-1", "nombre": "Flexura duodenoyeyunal (ángulo de Treitz, L2 izda)", "rosa": true, "seguro": true}, {"n": "B-2", "nombre": "Porción superior del duodeno (1ª)", "rosa": false, "seguro": true}, {"n": "B-3", "nombre": "«Casquete» duodenal (bulbo)", "rosa": false, "seguro": true}, {"n": "B-4", "nombre": "Conducto pilórico", "rosa": false, "seguro": true}, {"n": "B-5", "nombre": "Porción descendente del duodeno", "rosa": false, "seguro": true}, {"n": "B-6", "nombre": "Porción horizontal del duodeno", "rosa": false, "seguro": true}, {"n": "B-7", "nombre": "Pliegues circulares (de Kerckring)", "rosa": false, "seguro": true}, {"n": "B-8", "nombre": "Cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "B-9", "nombre": "Antro pilórico", "rosa": false, "seguro": true}, {"n": "B-10", "nombre": "Yeyuno", "rosa": false, "seguro": true}, {"n": "B-11", "nombre": "Porción ascendente del duodeno", "rosa": false, "seguro": true}, {"n": "B-12", "nombre": "Contracción peristáltica en el yeyuno", "rosa": false, "seguro": true}], "examen": [{"examen": "enero 2026", "pregunta": "P3 / P5 / P9 (placa gemela: S8 p11)", "imagen": 15, "clave": "c / b / d", "img_key": "enero-15", "que_pregunto": "Con el tránsito duodeno-yeyunal gemelo preguntaron: estructura detrás de D1 = a. GASTRODUODENAL (P3 c); porciones del duodeno (P5 b); y P9 d. Esta lámina de S7 tiene la misma anatomía con leyenda completa: úsala para tapar y nombrar."}], "pack": "Duodeno (25 cm, C alrededor de la cabeza del páncreas): D1 superior (L1, intraperitoneal en su inicio = bulbo; detrás: a. gastroduodenal, colédoco, porta; úlcera posterior → sangra la gastroduodenal); D2 descendente (L1-L3, papila mayor/menor; delante: colon transverso/mesocolon; detrás: riñón dcho); D3 horizontal (L3; pinza AMS-aorta); D4 ascendente (L2 → Treitz, músculo suspensorio). Irrigación: a. pancreaticoduodenal superior (gastroduodenal ← hepática común ← celíaco) e inferior (AMS) → anastomosis celíaco-mesentérica. Venas → VMS/porta. Linfa → pancreaticoduodenales → celíacos/mesentéricos superiores. Yeyuno vs íleon: Kerckring altos y numerosos en yeyuno ('en plumas'), arcadas arteriales pocas y vasos rectos largos.", "trampa": "Confundir la porción descendente (papila) con la horizontal (pinza aortomesentérica); 'D1 intraperitoneal en toda su longitud' (solo el bulbo); a. gastroduodenal por DETRÁS de D1.", "prioridad": 2}, {"key": "S7-p16", "pagina": 16, "item": null, "tipo": "identifica", "titulo": "Abdomen · Rx simple de abdomen en decúbito supino con leyenda 1-13 (técnica + estructuras)", "que_se_ve": "Izda: dibujo del paciente en decúbito supino bajo el tubo (Rx simple de abdomen AP). Dcha: radiografía simple con 13 números en rojo y su leyenda: costillas, T12, cámara gástrica, gas cólico por segmentos, sacro, sacroilíaca, cabeza femoral, moteado cecal, cresta ilíaca, línea del psoas.", "etiquetas": [{"n": "1", "nombre": "Costillas 11 (11ª costilla)", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Cuerpo vertebral T12", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Aire en cámara gástrica (fundus, bajo el hemidiafragma izdo)", "rosa": true, "seguro": true}, {"n": "4", "nombre": "Gas en el colon (ángulo esplénico)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Gas en el colon transverso", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Gas en colon sigmoide", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Hueso sacro", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Articulación sacroilíaca", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Cabeza femoral", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Moteado cecal (heces + gas en ciego)", "rosa": true, "seguro": true}, {"n": "11", "nombre": "Cresta ilíaca (L4 = plano supracrestal)", "rosa": false, "seguro": true}, {"n": "12", "nombre": "Gas en el colon (ángulo hepático)", "rosa": false, "seguro": true}, {"n": "13", "nombre": "Línea del psoas", "rosa": true, "seguro": true, "nota": "Su borramiento sugiere líquido/proceso retroperitoneal."}], "examen": [{"examen": "enero 2026", "pregunta": "P73 (placa externa, no la del profe)", "imagen": 10, "clave": "d", "img_key": "enero-10", "que_pregunto": "Rx simple de abdomen con letras A-D preguntando por palpación/regiones: A aorta, B estómago/bazo… Esta p16 es la Rx simple del propio seminario con leyenda: candidata a repetir el formato."}], "pack": "Lectura sistemática de la Rx simple de abdomen (supino AP): huesos (columna, pelvis, costillas 11-12), líneas grasas (psoas, properitoneal/flanco), silueta de hígado/bazo/riñones, patrón gaseoso (estómago con nivel bajo hemidiafragma izdo; colon con haustras periférico, intestino delgado central con válvulas conniventes), calcificaciones (litiasis, flebolitos). Ángulo esplénico más ALTO que el hepático. Plano transpilórico L1 (píloro, hilios renales, cuello del páncreas); plano supracrestal L4 (bifurcación aórtica).", "trampa": "Preguntar por la lateralidad (cámara gástrica IZDA, ángulo hepático DCHO y más bajo), por la línea del psoas o por qué nivel es la cresta ilíaca (L4).", "prioridad": 2}, {"key": "S7-p17", "pagina": 17, "item": null, "tipo": "identifica", "titulo": "Abdomen · Rx simple de abdomen con leyenda 1-20 (Weir-Abrahams, en inglés)", "que_se_ve": "Radiografía simple de abdomen AP en supino con 20 números pequeños y lista en inglés a la izquierda: gas gástrico y duodenal, segmentos del colon, márgenes de los psoas, hígado, bazo, línea grasa properitoneal, riñones, 12ª costilla, gas en íleon y ciego.", "etiquetas": [{"n": "1", "nombre": "Gas en el fundus gástrico", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Gas en el cuerpo del estómago", "rosa": false, "seguro": true}, {"n": "3", "nombre": "Gas en la 1ª porción del duodeno (bulbo/casquete duodenal)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Colon ascendente", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Colon transverso", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Colon descendente", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Flexura hepática (cólica dcha)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Flexura esplénica (cólica izda)", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Colon sigmoide", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Recto", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Margen del psoas derecho", "rosa": true, "seguro": true}, {"n": "12", "nombre": "Margen del psoas izquierdo", "rosa": false, "seguro": true}, {"n": "13", "nombre": "Hígado (silueta)", "rosa": false, "seguro": true}, {"n": "14", "nombre": "Bazo (silueta)", "rosa": false, "seguro": true}, {"n": "15", "nombre": "Línea grasa properitoneal (del flanco)", "rosa": true, "seguro": true, "nota": "Grasa extraperitoneal entre peritoneo parietal y transverso del abdomen; su desplazamiento indica líquido libre."}, {"n": "16", "nombre": "Riñón derecho (silueta, más bajo por el hígado)", "rosa": false, "seguro": true}, {"n": "17", "nombre": "Riñón izquierdo (silueta)", "rosa": false, "seguro": true}, {"n": "18", "nombre": "12ª costilla", "rosa": false, "seguro": true}, {"n": "19", "nombre": "Gas en íleon", "rosa": false, "seguro": true}, {"n": "20", "nombre": "Gas en ciego", "rosa": false, "seguro": true}], "examen": [], "pack": "Siluetas visibles por la grasa que las rodea (perirrenal, properitoneal). Riñón dcho más bajo (hígado); polos superiores a T12 (izdo) / L1 (dcho), hilios a L1-L2; el 12º arco costal cruza el polo superior. Colon = periférico, haustras incompletas; delgado = central, válvulas conniventes que cruzan toda la luz. Ciego y sigma son los segmentos con mesenterio móvil → los que se VOLVULAN (cayó en enero P16).", "trampa": "Confundir gas cólico con gas de delgado; decir que el riñón izdo está más bajo; olvidar que el recto/sigma tienen gas en supino por ser posteriores.", "prioridad": 2}, {"key": "S7-p18", "pagina": 18, "item": null, "tipo": "imagen", "titulo": "Abdomen · Rx simple de abdomen sin etiquetas (marca D = derecha)", "que_se_ve": "Radiografía simple de abdomen AP en supino sin leyenda, marcada 'D' en el lado derecho: se ven las siluetas hepática y esplénica, ambos riñones y líneas del psoas, gas en estómago y en colon (ángulo esplénico, sigma), pelvis ósea y cabezas femorales.", "etiquetas": [], "examen": [], "pack": "Lámina de autoevaluación: aplica la lista de p16/p17 sin leyenda. Localiza hígado (hipocondrio dcho, empuja el riñón dcho hacia abajo), bazo (bajo el hemidiafragma izdo, por detrás de la cámara gástrica), líneas del psoas divergentes desde T12 hacia las crestas, gas cólico periférico, sínfisis y cabezas femorales.", "trampa": "Formato 'imagen 10 de enero': letras A-D sobre esta placa preguntando qué se palpa/qué estructura es (aorta en línea media a la izda de L4, bazo, ciego, sigma).", "prioridad": 1}]}, "S8": {"fuente": "S8", "titulo": "Seminario S8 · Anatomía por técnicas de imagen II — Rx digestivo II (vías biliopancreáticas, arteriografías celíaco/AMS/AMI, eco abdominal, tránsito intestinal, enema opaco)", "resumen_examen": "Fuente nº1 del examen de enero 2026: según F2 §3.1, 7 de las 20 imágenes (img 9, 12, 13, 14, 15, 16, 17) se atribuyen a S8, y con S7 suman 10/20 (50 %). Verificando página a página: las imágenes 12 (CPRE → p2, P80 'todas falsas'), 14 (angiografía AMS → p7, P10 'ninguna correcta'), 15 (tránsito yeyuno-íleon → p11, P3 uréter DERECHO de D2 + P9 'todas correctas'), 16 (enema opaco → p13, P16 se volvulan sigma+ciego) y 17 (enema lateral → p14, P17 'todas correctas') son LITERALMENTE las placas de S8; la imagen 13 (arteriografía celíaca, P5 C = gastroduodenal) es la lámina de S8 p5 —F2 dice 'p6' por error, p6 son las gástricas— en su versión de Reto 2 dig p15; y la imagen 9 (tránsito gastroduodenal A-F, P6 colédoco detrás de D1 + P74 fundus ← cortas) NO está en S8 (F2 la sitúa en 'S8 p12', que en realidad es la técnica del enema): es Reto 2 dig p7. Las fotos de sonda ecográfica (p9-p10) inspiran la imagen 11 (P73). Formatos: 'todas correctas/falsas' y 'ninguna correcta' tras cruzar etiquetas, relación 'detrás de', irrigación por región, lateralidad. Páginas que AÚN NO han caído y son candidatas para septiembre: p8 (angiografía AMI: Drummond, sigmoideas, rectal superior), p6 (arteriografía gástrica izda: arco de la curvatura menor), p3-p4 (pancreatografía y colangio-RM: pregunta de técnica), p12 (técnica del enema).", "paginas": [{"key": "S8-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada — Seminario S8 · Anatomía por técnicas de imagen II (Bermúdez)"}, {"key": "S8-p02", "pagina": 2, "item": 1, "tipo": "identifica", "titulo": "CPRE (colangiopancreatografía retrógrada endoscópica) — vía biliar completa (Weir-Abrahams, leyenda 1-13)", "que_se_ve": "Radiografía AP con contraste yodado inyectado a contracorriente por el endoscopio (5), cuya punta está en la 2ª porción del duodeno enfrente de la papila mayor (7). Se rellena todo el árbol biliar: hepáticos derecho (12) e izquierdo (9) que confluyen en el hepático común (2); cístico (3) hacia el cuello (10) y cuerpo de la vesícula (6); colédoco (1) descendiendo hasta la ampolla de Vater (7); y hacia la izquierda el conducto pancreático de Wirsung (11). Es LITERALMENTE la imagen 12 del examen de enero 2026 (con letras A-E en vez de números).", "etiquetas": [{"n": "1", "nombre": "Conducto colédoco (common bile duct)", "rosa": true, "seguro": true, "nota": "En el examen = segmento B: NO 'se origina bajo D1', se forma POR ENCIMA de D1 (hepático común + cístico) y desemboca en D2"}, {"n": "2", "nombre": "Conducto hepático común", "rosa": true, "seguro": true, "nota": "Segmento A del examen: se forma por la fusión de los hepáticos dcho e izdo; queda a la DERECHA de la bifurcación de la a. hepática propia"}, {"n": "3", "nombre": "Conducto cístico", "rosa": true, "seguro": true, "nota": "Válvulas espirales de Heister; forma el lado inferior del triángulo de Calot"}, {"n": "4", "nombre": "Duodeno", "rosa": false, "seguro": true, "nota": "Número impreso en la leyenda; el contraste no lo rellena (está detrás del endoscopio)"}, {"n": "5", "nombre": "Endoscopio en el duodeno (2ª porción)", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Vesícula biliar", "rosa": true, "seguro": true, "nota": "Estructura E del examen: irrigada por la a. CÍSTICA ← hepática DERECHA (75-80 %), no izquierda"}, {"n": "7", "nombre": "Ampolla hepatopancreática (de Vater) / papila mayor", "rosa": true, "seguro": true, "nota": "Pared posteromedial de D2; esfínter de Oddi"}, {"n": "8", "nombre": "Yeyuno", "rosa": false, "seguro": true, "nota": "Impreso en la leyenda, apenas visible en la placa"}, {"n": "9", "nombre": "Conducto hepático izquierdo", "rosa": true, "seguro": true, "nota": "Más largo y horizontal que el derecho"}, {"n": "10", "nombre": "Cuello de la vesícula biliar", "rosa": false, "seguro": true, "nota": "Bolsa de Hartmann = dilatación del cuello, lugar de enclavamiento de cálculos"}, {"n": "11", "nombre": "Conducto pancreático (de Wirsung)", "rosa": true, "seguro": true, "nota": "Desemboca con el colédoco en la papila mayor; Santorini en la papila menor (2 cm más arriba)"}, {"n": "12", "nombre": "Conducto hepático derecho", "rosa": true, "seguro": true}, {"n": "13", "nombre": "Estómago", "rosa": false, "seguro": true, "nota": "Impreso en la leyenda; se intuye el endoscopio atravesándolo"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P80", "imagen": 12, "clave": "d", "img_key": "enero-12", "que_pregunto": "Misma CPRE con letras A-E. a) 'el segmento A (hepático común) se sitúa a la IZDA de la bifurcación de la a. hepática propia' → falso (la vía biliar es lo más derecho y anterior del pedículo); b) 'E (vesícula) irrigada por la cística, rama de la hepática IZDA' → falso (hepática DERECHA, triángulo de Calot); c) 'el segmento B (colédoco) se origina por debajo de D1' → falso (se forma por encima de D1 y DESEMBOCA en D2). Clave d = TODAS FALSAS."}], "pack": "Vía biliar extrahepática: a. cística ← a. hepática derecha ← a. hepática propia ← a. hepática común ← tronco celíaco (T12); colédoco distal ← aa. pancreatoduodenales superiores ← a. gastroduodenal. Venas: v. cística → rama derecha de la porta (o directamente al hígado); colédoco → vv. pancreatoduodenales → porta. Linfa: ganglio cístico (de Lund/Mascagni) → hepáticos → celíacos. Inervación: plexo celíaco/hepático (simpático T7-T9, dolor referido al epigastrio-hipocondrio dcho y hombro dcho vía frénico), vago para el esfínter. Tríada del ligamento hepatoduodenal: vía biliar DERECHA-delante, a. hepática IZQUIERDA-delante, porta DETRÁS.", "trampa": "Cambiar un adjetivo de lateralidad ('hepática izquierda', 'a la izquierda de la arteria'), y 'se origina' por 'desemboca'. Con tres opciones casi verdaderas la respuesta fue 'todas falsas'. Repetirá con las mismas letras: aprende la placa entera, incluidos 9/12 (hepáticos) y 11 (Wirsung).", "prioridad": 3}, {"key": "S8-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Pancreatografía retrógrada endoscópica (Sobotta, leyenda 1-6) + CPRE sin rotular", "que_se_ve": "Izquierda: pareja de placas AP de Sobotta con el endoscopio en la porción descendente del duodeno y el conducto pancreático de Wirsung relleno de contraste cruzando la columna hacia la izquierda; el par derecho lleva la leyenda 1-6 impresa. Derecha: otra CPRE (colangiografía) SIN números: árbol biliar intrahepático, hepático común, vesícula con cístico tortuoso a la derecha, colédoco descendiendo hasta la papila y, saliendo de la papila hacia la izquierda, el conducto pancreático; el endoscopio dibuja la curva del duodeno. Placa gemela de p2 — sirve para el mismo tipo de pregunta con las letras puestas donde el profesor quiera.", "etiquetas": [{"n": "1", "nombre": "«Casquete» duodenal (bulbo, con aire)", "rosa": false, "seguro": true, "nota": "Bulbo/D1: la única porción con pliegues lisos, aparece como 'casquete' con aire"}, {"n": "2", "nombre": "Endoscopio en la porción descendente del duodeno", "rosa": false, "seguro": true, "nota": "D2: donde está la papila mayor, por eso se canula desde aquí"}, {"n": "3", "nombre": "Endoscopio en el estómago", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Cuerpo del estómago (inflado)", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Conducto pancreático (de Wirsung)", "rosa": false, "seguro": true, "nota": "Recorre el páncreas de cola a cabeza; desemboca con el colédoco en la papila mayor (Vater)"}, {"n": "6", "nombre": "Conducto pancreático accesorio (de Santorini)", "rosa": false, "seguro": true, "nota": "Drena en la papila MENOR, 2 cm craneal a la mayor, en D2"}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P80 (placa gemela)", "imagen": 12, "clave": "d", "img_key": "enero-12", "que_pregunto": "La imagen 12 del examen es la CPRE de p2; esta página es la versión pancreatográfica/sin rotular de la misma técnica. Las estructuras que preguntó (hepático común, colédoco, vesícula/cística) son identificables aquí igual."}], "pack": "Páncreas: cabeza/cuello ← arcadas pancreatoduodenales (a. PD superior ← gastroduodenal ← hepática común ← tronco celíaco; a. PD inferior ← AMS); cuerpo/cola ← ramas pancreáticas de la a. esplénica (pancreática dorsal, magna, transversa). Venas: PD → VMS/porta; esplénica recibe las del cuerpo-cola. Linfa: pancreatoduodenales, pancreatoesplénicos → celíacos y mesentéricos superiores. Inervación: plexo celíaco (dolor en cinturón, T6-T10).", "trampa": "Confundir Wirsung (papila mayor, junto al colédoco) con Santorini (papila menor, craneal); preguntar en qué porción del duodeno está el endoscopio (D2, no D1). La técnica es 'retrógrada' (contracorriente) y ENDOSCÓPICA — invasiva, con contraste yodado.", "prioridad": 2}, {"key": "S8-p04", "pagina": 4, "item": 3, "tipo": "tecnica", "titulo": "Colangio-RM (CPRM / MRCP) 3D de la vía biliar — sin rotular", "que_se_ve": "Reconstrucción 3D de colangiopancreatografía por resonancia magnética (secuencia potenciada en T2, fondo negro, líquido estático hiperintenso). Se ven, sin contraste ni endoscopio: vesícula biliar grande (abajo-izquierda de la imagen), cístico que se une al hepático común, árbol biliar intrahepático (hepáticos derecho e izquierdo con sus ramas segmentarias), colédoco que desciende y, saliendo hacia la derecha de la imagen, el conducto pancreático (Wirsung) delgado y largo. No hay números.", "etiquetas": [{"n": "—", "nombre": "Vesícula biliar (estructura ovoidea grande)", "rosa": false, "seguro": true}, {"n": "—", "nombre": "Conducto cístico → conducto hepático común → colédoco", "rosa": false, "seguro": true, "nota": "El colédoco es el segmento vertical más grueso que desciende hacia la papila"}, {"n": "—", "nombre": "Conductos hepáticos derecho e izquierdo y ramas intrahepáticas", "rosa": false, "seguro": true}, {"n": "—", "nombre": "Conducto pancreático (Wirsung), fino, hacia la derecha de la imagen", "rosa": false, "seguro": true}], "pregunta": null, "examen": [], "pack": "Técnica: la colangio-RM es NO invasiva, sin contraste yodado ni radiación, aprovecha la señal T2 del líquido biliar/pancreático estático; la CPRE (p2-p3) es endoscópica, con contraste y radiación, pero permite tratar (esfinterotomía, extracción de cálculos, prótesis). Misma anatomía que p2: hepáticos dcho/izdo → hepático común (+ cístico) → colédoco → papila mayor con Wirsung.", "trampa": "'Es una CPRE' (falso: no hay endoscopio ni contraste); 'necesita contraste yodado' (falso). Candidata a pregunta tipo técnica: ¿qué prueba ve la vía biliar sin ser invasiva? → colangio-RM; ¿cuál permite tratar? → CPRE.", "prioridad": 1}, {"key": "S8-p05", "pagina": 5, "item": 4, "tipo": "identifica", "titulo": "Arteriografía selectiva del tronco celíaco (Weir-Abrahams, leyenda 1-14)", "que_se_ve": "Angiografía por sustracción digital con catéter (13) cuya punta está en el tronco celíaco. Desde ahí: hacia la derecha la a. hepática (3) que da la gastroduodenal (2) descendiendo por detrás de D1 —de la que salen la pancreatoduodenal superior (12), la gastroepiploica derecha (9) y las pancreáticas (14 transversa)— y se continúa como hepática propia dividiéndose en hepática derecha (10) e izquierda (6); hacia arriba la gástrica izquierda (4); hacia la izquierda la esplénica (11), gruesa y tortuosa, con la pancreática magna (7) y la gastroepiploica izquierda (5) y el ovillo de ramas en el hilio esplénico; 1 pancreática dorsal; 8 frénica. Es la placa madre de la imagen 13 de enero 2026 (la versión con letras del examen coincide con Reto 2 dig p15, misma arteriografía).", "etiquetas": [{"n": "1", "nombre": "A. pancreática dorsal", "rosa": false, "seguro": true, "nota": "Rama de la esplénica (o del tronco) para el cuello del páncreas; se continúa como pancreática transversa (14)"}, {"n": "2", "nombre": "A. gastroduodenal", "rosa": true, "seguro": true, "nota": "= C del examen. Nace de la hepática COMÚN, baja por DETRÁS de D1, se bifurca en gastroepiploica dcha (9) + pancreatoduodenal superior (12). A partir de aquí la hepática pasa a llamarse PROPIA"}, {"n": "3", "nombre": "A. hepática (común → propia)", "rosa": true, "seguro": true, "nota": "Rama derecha del trípode de Haller; 'común' hasta la gastroduodenal, 'propia' después"}, {"n": "4", "nombre": "A. gástrica izquierda", "rosa": true, "seguro": true, "nota": "La rama más pequeña del tronco; sube al cardias y baja por la curvatura menor; da ramas esofágicas"}, {"n": "5", "nombre": "A. gastroepiploica (gastroomental) izquierda", "rosa": false, "seguro": true, "nota": "Rama de la esplénica para la curvatura mayor; se anastomosa con la 9"}, {"n": "6", "nombre": "A. hepática izquierda", "rosa": false, "seguro": true}, {"n": "7", "nombre": "A. pancreática magna (de Haller)", "rosa": false, "seguro": true, "nota": "La mayor rama pancreática de la esplénica, para cuerpo/cola"}, {"n": "8", "nombre": "A. frénica (inferior)", "rosa": false, "seguro": true, "nota": "Puede nacer del tronco celíaco o de la aorta; da la suprarrenal superior"}, {"n": "9", "nombre": "A. gastroepiploica (gastroomental) derecha", "rosa": false, "seguro": true, "nota": "Rama terminal de la gastroduodenal; curvatura mayor"}, {"n": "10", "nombre": "A. hepática derecha", "rosa": false, "seguro": true, "nota": "Da la a. CÍSTICA en el triángulo de Calot"}, {"n": "11", "nombre": "A. esplénica", "rosa": true, "seguro": true, "nota": "Tortuosa 'en sacacorchos' por el borde superior del páncreas, tras la bolsa omental; da pancreáticas, gástricas cortas y gastroepiploica izda"}, {"n": "12", "nombre": "A. pancreatoduodenal superior", "rosa": false, "seguro": true, "nota": "Rama de la gastroduodenal; arcada con la PD inferior (AMS) = anastomosis celíaco-AMS"}, {"n": "13", "nombre": "Punta del catéter en el tronco celíaco", "rosa": false, "seguro": true, "nota": "Tronco de Haller, nace de la aorta en T12, 1-2 cm, retroperitoneal"}, {"n": "14", "nombre": "A. pancreática transversa (i

: 3}, {"key": "R2D-p15", "pagina": 15, "item": 14, "tipo": "identifica", "titulo": "Arteriografía selectiva del tronco celíaco (sustracción digital)", "que_se_ve": "Angiografía en proyección AP con catéter introducido por la aorta hasta el tronco celíaco: se opacifican la hepática común/propia y sus ramas a la derecha, la esplénica tortuosa hacia la izquierda y la gástrica izquierda ascendente; ramas gastroomentales bordean la curvatura mayor. Números rosas 1, 3, 6, 7, 8, 11, 14, 15 (los intermedios no aparecen en la lámina).", "etiquetas": [{"n": "1", "nombre": "Arteria hepática común", "rosa": true, "seguro": true, "nota": "Rama derecha del trípode de Haller; corre por el borde superior del páncreas hasta dar la gastroduodenal, donde pasa a llamarse hepática propia."}, {"n": "3", "nombre": "Arteria gástrica izquierda", "rosa": true, "seguro": true, "nota": "La rama más pequeña del tronco celíaco; asciende al cardias (ramas esofágicas) y baja por la curvatura menor entre las hojas del omento menor."}, {"n": "6", "nombre": "Arteria gastroomental (gastroepiploica) izquierda", "rosa": true, "seguro": true, "nota": "Rama de la esplénica en el lig. gastroesplénico; recorre la curvatura mayor y se anastomosa con la gastroomental dcha."}, {"n": "7", "nombre": "Arteria esplénica", "rosa": true, "seguro": true, "nota": "La rama más gruesa y tortuosa ('sacacorchos'), por el borde superior del páncreas dentro del lig. esplenorrenal; da pancreáticas, cortas, gastroomental izda y ramas esplénicas terminales."}, {"n": "8", "nombre": "Arteria gastroomental (gastroepiploica) derecha", "rosa": true, "seguro": true, "nota": "Rama terminal de la gastroduodenal; recorre la curvatura mayor de derecha a izquierda."}, {"n": "11", "nombre": "Arteria gastroduodenal", "rosa": true, "seguro": true, "nota": "Nace de la hepática común, baja por DETRÁS de D1 (úlcera posterior de bulbo sangra por ella) y se divide en gastroomental dcha + pancreatoduodenal superior. Letra C de la img 13 de enero (P5)."}, {"n": "14", "nombre": "Arteria hepática propia", "rosa": true, "seguro": true, "nota": "Continuación de la hepática común tras la gastroduodenal; da la gástrica dcha y se bifurca en hepáticas dcha (→ cística) e izda en el hilio."}, {"n": "15", "nombre": "Tronco celíaco", "rosa": true, "seguro": true, "nota": "Nace de la aorta en T12, 1-2 cm; trípode: gástrica izda, esplénica, hepática común. Irriga el intestino anterior (esófago abdominal → D2 + hígado, páncreas, bazo)."}], "examen": [{"examen": "enero 2026", "pregunta": "P5", "imagen": 13, "clave": "b", "que_pregunto": "Misma arteriografía con letras A-D: 'C = a. gastroduodenal' (cierta). Falsas: A no era la esplénica, B no era la gástrica izda, D no era la hepática común (se llama hepática propia distal a la gastroduodenal). Apoyo para P78.", "img_key": "enero-13"}], "pack": "Tronco celíaco (T12) → gástrica izda (esofágicas, curvatura menor) + esplénica (pancreáticas, cortas, gastroomental izda, esplénicas) + hepática común (→ gastroduodenal [gastroomental dcha + pancreatoduodenal superior] y hepática propia [gástrica dcha, hepáticas dcha con la cística e izda]). Ligadura de la hepática común PROXIMAL a la gastroduodenal: el hígado se mantiene por la anastomosis pancreatoduodenal desde la AMS. Leyenda S8 p5 (otra arteriografía): 1 pancreática dorsal · 2 gastroduodenal · 3 hepática · 4 gástrica izda · 5 gastroomental izda · 6 hepática izda · 7 pancreática magna · 8 frénica · 9 gastroomental dcha · 10 hepática dcha · 11 esplénica · 12 pancreatoduodenal superior · 13 catéter · 14 pancreática transversa.", "trampa": "Hepática común vs propia (frontera = gastroduodenal); gastroomental dcha (de la gastroduodenal) vs izda (de la esplénica); confundir la esplénica tortuosa con la gástrica izda fina.", "prioridad": 3}, {"key": "R2D-p16", "pagina": 16, "item": 15, "tipo": "caso", "titulo": "Caso 15 · Tumor de cola de páncreas que compromete la irrigación del bazo", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 48 años ingresó en el hospital con dolor abdominal intenso. La exploración radiológica muestra un tumor en la cola del páncreas. La arteriografía diagnóstica muestra que el tumor ha afectado el aporte sanguíneo de otro órgano. ¿En cuál de los siguientes órganos se ha afectado muy probablemente la irrigación por el tumor?", "opciones": [{"letra": "a", "texto": "Duodeno.", "correcta": false, "razon": "Su irrigación (arcadas pancreatoduodenales de la gastroduodenal y de la AMS) rodea la CABEZA del páncreas, en el extremo opuesto a la cola."}, {"letra": "b", "texto": "Vesícula biliar.", "correcta": false, "razon": "A. cística ← hepática dcha, en el hilio hepático; sin relación con la cola pancreática."}, {"letra": "c", "texto": "Riñón.", "correcta": false, "razon": "La a. renal izda nace de la aorta en L1-L2 por detrás; aunque la cola descansa sobre la cara anterior del riñón izdo, el tumor afecta antes a los vasos esplénicos que corren pegados a la cola."}, {"letra": "d", "texto": "Hígado.", "correcta": false, "razon": "Hepática común/propia van por el borde superior de la cabeza-cuello hacia el hilio hepático; lejos de la cola."}, {"letra": "e", "texto": "Bazo.", "correcta": true, "razon": "La a. esplénica recorre tortuosa el borde superior del cuerpo y la cola del páncreas y entra en el hilio esplénico junto con la cola dentro del lig. esplenorrenal: un tumor de cola la engloba/ocluye (y trombosa la v. esplénica → hipertensión portal izda con varices gástricas)."}], "respuesta": "e", "razonamiento": "La cola del páncreas es la única parte intraperitoneal de la glándula: viaja en el ligamento esplenorrenal hasta el hilio del bazo acompañada por la arteria y la vena esplénicas. La a. esplénica (rama más gruesa del tronco celíaco) da en ese trayecto las pancreáticas, las gástricas cortas y la gastroomental izquierda y termina en 5-6 ramas esplénicas segmentarias. Por eso un tumor de la cola compromete el aporte arterial del bazo (infarto esplénico) y, con más frecuencia, trombosa la vena esplénica. Contrasta con el tumor de cabeza (colédoco, ictericia: caso 7) y el de cuello (porta/VMS)."}, "examen": [], "pack": "Páncreas: cabeza-cuello ← arcadas pancreatoduodenales (gastroduodenal + AMS); cuerpo-cola ← ramas pancreáticas de la esplénica (dorsal, magna, caudal, transversa). Venas → esplénica y VMS → porta. Linfa → pancreatoesplénicos y pancreatoduodenales → celíacos/mesentéricos superiores. Inervación: plexo celíaco (esplácnicos, dolor en cinturón irradiado a la espalda) y vago. Relaciones: retroperitoneal secundario (Toldt) salvo la cola; detrás de la bolsa omental (lecho gástrico).", "trampa": "Riñón izquierdo (relación posterior de la cola pero no su vaso); cabeza → colédoco/duodeno vs cola → bazo. Bermúdez enlaza esta pregunta con el caso 7.", "prioridad": 2}, {"key": "R2D-p17", "pagina": 17, "item": 16, "tipo": "identifica", "titulo": "Arterias del estómago, hígado y bazo con el omento menor abierto (Netter)", "que_se_ve": "Lámina Netter de la región supramesocólica: hígado levantado, vesícula, estómago con las dos curvaturas, bazo a la derecha del dibujo, omento mayor abajo; se ven aorta, tronco celíaco y todo el árbol arterial gástrico-hepático-esplénico. Números 1-13; rosas 1-9, 11, 12, 13 (10 en negro).", "etiquetas": [{"n": "1", "nombre": "Aorta abdominal", "rosa": true, "seguro": true, "nota": "Atraviesa el hiato aórtico en T12 y da inmediatamente el tronco celíaco."}, {"n": "2", "nombre": "Tronco celíaco", "rosa": true, "seguro": true, "nota": "T12, trípode de Haller: gástrica izda, esplénica, hepática común. Ganglios celíacos = drenaje final de todo el intestino anterior (caso 17)."}, {"n": "3", "nombre": "Arteria hepática izquierda", "rosa": true, "seguro": true, "nota": "Rama terminal de la hepática propia para el lóbulo izdo (y cuadrado/caudado en parte)."}, {"n": "4", "nombre": "Arteria cística", "rosa": true, "seguro": true, "nota": "Rama de la hepática DERECHA en el triángulo de Calot (cístico + hepático común + borde hepático); trampa de P80 enero ('rama de la hepática izda')."}, {"n": "5", "nombre": "Arteria hepática propia", "rosa": true, "seguro": true, "nota": "En el lig. hepatoduodenal, a la izquierda del colédoco y delante de la porta (vaso azul 'en el dibujo'); da la gástrica dcha y se bifurca en dcha/izda."}, {"n": "6", "nombre": "Arteria gástrica derecha (pilórica)", "rosa": true, "seguro": true, "nota": "De la hepática propia; baja por la curvatura menor hacia el píloro y se anastomosa con la gástrica izda."}, {"n": "7", "nombre": "Arteria gastroduodenal", "rosa": true, "seguro": true, "nota": "De la hepática común; detrás de D1; termina en gastroomental dcha + pancreatoduodenal superior."}, {"n": "8", "nombre": "Arteria gastroomental (gastroepiploica) derecha", "rosa": true, "seguro": true, "nota": "Rama de la gastroduodenal; recorre la curvatura mayor entre las hojas del lig. gastrocólico."}, {"n": "9", "nombre": "Arteria hepática común", "rosa": true, "seguro": true, "nota": "Del tronco celíaco al origen de la gastroduodenal; la línea llega al segmento inicial detrás del estómago."}, {"n": "10", "nombre": "Arteria gastroomental (gastroepiploica) izquierda", "rosa": false, "seguro": true, "nota": "Rama de la esplénica en el lig. gastroesplénico; se anastomosa con la dcha en la curvatura mayor."}, {"n": "11", "nombre": "Arterias gástricas cortas (vasa brevia)", "rosa": true, "seguro": true, "nota": "4-5 ramas de la esplénica en el lig. gastroesplénico → fundus (P74 enero: 'A irrigada por las cortas de la esplénica')."}, {"n": "12", "nombre": "Arteria esplénica", "rosa": true, "seguro": false, "nota": "No está en la lista impresa. La línea 12 llega al vaso que sale del tronco celíaco hacia la izquierda del paciente, detrás del estómago, por el borde superior del páncreas: es la esplénica (ídem en build_cuaderno)."}, {"n": "13", "nombre": "Arteria gástrica izquierda", "rosa": true, "seguro": false, "nota": "No está en la lista impresa. La línea 13 llega al vaso que asciende desde el tronco celíaco hacia el cardias por la curvatura menor: gástrica izda (rama más pequeña del trípode)."}], "examen": [{"examen": "enero 2026", "pregunta": "P19", "imagen": 19, "clave": "d", "que_pregunto": "Vísceras supramesocólicas con vasos, letras A-C: 'A = a. esplénica / B = VMS / C = VMI' → TODAS FALSAS. La placa exacta del examen no se ha localizado; data_A la vincula a esta lámina (la más parecida) y hojas-imagenes a p5. Preparar las dos con criterio: esplénica tortuosa por el borde superior del páncreas, VMS a la derecha de la AMS delante de D3, VMI subiendo por la izda hasta la esplénica.", "img_key": "enero-19"}], "pack": "Curvatura menor ← gástrica izda (celíaco) + gástrica dcha (hepática propia); curvatura mayor ← gastroomental dcha (gastroduodenal ← hepática común) + gastroomental izda (esplénica); fundus ← cortas (esplénica); hígado ← hepática propia (dcha → cística; izda); bazo ← esplénica. Venas: gástricas izda/dcha → porta; cortas y gastroomental izda → esplénica; gastroomental dcha → VMS. Linfa gástrica: 4 territorios → ganglios celíacos. Inervación: vago anterior (izdo) → cara anterior y rama hepática; vago posterior (dcho) → cara posterior y rama celíaca; simpático T6-T9 (esplácnico mayor → plexo celíaco).", "trampa": "Lámina 'Identifica' todavía NO usada como tal en 2026: candidata número 1 de este PDF para rotar. Trampas: cística de la hepática izda; gastroomental dcha/izda intercambiadas; hepática común vs propia; etiquetar como arteria lo que es vena o víscera ('todas falsas').", "prioridad": 3}, {"key": "R2D-p18", "pagina": 18, "item": 17, "tipo": "caso", "titulo": "Caso 17 · Drenaje linfático del estómago: ganglios celíacos", "que_se_ve": "Diapositiva de texto (sin imagen): caso clínico tipo test con 5 opciones sobre grupos ganglionares.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 54 años ingresa en urgencias con intenso dolor abdominal superior. La gastroscopia revela un tumor en el antro del estómago. Se pide una TC para evaluar el drenaje linfático del estómago. ¿Cuál de los siguientes nódulos linfáticos estará muy probablemente afectado en una neoplasia maligna del estómago?", "opciones": [{"letra": "a", "texto": "Celíaco.", "correcta": true, "razon": "Toda la linfa gástrica (gástricos izdos/dchos, gastroomentales, pancreatoesplénicos, pilóricos/hepáticos) converge en los ganglios celíacos, preaórticos en torno al tronco celíaco, y de ahí al tronco intestinal → cisterna del quilo → conducto torácico (ganglio de Virchow supraclavicular izdo)."}, {"letra": "b", "texto": "Mesentérico superior.", "correcta": false, "razon": "Recogen el intestino medio (yeyuno-íleon, colon derecho); el estómago es intestino anterior."}, {"letra": "c", "texto": "Mesentérico inferior.", "correcta": false, "razon": "Intestino posterior (colon izdo, sigma, recto superior)."}, {"letra": "d", "texto": "Lumbar.", "correcta": false, "razon": "Ganglios laterales aórticos: riñones, suprarrenales, gónadas, uréteres y pared posterior; no reciben vísceras del tubo digestivo salvo por vía indirecta."}, {"letra": "e", "texto": "Hepático.", "correcta": false, "razon": "Los ganglios hepáticos (a lo largo de la hepática común/propia) y pilóricos son una ESTACIÓN intermedia del antro/píloro y del hígado, pero todos vierten en los celíacos, que es el grupo 'muy probablemente afectado' que pide la pregunta."}], "respuesta": "a", "razonamiento": "El drenaje linfático del estómago sigue a las arterias y se divide en cuatro territorios: (1) curvatura menor superior → ganglios gástricos izquierdos (y paracardiales); (2) curvatura menor inferior/píloro → gástricos derechos y hepáticos/pilóricos; (3) fundus y curvatura mayor superior → pancreatoesplénicos (hilio del bazo); (4) curvatura mayor inferior → gastroomentales derechos → pilóricos. Los cuatro convergen en los ganglios celíacos, que son también el punto final de hígado, páncreas, bazo y duodeno (intestino anterior). Un carcinoma del antro invade primero los gástricos derechos/pilóricos y luego, casi con seguridad, los celíacos; la diseminación distal alcanza el ganglio supraclavicular izquierdo de Virchow (signo de Troisier)."}, "examen": [], "pack": "Linfa del intestino anterior → ganglios celíacos; intestino medio → mesentéricos superiores; intestino posterior → mesentéricos inferiores; los tres preaórticos → tronco intestinal → cisterna del quilo (L1-L2, detrás de la aorta) → conducto torácico → confluente yugulosubclavio izdo. Gástricos izdos = el grupo más grande del estómago; ganglio de Virchow = metástasis gástrica supraclavicular izda.", "trampa": "Elegir la estación intermedia (hepático/pilórico/gástrico) en lugar del grupo terminal (celíaco). Cambiar el órgano: yeyuno → mesentérico superior; sigma → mesentérico inferior; riñón/testículo → lumbar.", "prioridad": 2}]}, "R2G": {"fuente": "R2G", "titulo": "Reto 2 GU · Aparato reproductor femenino (Bermúdez, 21 páginas; ítem N = página N+1)", "resumen_examen": "Fuente de máximo rendimiento: 4 de las 21 imágenes del examen de mayo 2026 salieron LITERALMENTE de aquí (F2 §3.1: imagen 8 = p19 eco de ovario → P29 clave b; imagen 9 = p4 HSG (placa de S11 p26-27, aquí con círculos) → P32 clave c; imagen 10 = p17 eco transvaginal del útero → P33 clave d; imagen 19 = p21 Rohen sagital ♀ con los mismos círculos rosas → P27 clave d), y la imagen 13 (mamografía doble MLO/CC, sin pregunta transcrita) tiene como candidatas p7, p11 y p14. El patrón de pregunta: los números rodeados en rosa son la plantilla literal ('9 = …; 12 = …; 23 = …; 26 = …'), combinados con una opción de irrigación/drenaje (VID) y una trampa de epónimo (Eustaquio/Falopio) o de sexo de la lámina (rectovesical en mujer). Páginas 'Identifica' que AÚN NO han caído y por tanto son candidatas calientes (F2 §3.2): p3 (periné Netter, 13 números; sustenta mayo P28), p9 (Netter útero/ligamento ancho posterior, 13 números), p13 (esquema mesos), p15 (Rohen in situ, 8 rosas) y las tres mamografías p7/p11/p14; en p21 quedan sin preguntar los rosas 8, 10, 11, 13-16, 24, 25 y 29. Los 9 casos clínicos (rectocele, posición uterina, linfa ovárica, episiotomía, hematocolpos, culdocentesis, vaginismo, ligamento redondo, ectópico) son el guion de las preguntas sin imagen de mayo P30-P35 (≈24 % de las preguntas de anatomía de 2026 son clones de casos de reto).", "paginas": [{"key": "R2G-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada · Reto 2 — Aparato reproductor femenino (Bermúdez)", "prioridad": 0}, {"key": "R2G-p02", "pagina": 2, "item": 1, "tipo": "caso", "titulo": "Caso 1 · Rectocele", "que_se_ve": "Diapositiva de texto (caso clínico tipo Snell), sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 46 años ingresa en el hospital con una protuberancia marcada de los tejidos que rodean la abertura vaginal. En la exploración física se aprecia la presencia de un rectocele. ¿Cuál de las siguientes respuestas es, probablemente, la responsable de esta condición?", "opciones": [{"letra": "a", "texto": "Afectación del tabique rectovaginal.", "correcta": true, "razon": "CORRECTA. El rectocele es la herniación de la pared anterior del recto hacia la luz vaginal a través de la pared vaginal posterior; su soporte es el tabique rectovaginal (fascia rectovaginal, de Denonvilliers en el varón), que se debilita/desgarra con los partos y la edad."}, {"letra": "b", "texto": "Debilidad de los músculos transversos del periné.", "correcta": false, "razon": "Los transversos superficial y profundo estabilizan el cuerpo perineal, pero por sí solos no separan recto y vagina; su debilidad favorece el descenso perineal, no el rectocele en concreto."}, {"letra": "c", "texto": "Parálisis del músculo isquiocavernoso.", "correcta": false, "razon": "El isquiocavernoso cubre el pilar del clítoris sobre la rama isquiopubiana: es un músculo eréctil, sin relación con el soporte de la pared vaginal posterior."}, {"letra": "d", "texto": "Debilidad del ligamento sacroespinoso.", "correcta": false, "razon": "El ligamento sacroespinoso (espina ciática → sacro) delimita los forámenes ciáticos mayor y menor; es un ligamento óseo pélvico, no un soporte visceral (aunque se usa como anclaje en la cirugía del prolapso, la 'sacroespinofijación')."}, {"letra": "e", "texto": "Rotura del esfínter uretral.", "correcta": false, "razon": "Daría incontinencia urinaria de esfuerzo, no un abombamiento de la pared vaginal posterior. La uretra está en relación con la pared vaginal ANTERIOR (tabique uretrovaginal)."}], "respuesta": "a", "razonamiento": "La vagina tiene dos tabiques de relación: el uretrovaginal/vesicovaginal por delante y el rectovaginal por detrás. Cuando el tabique rectovaginal cede (partos, menopausia), la pared anterior del recto empuja la pared posterior de la vagina y asoma por el introito: eso es un rectocele (prolapso del compartimento posterior). El equivalente anterior es el cistocele (vejiga a través del tabique vesicovaginal). El resto de opciones son estructuras del periné o de la pelvis ósea que no separan recto y vagina."}, "examen": [{"examen": "mayo 2026", "pregunta": "P35", "imagen": null, "clave": "d (todas correctas)", "que_pregunto": "Relaciones de la vagina: cara anterior con la uretra por el tabique uretrovaginal y cara posterior con el recto por el tabique rectovaginal; irrigación por a. vaginal (AII), perineal (pudenda interna) y ramas vaginales de la uterina. Misma anatomía que sustenta este caso.", "img_key": null}], "pack": "Vagina: irrigación por la a. vaginal (rama de la ilíaca interna o de la uterina), ramas vaginales de la a. uterina, a. rectal media y a. perineal (rama de la pudenda interna ← ilíaca interna). Drenaje venoso: plexo vaginal → plexo uterovaginal → v. ilíaca interna. Linfa: 2/3 superiores a ilíacos internos/externos; 1/3 inferior (bajo el himen) a inguinales superficiales. Relaciones: delante uretra y base vesical (tabiques uretrovaginal y vesicovaginal), detrás recto por el tabique rectovaginal y, en el fórnix posterior, el fondo de saco de Douglas.", "trampa": "Confundir rectocele (tabique rectovaginal, compartimento posterior) con cistocele (tabique vesicovaginal, anterior) o con el descenso perineal por lesión del cuerpo perineal; y el 'ligamento sacroespinoso' suena a sostén pélvico pero es ligamento óseo.", "prioridad": 2}, {"key": "R2G-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Periné femenino, músculos superficiales (Netter, vista inferior)", "que_se_ve": "Lámina de atlas (Netter) del periné femenino en posición de litotomía, vista inferior: triángulo urogenital arriba (clítoris, uretra, vagina con sus músculos) y triángulo anal abajo (ano, esfínter, elevador del ano, glúteo mayor). 13 números en círculo negro, ninguno rosa: hay que saberlos TODOS.", "etiquetas": [{"n": "1", "nombre": "M. isquiocavernoso", "rosa": false, "seguro": true, "nota": "Cubre el pilar del clítoris sobre la rama isquiopubiana (mayo 2026 P28a: 'refuerza su inserción en las ramas isquiopúbicas' = cierto)."}, {"n": "2", "nombre": "M. bulboesponjoso", "rosa": false, "seguro": true, "nota": "Rodea el orificio vaginal; cubre el bulbo del vestíbulo y la glándula de Bartolino (P28c mayo 2026)."}, {"n": "3", "nombre": "Membrana perineal (fascia inferior del diafragma urogenital)", "rosa": false, "seguro": true, "nota": "Triángulo blanco entre isquiocavernoso y bulboesponjoso; se inserta en las ramas isquiopubianas."}, {"n": "4", "nombre": "M. transverso superficial del periné", "rosa": false, "seguro": true, "nota": "De la tuberosidad isquiática al cuerpo perineal; marca el límite entre triángulo urogenital y anal."}, {"n": "5", "nombre": "Cuerpo perineal (centro tendinoso del periné)", "rosa": false, "seguro": true, "nota": "Punto de convergencia de bulboesponjoso, transversos y esfínter anal externo; se secciona en la episiotomía media (caso 7)."}, {"n": "6", "nombre": "M. esfínter externo del ano", "rosa": false, "seguro": true}, {"n": "7", "nombre": "M. elevador del ano (pubococcígeo / iliococcígeo)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "M. glúteo mayor", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Ano (orificio anal)", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Rama isquiopubiana (tuberosidad isquiática en su extremo posterior)", "rosa": false, "seguro": false, "nota": "La línea acaba en la zona ósea/adiposa lateral a la membrana perineal; alternativa: grasa de la fosa isquioanal."}, {"n": "11", "nombre": "Orificio vaginal (introito / vestíbulo de la vagina)", "rosa": false, "seguro": true}, {"n": "12", "nombre": "Orificio uretral externo", "rosa": false, "seguro": true}, {"n": "13", "nombre": "Glande del clítoris", "rosa": false, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P28", "imagen": null, "clave": "d (todas correctas)", "que_pregunto": "Genitales externos ♀ sin imagen: pilares del clítoris cubiertos por isquiocavernosos (1); bulbos del vestíbulo laterales al vestíbulo, inferiores al transverso profundo; glándulas de Bartolino dentro del bulboesponjoso (2) y secretan durante la excitación. Esta lámina es la que ilustra las tres afirmaciones.", "img_key": null}], "pack": "Periné: irrigación por la a. pudenda interna (rama de la ilíaca interna, entra por el conducto de Alcock) → a. rectal inferior (esfínter anal 6), a. perineal (labiales posteriores, transverso 4 y bulboesponjoso 2) y aa. del bulbo del vestíbulo, profunda y dorsal del clítoris (13). Venas paralelas → v. pudenda interna → ilíaca interna; los labios anteriores también drenan a la v. pudenda externa → femoral. Inervación: n. pudendo (S2-S4): ramas rectales inferiores, perineales y n. dorsal del clítoris; el elevador del ano (7) recibe además ramas directas de S3-S4. Linfa de vulva y periné → inguinales superficiales.", "trampa": "Isquiocavernoso (lateral, sobre hueso, eréctil) vs bulboesponjoso (medial, rodea la vagina); 'transverso superficial' vs 'profundo' (este último está bajo la membrana perineal y no se ve aquí); y que el cuerpo perineal (5) NO es músculo sino centro tendinoso.", "prioridad": 2}, {"key": "R2G-p04", "pagina": 4, "item": 3, "tipo": "identifica", "titulo": "Histerosalpingografía (Rx AP con contraste, Weir & Abrahams)", "que_se_ve": "Radiografía AP de pelvis con contraste yodado inyectado por una cánula cervical: cavidad uterina triangular, trompas finas y derrame de contraste en peritoneo por ambos extremos ampulares (prueba de permeabilidad, signo de Cotte). Números 1, 2, 3, 5, 6, 8, 9 rodeados en rosa; 7 y el segundo 1 (derecha) en negro.", "etiquetas": [{"n": "1", "nombre": "Ampolla / infundíbulo de la trompa uterina con paso de contraste al peritoneo (trompa permeable)", "rosa": true, "seguro": true, "nota": "Aparece dos veces: rosa a la izquierda de la imagen (trompa derecha de la paciente) y en negro a la derecha (trompa izquierda)."}, {"n": "2", "nombre": "Cavidad del cuerpo del útero (triángulo de contraste)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Cánula / catéter de histerosalpingografía en el conducto cervical (vagina)", "rosa": true, "seguro": false, "nota": "Está sobre la sombra tubular del catéter que sube desde la vagina; alternativa: conducto cervical."}, {"n": "5", "nombre": "Cuerno uterino (ángulo tubárico) izquierdo de la paciente — origen de la porción intramural de la trompa", "rosa": true, "seguro": false}, {"n": "6", "nombre": "Istmo del útero / orificio cervical interno (vértice inferior del triángulo, donde se estrecha la cavidad)", "rosa": true, "seguro": false, "nota": "Justo por encima del balón/punta de la cánula."}, {"n": "7", "nombre": "Fondo del útero (borde superior de la cavidad, flecha)", "rosa": false, "seguro": false}, {"n": "8", "nombre": "Cuerno uterino derecho de la paciente / porción intramural (intersticial) de la trompa", "rosa": true, "seguro": false, "nota": "Flecha al ángulo superior izquierdo de la imagen, donde nace la trompa."}, {"n": "9", "nombre": "Istmo de la trompa uterina (porción fina y recta, medial)", "rosa": true, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P32", "imagen": 9, "clave": "c", "que_pregunto": "Misma iconografía (S11 p26-27 es la placa; aquí la versión con círculos). A = trompa uterina, B = cavidad uterina, C = contraste libre. a) 'trompa de Eustaquio' = trampa de epónimo (Falopio); b) 'meso por debajo del borde superior' falsa (la trompa forma el borde superior libre del ligamento ancho); c) CORRECTA: drenaje venoso de la trompa a las vv. ováricas y al plexo uterovaginal.", "img_key": "mayo-09"}], "pack": "Trompa (10-12 cm), de medial a lateral: intramural (8/5) → istmo (9) → ampolla (fecundación; ectópico más frecuente) → infundíbulo con fimbrias (1). Irrigación doble: rama tubárica de la a. uterina (← ilíaca interna) por el lado medial + rama tubárica de la a. ovárica (← aorta, L2) por el lateral, anastomosadas en el mesosálpinx. Venas: plexo uterovaginal → v. ilíaca interna (medial) y plexo pampiniforme → v. ovárica (lateral; derecha a VCI, izquierda a v. renal izquierda). Linfa: lumbares/paraaórticos (con el ovario) y algo a ilíacos. Inervación: plexo uterovaginal (simpático T10-L1, parasimpático S2-S4). La HSG (contraste hidrosoluble por cánula cervical) se indica en infertilidad y se contraindica en embarazo, infección, menstruación y DIU.", "trampa": "Eustaquio por Falopio; 'la fecundación ocurre en el istmo' (es en la ampolla: mayo 2026 P31c falsa); 'la trompa se comunica con el útero por el orificio abdominal' (es el orificio uterino); 'irrigada solo por la a. uterina' (es doble).", "prioridad": 3}, {"key": "R2G-p05", "pagina": 5, "item": 4, "tipo": "caso", "titulo": "Caso 4 · Posición normal del útero", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "En la exploración digital de la vagina, la porción del útero que primero palpa el dedo explorador es el cuello y el orificio externo. ¿Cuál de las siguientes es la posición más frecuente del útero?", "opciones": [{"letra": "a", "texto": "Anteflexo y retrovertido.", "correcta": false, "razon": "Combinación incoherente con la normalidad: retroversión = el eje del útero se inclina hacia atrás respecto a la vagina; no es la posición habitual."}, {"letra": "b", "texto": "Retroflexo y antevertido.", "correcta": false, "razon": "Retroflexión = el cuerpo se dobla hacia atrás sobre el cérvix; es una variante (≈20 %), no la más frecuente."}, {"letra": "c", "texto": "Anteflexo y antevertido.", "correcta": true, "razon": "CORRECTA. Anteversión: el eje del útero forma un ángulo abierto hacia delante (~90°) con el eje de la vagina. Anteflexión: el eje del cuerpo se dobla hacia delante sobre el eje del cérvix (~120-170°). El útero descansa sobre la vejiga."}, {"letra": "d", "texto": "Retroflexo y retrovertido.", "correcta": false, "razon": "Es la posición opuesta a la normal; se asocia a dolor lumbar/dispareunia y, en la embarazada, a retención urinaria por encarcelación."}], "respuesta": "c", "razonamiento": "Versión = relación del eje uterino con el eje vaginal; flexión = relación del cuerpo con el cuello. En la posición fisiológica (vejiga vacía) el útero está antevertido y anteflexo, apoyado sobre la cara superior de la vejiga, por lo que el cérvix mira hacia la pared posterior de la vagina y es lo primero que palpa el dedo a través del fórnix. Al llenarse la vejiga, el útero se endereza (menor anteversión). Es la respuesta 'c' del reto y el dato que Bermúdez colgó de la eco transvaginal de mayo 2026 (P33, posición y relaciones del útero)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P33", "imagen": 10, "clave": "d (a y c)", "que_pregunto": "Eco transvaginal del útero (p17 de este reto): identificación fondo/endometrio/cuerpo/cérvix + irrigación triple; el útero aparece en anteversión-anteflexión sobre la vejiga.", "img_key": "mayo-10"}], "pack": "Sostén del útero: ligamentos cardinales o cervicales transversos (Mackenrodt), que lo anclan a las paredes laterales de la pelvis (mayo 2026 P34c cierta); ligamentos uterosacros (cérvix → sacro, palpables por tacto rectal); ligamento pubocervical; ligamento redondo (cuerno → conducto inguinal → labio mayor: mantiene la anteversión, NO fija el útero a la pared posterior: P34a falsa); y sobre todo el suelo pélvico (elevador del ano) y el cuerpo perineal. Irrigación: a. uterina (ilíaca interna) + rama ovárica + a. del ligamento redondo (epigástrica inferior).", "trampa": "Intercambiar 'versión' y 'flexión'; y 'ligamento redondo fija a la pared abdominal posterior' (va hacia delante, al conducto inguinal).", "prioridad": 2}, {"key": "R2G-p06", "pagina": 6, "item": 5, "tipo": "caso", "titulo": "Caso 5 · Drenaje linfático del ovario", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 34 años ingresa en el hospital por un intenso dolor en el abdomen inferior. La exploración radiológica muestra la presencia de una tumoración en ambos ovarios. Se realiza una biopsia que confirma el diagnóstico inicial de cáncer de ovario. ¿Cuáles de los siguientes nódulos linfáticos son los primeros que recibirán la linfa a partir de los ovarios enfermos?", "opciones": [{"letra": "a", "texto": "Los nódulos inguinales superficiales y profundos.", "correcta": false, "razon": "Los inguinales reciben la linfa de vulva, periné y 1/3 inferior de la vagina (y algo del cuerno uterino por el ligamento redondo), no del ovario."}, {"letra": "b", "texto": "Los nódulos ilíacos externos.", "correcta": false, "razon": "Los ilíacos externos drenan vejiga, uretra, vagina superior y parte del cérvix; no son el primer escalón ovárico."}, {"letra": "c", "texto": "Los nódulos lumbares.", "correcta": true, "razon": "CORRECTA. La linfa del ovario sigue a los vasos ováricos por el ligamento suspensorio hacia arriba, retroperitoneal, hasta los ganglios lumbares (paraaórticos/preaórticos) a nivel L1-L2, igual que el testículo."}, {"letra": "d", "texto": "Los nódulos ilíacos internos", "correcta": false, "razon": "Los ilíacos internos drenan cérvix, cuerpo uterino inferior, vagina y recto; solo reciben linfa ovárica de forma secundaria/accesoria."}], "respuesta": "c", "razonamiento": "El ovario es una gónada que desciende desde la cresta urogenital lumbar, arrastrando su pedículo vascular: la a. ovárica nace de la aorta a nivel L2, la v. ovárica va a la VCI (derecha) o a la v. renal izquierda (izquierda), y los linfáticos siguen el mismo camino ascendente por el ligamento suspensorio hasta los ganglios lumbares (paraaórticos). Por eso el cáncer de ovario metastatiza a ganglios paraaórticos y no a inguinales, y un ganglio de Virchow (supraclavicular izquierdo) puede ser su primera manifestación a distancia. El mismo razonamiento se aplica al testículo (retos 3)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P30", "imagen": null, "clave": "c", "que_pregunto": "Ovario sin imagen: la a. ovárica nace de la aorta abdominal, se relaciona con el ligamento suspensorio y se anastomosa con la rama ovárica de la a. uterina (cierta); el mesovario NO se forma de la hoja posterior 'por detrás del borde posterior' y el istmo de la trompa no es anterolateral al ovario.", "img_key": null}, {"examen": "mayo 2026", "pregunta": "P29", "imagen": 8, "clave": "b", "que_pregunto": "Eco de ovario (p19 de este reto): ligamentos suspensorio/propio/infundíbulo-ovárico; límites de la fosa de Krause.", "img_key": "mayo-08"}], "pack": "Ovario: a. ovárica ← aorta abdominal (L2, bajo las renales), desciende retroperitoneal cruzando por delante del uréter y entra por el ligamento suspensorio (infundíbulo-pélvico); anastomosis con la rama ovárica de la a. uterina (← ilíaca interna) por el ligamento propio. Venas: plexo pampiniforme → v. ovárica derecha a la VCI, izquierda a la v. renal izquierda. Linfa: lumbares/paraaórticos. Inervación: plexo ovárico (simpático T10-T11: dolor referido periumbilical) + parasimpático vagal/pélvico. Fosa ovárica (Krause) en la nulípara: delante vasos ilíacos externos, detrás uréter + vasos ilíacos internos, en el suelo el n. obturador (dolor a la cara medial del muslo).", "trampa": "Responder 'ilíacos' por proximidad anatómica: la linfa gonadal sube con los vasos gonadales hasta los lumbares. En el examen: intercambiar ilíacos externos/internos en la fosa de Krause.", "prioridad": 2}, {"key": "R2G-p07", "pagina": 7, "item": 6, "tipo": "identifica", "titulo": "Mamografía, proyección craneocaudal (CC) — zonas de la mama", "que_se_ve": "Mamografía CC de una mama de densidad mixta, pezón a la izquierda de la imagen. Cinco números rosas; la única lámina del reto con la leyenda impresa: 1 zona premamaria, 2 zona mamaria, 3 zona retromamaria, 4 piel, 5 pezón.", "etiquetas": [{"n": "1", "nombre": "Zona premamaria (grasa subcutánea entre la piel y el parénquima; la cruzan los ligamentos de Cooper)", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Zona mamaria (tejido fibroglandular, cuerpo de la mama)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Zona retromamaria (grasa retroglandular, delante de la fascia del pectoral mayor; bolsa de Chassaignac)", "rosa": true, "seguro": true}, {"n": "4", "nombre": "Piel (flecha hacia la línea cutánea)", "rosa": true, "seguro": true}, {"n": "5", "nombre": "Pezón", "rosa": true, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "sin pregunta en la permutación transcrita (imagen de reserva)", "imagen": 13, "clave": "—", "que_pregunto": "Imagen 13 de mayo = mamografía doble (A MLO bilateral, B CC). Placa exacta NO localizada en el campus; esta CC con la leyenda de zonas es la candidata más directa junto a p11 y p14.", "img_key": "mayo-13"}], "pack": "Mama: irrigación por ramas perforantes de la a. torácica (mamaria) interna (≈60 %, 2ª-5ª perforantes; la 3ª es la principal de la areola — mayo 2026 P6), a. torácica lateral y ramas de la axilar, y perforantes de las aa. intercostales posteriores 3ª-5ª (NO 7ª-9ª: P6b falsa). Venas: plexo superficial de Haller; profundas a torácica interna, axilar e intercostales (→ plexo vertebral de Batson: metástasis óseas). Linfa: ≈97 % a la axila (niveles de Berg: I lateral, II posterior, III medial al pectoral menor), ≈3 % a la cadena mamaria interna; Rotter = interpectorales. Relación: 2/3 de la base sobre el pectoral mayor, 1/3 sobre el serrato anterior; la zona retromamaria (3) es la grasa laxa que permite la movilidad de la mama sobre el pectoral.", "trampa": "Llamar 'músculo' a la zona 3 (es grasa retromamaria; el pectoral es lo que hay detrás y no se ve en la CC); confundir premamaria (subcutánea, anterior) con retromamaria (posterior). Bloque mama en catalán en el examen.", "prioridad": 2}, {"key": "R2G-p08", "pagina": 8, "item": 7, "tipo": "caso", "titulo": "Caso 7 · Episiotomía media e incontinencia fecal", "que_se_ve": "Diapositiva de texto, sin imagen. La lámina que lo ilustra es la p3 (periné Netter, número 5 = cuerpo perineal, 6 = esfínter anal externo).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer embarazada, de 29 años, ingresa en el hospital para la asistencia al parto. Durante el parto vaginal, el obstetra realiza una episiotomía media en la que se corta profundamente el cuerpo perineal. Dos semanas después del parto, la paciente refiere incontinencia fecal desde el parto. ¿Cuál de las siguientes estructuras fueron lesionadas con mayor probabilidad en la episiotomía?", "opciones": [{"letra": "a", "texto": "Músculos transversos del periné.", "correcta": false, "razon": "Se seccionan en la episiotomía media (se insertan en el cuerpo perineal), pero su lesión no produce incontinencia fecal."}, {"letra": "b", "texto": "Esfínter anal externo.", "correcta": true, "razon": "CORRECTA. El esfínter anal externo se ancla por delante en el cuerpo perineal; una incisión media que profundiza hacia el ano lo secciona (desgarro de 3er grado) y aparece incontinencia fecal."}, {"letra": "c", "texto": "Músculo isquiocavernoso.", "correcta": false, "razon": "Está lateral, sobre la rama isquiopubiana, lejos de la línea media; nada que ver con la continencia."}, {"letra": "d", "texto": "Ligamento sacroespinoso.", "correcta": false, "razon": "Ligamento profundo de la pelvis ósea, inaccesible desde el periné."}, {"letra": "e", "texto": "Esfínter de la uretra.", "correcta": false, "razon": "Está en el triángulo urogenital, por delante de la vagina; su lesión daría incontinencia urinaria, y la episiotomía media va hacia atrás, hacia el ano."}], "respuesta": "b", "razonamiento": "La episiotomía media se hace en la línea media desde la horquilla vulvar hacia el ano, atravesando la pared vaginal posterior, el bulboesponjoso, los transversos superficiales y el cuerpo perineal. Si se profundiza, el siguiente plano es el esfínter anal externo (desgarro de 3er grado) y después la mucosa anal (4º grado): resultado, incontinencia fecal. Por eso muchos obstetras prefieren la episiotomía mediolateral, que se aleja del esfínter (aunque sangra más y cicatriza peor). Clave Bermúdez: cuerpo perineal = punto de anclaje común de bulboesponjoso, transversos y esfínter anal externo."}, "examen": [], "pack": "Esfínter anal externo: inervado por el n. rectal inferior (rama del pudendo, S2-S4); irrigado por la a. rectal inferior (rama de la pudenda interna ← ilíaca interna); drenaje a v. pudenda interna y linfa a inguinales superficiales (por debajo de la línea pectínea). El cuerpo perineal (centro tendinoso) está entre el orificio vaginal y el ano, bajo la piel, y en él convergen bulboesponjoso, transversos superficial y profundo, esfínter anal externo y fibras del elevador del ano.", "trampa": "Elegir 'transversos del periné' porque también se cortan: la pregunta pide la estructura que EXPLICA la incontinencia fecal.", "prioridad": 2}, {"key": "R2G-p09", "pagina": 9, "item": 8, "tipo": "identifica", "titulo": "Útero, trompas, ovarios y ligamento ancho (Netter, vista posterior)", "que_se_ve": "Lámina de Netter ('Útero, vagina y estructuras de sostén'), vista posterior: útero central, ligamento ancho desplegado a ambos lados, trompas con sus porciones marcadas con corchetes a la derecha, ovarios y ligamento suspensorio; en la base se ven los uréteres y los vasos uterinos. 13 números en negro, ninguno rosa: se identifican todos.", "etiquetas": [{"n": "1", "nombre": "Fondo del útero", "rosa": false, "seguro": true}, {"n": "2", "nombre": "Ligamento propio del ovario (útero-ovárico)", "rosa": false, "seguro": true, "nota": "Del polo inferior del ovario al cuerno uterino, por detrás y debajo de la trompa."}, {"n": "3", "nombre": "Mesosálpinx (parte del ligamento ancho que envuelve la trompa)", "rosa": false, "seguro": true}, {"n": "4", "nombre": "Ligamento suspensorio del ovario (infundíbulo-pélvico), con los vasos ováricos", "rosa": false, "seguro": true}, {"n": "5", "nombre": "Ovario", "rosa": false, "seguro": true}, {"n": "6", "nombre": "Cuerpo del útero", "rosa": false, "seguro": true}, {"n": "7", "nombre": "Ligamento ancho (mesometrio)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Uréter (seccionado, pasa por la base del ligamento ancho)", "rosa": false, "seguro": true}, {"n": "9", "nombre": "Vasos uterinos (a. uterina) en la base del ligamento ancho, cruzando por encima del uréter", "rosa": false, "seguro": false, "nota": "La línea acaba en la base del mesometrio junto al uréter; alternativa: ligamento cardinal (Mackenrodt)."}, {"n": "10", "nombre": "Fimbrias de la trompa", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Infundíbulo de la trompa", "rosa": false, "seguro": true}, {"n": "12", "nombre": "Ampolla de la trompa uterina (porción ancha y tortuosa)", "rosa": false, "seguro": true}, {"n": "13", "nombre": "Istmo de la trompa uterina (porción estrecha junto al cuerno)", "rosa": false, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P34", "imagen": null, "clave": "c", "que_pregunto": "Ligamentos del útero sin imagen: cardinales (cervicales transversos) anclan el útero a las paredes laterales de la pelvis (cierta); lig. redondo NO fija a la pared posterior; uterosacros SÍ son palpables por tacto rectal.", "img_key": null}, {"examen": "mayo 2026", "pregunta": "P22", "imagen": 3, "clave": "d", "que_pregunto": "Urografía (R1): 'los uréteres cruzan por detrás del conducto deferente en el hombre y por detrás de la a. uterina en la mujer' (cierta) — es lo que muestra el 8/9 de esta lámina.", "img_key": "mayo-03"}], "pack": "Útero: a. uterina (← ilíaca interna) llega por la base del ligamento ancho (parametrio), cruza POR ENCIMA y por delante del uréter (8) a ~2 cm del cérvix ('el agua pasa bajo el puente'), asciende tortuosa por el borde lateral y se anastomosa con la a. ovárica (← aorta) en el mesosálpinx (3); tercera fuente: a. del ligamento redondo (← epigástrica inferior). Venas: plexo uterino → vv. uterinas → v. ilíaca interna; plexo pampiniforme → v. ovárica. Linfa: fondo y parte alta del cuerpo → lumbares (y algo a inguinales por el ligamento redondo); cuerpo → ilíacos externos; cérvix → ilíacos internos/sacros. Ligamento ancho = mesometrio (7) + mesosálpinx (3) + mesovario; el ligamento suspensorio (4) lleva vasos, linfáticos y nervios del ovario.", "trampa": "En la histerectomía el uréter se liga por error al pinzar la a. uterina; confundir ligamento propio (2, al útero) con suspensorio (4, a la pared pélvica); y orden de las porciones de la trompa (istmo 13 pegado al útero, ampolla 12 en medio, infundíbulo 11 con fimbrias 10).", "prioridad": 2}, {"key": "R2G-p10", "pagina": 10, "item": 9, "tipo": "caso", "titulo": "Caso 9 · Hematocolpos", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una niña de 13 años es llevada a urgencias por referir un intenso dolor pelviano profundo. La exploración física muestra que la paciente tiene el himen íntegro. La incisión del himen muestra la presencia de un hematocolpos. ¿Cuál de las siguientes condiciones se asocia con un hematocolpos?", "opciones": [{"letra": "a", "texto": "Quiste de la glándula de Bartolino.", "correcta": false, "razon": "Es una tumefacción del labio mayor (tercio posterior del vestíbulo) por obstrucción del conducto de la glándula vestibular mayor; no acumula sangre en la vagina."}, {"letra": "b", "texto": "Hemorragia por un embarazo ectópico.", "correcta": false, "razon": "Sangra hacia la cavidad peritoneal (hemoperitoneo, Douglas), no hacia la luz vaginal; además la paciente tiene el himen íntegro."}, {"letra": "c", "texto": "Himen imperforado.", "correcta": true, "razon": "CORRECTA. Si el himen no se perfora, la sangre menstrual queda retenida en la vagina (hematocolpos), luego en el útero (hematometra) y trompas (hematosálpinx): amenorrea primaria con dolor cíclico y masa pélvica en una adolescente."}, {"letra": "d", "texto": "Hernia inguinal.", "correcta": false, "razon": "Contenido peritoneal en el conducto inguinal; no tiene relación con la vagina."}], "respuesta": "c", "razonamiento": "Hemato-colpos = sangre en la vagina (kolpos = vagina). La vagina se origina de los bulbos senovaginales del seno urogenital; el himen es el tabique entre la placa vaginal y el seno urogenital, que normalmente se perfora antes del nacimiento. Si persiste imperforado, en la menarquia la sangre no tiene salida: dolor pélvico cíclico sin menstruación, himen abombado azulado y masa retrovesical. El tratamiento es la himenotomía. Bermúdez utiliza este caso para el vocabulario: hematocolpos / hematometra / hematosálpinx."}, "examen": [], "pack": "Vagina (8-10 cm, orientada hacia atrás y arriba): irrigación por a. vaginal (← ilíaca interna) + ramas vaginales de la uterina + rectal media + perineal (pudenda interna); venas al plexo uterovaginal → ilíaca interna; linfa de los 2/3 superiores a ilíacos y del 1/3 inferior (bajo el himen) a inguinales superficiales; inervación autónoma (plexo uterovaginal) en los 2/3 superiores y somática (n. pudendo, rama perineal) en el 1/3 inferior — por eso solo el tercio inferior es sensible al dolor táctil. Mucosa rugosa, rosada y húmeda en la mujer joven sana (mayo 2026 P2c cierta).", "trampa": "Confundir hematocolpos (vagina) con hematometra (útero) o con hemoperitoneo (ectópico); y 'la vagina no tiene inervación autónoma' (falsa, P2d).", "prioridad": 2}, {"key": "R2G-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Mamografía, proyección mediolateral oblicua (MLO) — zonas + pectoral", "que_se_ve": "Mamografía MLO (la única proyección que incluye el músculo pectoral mayor como banda densa posterosuperior y la cola axilar). Seis números rosas: los cinco de la CC (p7) más el 6 sobre el pectoral. Sin leyenda impresa: se responde con la de p7.", "etiquetas": [{"n": "1", "nombre": "Zona premamaria (grasa subcutánea con ligamentos de Cooper)", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Zona mamaria (tejido fibroglandular)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Zona retromamaria (grasa retroglandular, delante del pectoral)", "rosa": true, "seguro": true}, {"n": "4", "nombre": "Piel (línea cutánea superior de la mama)", "rosa": true, "seguro": true, "nota": "Mismo criterio que el 4 de la CC de p7 (piel); el círculo está sobre el borde cutáneo superior."}, {"n": "5", "nombre": "Pezón", "rosa": true, "seguro": true}, {"n": "6", "nombre": "M. pectoral mayor (banda densa oblicua posterosuperior, solo visible en la MLO)", "rosa": true, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "sin pregunta en la permutación transcrita (imagen de reserva)", "imagen": 13, "clave": "—", "que_pregunto": "Imagen 13 de mayo: mamografía doble con A = MLO bilateral (se reconoce por el pectoral) y B = CC. Placa exacta no localizada; esta MLO es la candidata para preguntar 'qué proyección es' o 'qué es el 6'.", "img_key": "mayo-13"}], "pack": "MLO: incluye pectoral mayor (6) y cola axilar de Spence (cuadrante superoexterno, donde asientan la mayoría de tumores y por donde drena la linfa a la axila); la CC valora mejor los cuadrantes internos. Irrigación: torácica interna (perforantes 2ª-5ª), torácica lateral, intercostales posteriores 3ª-5ª; linfa 97 % a la axila (niveles de Berg I-III respecto al pectoral menor), 3 % a mamaria interna. Relación: 2/3 sobre el pectoral mayor, 1/3 sobre el serrato anterior; pezón a nivel del 4º espacio intercostal en la nulípara.", "trampa": "Confundir la banda del pectoral (6) con tejido glandular denso; llamar músculo a la zona retromamaria (3); y no reconocer la proyección (si hay pectoral es MLO).", "prioridad": 2}, {"key": "R2G-p12", "pagina": 12, "item": 11, "tipo": "caso", "titulo": "Caso 11 · Culdocentesis: punción del fórnix posterior", "que_se_ve": "Diapositiva de texto, sin imagen. La lámina que lo ilustra es la p21 (Rohen sagital: 23 = Douglas, 25 = fórnix posterior).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 34 años es hospitalizada por presentar un abdomen aumentado de tamaño y doloroso. La exploración ecográfica muestra la presencia de ascitis en el interior de la cavidad peritoneal. Se inserta una aguja a través de la porción posterior del fórnix vaginal para drenar el fluido. ¿En qué espacio debe penetrar la aguja para drenarlo?", "opciones": [{"letra": "a", "texto": "En el fondo de saco rectouterino.", "correcta": true, "razon": "CORRECTA. El fondo de saco rectouterino (Douglas) es el punto más declive de la cavidad peritoneal en bipedestación y solo está separado del fórnix posterior de la vagina por la pared vaginal y el peritoneo: por ahí se punciona (culdocentesis) y se drena."}, {"letra": "b", "texto": "En la fosa pararrectal.", "correcta": false, "razon": "Es un receso peritoneal lateral al recto, no accesible desde el fórnix posterior y no es el punto más declive."}, {"letra": "c", "texto": "En el espacio paravesical.", "correcta": false, "razon": "Espacio extraperitoneal lateral a la vejiga, anterior; nada que ver con la vagina posterior."}, {"letra": "d", "texto": "En el fondo de saco uterovesical.", "correcta": false, "razon": "Es el receso ANTERIOR, entre vejiga y útero; es menos profundo (el peritoneo se refleja a nivel del istmo) y no contacta con la vagina."}, {"letra": "e", "texto": "En el fondo de saco perineal superficial.", "correcta": false, "razon": "El espacio perineal superficial es un compartimento del periné (entre membrana perineal y fascia de Colles), por debajo del suelo pélvico: no es peritoneal y no acumula ascitis."}], "respuesta": "a", "razonamiento": "El peritoneo en la mujer va de la vejiga al útero (fondo de saco vesicouterino), cubre la cara anterior, el fondo y la cara posterior del útero, baja hasta el fórnix posterior de la vagina (que por eso SÍ está peritonizado, a diferencia del anterior) y se refleja sobre el recto: ese receso es el fondo de saco rectouterino de Douglas, el más declive. Sangre (ectópico roto), pus (absceso) o ascitis se acumulan ahí y se alcanzan con una aguja a través del fórnix posterior (culdocentesis) o con un espéculo. Es exactamente lo que preguntó mayo 2026 (P27, imagen 19 = p21 de este reto) y enero 2026 (imagen 18)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P27", "imagen": 19, "clave": "d (todas falsas)", "que_pregunto": "Rohen sagital ♀ (p21): 9 vesicouterino, 12 fórnix anterior SIN peritoneo, 23 rectouterino (Douglas), 26 cérvix; las tres opciones decían '23 = rectovesical', imposible en la mujer.", "img_key": "mayo-19"}, {"examen": "enero 2026", "pregunta": "P18", "imagen": 18, "clave": "c", "que_pregunto": "Fondos de saco A (rectovesical ♂) y B (rectouterino ♀) 'recubiertos por peritoneo donde se acumulan fluidos patológicos' = cierta. Mismo concepto.", "img_key": "enero-18"}], "pack": "Fondo de saco de Douglas: límites = cara posterior del útero/fórnix posterior (delante), recto (detrás) y pliegues rectouterinos con los ligamentos uterosacros (lados). Se explora por tacto vaginal (fórnix posterior) y tacto rectal. El fórnix anterior se relaciona con la base vesical, sin peritoneo; el vesicouterino queda a la altura del istmo uterino. Vagina: irrigación a. vaginal (AII) + uterina + rectal media + pudenda interna; venas al plexo uterovaginal → ilíaca interna.", "trampa": "'Rectovesical' en la mujer (solo existe en el varón); 'fórnix anterior peritonizado' (no lo está); elegir el vesicouterino por ser 'fondo de saco' (es el anterior y menos declive).", "prioridad": 3}, {"key": "R2G-p13", "pagina": 13, "item": 12, "tipo": "identifica", "titulo": "Esquema del ligamento ancho en corte sagital/coronal: mesos de trompa y ovario", "que_se_ve": "Esquema tipo Gray's/Moore: el ligamento ancho como pliegue peritoneal en forma de 'Y' invertida, con la trompa seccionada en su borde superior, el ovario colgando de la hoja posterior por su meso, un cilindro azul (5) bajo el peritoneo de la pared pélvica y un cilindro rojo sin número (a. uterina) en la base. Números 5, 6, 8, 10, 11, 12 en negro; no hay rosas.", "etiquetas": [{"n": "5", "nombre": "Uréter (bajo el peritoneo de la pared lateral de la pelvis)", "rosa": false, "seguro": false, "nota": "Cilindro azul seccionado bajo el peritoneo parietal; alternativa: vasos ilíacos. El rojo sin número de la base es la a. uterina."}, {"n": "6", "nombre": "Trompa uterina (seccionada, en el borde superior libre del ligamento ancho)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Ovario (suspendido de la hoja posterior del ligamento ancho)", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Mesosálpinx (porción del ligamento ancho entre trompa y mesovario)", "rosa": false, "seguro": true}, {"n": "11", "nombre": "Mesovario (pliegue corto que une el ovario a la hoja posterior)", "rosa": false, "seguro": true}, {"n": "12", "nombre": "Mesometrio (ligamento ancho propiamente dicho, del útero a la pared pélvica)", "rosa": false, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P30", "imagen": null, "clave": "c", "que_pregunto": "Ovario sin imagen: 'el mesovario se forma por desdoblamiento de la hoja posterior del ligamento ancho y se sitúa por detrás del borde posterior del ovario' → falsa (es el borde ANTERIOR/mesovárico del ovario el que se une al mesovario). Cierta: a. ovárica ← aorta, ligamento suspensorio, anastomosis con la rama ovárica de la uterina.", "img_key": null}, {"examen": "mayo 2026", "pregunta": "P32", "imagen": 9, "clave": "c", "que_pregunto": "HSG: opción b 'la trompa posee su meso por debajo del borde superior' dada por falsa — la trompa forma el borde superior libre del ligamento ancho (6 en este esquema).", "img_key": "mayo-09"}], "pack": "Ligamento ancho = doble hoja peritoneal: mesometrio (12) del útero a la pared pélvica, cuya base (parametrio) contiene la a. uterina cruzando sobre el uréter (5) y el ligamento cardinal; mesosálpinx (10) con las anastomosis tubáricas de aa. uterina y ovárica y el epoóforo; mesovario (11) por el que entran al hilio ovárico los vasos del ligamento suspensorio (a. ovárica ← aorta L2) y del ligamento propio (rama ovárica de la uterina). Venas: plexo uterino → ilíaca interna; pampiniforme → v. ovárica (VCI / renal izquierda). El ovario NO está cubierto de peritoneo (epitelio germinal): el ovocito cae a la cavidad peritoneal y lo captan las fimbrias.", "trampa": "Confundir mesosálpinx (trompa) con mesovario (ovario); decir que el ovario es intraperitoneal (está desnudo, unido por el mesovario por su borde anterior); y el cilindro rojo de la base (a. uterina) no lleva número: no inventarlo.", "prioridad": 2}, {"key": "R2G-p14", "pagina": 14, "item": 13, "tipo": "imagen", "titulo": "¿Qué diferencia hay? Mamografía MLO: mama grasa (a) vs mama densa (c)", "que_se_ve": "Dos mamografías MLO: (a) mama radiotransparente, casi toda grasa, con finas líneas curvas (ligamentos de Cooper y vasos) y el pectoral en la esquina superior; (c) mama heterogéneamente densa, con áreas blancas nodulares de tejido fibroglandular. Letras a y c impresas en la esquina de cada placa.", "etiquetas": [{"n": "a", "nombre": "Mama grasa / adiposa (involución adiposa, típica de postmenopáusica): parénquima sustituido por grasa radiotransparente, se ven los ligamentos de Cooper como líneas finas; máxima sensibilidad mamográfica", "rosa": true, "seguro": true}, {"n": "c", "nombre": "Mama densa (fibroglandular abundante, típica de joven / nulípara / THS): áreas blancas que pueden enmascarar un tumor; menor sensibilidad mamográfica y factor de riesgo de cáncer", "rosa": true, "seguro": true}], "pregunta": {"enunciado": "¿Qué diferencia hay entre estas imágenes?", "opciones": [], "respuesta": "a = mama grasa (radiotransparente); c = mama densa (fibroglandular, radiopaca)", "razonamiento": "La densidad mamográfica depende de la proporción de tejido fibroglandular (atenúa los rayos X: blanco) frente a grasa (los deja pasar: gris oscuro). Con la edad y la menopausia los lóbulos involucionan y se sustituyen por grasa (imagen a), lo que hace la mamografía muy sensible: un nódulo se ve blanco sobre fondo negro. En la mujer joven o con tratamiento hormonal predomina el tejido glandular (imagen c, categoría BI-RADS c/d), que puede ocultar lesiones (por eso en jóvenes se prefiere la ecografía) y además es factor de riesgo independiente de cáncer. La anatomía subyacente es la misma en ambas: piel, zona premamaria, zona mamaria, zona retromamaria y pectoral."}, "examen": [{"examen": "mayo 2026", "pregunta": "sin pregunta en la permutación transcrita (imagen de reserva)", "imagen": 13, "clave": "—", "que_pregunto": "Imagen 13 = mamografía doble MLO/CC; junto con p7 y p11 es la lámina de mama candidata a caer (proyección, zonas, densidad).", "img_key": "mayo-13"}], "pack": "Mama: 15-20 lóbulos → conductos galactóforos → senos lactíferos retroareolares; unidad ductolobulillar terminal cubierta por células mioepiteliales contráctiles (mayo 2026 P5c cierta). Ligamentos de Cooper: tabiques fibrosos de la fascia superficial a la dermis que atraviesan la zona premamaria; se elongan con la edad y la lactancia (ptosis) — 'misma longitud toda la vida' es falsa (P4d). Irrigación torácica interna + torácica lateral + intercostales; linfa 97 % axila (Berg I-III), 3 % mamaria interna.", "trampa": "Decir que la mama densa es 'más fácil de leer' (es al revés); confundir las líneas curvas de Cooper de la mama grasa con espículas; y el bloque de mama del examen va en catalán (Morgagni = tubérculos de la areola, Duret = crestas).", "prioridad": 2}, {"key": "R2G-p15", "pagina": 15, "item": 14, "tipo": "identifica", "titulo": "Útero y anejos in situ, vista superior (Rohen-Yokochi)", "que_se_ve": "Fotografía de disección (Rohen) de la pelvis femenina vista desde arriba/delante: vejiga con el uraco en el vértice arriba (anterior), útero en el centro con trompas y ovarios a los lados, ligamentos redondos como cordones blancos hacia arriba-lateral, uréteres seccionados y recto/sigma abajo (posterior). Rosas: 1, 2, 3, 4, 8, 10, 11, 14; en negro: 5, 6, 7 (bilateral), 9, 12, 13 y las repeticiones 2, 3, 4 del lado derecho.", "etiquetas": [{"n": "1", "nombre": "Fondo del útero", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Trompa uterina, istmo (junto al cuerno uterino; etiquetada a ambos lados)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Ligamento propio del ovario (útero-ovárico; etiquetado a ambos lados)", "rosa": true, "seguro": true}, {"n": "4", "nombre": "Ovario (etiquetado a ambos lados)", "rosa": true, "seguro": true}, {"n": "5", "nombre": "Fimbrias de la trompa (dos líneas al extremo franjeado)", "rosa": false, "seguro": false, "nota": "La porción ancha entre 2 y 5 es la ampolla; alternativa para el 5: ampolla."}, {"n": "6", "nombre": "Infundíbulo / orificio abdominal de la trompa (extremo libre)", "rosa": false, "seguro": false}, {"n": "7", "nombre": "Uréter (seccionado; etiquetado a ambos lados, bajo la trompa)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Recto (unión rectosigmoidea, cara anterior)", "rosa": true, "seguro": true}, {"n": "9", "nombre": "Uraco (ligamento umbilical medio) en el vértice de la vejiga", "rosa": false, "seguro": true}, {"n": "10", "nombre": "Vejiga urinaria (cara superior, peritonizada)", "rosa": true, "seguro": true}, {"n": "11", "nombre": "Ligamento redondo del útero (cordón blanco del cuerno hacia el anillo inguinal profundo)", "rosa": true, "seguro": true}, {"n": "12", "nombre": "Mesosálpinx / ampolla de la trompa izquierda", "rosa": false, "seguro": false, "nota": "La línea acaba en el borde superior del anejo izquierdo, medial al ovario."}, {"n": "13", "nombre": "Mesovario (unión del ovario a la hoja posterior del ligamento ancho)", "rosa": false, "seguro": false}, {"n": "14", "nombre": "Fondo de saco rectouterino (Douglas) / pliegue rectouterino, entre la cara posterior del útero y el recto", "rosa": true, "seguro": false}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P34", "imagen": null, "clave": "c", "que_pregunto": "Ligamentos del útero: el redondo (11) NO fija el útero a la pared abdominal posterior (va al conducto inguinal); los cardinales sí anclan a las paredes laterales.", "img_key": null}, {"examen": "mayo 2026", "pregunta": "P22", "imagen": 3, "clave": "d", "que_pregunto": "Uréter (7) cruza por detrás de la a. uterina en la mujer (cierta).", "img_key": "mayo-03"}], "pack": "Orientación: vejiga (10) con uraco (9) = anterior; recto (8) = posterior; entre vejiga y útero el fondo de saco vesicouterino y entre útero y recto el de Douglas (14), el más declive. Útero: a. uterina (← ilíaca interna) cruza por encima del uréter (7) a nivel del cérvix y sube por el borde lateral; ovario (4): a. ovárica (← aorta L2) por el ligamento suspensorio + rama ovárica de la uterina por el ligamento propio (3). Venas: plexo uterino → ilíaca interna; v. ovárica → VCI / renal izquierda. Linfa: ovario y fondo → lumbares; cuerpo → ilíacos externos; cérvix → ilíacos internos; por el ligamento redondo (11) algo de linfa del cuerno va a inguinales superficiales. El ligamento redondo sale del cuerno POR DELANTE de la trompa, cruza los vasos ilíacos externos, entra por el anillo inguinal profundo y termina en el labio mayor.", "trampa": "Ligamento redondo (11, hacia delante, al conducto inguinal — caso 17) vs ligamento propio del ovario (3, hacia el ovario) vs ligamento suspensorio (a la pared pélvica, con los vasos); y 14: es el fondo de saco RECTOUTERINO, nunca 'rectovesical' en la mujer.", "prioridad": 2}, {"key": "R2G-p16", "pagina": 16, "item": 15, "tipo": "caso", "titulo": "Caso 15 · Vaginismo", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 32 años ingresa en el hospital aquejada de espasmos dolorosos en la vagina. La exploración física muestra la presencia de varias contracciones involuntarias de la musculatura vaginal. La paciente también refiere coitos dolorosos. ¿Cuál de los siguientes problemas describe mejor los signos de esta paciente?", "opciones": [{"letra": "a", "texto": "Compresión del nervio pudendo.", "correcta": false, "razon": "Produce dolor perineal neuropático (neuralgia del pudendo, sentado) y anestesia/incontinencia, no contracciones involuntarias de la musculatura vaginal."}, {"letra": "b", "texto": "Disrupción del cuerpo perineal.", "correcta": false, "razon": "Da laxitud perineal y prolapso (rectocele/cistocele), lo contrario del espasmo."}, {"letra": "c", "texto": "Vaginismo.", "correcta": true, "razon": "CORRECTA. Vaginismo = contracción involuntaria, refleja y dolorosa de la musculatura del tercio inferior de la vagina y del suelo pélvico (bulboesponjoso, elevador del ano) que impide o hace doloroso el coito (dispareunia) y la exploración."}, {"letra": "d", "texto": "Endometriosis.", "correcta": false, "razon": "Causa dispareunia profunda y dolor pélvico cíclico por implantes (Douglas, uterosacros), pero no espasmos musculares visibles en la exploración."}, {"letra": "e", "texto": "Fibroma del útero.", "correcta": false, "razon": "Mioma: masa uterina, menorragia y síntomas por compresión; no espasmos vaginales."}], "respuesta": "c", "razonamiento": "El enunciado describe literalmente la definición de vaginismo: espasmo involuntario de los músculos perivaginales (bulboesponjoso, transversos, elevador del ano — los de la lámina p3) con dispareunia. La inervación somática de esa musculatura y del tercio inferior de la vagina es el n. pudendo (S2-S4): el reflejo es somático, no autónomo. Las otras opciones son causas de dolor pélvico pero no de contracciones involuntarias visibles. Caso de vocabulario clínico: Bermúdez lo reutiliza como 'quién inerva la musculatura que se contrae'."}, "examen": [], "pack": "Musculatura perivaginal (bulboesponjoso, transverso superficial, elevador del ano): inervación por el n. pudendo (ramas perineales, S2-S4) y ramas directas de S3-S4 para el elevador; irrigación por la a. perineal (← pudenda interna ← ilíaca interna). Vagina: 2/3 superiores con inervación autónoma (plexo uterovaginal: simpático L1-L2, parasimpático S2-S4), 1/3 inferior somática (n. pudendo, rama perineal profunda) → solo el tercio inferior duele al tacto.", "trampa": "Elegir 'compresión del pudendo' porque es el nervio de la zona: la compresión daría dolor/anestesia, no espasmo.", "prioridad": 1}, {"key": "R2G-p17", "pagina": 17, "item": 16, "tipo": "identifica", "titulo": "Ecografía transvaginal del útero, corte sagital (= S11 p19; imagen 10 de mayo 2026)", "que_se_ve": "Ecografía transvaginal (transductor en el fórnix: el cérvix queda en el campo cercano, arriba a la derecha; el fondo lejos, a la izquierda) con el útero en corte longitudinal: miometrio homogéneo y línea endometrial hiperecogénica central. Cuatro círculos rosas 1-4. El título 'Identifica las arterias segmentarias' es un error de copia del Reto 1 (riñón): la imagen es el útero.", "etiquetas": [{"n": "1", "nombre": "Fondo del útero", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Endometrio (línea hiperecogénica central de la cavidad)", "rosa": true, "seguro": true}, {"n": "3", "nombre": "Cuerpo del útero (miometrio)", "rosa": true, "seguro": true}, {"n": "4", "nombre": "Cérvix (cuello uterino, próximo al transductor)", "rosa": true, "seguro": true}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P33", "imagen": 10, "clave": "d (a y c)", "que_pregunto": "Misma eco con letras: a) A fondo, B endometrio, C cuerpo, D cérvix (cierta); b) 'se relaciona posteriormente con el tabique úterovaginal' (falsa: el tabique rectovaginal es relación de la VAGINA); c) irrigado por a. uterina (← ilíaca interna), a. del ligamento redondo (← epigástrica inferior ← ilíaca externa) y a. ovárica (← aorta) (cierta) → d.", "img_key": "mayo-10"}], "pack": "Irrigación triple del útero: a. uterina (← ilíaca interna; cruza por delante y encima del uréter) → ramas arcuatas en el miometrio → radiales → basales y espirales del endometrio (las espirales se desprenden en la menstruación); a. ovárica (← aorta) anastomosada en el mesosálpinx; a. del ligamento redondo (← epigástrica inferior ← ilíaca externa). Venas: plexo uterino → vv. uterinas → v. ilíaca interna. Linfa: fondo → lumbares (+ inguinales por el ligamento redondo), cuerpo → ilíacos externos, cérvix → ilíacos internos y sacros. Relaciones posteriores del cuerpo: Douglas, recto y asas de delgado; anteriores: vejiga (vesicouterino). Posición: anteversión + anteflexión (caso 4). Endometrio: fino postmenstrual, trilaminar periovulatorio, grueso secretor.", "trampa": "Atribuir al cuerpo uterino el tabique rectovaginal (relación de la vagina); olvidar la a. del ligamento redondo en la irrigación; y no ver que a y c son ciertas a la vez (clave 'd'). Transvaginal = más definición, menos campo; transabdominal usa la vejiga llena como ventana.", "prioridad": 3}, {"key": "R2G-p18", "pagina": 18, "item": 17, "tipo": "caso", "titulo": "Caso 17 · Contenido del conducto inguinal femenino", "que_se_ve": "Diapositiva de texto, sin imagen. La estructura se ve en la p15 (Rohen, número 11 = ligamento redondo).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 32 años ingresa en el hospital por una masa palpable por encima del ligamento inguinal. En la exploración física se diagnostica la presencia de una hernia inguinal indirecta. Debido a la gravedad de la hernia, se realiza una reparación abierta de la misma. ¿Cuál de las siguientes estructuras puede encontrar el cirujano en el conducto inguinal?", "opciones": [{"letra": "a", "texto": "Ligamento redondo del útero.", "correcta": true, "razon": "CORRECTA. El ligamento redondo (gubernáculo femenino) sale del cuerno uterino por delante de la trompa, cruza los vasos ilíacos externos, entra por el anillo inguinal profundo, recorre el conducto inguinal y termina deshilachado en el labio mayor. Es el contenido del conducto inguinal femenino junto con el n. ilioinguinal y la rama genital del genitofemoral."}, {"letra": "b", "texto": "Uraco.", "correcta": false, "razon": "Ligamento umbilical medio: del vértice de la vejiga al ombligo, en la línea media bajo el peritoneo; nunca entra en el conducto inguinal."}, {"letra": "c", "texto": "Ligamento suspensorio del ovario.", "correcta": false, "razon": "Va del polo superior del ovario a la pared pélvica lateral, hacia arriba (lleva los vasos ováricos); es la parte del gubernáculo que NO desciende."}, {"letra": "d", "texto": "Trompa uterina.", "correcta": false, "razon": "Intrapélvica, en el borde superior del ligamento ancho; solo excepcionalmente puede formar parte del contenido de un saco herniario, no es contenido normal del conducto."}, {"letra": "e", "texto": "Mesosalpinx", "correcta": false, "razon": "Meso peritoneal de la trompa, intrapélvico."}], "respuesta": "a", "razonamiento": "El gubernáculo femenino no arrastra el ovario fuera de la pelvis (se ancla en el cuerno uterino), y su porción distal persiste como ligamento redondo, que sigue el mismo trayecto que el cordón espermático en el varón: anillo inguinal profundo (lateral a los vasos epigástricos inferiores) → conducto inguinal → anillo superficial → labio mayor. Una hernia inguinal indirecta en la mujer sigue ese trayecto y el cirujano encuentra el ligamento redondo (a veces con un divertículo peritoneal acompañante, el conducto de Nuck). El ligamento redondo recibe la a. del ligamento redondo (← epigástrica inferior), tercera fuente de irrigación del útero."}, "examen": [{"examen": "mayo 2026", "pregunta": "P34", "imagen": null, "clave": "c", "que_pregunto": "Opción a 'el ligamento redondo fija el útero a la pared abdominal posterior' = falsa: va hacia delante, al conducto inguinal, y mantiene la anteversión.", "img_key": null}, {"examen": "mayo 2026", "pregunta": "P33", "imagen": 10, "clave": "d", "que_pregunto": "Irrigación del útero incluye la a. del ligamento redondo (rama de la epigástrica inferior ← ilíaca externa).", "img_key": "mayo-10"}], "pack": "Ligamento redondo: irrigado por la a. del ligamento redondo (← epigástrica inferior ← ilíaca externa; equivalente de la a. cremastérica); acompañado en el conducto por la rama genital del n. genitofemoral (L1-L2) y el n. ilioinguinal (L1) que inerva el labio mayor. Por él discurren linfáticos del cuerno uterino hacia los ganglios inguinales superficiales (por eso un cáncer de fondo uterino puede dar adenopatía inguinal).", "trampa": "Confundir ligamento redondo (al conducto inguinal) con ligamento propio del ovario (útero ↔ ovario) y suspensorio (ovario ↔ pared pélvica): los tres son restos del gubernáculo/mesonefros y Bermúdez los mezcla.", "prioridad": 2}, {"key": "R2G-p19", "pagina": 19, "item": 18, "tipo": "identifica", "titulo": "Ecografía transvaginal del ovario con folículos (= S11 p22-23; imagen 8 de mayo 2026)", "que_se_ve": "Ecografía transvaginal (sector de alta frecuencia, transductor arriba) de un ovario: estroma ecogénico con varias estructuras anecoicas redondeadas de distinto tamaño = folículos antrales en desarrollo; el mayor sería el dominante. Sin números; la pregunta es 'identifica el órgano'.", "etiquetas": [{"n": "órgano", "nombre": "Ovario (edad reproductiva) con folículos anecoicos; el más grande = folículo dominante", "rosa": true, "seguro": true}], "pregunta": {"enunciado": "Identifica el órgano de la imagen", "opciones": [], "respuesta": "Ovario", "razonamiento": "Se reconoce por las estructuras anecoicas (negras, con refuerzo posterior) redondeadas de pocos milímetros dentro de un estroma ecogénico ovalado de ~3 × 2 × 1 cm: son folículos con líquido antral. Ningún otro órgano pélvico tiene ese aspecto 'en queso'. Por la nitidez de los folículos y el sector estrecho de alta frecuencia se trata de una eco TRANSVAGINAL (mayo 2026 P29c 'transabdominal' = falsa). Múltiples folículos pequeños periféricos ('collar de perlas') con estroma aumentado sugerirían ovario poliquístico; un folículo > 20 mm, preovulatorio. Volumen: ~10 cc en edad reproductiva (máx. 20), ~6 cc postmenopausia."}, "examen": [{"examen": "mayo 2026", "pregunta": "P29", "imagen": 8, "clave": "b", "que_pregunto": "A = ovario. a) fosa de Krause limitada por detrás por uréter y vasos ilíacos EXTERNOS (falsa: son los INTERNOS); b) se fija a la pelvis por el ligamento suspensorio, al útero por el ligamento propio y a la trompa por el infundíbulo-ovárico (CORRECTA); c) eco transabdominal (falsa: transvaginal).", "img_key": "mayo-08"}], "pack": "Ovario: a. ovárica ← aorta abdominal (L2, bajo las renales), retroperitoneal, cruza por delante del uréter y entra por el ligamento suspensorio (infundíbulo-pélvico); se anastomosa con la rama ovárica de la a. uterina (← ilíaca interna) que llega por el ligamento propio. Venas: plexo pampiniforme → v. ovárica derecha a la VCI, izquierda a la v. renal izquierda. Linfa: lumbares/paraaórticos (caso 5). Inervación: plexo ovárico (simpático T10-T11, parasimpático vagal); dolor referido periumbilical. Fijación: ligamento suspensorio (pared pélvica, vasos), ligamento propio (cuerno uterino), ligamento infundíbulo-ovárico/fimbria ovárica (trompa) y mesovario (ligamento ancho). Fosa ovárica de Krause (nulípara): delante vasos ilíacos externos, detrás uréter + vasos ilíacos internos, en el suelo el n. obturador.", "trampa": "Transabdominal por transvaginal; ilíacos externos por internos en la fosa de Krause; linfa a inguinales/ilíacos (es a lumbares); v. ovárica izquierda 'a la VCI' (es a la renal izquierda).", "prioridad": 3}, {"key": "R2G-p20", "pagina": 20, "item": 19, "tipo": "caso", "titulo": "Caso 19 · Localización más frecuente del embarazo ectópico", "que_se_ve": "Diapositiva de texto, sin imagen. La anatomía de la trompa está en la p4 (HSG) y p9 (Netter).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 32 años ingresa en el hospital con dolor abdominal inferior intenso, junto con temperatura elevada. En la exploración física se observa de inmediato que la pared abdominal es sensible a la palpación. El hemograma muestra leucocitosis, y se establece el diagnóstico de peritonitis. Una laparotomía exploradora muestra la presencia de un embarazo ectópico roto. ¿Cuál de las siguientes localizaciones es la más frecuente de un embarazo ectópico?", "opciones": [{"letra": "a", "texto": "Dentro del orificio cervical interno.", "correcta": false, "razon": "El embarazo cervical es rarísimo (< 1 %); el interior del útero (aunque sea cerca del orificio interno) no se considera ectópico salvo que sea cervical."}, {"letra": "b", "texto": "Pared del intestino.", "correcta": false, "razon": "El embarazo abdominal (implantación en peritoneo, epiplón o intestino) es < 1-2 %, generalmente secundario a un aborto tubárico."}, {"letra": "c", "texto": "Trompa uterina.", "correcta": true, "razon": "CORRECTA. ≈95-98 % de los ectópicos son tubáricos, y dentro de la trompa la AMPOLLA es la localización más frecuente (≈70-80 %), seguida del istmo; el intersticial/cornual es el más peligroso por sangrado."}, {"letra": "d", "texto": "Mesenterio del intestino.", "correcta": false, "razon": "Variante de embarazo abdominal, excepcional."}, {"letra": "e", "texto": "Superficie del ovario.", "correcta": false, "razon": "El embarazo ovárico es ≈1-3 %; el ovocito suele fecundarse ya dentro de la ampolla."}], "respuesta": "c", "razonamiento": "La fecundación ocurre en la ampolla de la trompa y el cigoto tarda 3-4 días en llegar al útero; cualquier retraso (salpingitis previa, cirugía tubárica, DIU, técnicas de reproducción) hace que se implante en la trompa, sobre todo en la ampolla. La pared tubárica es fina y sin decidua: entre la 6ª y 8ª semana se rompe y sangra a la cavidad peritoneal (hemoperitoneo que se acumula en el Douglas: culdocentesis positiva, caso 11) con dolor, irritación peritoneal y shock. Bermúdez enlaza esto con la HSG de p4 y con el detalle de que la cavidad peritoneal femenina comunica con el exterior a través de la trompa (vía de la peritonitis ascendente)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P31", "imagen": null, "clave": "a", "que_pregunto": "Trompa sin imagen: 'en el istmo tiene lugar la fecundación' = falsa (ampolla); 'se comunica con el útero por el orificio abdominal' = falsa; 'irrigada solamente por la rama tubárica de la uterina' = falsa; cierta: a pesar de sus ligamentos es móvil.", "img_key": null}], "pack": "Trompa: porciones intramural → istmo → ampolla (fecundación y ectópico) → infundíbulo con fimbrias, abierta a la cavidad peritoneal (orificio abdominal). Irrigación: rama tubárica de la a. uterina (← ilíaca interna) + rama tubárica de la a. ovárica (← aorta), anastomosadas en el mesosálpinx; venas a vv. ováricas (lateral) y plexo uterovaginal (medial); linfa a lumbares; inervación por el plexo uterovaginal y ovárico (T10-L1 / S2-S4).", "trampa": "'Istmo' como sitio de fecundación o de ectópico más frecuente (es la ampolla); 'orificio abdominal' para comunicar con el útero (es el uterino).", "prioridad": 2}, {"key": "R2G-p21", "pagina": 21, "item": 20, "tipo": "identifica", "titulo": "Pelvis femenina, corte sagital medio (Rohen-Yokochi) — imagen 19 de mayo 2026", "que_se_ve": "Fotografía de disección (Rohen) de una hemipelvis femenina en corte sagital: anterior a la IZQUIERDA (pared abdominal, sínfisis, vejiga, uretra, vulva), posterior a la DERECHA (sigma, recto, conducto anal). Útero antevertido y anteflexo apoyado en la vejiga, vagina descendiendo oblicua entre uretra y recto. Números 6-16 a la izquierda y 21-32 a la derecha; rosas: 8, 9, 10, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 29. Misma lámina, mismos números y mismos círculos que la Imagen 19 del examen de mayo 2026 (P27 preguntó 9, 12, 23 y 26).", "etiquetas": [{"n": "6", "nombre": "Omento mayor / asas de intestino delgado (íleon) en la parte alta de la cavidad", "rosa": false, "seguro": false, "nota": "La línea acaba en una lámina peritoneal translúcida sobre asas de delgado."}, {"n": "7", "nombre": "M. recto del abdomen (pared abdominal anterior)", "rosa": false, "seguro": true}, {"n": "8", "nombre": "Útero (cuerpo y fondo, en anteversión sobre la vejiga)", "rosa": true, "seguro": true}, {"n": "9", "nombre": "Fondo de saco vesicouterino (reflexión peritoneal vejiga → útero)", "rosa": true, "seguro": true, "nota": "Preguntado en mayo 2026 P27."}, {"n": "10", "nombre": "Vejiga urinaria (vacía, pared plegada)", "rosa": true, "seguro": true}, {"n": "11", "nombre": "Sínfisis del pubis (anillo blanco = disco interpúbico y hueso)", "rosa": true, "seguro": true}, {"n": "12", "nombre": "Fórnix anterior de la vagina (SIN recubrimiento peritoneal)", "rosa": true, "seguro": true, "nota": "Preguntado en mayo 2026 P27: la trampa fue 'peritonizado'."}, {"n": "13", "nombre": "Uretra (≈4 cm, adherida a la pared anterior de la vagina)", "rosa": true, "seguro": true}, {"n": "14", "nombre": "Clítoris (cuerpo/glande, bajo la sínfisis)", "rosa": true,

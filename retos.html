 "nota": "Lámina Netter sagital A-E: surco mamario, Cooper, fascia pectoral, niveles de Berg, perforantes de la mamaria interna."}}}, "fuentes": {"P1": {"fuente": "P1", "titulo": "Práctica P1-DGU · Cavidad bucal, labios, dientes, lengua, glándulas salivares, faringe y esófago", "resumen_examen": "Las prácticas P1-P3 son guiones de texto puro (5+6+4 páginas, 0 imágenes). En 2026 NINGUNA de las 41 imágenes de los exámenes salió de las prácticas y tampoco hubo preguntas literales de los guiones (F2 §1.1 y §1.2; analisis-P3-practica §1.2). Sirven SOLO como checklist de vocabulario: cada estructura que el guion pide reconocer es una etiqueta posible en las láminas de seminarios/retos, y aquí se le cuelga el dato de irrigación/relación que Bermúdez pregunta sobre ella según el glosario VID y los exámenes. P1 cubre el digestivo supradiafragmático: en enero 2026 cayeron de ESTE vocabulario (con imagen de seminario/reto, no de la práctica) el molar → V2 (P63), la amígdala palatina del istmo (P66), la parótida y la carótida externa (P64), la lesión del XII (P68) y el estrechamiento broncoaórtico del esófago (P69).", "paginas": [{"key": "P1-p01", "pagina": 1, "item": null, "tipo": "teoria", "titulo": "Cavidad bucal: vestíbulo, techo (paladar), pared lateral (mejilla) y suelo (región sublingual)", "que_se_ve": "Página de texto: objetivos y fundamentos; lista de estructuras del vestíbulo, paladar duro/blando, mejillas y suelo de la boca.", "etiquetas": [{"n": "1", "nombre": "Surcos vestibulares (labiogingivales)", "rosa": false, "seguro": true, "nota": "Límite entre labio/mejilla y encía; el vestíbulo es el espacio entre dientes y labios/mejillas."}, {"n": "2", "nombre": "Frenillos labiales superior e inferior", "rosa": false, "seguro": true, "nota": "Pliegues falciformes medios del vestíbulo."}, {"n": "3", "nombre": "Orificio del conducto de Stenon (parotídeo)", "rosa": false, "seguro": true, "nota": "Desemboca en el vestíbulo frente al 2º molar SUPERIOR tras perforar el bucinador. Relación clave de la parótida (nervio facial VII la atraviesa)."}, {"n": "4", "nombre": "Espacios retromolares e interdentarios", "rosa": false, "seguro": true, "nota": "Comunicación vestíbulo ↔ cavidad bucal propiamente dicha con la boca cerrada."}, {"n": "5", "nombre": "Paladar duro: rafe medio, papila incisiva, pliegues transversos", "rosa": false, "seguro": true, "nota": "Irrigación: a. palatina mayor ← palatina descendente ← maxilar ← carótida externa; sensibilidad V2 (n. nasopalatino y palatino mayor)."}, {"n": "6", "nombre": "Paladar blando: músculos estafilinos, amígdala palatina, pilares", "rosa": false, "seguro": true, "nota": "Motor: todo el VAGO (X) excepto el tensor del velo (V3). Sensitivo V2. Pilares = arcos palatogloso y palatofaríngeo; entre ellos la amígdala palatina (img 2 de enero, P66 → b)."}, {"n": "7", "nombre": "Mejilla: m. bucinador, bola adiposa de Bichat, conducto parotídeo", "rosa": false, "seguro": true, "nota": "Bucinador ← VII (motor) y lo perfora el conducto de Stenon; sensibilidad de la mejilla n. bucal (V3)."}, {"n": "8", "nombre": "Región sublingual: frenillo lingual, repliegue franjeado, rodete del geniogloso, venas raninas, carúnculas sublinguales", "rosa": false, "seguro": true, "nota": "En las carúnculas desemboca el conducto de Wharton (submandibular). Venas raninas = vv. linguales profundas visibles bajo la lengua (absorción sublingual). Suelo de boca = posición ecográfica submentoniana (img 4 de enero, P65 → c)."}], "pregunta": null, "examen": [], "pack": "Cavidad bucal: ramas de la maxilar y la facial ← carótida externa; venas → plexo pterigoideo / facial → yugular interna; linfa → submandibulares y submentonianos → cervicales profundos; sensibilidad V2 (techo) y V3 (suelo, mejilla, dientes inferiores).", "trampa": "Confundir Stenon (parótida, vestíbulo, 2º molar superior) con Wharton (submandibular, carúncula sublingual).", "prioridad": 1}, {"key": "P1-p02", "pagina": 2, "item": null, "tipo": "teoria", "titulo": "Labios, lengua (mucosa y musculatura), dientes y glándulas salivales menores", "que_se_ve": "Página de texto: labios, mucosa y músculos linguales, tipos de dientes (32) y componentes del diente, glándulas salivales menores.", "etiquetas": [{"n": "1", "nombre": "Labios superior e inferior: comisura, hendidura bucal, surcos labiales, frenillos", "rosa": false, "seguro": true, "nota": "Irrigación aa. labiales superior e inferior ← facial ← carótida externa; linfa del labio inferior → submentonianos/submandibulares."}, {"n": "2", "nombre": "Mucosa lingual: papilas, 'V' lingual (surco terminal), amígdala lingual, agujero ciego", "rosa": false, "seguro": true, "nota": "Delante de la V: sensibilidad general n. lingual (V3) + gusto cuerda del tímpano (VII). Detrás de la V: IX (general + gusto). Agujero ciego = origen del conducto tirogloso. Amígdala lingual = parte del anillo de Waldeyer."}, {"n": "3", "nombre": "Musculatura lingual: septum y aponeurosis lingual, mm. intrínsecos y extrínsecos", "rosa": false, "seguro": true, "nota": "Todos ← HIPOGLOSO (XII) excepto el palatogloso (X). Lesión del XII: la lengua se desvía HACIA el lado lesionado + atrofia (img 5 de enero, P68 → d)."}, {"n": "4", "nombre": "Dientes: incisivos, caninos, premolares (1º-2º), molares (1º-3º) — 32 definitivos", "rosa": false, "seguro": true, "nota": "Inervación: superiores ← ramos alveolares superiores ← V2 (img 1 de enero, P63 → d); inferiores ← n. alveolar inferior ← V3. Linfa cruzada: maxilares → cervicales profundos, mandibulares → submandibulares."}, {"n": "5", "nombre": "Componentes del diente: esmalte (blanco), dentina (amarillenta), cemento (gris), cavidad pulpar", "rosa": false, "seguro": true, "nota": "Vasos y nervios entran por el agujero apical a la pulpa (aa. alveolares ← maxilar)."}, {"n": "6", "nombre": "Glándulas salivales menores: labiales, yugales, molares, palatinas, linguales", "rosa": false, "seguro": true, "nota": "Yugales = cara medial de las mejillas; molares junto al 3er molar superior. Secreción parasimpática vía VII (cuerda del tímpano / petroso mayor) y IX."}], "pregunta": null, "examen": [], "pack": "Lengua: a. lingual ← carótida externa; v. lingual → yugular interna; linfa punta → submentonianos, cuerpo → submandibulares ipsilaterales, raíz → cervicales profundos bilaterales; motor XII, sensitivo V3 (2/3 ant) + IX (1/3 post), gusto VII (cuerda del tímpano) + IX.", "trampa": "Desviación de la lengua: hacia el lado LESIONADO (el geniogloso sano empuja). Sensibilidad general 2/3 anteriores = lingual (V3), no VII.", "prioridad": 1}, {"key": "P1-p03", "pagina": 3, "item": null, "tipo": "teoria", "titulo": "Glándulas salivales mayores (parótida, submandibular, sublingual) y faringe: generalidades y rinofaringe (inicio)", "que_se_ve": "Página de texto: relaciones de parótida, submandibular y sublingual; definición de faringe (base de cráneo a borde inferior del cricoides, C6), estructura y paredes anterior/inferior de la rinofaringe.", "etiquetas": [{"n": "1", "nombre": "Parótida: celda parotídea (región parotideomaseterina)", "rosa": false, "seguro": true, "nota": "La CARÓTIDA EXTERNA se bifurca DENTRO de la parótida (temporal superficial + maxilar) — img 3 de enero, P64 → a. También la atraviesan el n. facial (VII, plano más superficial) y la v. retromandibular."}, {"n": "2", "nombre": "Relaciones de la parótida: n. facial [VII], n. auriculotemporal, a. carótida externa, vv. yugular externa y retromandibular", "rosa": false, "seguro": true, "nota": "Parasimpático secretor: IX → n. timpánico → petroso menor → ganglio ÓTICO → auriculotemporal (V3). Sensitiva de la fascia: n. auricular mayor (C2-C3)."}, {"n": "3", "nombre": "Conducto de Stenon", "rosa": false, "seguro": true, "nota": "Sale del borde anterior, cruza el masetero, perfora el bucinador y desemboca frente al 2º molar superior."}, {"n": "4", "nombre": "Submandibular: celda submaxilar, prolongación anterior", "rosa": false, "seguro": true, "nota": "Irrigación a. facial (submentoniana) ← carótida externa; la a. facial pasa por la celda submandibular."}, {"n": "5", "nombre": "Conducto de Wharton; nn. lingual e hipogloso", "rosa": false, "seguro": true, "nota": "El n. LINGUAL cruza el conducto de Wharton (por encima y lateral → luego medial); el XII va por debajo. Sialografía: la submandibular es la que se ve en la Rx lateral con conducto ascendente."}, {"n": "6", "nombre": "Sublingual: relación con vasos linguales y n. hipogloso", "rosa": false, "seguro": true, "nota": "Bajo la mucosa del suelo de boca; a. sublingual ← lingual. Parasimpático de submandibular y sublingual: cuerda del tímpano (VII) + lingual → ganglio submandibular."}, {"n": "7", "nombre": "Conducto sublingual mayor (Rivinus/Bartolino) y conductos menores (Walther)", "rosa": false, "seguro": true, "nota": "El mayor desemboca junto al Wharton en la carúncula; los menores en el repliegue sublingual."}, {"n": "8", "nombre": "Faringe: base de cráneo → borde inferior del cricoides (C6); aponeurosis cervical profunda y espacio retrofaríngeo", "rosa": false, "seguro": true, "nota": "Motor: plexo faríngeo (X) salvo el estilofaríngeo (IX). Sensitivo: rinofaringe V2, orofaringe IX (reflejo nauseoso), laringofaringe X."}, {"n": "9", "nombre": "Estructura: fascias, mm. longitudinales y constrictores, hiatos, mucosa", "rosa": false, "seguro": true, "nota": "Hiatos entre constrictores: por el superior-medio pasa el estilofaríngeo (IX); por el medio-inferior el n. laríngeo interno (X); bajo el inferior el recurrente."}, {"n": "10", "nombre": "Rinofaringe: pared anterior = coanas; pared inferior = velo del paladar", "rosa": false, "seguro": true, "nota": "Se extiende de la base de cráneo al velo del paladar."}], "pregunta": null, "examen": [], "pack": "Glándulas salivales: parótida ← temporal superficial/auricular posterior ← carótida externa; submandibular ← facial; sublingual ← lingual. Venas → retromandibular/facial → yugular interna. Linfa → parotídeos / submandibulares → cervicales profundos. Parasimpático: parótida IX (ótico), submandibular-sublingual VII (cuerda del tímpano, ganglio submandibular).", "trampa": "Poner al VII como nervio secretor de la parótida (es el IX). Situar la bifurcación carotídea fuera de la parótida.", "prioridad": 1}, {"key": "P1-p04", "pagina": 4, "item": null, "tipo": "teoria", "titulo": "Faringe: rinofaringe (paredes posterior, superior y lateral), orofaringe y laringofaringe", "que_se_ve": "Página de texto: paredes de la rinofaringe (occipital, amígdala faríngea, trompa auditiva y sus pliegues, fosita de Rosenmüller), orofaringe (istmo de las fauces, valécula, amígdalas palatinas) y laringofaringe (aditus, recesos piriformes, C4-C6).", "etiquetas": [{"n": "1", "nombre": "Rinofaringe, pared posterior: parte basilar del occipital, membrana atlantooccipital anterior, nódulos linfoides", "rosa": false, "seguro": true, "nota": "Relación con C1-C2 y el espacio retrofaríngeo (abscesos)."}, {"n": "2", "nombre": "Pared superior: amígdala faríngea (adenoides), fosita faríngea, hipófisis faríngea", "rosa": false, "seguro": true, "nota": "Amígdala faríngea = parte superior del anillo de Waldeyer (con tubáricas, palatinas y lingual)."}, {"n": "3", "nombre": "Pared lateral: orificio de la trompa auditiva (Eustaquio)", "rosa": false, "seguro": true, "nota": "Vía de la otitis media desde una faringitis (caso R1D p18). Se abre por el elevador y tensor del velo al deglutir."}, {"n": "4", "nombre": "Pliegue salpingopalatino (anterior) y salpingofaríngeo (posterior); rodete tubárico y rodete del elevador", "rosa": false, "seguro": true, "nota": "El rodete del elevador es el relieve del m. elevador del velo del paladar bajo el orificio tubárico."}, {"n": "5", "nombre": "Amígdalas tubáricas", "rosa": false, "seguro": true, "nota": "Tejido linfoide alrededor del orificio de la trompa (Waldeyer)."}, {"n": "6", "nombre": "Receso faríngeo (fosita de Rosenmüller)", "rosa": false, "seguro": true, "nota": "Detrás del rodete tubárico; localización típica del carcinoma de cavum (nasofaringe) → linfa a cervicales profundos superiores/retrofaríngeos."}, {"n": "7", "nombre": "Orofaringe (velo del paladar → epiglotis): istmo de las fauces y raíz de la lengua", "rosa": false, "seguro": true, "nota": "Sensibilidad IX (glosofaríngeo) → dispara el reflejo de deglución/nauseoso."}, {"n": "8", "nombre": "Pliegues glosoepiglóticos medial y laterales; valécula epiglótica", "rosa": false, "seguro": true, "nota": "Valécula = entre base de la lengua y epiglotis, donde se enclavan cuerpos extraños; sensibilidad n. laríngeo interno (X)."}, {"n": "9", "nombre": "Fosa amigdalina y amígdalas palatinas", "rosa": false, "seguro": true, "nota": "Entre arcos palatogloso y palatofaríngeo; irrigación a. tonsilar ← facial (+ palatina ascendente, lingual dorsal, faríngea ascendente); linfa → yugulodigástrico (cervical profundo). Img 2 de enero (P66 → b)."}, {"n": "10", "nombre": "Orofaringe, pared posterior: C1-C3, nódulos linfoides", "rosa": false, "seguro": true, "nota": "Rinofaringe C1-C2 · orofaringe C1-C3 · laringofaringe C4-C6."}, {"n": "11", "nombre": "Laringofaringe (epiglotis → borde inferior del cricoides, C6): relieve laríngeo y aditus laríngeo", "rosa": false, "seguro": true, "nota": "Termina en el esfínter esofágico superior (constrictor inferior/cricofaríngeo)."}, {"n": "12", "nombre": "Recesos piriformes (canales faringolaríngeos) con el relieve del n. laríngeo superior (rama interna)", "rosa": false, "seguro": true, "nota": "A ambos lados del aditus; el n. laríngeo interno levanta el pliegue del receso → cuerpos extraños y anestesia local."}, {"n": "13", "nombre": "Pared posterior C4-C6; pared inferior: rodete muscular que separa faringe de esófago", "rosa": false, "seguro": true, "nota": "= esfínter esofágico superior (cricofaríngeo), primer estrechamiento del esófago (C6, 15 cm de los incisivos)."}], "pregunta": null, "examen": [], "pack": "Faringe: aa. faríngea ascendente, palatina ascendente (facial), ramas de la maxilar y tiroidea inferior; plexo faríngeo venoso → yugular interna; linfa retrofaríngeos y cervicales profundos (yugulodigástrico para la amígdala); motor X (salvo estilofaríngeo IX), sensitivo V2/IX/X por pisos.", "trampa": "Anillo de Waldeyer: faríngea + tubáricas + palatinas + lingual. Confundir valécula (delante de la epiglotis) con receso piriforme (a los lados de la laringe).", "prioridad": 1}, {"key": "P1-p05", "pagina": 5, "item": null, "tipo": "teoria", "titulo": "Esófago: origen, desembocadura, estrechamientos y porciones", "que_se_ve": "Página de texto: esófago de 23-26 cm desde el borde inferior del constrictor inferior (cricoides, C6) hasta el cardias (D10-D11, izquierda de la línea media); tres estrechamientos y tres porciones.", "etiquetas": [{"n": "1", "nombre": "Origen: borde inferior del constrictor inferior de la faringe, frente al cricoides y C6 (se desplaza una vértebra con la posición de la cabeza)", "rosa": false, "seguro": true, "nota": "Esfínter esofágico superior = cricofaríngeo (estriado)."}, {"n": "2", "nombre": "Desembocadura: cardias, parte medial del tercio superior del estómago, a la izquierda de la línea media, a la altura de D10-D11", "rosa": false, "seguro": true, "nota": "EEI fisiológico: relajación por fibras vagales inhibidoras que liberan NO (fisio, caído)."}, {"n": "3", "nombre": "Estrechamiento cricoideo (cervical, EES): a 15 cm de los incisivos (C6), por el constrictor inferior", "rosa": false, "seguro": true, "nota": "Primer estrechamiento; cuerpos extraños."}, {"n": "4", "nombre": "Estrechamiento broncoaórtico (torácico): a 23 cm de los incisivos, por el bronquio principal IZQUIERDO y el arco aórtico (D4)", "rosa": false, "seguro": true, "nota": "El 'segmento B' del esofagograma de la img 7 de enero (P69 → c). Además, la aurícula IZQUIERDA contacta con el esófago por delante (cardiomegalia → disfagia, P70)."}, {"n": "5", "nombre": "Estrechamiento diafragmático: a 40 cm de los incisivos, por el hiato esofágico (D10)", "rosa": false, "seguro": true, "nota": "Hiato esofágico en el pilar DERECHO del diafragma (D10); por él pasan los troncos vagales anterior y posterior."}, {"n": "6", "nombre": "Porciones: cervical, torácica, abdominal", "rosa": false, "seguro": true, "nota": "Irrigación por segmentos: cervical ← tiroidea inferior (subclavia); torácica ← ramas esofágicas de la aorta y bronquiales; abdominal ← gástrica izquierda (tronco celíaco). Venas: tiroidea inferior / ácigos-hemiácigos (cava superior) / gástrica izquierda (PORTA) → varices esofágicas."}], "pregunta": null, "examen": [], "pack": "Esófago: cervical ← a. tiroidea inferior ← tronco tirocervical ← subclavia; torácico ← aorta torácica; abdominal ← a. gástrica izquierda ← tronco celíaco. Venas: tiroidea inferior → braquiocefálica; ácigos/hemiácigos → cava superior; gástrica izquierda → porta (anastomosis porto-cava). Linfa: cervicales profundos / mediastínicos posteriores / gástricos izquierdos-celíacos. Inervación: plexo esofágico vagal (X) + simpático torácico; plexo mientérico de Auerbach.", "trampa": "Cambiar el bronquio (es el IZQUIERDO) o la vértebra (D4) del estrechamiento medio; poner 3 estrechamientos a distancias equivocadas (15-23-40 cm).", "prioridad": 1}]}, "P2": {"fuente": "P2", "titulo": "Práctica P2-DGU · Cavidad abdominal, división topográfica, compartimentos supra e inframesocólico, anatomía seccional", "resumen_examen": "Las prácticas P1-P3 son guiones de texto puro (5+6+4 páginas, 0 imágenes). En 2026 NINGUNA de las 41 imágenes de los exámenes salió de las prácticas y tampoco hubo preguntas literales de los guiones (F2 §1.1 y §1.2; analisis-P3-practica §1.2). Sirven SOLO como checklist de vocabulario: cada estructura que el guion pide reconocer es una etiqueta posible en las láminas de seminarios/retos, y aquí se le cuelga el dato de irrigación/relación que Bermúdez pregunta sobre ella según el glosario VID y los exámenes. P2 es el guion del abdomen: su vocabulario es exactamente el de las láminas que sí cayeron en enero 2026 (hiato de Winslow P1, lig. redondo P77, colédoco tras D1/F P6, porciones del duodeno P3/P5/P9, vólvulo de sigma y ciego P16, recto y canal anal P17, fondos de saco P18, omento menor img 20). El único dato de la práctica que Bermúdez aprovecha literalmente es el vocabulario quirúrgico ('introduciendo el dedo por el hiato de Winslow…').", "paginas": [{"key": "P2-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada y objetivos de la práctica P2 (solo texto de objetivos)", "prioridad": 0}, {"key": "P2-p02", "pagina": 2, "item": null, "tipo": "teoria", "titulo": "Paredes del abdomen, nueve regiones, puntos de Murphy y McBurney, peritoneo y clasificación de las vísceras", "que_se_ve": "Página de texto: paredes esqueléticas/musculoaponeuróticas, las 9 regiones abdominales, puntos anatomoclínicos, localización peritoneal de las vísceras digestivas y clasificación intra/retro/subperitoneal; pliegues peritoneales.", "etiquetas": [{"n": "1", "nombre": "Regiones: epigastrio, mesogastrio (umbilical), hipogastrio; hipocondrios, flancos y fosas ilíacas derecha/izquierda", "rosa": false, "seguro": true, "nota": "Planos subcostal (L3) y transtubercular (L5) + líneas medioclaviculares. Plano transpilórico L1: píloro, cuello del páncreas, hilios renales, origen de la AMS. Lámina R2D p3 (9 cuadrantes, aún no caída)."}, {"n": "2", "nombre": "Punto de Murphy", "rosa": false, "seguro": true, "nota": "Fondo vesicular: intersección del reborde costal derecho con la línea medioclavicular (9º cartílago costal); dolor de colecistitis; sensibilidad peritoneal por el frénico derecho → hombro."}, {"n": "3", "nombre": "Punto de McBurney", "rosa": false, "seguro": true, "nota": "Unión del tercio lateral con los dos mediales de la línea espina ilíaca anterosuperior–ombligo = base del apéndice (a. apendicular ← ileocólica ← AMS); dolor referido inicial periumbilical T10."}, {"n": "4", "nombre": "Vísceras intraperitoneales", "rosa": false, "seguro": true, "nota": "Estómago, bazo, hígado (salvo área desnuda), yeyuno-íleon, transverso, sigma, ciego, D1 proximal: tienen meso y se MUEVEN (vólvulo de sigma y ciego, P16 de enero)."}, {"n": "5", "nombre": "Vísceras retroperitoneales primarias y secundarias", "rosa": false, "seguro": true, "nota": "Primarias: riñones, suprarrenales, uréteres, aorta/VCI. Secundarias (fascias de coalescencia de Toldt/Treitz): duodeno D2-D4, páncreas, colon ascendente y descendente → FIJOS."}, {"n": "6", "nombre": "Vísceras subperitoneales", "rosa": false, "seguro": true, "nota": "Vejiga, próstata, vesículas seminales, útero-vagina bajos, recto inferior: bajo el peritoneo pélvico (fondos de saco rectovesical / rectouterino de Douglas, P18)."}, {"n": "7", "nombre": "Pliegues peritoneales", "rosa": false, "seguro": true, "nota": "Mesos, epiplones y ligamentos (página siguiente); los pliegues umbilicales (medio = uraco, mediales = aa. umbilicales, laterales = vasos epigástricos inferiores)."}], "pregunta": null, "examen": [], "pack": "Pared abdominal: aa. epigástricas superior (torácica interna) e inferior (ilíaca externa); peritoneo parietal sensible por los nervios somáticos intercostales T7-T12 (dolor localizado) frente al visceral (referido: foregut epigastrio, midgut periumbilical, hindgut hipogastrio).", "trampa": "Confundir retroperitoneal primario (riñón) con secundario (páncreas, D2-D4, ascendente, descendente). Meter el transverso o el sigma entre los fijos.", "prioridad": 1}, {"key": "P2-p03", "pagina": 3, "item": null, "tipo": "teoria", "titulo": "Mesos, epiplones, ligamentos; supra/inframesocólico y supra/inframesentérico; transcavidad (Winslow); estómago e hígado", "que_se_ve": "Página de texto: mesocolon transverso, mesenterio, mesosigma, epiplones mayor y menor, ligamentos; división por la raíz del mesocolon transverso y del mesenterio; hiato de Winslow y transcavidad; estómago (caras, curvaturas, porciones, píloro, pliegues) e hígado (caras, lóbulos, área desnuda, ligamentos, pedículo, VCI).", "etiquetas": [{"n": "1", "nombre": "Mesos: mesocolon transverso, mesenterio, mesosigma", "rosa": false, "seguro": true, "nota": "Raíz del mesenterio: de la flexura duodenoyeyunal (izquierda de L2) a la unión ileocecal (15 cm), cruza D3, aorta, VCI y uréter derecho. Raíz del mesocolon transverso: cruza D2, cabeza del páncreas y riñón izquierdo."}, {"n": "2", "nombre": "Epiplón (omento) mayor y menor; ligamentos", "rosa": false, "seguro": true, "nota": "Omento menor = hepatogástrico + hepatoduodenal (borde libre = pedículo hepático: porta detrás, colédoco derecha, a. hepática propia izquierda). Omento mayor: gastrocólico + gastroesplénico (vasos cortos y gastroomentales izquierdos, P8 mayo) + gastrofrénico. Img 20 de enero: 2 = omento menor."}, {"n": "3", "nombre": "Vísceras supramesocólicas / inframesocólicas (raíz del mesocolon transverso)", "rosa": false, "seguro": true, "nota": "Supra: esófago abdominal, estómago, hígado, vesícula, bazo, D1 y parte de páncreas. Infra: yeyuno-íleon, colon, D3-D4."}, {"n": "4", "nombre": "Vísceras supramesentéricas (espacio mesentérico-cólico derecho) / inframesentéricas (izquierdo)", "rosa": false, "seguro": true, "nota": "La raíz del mesenterio, oblicua de arriba-izquierda a abajo-derecha, divide el inframesocólico; el espacio izquierdo se abre a la pelvis (pus baja a Douglas)."}, {"n": "5", "nombre": "Hiato de Winslow (foramen omental)", "rosa": false, "seguro": true, "nota": "Único acceso a la bolsa omental. Límites: delante lig. hepatoduodenal (porta, colédoco, hepática), detrás VCI, arriba lóbulo caudado, abajo D1. Dedo en el hiato: PORTA delante, CAVA detrás (P1 enero → a falsa: 'tiene por delante la cava'). Maniobra de Pringle."}, {"n": "6", "nombre": "Transcavidad de los epiplones (bolsa omental)", "rosa": false, "seguro": true, "nota": "Detrás del estómago y del omento menor, delante del páncreas; úlcera perforada de la pared posterior gástrica → peritonitis en la bolsa omental."}, {"n": "7", "nombre": "Esófago abdominal", "rosa": false, "seguro": true, "nota": "2-3 cm, a la izquierda de la línea media, ← a. gástrica izquierda; venas → gástrica izquierda → porta (varices)."}, {"n": "8", "nombre": "Estómago: caras anterior y posterior, curvaturas mayor y menor", "rosa": false, "seguro": true, "nota": "Curvatura menor: gástricas izquierda (TC) y derecha (hepática); mayor: gastroomentales derecha (gastroduodenal) e izquierda (esplénica); fundus: aa. cortas ← esplénica (P74 enero → a)."}, {"n": "9", "nombre": "Fundus, cuerpo, antro pilórico; unión cardioesofágica y píloro; pliegues de la mucosa", "rosa": false, "seguro": true, "nota": "Píloro en L1 (transpilórico), señalado por la v. prepilórica de Mayo. Linfa: todo → celíacos (cuerpo → celíacos, P mayo). Vago ↑ HCl (vagotomía)."}, {"n": "10", "nombre": "Hígado: caras visceral y diafragmática; lóbulos y cisuras; área desnuda", "rosa": false, "seguro": true, "nota": "Cara visceral en 'H': lóbulo caudado (entre lig. venoso y VCI) y cuadrado (entre lig. redondo y vesícula). Área desnuda entre las hojas del lig. coronario, contacta con VCI y diafragma."}, {"n": "11", "nombre": "Ligamentos coronario, falciforme, triangulares; ligamento redondo y cordón fibroso de Arancio", "rosa": false, "seguro": true, "nota": "Lig. REDONDO = v. umbilical obliterada, fisura sagital izquierda anterior (img 8 de enero, P77 → b). Lig. VENOSO de Arancio = ductus venoso (VCI ↔ v. umbilical), fisura sagital izquierda posterior. Falciforme lleva el redondo a la pared."}, {"n": "12", "nombre": "Pedículo hepático: v. porta, a. hepática, vía biliar extrahepática", "rosa": false, "seguro": true, "nota": "En el lig. hepatoduodenal: colédoco a la derecha, a. hepática propia a la izquierda, porta detrás. A. hepática propia ← hepática común ← tronco celíaco; cística ← hepática derecha (triángulo de Calot)."}, {"n": "13", "nombre": "Vena cava inferior", "rosa": false, "seguro": true, "nota": "Surco de la cara posterior del hígado; recibe las 3 venas hepáticas (derecha, media, izquierda) justo bajo el diafragma."}], "pregunta": null, "examen": [], "pack": "Hígado: a. hepática propia (25 %) + porta (75 %) → sinusoides → 3 vv. hepáticas → VCI. Estómago: dos arcos (curvaturas) + cortas al fundus; venas → porta/esplénica/VMS; linfa → celíacos; vago (HCl) / esplácnico mayor T6-T9 (dolor epigástrico).", "trampa": "Hiato de Winslow: cava DETRÁS, porta DELANTE. Redondo = umbilical, Arancio = ductus venoso (no al revés). Vasos cortos en el gastroesplénico (no en el gastrocólico).", "prioridad": 1}, {"key": "P2-p04", "pagina": 4, "item": null, "tipo": "teoria", "titulo": "Vesícula y vías biliares, bazo, complejo duodeno-páncreas, yeyuno-íleon y raíz del mesenterio", "que_se_ve": "Página de texto: vesícula (forma, hepático-cístico-colédoco, desembocadura en D2, válvulas de Heister), bazo (caras, bordes, hilio), duodeno-páncreas (porciones, pliegues, carúnculas, ángulo duodenoyeyunal, partes del páncreas, vasos esplénicos, formación de la porta), yeyuno-íleon (extremos fijos, raíz del mesenterio) y yeyuno.", "etiquetas": [{"n": "1", "nombre": "Vesícula biliar: fondo, cuerpo, cuello; forma", "rosa": false, "seguro": true, "nota": "Fondo en el punto de Murphy (9º cartílago costal); a. cística ← hepática DERECHA (75 %) en el triángulo de Calot; linfa → nodo cístico → hepáticos → celíacos."}, {"n": "2", "nombre": "Vías biliares: conducto hepático común, cístico y colédoco; desembocadura en la 2ª porción del duodeno (papila mayor de Vater)", "rosa": false, "seguro": true, "nota": "Colédoco: supraduodenal (lig. hepatoduodenal, derecha de la hepática), retroduodenal (DETRÁS de D1, P6 enero → 'detrás de F = colédoco'), retropancreático (surco de la cabeza) e intramural (ampolla + Oddi). Colédoco distal → linfa pancreatoduodenales. CPRE img 12 de enero (P80 → d)."}, {"n": "3", "nombre": "Válvulas de Heister (pliegues espirales del cístico)", "rosa": false, "seguro": true, "nota": "Mucosa espiral del conducto cístico; dificultan la canulación y el paso de cálculos."}, {"n": "4", "nombre": "Bazo: cara diafragmática (externa) y visceral; bordes anterior (almenado/crenado) y posterior; hilio esplénico", "rosa": false, "seguro": true, "nota": "Intraperitoneal, en el hipocondrio izquierdo (costillas 9-11); cara visceral con impresiones gástrica, renal, cólica y la cola del páncreas en el hilio. A. esplénica ← tronco celíaco; v. esplénica → porta; linfa → esplénicos → celíacos. Ángulo esplénico del colon deja huella en él."}, {"n": "5", "nombre": "Duodeno: porciones D1 (bulbo, L1), D2 (descendente), D3 (horizontal, L3), D4 (ascendente); pliegues circulares de Kerckring", "rosa": false, "seguro": true, "nota": "D2: posterior hilio renal DERECHO, vasos renales y uréter derecho (P3 enero: 'D no se relaciona con el uréter izquierdo'); la raíz del mesocolon transverso la cruza. D3: pinza aortomesentérica AMS-aorta (Wilkie, P4 enero). Retroperitoneal secundario salvo D1 proximal (fascia de Treitz)."}, {"n": "6", "nombre": "Carúnculas duodenales mayor (Vater: colédoco + Wirsung, esfínter de Oddi) y menor (Santorini)", "rosa": false, "seguro": true, "nota": "En la cara posteromedial de D2; la papila mayor marca el límite foregut/midgut: proximal ← tronco celíaco (PD superior ← gastroduodenal), distal ← AMS (PD inferior)."}, {"n": "7", "nombre": "Ángulo duodenoyeyunal (flexura de Treitz)", "rosa": false, "seguro": true, "nota": "A la izquierda de L2, sostenido por el m. suspensorio del duodeno (Treitz); origen de la raíz del mesenterio; referencia de la hemorragia digestiva alta/baja."}, {"n": "8", "nombre": "Partes del páncreas: cabeza, proceso uncinado, cuello, cuerpo, cola", "rosa": false, "seguro": true, "nota": "Cabeza en el marco duodenal; uncinado DETRÁS de la AMS/VMS; cuello DELANTE de la porta; cuerpo cruza aorta, AMS, riñón y suprarrenal izquierdos; cola en el hilio esplénico (lig. esplenorrenal). Lámina R3D p4."}, {"n": "9", "nombre": "Relaciones con los vasos esplénicos", "rosa": false, "seguro": true, "nota": "A. esplénica tortuosa por el borde SUPERIOR del cuerpo-cola; v. esplénica recta por DETRÁS del cuerpo (donde recibe la VMI)."}, {"n": "10", "nombre": "Formación de la vena porta", "rosa": false, "seguro": true, "nota": "VMS + v. esplénica (+ VMI, en la esplénica) DETRÁS del cuello del páncreas, L1-L2 (casos R3D p7-p8: tumor de cuello → porta → hígado). Lámina R3D p11."}, {"n": "11", "nombre": "Yeyuno-íleon: dos extremos fijos (ángulo duodenoyeyunal y válvula ileocecal); raíz del mesenterio", "rosa": false, "seguro": true, "nota": "Intraperitoneal y móvil, fijo SOLO por la raíz del mesenterio (15 cm, de Treitz a la FID). Irrigación exclusiva AMS → yeyunales e ileales (caso R3D p15: íleon = primer órgano isquémico)."}, {"n": "12", "nombre": "Yeyuno: parte superior e izquierda de la cavidad abdominal", "rosa": false, "seguro": true, "nota": "Pliegues de Kerckring altos ('pila de monedas' en el tránsito, img 15 de enero: B = yeyuno)."}], "pregunta": null, "examen": [], "pack": "Vías biliares: cística ← hepática derecha; colédoco distal ← PD superior (gastroduodenal); venas → porta; linfa → císticos/hepáticos y pancreatoduodenales → celíacos. Páncreas: cabeza/cuello = arcadas PD (TC + AMS), cuerpo/cola = esplénica; venas espejo → porta/VMS/esplénica. Bazo: eje esplénico completo (TC → porta → celíacos).", "trampa": "Uréter/riñón IZQUIERDO como relación posterior de D2 (es el DERECHO). Situar la porta delante del cuello (está detrás). Cística de la hepática izquierda (es la derecha).", "prioridad": 1}, {"key": "P2-p05", "pagina": 5, "item": null, "tipo": "teoria", "titulo": "Yeyuno vs íleon, intestino grueso segmento a segmento, recto (inicio)", "que_se_ve": "Página de texto: diferencias yeyuno/íleon; características del colon (tenias, haustras); ciego, ascendente, ángulo hepático, transverso, ángulo esplénico, descendente, sigma; recto (S3 → flexura perineal, 2 flexuras sagitales y 3 coronales).", "etiquetas": [{"n": "1", "nombre": "Yeyuno: mayor calibre, más vascularizado, mesenterio delgado sin grasa", "rosa": false, "seguro": true, "nota": "Arcadas simples (1-2) y vasos rectos LARGOS; pared gruesa (Kerckring)."}, {"n": "2", "nombre": "Íleon: parte inferior y derecha; menor calibre, menos vascularizado, mesenterio con más grasa", "rosa": false, "seguro": true, "nota": "Arcadas múltiples (3-5) y vasos rectos CORTOS; placas de Peyer; termina en la válvula ileocecal (Bauhin). C = íleon en la img 15 de enero."}, {"n": "3", "nombre": "Intestino grueso: mayor diámetro, aspecto abollonado (haustras), tenias que comienzan en la base del apéndice, apéndices epiploicos", "rosa": false, "seguro": true, "nota": "Las 3 tenias convergen en la base del apéndice (guía quirúrgica). El recto no tiene tenias ni apéndices epiploicos."}, {"n": "4", "nombre": "Ciego: fosa ilíaca derecha, MÓVIL, rodeado de peritoneo; válvula ileocecal (Bauhin); desembocadura del apéndice", "rosa": false, "seguro": true, "nota": "Se vuelve (img 16 de enero, P16 → d). Irrigación: aa. cecales anterior/posterior ← ileocólica ← AMS; apéndice ← a. apendicular (mesoapéndice)."}, {"n": "5", "nombre": "Colon ascendente: sobre el m. ilíaco y la cara ventral del riñón derecho", "rosa": false, "seguro": true, "nota": "Retroperitoneal secundario (Toldt derecha) → fijo. ← cólica derecha + ileocólica (AMS)."}, {"n": "6", "nombre": "Ángulo hepático del colon: cara visceral del lóbulo derecho", "rosa": false, "seguro": true, "nota": "Impresión cólica del hígado; más bajo y abierto que el esplénico."}, {"n": "7", "nombre": "Colon transverso: su meso cruza D2, la cabeza del páncreas y el riñón izquierdo; divide supra/inframesocólico", "rosa": false, "seguro": true, "nota": "← a. cólica MEDIA (AMS) hasta los 2/3 (Cannon-Böhm), luego cólica izquierda (AMI). Se liga la cólica media para operarlo (caso R3D p16). Móvil pero vólvulo raro."}, {"n": "8", "nombre": "Ángulo esplénico del colon: hipocondrio izquierdo, huella en el bazo, fijo por el ligamento frenocólico; más agudo y alto que el hepático", "rosa": false, "seguro": true, "nota": "Zona 'watershed' (punto de Griffith) entre AMS y AMI → colitis isquémica. El lig. frenocólico sostiene el bazo ('sustentaculum lienis')."}, {"n": "9", "nombre": "Colon descendente: más profundo que el ascendente; borde convexo del riñón izquierdo", "rosa": false, "seguro": true, "nota": "Retroperitoneal secundario (Toldt izquierda) → fijo. ← cólica izquierda (AMI) — caso R3D p2 (hemorragia = rama de la AMI)."}, {"n": "10", "nombre": "Colon sigmoide: fosa ilíaca izquierda, disposición y movilidad variables; en S3 se continúa con el recto; la unión rectosigmoidea SUELE ser la más estrecha del intestino grueso", "rosa": false, "seguro": true, "nota": "Mesosigma largo → vólvulo más frecuente del adulto (P16). ← aa. sigmoideas (AMI); dolor referido T12-L1."}, {"n": "11", "nombre": "Recto: parte terminal, desde S3 (unión rectosigmoidea) hasta la flexura perineal; superficie externa lisa, sin apéndices epiploicos; 2 flexuras sagitales (sacra y perineal) y 3 coronales", "rosa": false, "seguro": true, "nota": "Flexura sacra (concavidad anterior) y flexura PERINEAL/anorrectal (asa del puborrectal, ~80°): img 17 de enero (P17 → d, A recto / B flexura perineal / C canal anal). Las flexuras laterales forman los pliegues de Houston."}], "pregunta": null, "examen": [], "pack": "Colon derecho: ileocólica, cólica derecha, cólica media ← AMS; VMS; mesentéricos superiores; vago. Colon izquierdo: cólica izquierda, sigmoideas, rectal superior ← AMI (L3); VMI → esplénica; mesentéricos inferiores; S2-S4. Recto: rectal superior (AMI) + media (ilíaca interna) + inferior (pudenda interna).", "trampa": "Trampa de movilidad: fijos = ascendente y descendente; móviles = ciego, transverso, sigma; se VUELVEN sigma y ciego. Punto más estrecho del grueso = unión rectosigmoidea (no el canal anal).", "prioridad": 1}, {"key": "P2-p06", "pagina": 6, "item": null, "tipo": "teoria", "titulo": "Recto (mucosa, ampolla, reflexiones peritoneales, tabiques, espacios) y canal anal", "que_se_ve": "Página de texto: pliegues transversales del recto, ampolla rectal sobre el diafragma pélvico, fondos de saco rectovesical/rectouterino, tabiques rectovesical/rectovaginal, espacio pelvirrectal superior; canal anal (diafragma pélvico → ano, puborrectal, 2,5-3,5 cm, esfínteres, cuerpo anococcígeo y perineal, elevador del ano, espacio isquiorrectal).", "etiquetas": [{"n": "1", "nombre": "Pliegues transversales del recto (Houston), producidos por las flexuras laterales", "rosa": false, "seguro": true, "nota": "Tres pliegues (superior y inferior a la izquierda, medio a la derecha, el de Kohlrausch a ~7 cm = límite del peritoneo anterior)."}, {"n": "2", "nombre": "Ampolla rectal: porción dilatada, sostenida por el diafragma pélvico (elevador del ano) y el lig. anococcígeo; retiene las heces", "rosa": false, "seguro": true, "nota": "Su distensión dispara el reflejo de defecación: relajación del esfínter INTERNO (liso) por parasimpático S2-S4; el simpático lumbar mantiene el tono."}, {"n": "3", "nombre": "Reflexiones peritoneales: fondo de saco rectovesical (♂) y rectouterino de Douglas (♀); fosas pararrectales", "rosa": false, "seguro": true, "nota": "Punto más declive de la cavidad peritoneal → líquidos patológicos (img 18 de enero, P18 → c). En ♀ no hay rectovesical (mayo P27 → todas falsas)."}, {"n": "4", "nombre": "Tabique rectovesical (fascia de Denonvilliers), rectovaginal y vaina rectal (fascia propia)", "rosa": false, "seguro": true, "nota": "Denonvilliers separa recto de próstata/vesículas seminales; plano de disección en cirugía rectal y prostática."}, {"n": "5", "nombre": "Espacio pelvirrectal superior", "rosa": false, "seguro": true, "nota": "Por ENCIMA del elevador del ano, subperitoneal (celda rectal)."}, {"n": "6", "nombre": "Canal anal: porción terminal del tubo digestivo, de la cara superior del diafragma pélvico al ano; empieza donde la ampolla se estrecha en la U del m. puborrectal; 2,5-3,5 cm", "rosa": false, "seguro": true, "nota": "C = canal anal en la img 17 de enero. La flexura perineal la MANTIENE activamente el puborrectal (continencia)."}, {"n": "7", "nombre": "Esfínter anal interno (liso, involuntario) y externo (estriado, voluntario)", "rosa": false, "seguro": true, "nota": "Interno: tono simpático (plexo hipogástrico), relajado por S2-S4. Externo: n. rectal inferior ← pudendo (S2-S4)."}, {"n": "8", "nombre": "Desciende entre el cuerpo/ligamento anococcígeo y el cuerpo perineal; colapsado salvo al defecar; superficie interna rugosa (columnas de Morgagni, línea pectínea)", "rosa": false, "seguro": true, "nota": "Línea pectínea: arriba rectal superior (AMI) / porta / ilíacos internos / visceral; abajo rectal inferior (pudenda interna) / cava / inguinales superficiales / pudendo (doloroso) — caso R3D p13 (ca. espinocelular → inguinales superficiales)."}, {"n": "9", "nombre": "Músculo elevador del ano (puborrectal, pubococcígeo, iliococcígeo)", "rosa": false, "seguro": true, "nota": "Diafragma pélvico; inervado por ramas directas S3-S4 (+ pudendo). El puborrectal forma el asa que cierra el ángulo anorrectal."}, {"n": "10", "nombre": "Espacio pelvirrectal (isquiorrectal) inferior", "rosa": false, "seguro": true, "nota": "Fosa isquioanal, por DEBAJO del elevador, con grasa y el conducto pudendo de Alcock (vasos y n. pudendo → rectales inferiores); abscesos perianales."}], "pregunta": null, "examen": [], "pack": "Recto/canal anal: rectal superior ← AMI; rectal media ← ilíaca interna; rectal inferior ← pudenda interna ← ilíaca interna (conducto de Alcock). Venas: rectal superior → VMI → porta; medias/inferiores → ilíaca interna → cava (hemorroides = anastomosis). Linfa: recto → mesentéricos inferiores / ilíacos internos; canal anal infrapectíneo → inguinales superficiales. Nervios: plexo hipogástrico inferior (visceral) y pudendo S2-S4 (esfínter externo, piel).", "trampa": "Confundir flexura perineal (ángulo del puborrectal) con 'fascia perineal' (P17 trampa literal). Espacio pelvirrectal superior (encima del elevador) vs inferior/isquiorrectal (debajo).", "prioridad": 1}]}, "P3": {"fuente": "P3", "titulo": "Práctica P3-DGU · Retroperitoneo, riñón, vías urinarias, sistema reproductor femenino y masculino", "resumen_examen": "Las prácticas P1-P3 son guiones de texto puro (5+6+4 páginas, 0 imágenes). En 2026 NINGUNA de las 41 imágenes de los exámenes salió de las prácticas y tampoco hubo preguntas literales de los guiones (F2 §1.1 y §1.2; analisis-P3-practica §1.2). Sirven SOLO como checklist de vocabulario: cada estructura que el guion pide reconocer es una etiqueta posible en las láminas de seminarios/retos, y aquí se le cuelga el dato de irrigación/relación que Bermúdez pregunta sobre ella según el glosario VID y los exámenes. P3 es solo una lista de epígrafes (situación, relaciones, segmentos) sin ningún dato: su valor es recordar QUÉ órganos hay que saber identificar en las láminas de S10/S11 y de los retos GU, de donde salieron 19 de las 21 imágenes de mayo 2026 (riñón/seno renal P1, arterias segmentarias P1, vasos renales P18, urografía P22, vejiga y Batson P23, uretra ♂ P24 y ♀ P25, retroperitoneo Rohen P26, próstata P14/P21, testículo P7/P8, ovario P29, trompa P32, útero P33, pelvis ♀ P27). Cada etiqueta lleva el dato VID/examen que Bermúdez cuelga del órgano.", "paginas": [{"key": "P3-p01", "pagina": 1, "item": null, "tipo": "teoria", "titulo": "Objetivos y riñón: situación, orientación, polos, bordes, seno renal, corteza/médula, pirámides/columnas, celda renal", "que_se_ve": "Página de texto: objetivos de la práctica (retroperitoneo, riñón, uréter, vejiga, uretras, pelvis, genitales) y epígrafes del riñón.", "etiquetas": [{"n": "1", "nombre": "Riñón: situación (retroperitoneal primario, T12-L3, el derecho más bajo por el hígado) y orientación (hilio anteromedial)", "rosa": false, "seguro": true, "nota": "Relaciones: 12ª costilla y diafragma (receso costodiafragmático), psoas, cuadrado lumbar; el DERECHO con hígado (receso de Morrison, img 1 mayo), D2 y ángulo hepático; el IZQUIERDO con bazo, páncreas, estómago, yeyuno y ángulo esplénico."}, {"n": "2", "nombre": "Polos superior (suprarrenal) e inferior; bordes lateral convexo y medial con el hilio", "rosa": false, "seguro": true, "nota": "Hilio de delante a atrás: Vena–Arteria–Uréter (VAU); la a. renal pasa POR DETRÁS de la vena (mayo P18 → b). V. renal izquierda pasa entre aorta y AMS y recibe la v. gonadal izquierda (varicocele)."}, {"n": "3", "nombre": "Seno renal", "rosa": false, "seguro": true, "nota": "Cavidad del hilio con vasos, nervios, grasa y la pelvis/cálices (hiperecogénico en eco: 'D = seno renal', mayo P1 → c)."}, {"n": "4", "nombre": "Corteza y médula renales; pirámides de Malpighi (papilas → cálices menores) y columnas de Bertin", "rosa": false, "seguro": true, "nota": "Lámina R1G p3 (corte coronal Netter, rosas 1, 2, 3, 8): cápsula/corteza, pirámide, columna de Bertin, pelvis — la gran candidata pendiente. Arterias: renal → segmentarias (5: superior, anterosuperior, anteroinferior, inferior, posterior; mayo P1 img 17) → interlobulares → arcuatas → interlobulillares."}, {"n": "5", "nombre": "Celda renal: cápsula fibrosa, grasa perirrenal, fascia renal de Gerota (hojas pre y retrorrenal), grasa pararrenal", "rosa": false, "seguro": true, "nota": "Mayo P19 (img 7, TC Weir R1G p24): 30 grasa pararrenal · 31 perirrenal · 39 pelvis. La celda NO son dos hojas de cápsula (trampa P18). Fascia de Zuckerkandl = hoja posterior."}], "pregunta": null, "examen": [], "pack": "Riñón: a. renal ← aorta (L1-L2), detrás de la vena; v. renal → VCI (la izquierda recibe gonadal y suprarrenal izquierdas); linfa → lumbares ipsilaterales; plexo renal (esplácnicos T10-L1) → dolor referido genitofemoral/T12-L1. Suprarrenal: 3 arterias (frénica inferior, aorta, renal) y UNA vena (derecha → VCI; izquierda → v. renal izquierda) — mayo P20.", "trampa": "Orden del hilio (VAU) y lado de la gonadal (izquierda → renal izquierda; derecha → VCI directa).", "prioridad": 1}, {"key": "P3-p02", "pagina": 2, "item": null, "tipo": "teoria", "titulo": "Conductos excretores, vejiga, uretra masculina y femenina, genitales externos femeninos", "que_se_ve": "Página de texto: cálices menores/mayores, pelvis, uréter; vejiga (situación, configuración, relaciones); uretra ♂ y ♀ (localización, segmentos, relaciones); vulva (monte del pubis, labios, clítoris, vestíbulo, bulbos, glándulas vestibulares).", "etiquetas": [{"n": "1", "nombre": "Cálices renales menores (8-12) → cálices mayores (2-3) → pelvis renal", "rosa": false, "seguro": true, "nota": "Urografía S10 p21 (mayo P22 → d): saber señalar cálices, pelvis, uréteres y vejiga. UroTAC: fase nefrográfica = mejor para tumores; excretora para la vía."}, {"n": "2", "nombre": "Uréter: abdominal (sobre el psoas, cruza los vasos ilíacos), pélvico e intramural; 3 estrecheces (unión pieloureteral, cruce ilíaco, meato)", "rosa": false, "seguro": true, "nota": "Pasa POR DETRÁS del conducto deferente ♂ y de la a. uterina ♀ ('agua bajo el puente', mayo P22). Irrigación en mosaico: renal/gonadal/aorta arriba, ilíaca interna abajo, anastomosis longitudinal parietal (no esqueletizar). Dolor referido genitofemoral T11-L2."}, {"n": "3", "nombre": "Vejiga: situación (subperitoneal, retropúbica, espacio de Retzius), configuración (vértice-uraco, cuerpo, fondo, cuello; trígono de Lieutaud), relaciones", "rosa": false, "seguro": true, "nota": "Detrás: vesículas seminales y recto ♂ / útero y vagina ♀. Eco suprapúbica (mayo P23 → b): drenaje venoso → plexo vesical → ilíacas internas Y plexos vertebrales de BATSON. Detrusor ← S2-S4; cuello ← simpático T11-L2. Aa. vesicales superiores ← umbilical ← ilíaca interna."}, {"n": "4", "nombre": "Uretra masculina: intramural (preprostática), prostática (verumontanum, eyaculadores), membranosa (esfínter externo), esponjosa (bulbar y peneana, fosa navicular)", "rosa": false, "seguro": true, "nota": "Uretrografía S10 p24 / R1G p22 (mayo P24 → c): A vejiga · B prostática · C membranosa · D bulbar · E esponjosa; los eyaculadores desembocan en la PROSTÁTICA (colículo seminal). Posterior ← vesical inferior/rectal media; anterior ← pudenda interna (a. del bulbo, dorsal del pene). Linfa: posterior → ilíacos internos; esponjosa → inguinales profundos."}, {"n": "5", "nombre": "Uretra femenina: 3-4 cm, en la pared ANTERIOR de la vagina, atraviesa el diafragma urogenital (esfínter externo) y se abre en el vestíbulo entre clítoris y vagina", "rosa": false, "seguro": true, "nota": "Cistouretrografía S10 p27 (mayo P25 → d, todas falsas). ← pudenda interna + a. vaginal; linfa → ilíacos internos y sacros (NUNCA inguinales); esfínter externo ← pudendo."}, {"n": "6", "nombre": "Monte del pubis y labios mayores", "rosa": false, "seguro": true, "nota": "Homólogos del escroto; en el labio mayor termina el lig. redondo. Piel → linfa inguinales superficiales. Anterior ← pudenda externa (femoral); posterior ← pudenda interna (labiales posteriores ← perineal)."}, {"n": "7", "nombre": "Hendidura vulvar, labios menores (ninfas), clítoris (cuerpos cavernosos, glande, prepucio, frenillo)", "rosa": false, "seguro": true, "nota": "Clítoris ← a. dorsal y profunda del clítoris ← pudenda interna; n. dorsal del clítoris ← pudendo; linfa glande/labios menores → inguinales profundos + ilíacos internos."}, {"n": "8", "nombre": "Vestíbulo de la vagina (meato uretral, orificio vaginal, himen), bulbos del vestíbulo, glándulas vestibulares mayores (Bartolino) y menores", "rosa": false, "seguro": true, "nota": "Bulbos = homólogos del bulbo esponjoso, cubiertos por el bulboesponjoso; Bartolino = homóloga de Cowper, en el extremo posterior del bulbo, desemboca junto al himen (bartolinitis). Todo perineal ← pudenda interna (conducto de Alcock) y n. pudendo S2-S4."}], "pregunta": null, "examen": [], "pack": "Uréter: renal/gonadal/aorta + ilíaca interna; linfa lumbares (abd.) e ilíacos (pelv.). Vejiga: vesicales superiores/inferiores ← ilíaca interna; plexo vesical → ilíaca interna + Batson; parasimpático S2-S4 (micción). Uretra ♂ posterior = territorio pélvico (ilíacos internos), esponjosa = perineal (pudenda interna, inguinales profundos). Vulva: pudenda externa (anterior) / pudenda interna (posterior); pudendo (Alcock) para casi todo lo somático.", "trampa": "Uretra femenina delante de la vagina (no detrás) y sin drenaje inguinal. Uréter siempre por detrás del deferente/a. uterina.", "prioridad": 1}, {"key": "P3-p03", "pagina": 3, "item": null, "tipo": "teoria", "titulo": "Ovario, trompa uterina, útero, vagina, testículo y epidídimo", "que_se_ve": "Página de texto: ovario (situación, relaciones), trompa (localización, segmentos, relaciones), útero (situación/posición, partes, relaciones, fondos de saco), vagina (localización, paredes, fondos, relaciones), testículo (situación, estructura) y epidídimo (estructura, segmentos, relaciones).", "etiquetas": [{"n": "1", "nombre": "Ovario: situación en la fosa ovárica (de Krause), relaciones (uréter y vasos ilíacos internos detrás, ilíacos externos arriba, obturador), ligamentos suspensorio (vasos ováricos), propio y mesoovario", "rosa": false, "seguro": true, "nota": "Eco transvaginal con folículos (mayo P29 → b, R2G p19). A. ovárica ← aorta (L2) + rama ovárica de la uterina; v. ovárica izquierda → v. RENAL izquierda, derecha → VCI; linfa → LUMBARES (nunca inguinales)."}, {"n": "2", "nombre": "Trompa uterina: en el borde superior del lig. ancho (mesosálpinx); segmentos intramural, istmo, ampolla (fecundación) e infundíbulo con fimbrias (abierto al peritoneo)", "rosa": false, "seguro": true, "nota": "HSG S11 p26-27 / R2G p4 (mayo P32 → c): drenaje venoso DOBLE → vv. ováricas + plexo uterovaginal; 'trompa de Eustaquio' es la trampa. Arterial doble: uterina + ovárica anastomosadas."}, {"n": "3", "nombre": "Útero: anteversión-anteflexión; partes: fondo, cuerpo, istmo, cérvix (porción supravaginal y hocico de tenca); relaciones (vejiga delante, recto detrás, uréter y a. uterina en el parametrio)", "rosa": false, "seguro": true, "nota": "Eco R2G p17 / S11 p19 (mayo P33 → d): A fondo · B endometrio · C cuerpo · D cérvix. Triple aporte: a. uterina ← ilíaca interna, a. ovárica ← aorta, a. del lig. redondo ← epigástrica inferior (ilíaca EXTERNA). El uréter pasa DEBAJO de la a. uterina a 1-2 cm del cérvix. Linfa segmentaria: fondo → lumbares; cuerpo → ilíacos externos; cérvix → ilíacos int/ext + sacros; lig. redondo → inguinales superficiales."}, {"n": "4", "nombre": "Fondos de saco peritoneales: vesicouterino (anterior) y rectouterino de Douglas (posterior, el más declive)", "rosa": false, "seguro": true, "nota": "En la mujer NO existe rectovesical (mayo P27 → todas falsas, R2G p21; enero P18). Culdocentesis por el fórnix posterior. Láminas R3D p12 y R1G p11."}, {"n": "5", "nombre": "Vagina: entre vejiga/uretra (delante) y recto/canal anal (detrás); paredes anterior y posterior; fondos de saco (fórnices) anterior, posterior (el más profundo, contacta con Douglas) y laterales (a. uterina y uréter a 1 cm)", "rosa": false, "seguro": true, "nota": "'Poco vascularizada' = FALSO: a. vaginal + rr. vaginales de la uterina + rectal media + pudenda interna (todas de la ilíaca interna). Inervación doble: plexo uterovaginal arriba, pudendo abajo. Linfa por tercios: superior → ilíacos, inferior → sacros, introito → inguinales superficiales."}, {"n": "6", "nombre": "Testículo: en el escroto, el izquierdo más bajo; túnica vaginal (visceral/parietal), albugínea, mediastino testicular, tabiques y lobulillos (túbulos seminíferos → rete testis → conos eferentes)", "rosa": false, "seguro": true, "nota": "Eco S11 p11-12 / R3G p19 (mayo P7 → c, P8 → b): 3 arterias (testicular ← aorta L2, deferencial ← vesical ← ilíaca interna, cremastérica ← epigástrica inferior); plexo pampiniforme → v. testicular (izquierda → renal izquierda: varicocele izquierdo); linfa → LUMBARES/paraaórticos (nunca inguinales, que son del escroto)."}, {"n": "7", "nombre": "Epidídimo: cabeza (conos eferentes), cuerpo y cola (→ conducto deferente); en el borde posterior del testículo; seno del epidídimo; apéndices (hidátides de Morgagni)", "rosa": false, "seguro": true, "nota": "Irrigación por ramas epididimarias de la a. testicular + anastomosis con la deferencial. Ecográficamente la cabeza se ve sobre el polo superior (lámina R3G p15, pendiente)."}], "pregunta": null, "examen": [], "pack": "Ovario y testículo = mismo esquema: arteria de la aorta (L2), vena izquierda a la renal izquierda, linfa lumbar. Útero/trompa/vagina = ilíaca interna (uterina, vaginal, pudenda interna) + ovárica, plexo uterovaginal → ilíaca interna, linfa segmentaria.", "trampa": "Cualquier 'solamente/únicamente' en irrigación o drenaje de trompa, útero o vagina es falso (todo es doble o triple). Linfa gonadal lumbar, no inguinal.", "prioridad": 1}, {"key": "P3-p04", "pagina": 4, "item": null, "tipo": "teoria", "titulo": "Escroto, cordón espermático, pene, conducto deferente, vesículas seminales, conducto eyaculador, próstata y glándulas bulbouretrales", "que_se_ve": "Página de texto: escroto (capas), cordón espermático (componentes, capas, relaciones), pene (estructura), deferente (segmentos, relaciones), vesículas seminales, conducto eyaculador (segmentos, relaciones), próstata (estructura, relaciones), glándulas bulbouretrales (localización).", "etiquetas": [{"n": "1", "nombre": "Escroto: capas piel – dartos – fascia espermática externa – cremáster – fascia espermática interna – túnica vaginal", "rosa": false, "seguro": true, "nota": "Eco S11 p12 (mayo P8 → b): A mediastino testicular · B escroto · C tabique escrotal · D tabiques testiculares. Piel escrotal → inguinales SUPERFICIALES; anterior ← pudenda externa (femoral), posterior ← pudenda interna (perineal); dartos contraído por el SIMPÁTICO; ramo genital del genitofemoral (cremáster), ilioinguinal, perineales y cutáneo femoral posterior."}, {"n": "2", "nombre": "Cordón espermático: conducto deferente, a. testicular, a. deferencial, a. cremastérica, plexo pampiniforme, linfáticos, plexo testicular (SNS T10-T11), ramo genital del genitofemoral, vestigio del proceso vaginal; capas = las del escroto (fascias espermáticas y cremáster)", "rosa": false, "seguro": true, "nota": "La opción correcta suele ser 'todos'. Anillo inguinal profundo lateral a los vasos epigástricos inferiores. Cremastérica ← epigástrica inferior (ilíaca EXTERNA); deferencial ← vesical superior/inferior (ilíaca interna)."}, {"n": "3", "nombre": "Pene: raíz (bulbo + pilares), cuerpo (2 cuerpos cavernosos + esponjoso con la uretra), glande; fascia de Buck (profunda) y de Colles/dartos (superficial); ligamentos suspensorio (→ sínfisis) y fundiforme (→ línea alba)", "rosa": false, "seguro": true, "nota": "Mayo P3 (fascia de Buck) y P12 (ligamentos) cayeron SIN imagen; lámina R3G p21 (corte transversal Rohen) pendiente. Eréctil/profundo ← pudenda interna (dorsales, cavernosas, del bulbo) bajo la fascia de Buck, laterales a la v. dorsal profunda → plexo de Santorini → ilíaca interna; piel ← pudendas externas → safena. Erección S2-S4 (nn. cavernosos), emisión L1-L2. Linfa: piel → inguinales superficiales; glande → profundos + ilíacos internos."}, {"n": "4", "nombre": "Conducto deferente: epididimario, funicular (cordón), inguinal, pélvico (cruza POR DELANTE del uréter, sobre la vejiga, hasta la ampolla deferencial medial a la vesícula seminal)", "rosa": false, "seguro": true, "nota": "A. deferencial ← vesical superior ← umbilical ← ilíaca interna (NUNCA de la ilíaca externa). Contracción en la emisión por simpático T12-L2. Vasectomía en el segmento funicular."}, {"n": "5", "nombre": "Vesículas seminales: detrás de la vejiga, lateral a la ampolla deferencial, delante del recto (fascia de Denonvilliers)", "rosa": false, "seguro": true, "nota": "← vesical inferior / rectal media ← ilíaca interna; plexo vesicoprostático; linfa → ilíacos internos; palpables por tacto rectal solo si patológicas."}, {"n": "6", "nombre": "Conducto eyaculador: ampolla deferencial + vesícula seminal → atraviesa la próstata → desemboca en el colículo seminal (verumontanum) de la uretra PROSTÁTICA", "rosa": false, "seguro": true, "nota": "Mayo P24: 'los eyaculadores desembocan en B = uretra prostática'. ~2 cm, segmento intraprostático."}, {"n": "7", "nombre": "Próstata: base bajo la vejiga, vértice sobre el diafragma urogenital; lóbulos/zonas (periférica = cáncer, transicional = HBP, central); relaciones: sínfisis y plexo de Santorini delante, recto detrás (tacto rectal), elevador del ano lateral", "rosa": false, "seguro": true, "nota": "Eco transrectal S11 p5-8 / R3G p17 (mayo P14 → b, P21 → d): ← vesical INFERIOR + rectal media + pudenda interna (todas de la ilíaca interna); vv. → plexo de Santorini → ilíaca interna y → Batson → metástasis vertebrales; linfa → ilíacos internos/externos y sacros; la vía transrectal tiene más resolución que la suprapúbica."}, {"n": "8", "nombre": "Glándulas bulbouretrales (Cowper): en el espesor del diafragma urogenital (m. transverso profundo), a los lados de la uretra membranosa; desembocan en la uretra bulbar/esponjosa", "rosa": false, "seguro": true, "nota": "Doble P: irrigación de las arterias del Pene (a. del bulbo/dorsal ← pudenda interna) e inervación por ramos del Pudendo (S2-S4). Homólogas de Bartolino."}], "pregunta": null, "examen": [], "pack": "Genitales masculinos: testículo/epidídimo = aorta-renal izquierda-lumbares; deferente y vesículas = umbilical/vesical (ilíaca interna) y plexo vesicoprostático; próstata = vesical inferior + rectal media + pudenda interna → Santorini/Batson; pene = pudenda interna bajo Buck (profundo) y pudenda externa (piel); Cowper = pudenda interna + pudendo.", "trampa": "Deferencial de la ilíaca externa (falso: es de la interna vía umbilical/vesical). Eyaculadores en la uretra membranosa (falso: prostática). Linfa testicular inguinal (falso: lumbar).", "prioridad": 1}]}, "R1D": {"fuente": "R1D", "titulo": "Reto 1 digestivo · Sistema digestivo supradiafragmático (boca, glándulas salivares, faringe, esófago)", "resumen_examen": "Fuente de máximo rendimiento en enero 2026: 6 de las 10 imágenes del anexo de digestivo salieron LITERALMENTE de este reto (img 1 = p4 panorámica → P63; img 2 = p3 fauces → P66; img 3 = p7 sialografía (gemela de S7 p6-7) → P64; img 5 = p6 suelo de boca → P62; img 6 = p9 nervios del suelo de la boca → P68; img 7 = p17 esofagograma → P69), y además 3 preguntas SIN imagen son clones de sus casos clínicos (P70 ≡ caso 1 aurícula izda-esófago; P68 ≡ caso 9 hipogloso; P63 ≡ caso 12 espejado a la arcada superior) y P67 usa el contenido de p14. En mayo 2026 no cayó nada de aquí (el bloque digestivo fue mayoritariamente R2/R3 + S8), así que el tribunal 'clona y rota'. Formato: lámina con letras A-D y una pregunta de relación (inervación, drenaje linfático, nivel del estrechamiento, anillo de Waldeyer) con opción 'todas/B y C correctas'. Láminas 'Identifica' que AÚN NO han caído y son candidatas (F2 §3.2): p12 (disección Rohen del suelo de la boca: lingual, hipogloso, milohioideo, parótida, sublingual, buccinador, Stenon), p14 (nasofaringe: orificio de la trompa, adenoides, rodete tubárico, receso faríngeo, vallécula) y p11 (dentición, seno maxilar, canal mandibular); casos no explotados: 4 (sonda → hiato), 7 (úvula → vago), 14 (anquiloglosia) y 17 (trompa auditiva).", "paginas": [{"key": "R1D-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada · Reto 1 Sistema digestivo supradiafragmático"}, {"key": "R1D-p02", "pagina": 2, "item": 1, "tipo": "caso", "titulo": "Caso 1 · Disfagia por dilatación de la aurícula izquierda", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 35 años ingresó en el hospital con dolor durante la deglución. Las técnicas de imagen muestran una dilatación de la aurícula izquierda. ¿Qué estructura está comprimida con mayor probabilidad por la dilatación de la aurícula izquierda y provoca los síntomas del paciente?", "opciones": [{"letra": "a", "texto": "Esófago.", "correcta": true, "razon": "CORRECTA. La aurícula izquierda es la cámara más POSTERIOR del corazón y se apoya directamente sobre el esófago torácico (solo los separa el pericardio fibroso y el seno oblicuo). Su dilatación (estenosis mitral clásica) comprime el esófago → disfagia/odinofagia; es la misma razón por la que la ecocardiografía transesofágica ve tan bien la aurícula izquierda."}, {"letra": "b", "texto": "Raíz o pedículo del pulmón.", "correcta": false, "razon": "Los hilios pulmonares son laterales al corazón; la aurícula izquierda recibe las venas pulmonares pero su crecimiento no comprime el pedículo de forma que produzca odinofagia."}, {"letra": "c", "texto": "Tráquea.", "correcta": false, "razon": "La tráquea termina en la carina (T4-T5), por encima y por delante de la aurícula izquierda; una aurícula muy grande puede elevar el bronquio principal izquierdo, pero eso daría tos/atelectasia, no dolor al tragar."}, {"letra": "d", "texto": "Vena cava superior.", "correcta": false, "razon": "La VCS desemboca en la aurícula DERECHA, en el lado derecho del mediastino; no tiene relación con la aurícula izquierda ni con la deglución."}, {"letra": "e", "texto": "Vena cava inferior.", "correcta": false, "razon": "La VCI atraviesa el diafragma (T8) y entra en la aurícula DERECHA; está lejos de la aurícula izquierda y su compresión no produciría disfagia."}], "respuesta": "a", "razonamiento": "El esófago torácico, en el mediastino posterior, tiene por delante (de arriba abajo) la tráquea, el bronquio principal izquierdo, la aurícula izquierda (pericardio) y finalmente el diafragma. La aurícula izquierda es la cámara posterior del corazón: cuando se dilata empuja hacia atrás y comprime el esófago, que queda atrapado contra la columna y la aorta descendente. Clínicamente: disfagia en la estenosis mitral, impronta de la aurícula sobre el esofagograma baritado (signo clásico) y ventana perfecta para la ecocardiografía transesofágica."}, "examen": [{"examen": "enero 2026", "pregunta": "P70", "imagen": null, "clave": "c", "que_pregunto": "Clon SIN imagen: mujer de 40 años con disfagia progresiva y una cámara cardiaca aumentada → ¿cuál? Aurícula izquierda (c). Es el mismo caso invertido (te dan la disfagia y te piden la cámara).", "img_key": null}], "pack": "Esófago torácico: delante = tráquea → bronquio principal izdo → aurícula izda (pericardio) → diafragma; detrás = columna, conducto torácico, ácigos, aorta descendente (que al final se le pone detrás y a la izquierda). Irrigación: ramas esofágicas de la aorta torácica + bronquiales; drenaje venoso al sistema ácigos (anastomosis porto-cava con la gástrica izda → varices). Linfa: nodos mediastínicos posteriores y paratraqueales. Inervación: plexo esofágico del vago (troncos vagales anterior = izdo, posterior = dcho) + simpático T5-T6.", "trampa": "Preguntar la cámara al revés (P70): el alumno elige 'ventrículo izquierdo' por ser la cámara grande; la que TOCA el esófago es la AURÍCULA izquierda. También puede colar 'aurícula derecha' (recibe las cavas, anterior-derecha).", "prioridad": 3}, {"key": "R1D-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Cavidad oral abierta · istmo de las fauces (esquema tipo Netter)", "que_se_ve": "Esquema en color de la boca abierta vista de frente: paladar, úvula, arcos, amígdala y lengua, con números 1-8 (rosas 1-6 y 8; el 7 sin lista).", "etiquetas": [{"n": "1", "nombre": "Paladar duro.", "rosa": true, "seguro": true, "nota": "Mucosa sobre apófisis palatinas del maxilar + láminas horizontales del palatino; irrigado por la a. palatina mayor (maxilar), n. palatino mayor + nasopalatino (V2)."}, {"n": "2", "nombre": "Paladar blando.", "rosa": true, "seguro": true, "nota": "Velo: elevador del velo (vago/plexo faríngeo), tensor del velo (V3), palatogloso, palatofaríngeo, m. de la úvula."}, {"n": "3", "nombre": "Úvula.", "rosa": true, "seguro": true, "nota": "Se desvía hacia el lado SANO en la lesión del vago (caso 7)."}, {"n": "4", "nombre": "Arco palatofaríngeo.", "rosa": true, "seguro": true, "nota": "Pilar POSTERIOR; m. palatofaríngeo."}, {"n": "5", "nombre": "Arco palatogloso.", "rosa": true, "seguro": true, "nota": "Pilar ANTERIOR (va a la lengua); delimita el istmo de las fauces."}, {"n": "6", "nombre": "Amígdala palatina.", "rosa": true, "seguro": true, "nota": "En la fosa tonsilar entre ambos arcos; anillo de Waldeyer; a. tonsilar de la facial; n. IX (otalgia refleja tras amigdalectomía)."}, {"n": "7", "nombre": "Dorso de la lengua (surco medio)", "rosa": false, "seguro": true, "nota": "No está en la lista impresa; la línea 7 acaba en el dorso de la lengua."}, {"n": "8", "nombre": "Pared posterior de la orofaringe.", "rosa": true, "seguro": true, "nota": "Constrictor superior/medio; entre paladar blando y epiglotis."}], "examen": [{"examen": "enero 2026", "pregunta": "P66", "imagen": 2, "clave": "b", "que_pregunto": "Imagen 2 = esta misma lámina con letras. Sobre la estructura C (amígdala palatina): 'forma parte del anillo linfoide de Waldeyer' (b). Las opciones a y c invertían los arcos (limitada anteriormente por el palatofaríngeo / posteriormente por el palatogloso = falsas).", "img_key": "enero-02"}], "pack": "Amígdala palatina: irrigación a. tonsilar (rama de la a. facial ← carótida externa) + ramas de palatina ascendente, palatina descendente, lingual dorsal y faríngea ascendente. Venas → plexo tonsilar/paratonsilar → v. facial → yugular interna. Linfa → nodo yugulodigástrico (cervical profundo superior). Inervación sensitiva: glosofaríngeo (IX) + n. palatino menor (V2). Relación lateral: constrictor superior y, por fuera, a. carótida interna (peligro en la amigdalectomía). Anillo de Waldeyer = amígdalas faríngea (adenoides), tubáricas, palatinas y lingual.", "trampa": "Cruzar los arcos: palatoGLOSO = ANTERIOR (llega a la lengua), palatoFARÍNGEO = POSTERIOR. También 'el paladar blando lo eleva el tensor' (lo eleva el elevador, vago; el tensor es V3).", "prioridad": 3}, {"key": "R1D-p04", "pagina": 4, "item": 3, "tipo": "identifica", "titulo": "Ortopantomografía (radiografía panorámica dental)", "que_se_ve": "Rx panorámica de los maxilares con números impresos (atlas Weir & Abrahams): 1-11, dientes 12-19, 23 (bloque de mordida) y 28. La diapo solo lista 1, 6, 7, 8, 19 y 23.", "etiquetas": [{"n": "1", "nombre": "Tabique nasal.", "rosa": true, "seguro": true}, {"n": "2", "nombre": "Paladar duro (suelo de las fosas nasales)", "rosa": false, "seguro": false, "nota": "Línea radiopaca horizontal sobre las raíces superiores; no listado en la diapo."}, {"n": "3", "nombre": "Apófisis coronoides de la mandíbula", "rosa": false, "seguro": false, "nota": "Proyección lateral a la altura del arco cigomático; no listado."}, {"n": "4", "nombre": "Fosa mandibular / tubérculo articular (ATM)", "rosa": false, "seguro": false, "nota": "Extremo superolateral de la placa; no listado."}, {"n": "5", "nombre": "Cabeza (cóndilo) de la mandíbula", "rosa": false, "seguro": false, "nota": "Bajo el 4, en la ATM; no listado."}, {"n": "6", "nombre": "Rama de la mandíbula.", "rosa": true, "seguro": true}, {"n": "7", "nombre": "Ángulo de la mandíbula.", "rosa": true, "seguro": true}, {"n": "8", "nombre": "Cuerpo de la mandíbula.", "rosa": true, "seguro": true}, {"n": "9", "nombre": "Conducto mandibular (n. alveolar inferior)", "rosa": false, "seguro": false, "nota": "Banda radiolúcida dentro de la rama/cuerpo; no listado."}, {"n": "10", "nombre": "Hueso hioides (asta mayor) proyectado bajo la mandíbula", "rosa": false, "seguro": false, "nota": "Aparece a ambos lados, bajo el borde inferior; no listado."}, {"n": "11", "nombre": "Espina nasal anterior / sutura intermaxilar", "rosa": false, "seguro": false, "nota": "Línea media entre las raíces de los incisivos superiores; no listado."}, {"n": "12", "nombre": "Incisivo central", "rosa": false, "seguro": true, "nota": "Serie dental 12-19 de mesial a distal, arriba y abajo."}, {"n": "13", "nombre": "Incisivo lateral", "rosa": false, "seguro": true}, {"n": "14", "nombre": "Canino", "rosa": false, "seguro": true}, {"n": "15", "nombre": "Primer premolar", "rosa": false, "seguro": true}, {"n": "16", "nombre": "Segundo premolar", "rosa": false, "seguro": true}, {"n": "17", "nombre": "Primer molar", "rosa": false, "seguro": true}, {"n": "18", "nombre": "Segundo molar", "rosa": false, "seguro": true}, {"n": "19", "nombre": "Tercer molar.", "rosa": true, "seguro": true, "nota": "Cordal, en erupción/incluido en esta placa."}, {"n": "23", "nombre": "Bloque de mordida.", "rosa": true, "seguro": true, "nota": "Artefacto: pieza de plástico que muerde el paciente para centrar la panorámica."}, {"n": "28", "nombre": "Conducto mandibular / agujero mentoniano", "rosa": false, "seguro": false, "nota": "Bajo las raíces de premolares-molares inferiores, bilateral; no listado."}], "examen": [{"examen": "enero 2026", "pregunta": "P63", "imagen": 1, "clave": "d", "que_pregunto": "Imagen 1 = esta panorámica con letras. Caries en B (molar SUPERIOR izquierdo; mitad derecha de la placa = lado izdo del paciente) → dolor por los ramos alveolares superiores, rama del n. MAXILAR (V2). Distractores: 'rama del facial' (a, b) y 'rama del mandibular' (c).", "img_key": "enero-01"}], "pack": "Dientes superiores: ramos alveolares superiores posteriores/medio/anteriores del n. maxilar (V2) → plexo dental superior; irrigación a. alveolar superior posterior e infraorbitaria (← maxilar). Dientes inferiores: n. alveolar inferior (V3) por el conducto mandibular → n. mentoniano (labio y mentón) + n. incisivo; a. alveolar inferior (← maxilar). Encía lingual inferior = n. lingual; encía vestibular molar inferior = n. bucal. Linfa → submandibulares (submentonianos para incisivos inferiores).", "trampa": "Lateralidad invertida en la panorámica (derecha de la placa = izquierda del paciente); V2 arcada superior vs V3 arcada inferior; colar el facial (VII) como nervio sensitivo dental.", "prioridad": 3}, {"key": "R1D-p05", "pagina": 5, "item": 4, "tipo": "caso", "titulo": "Caso 4 · Sonda nasogástrica: última resistencia", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 32 años ingresa en el hospital en estado comatoso. La exploración física revela que la paciente sufre anorexia nerviosa. Se ordena la colocación de una sonda nasogástrica. ¿Cuál es el último lugar donde se esperaría resistencia al paso de la sonda de la nariz al estómago?", "opciones": [{"letra": "a", "texto": "Unión faringoesofágica.", "correcta": false, "razon": "Es el PRIMER estrechamiento (cricofaríngeo/EES, C6, 15 cm de los incisivos, el más estrecho), no el último."}, {"letra": "b", "texto": "A la altura del orificio torácico superior.", "correcta": false, "razon": "El esófago cruza el opérculo torácico sin ningún estrechamiento fisiológico propio; no es un punto de resistencia."}, {"letra": "c", "texto": "Posterior al cayado aórtico.", "correcta": false, "razon": "Es el segundo estrechamiento (impronta aórtica, T4, ~22,5 cm); aún quedan el bronquio y el hiato por debajo."}, {"letra": "d", "texto": "Posterior al bronquio principal izquierdo.", "correcta": false, "razon": "Impronta bronquial (~27,5 cm), tercer punto en orden de descenso; todavía no es el último."}, {"letra": "e", "texto": "Hiato esofágico del diafragma.", "correcta": true, "razon": "CORRECTA. El estrechamiento diafragmático/hiatal (T10, ~40 cm de los incisivos, esfínter esofágico inferior fisiológico) es el ÚLTIMO obstáculo antes de que la sonda caiga en el estómago."}], "respuesta": "e", "razonamiento": "Los estrechamientos fisiológicos del esófago, en orden de descenso, son: (1) cricofaríngeo o faringoesofágico = EES (C6, 15 cm), (2) broncoaórtico: arco aórtico (T4, 22,5 cm) y bronquio principal izquierdo (27,5 cm), (3) diafragmático o hiatal (T10, 40 cm; EEI). Una sonda que va de la nariz al estómago encuentra resistencia en cada uno y la última es el hiato esofágico. Son también los puntos donde se enclavan los cuerpos extraños y las estenosis por cáusticos, y las distancias sirven para calcular cuánta sonda introducir (~45 cm hasta el cardias desde la narina)."}, "examen": [], "pack": "Hiato esofágico: T10, formado por el pilar DERECHO del diafragma (asas musculares), por él pasan el esófago, los troncos vagales anterior (izdo) y posterior (dcho) y ramas esofágicas de la gástrica izda. Hiato aórtico T12 (aorta, conducto torácico, ácigos), orificio de la cava T8 (VCI + n. frénico dcho). Regla: 8-10-12 = cava-esófago-aorta.", "trampa": "Preguntar el PRIMER o el más estrecho (EES) en lugar del último; o dar las distancias en cm y pedir a qué estrechamiento corresponden (15 / 22,5 / 27,5 / 40).", "prioridad": 2}, {"key": "R1D-p06", "pagina": 6, "item": 5, "tipo": "identifica", "titulo": "Suelo de la boca · cara inferior de la lengua (esquema + foto)", "que_se_ve": "Arriba: esquema con la lengua levantada (v. lingual profunda, conductos, pliegues, frenillo), números 1-8. Abajo: fotografía clínica con la lengua elevada, números 1, 3, 4, 5, 7. Rosas: 1, 2, 6, 8 en el esquema; 1, 3, 4, 7 en la foto.", "etiquetas": [{"n": "1", "nombre": "V. lingual profunda.", "rosa": true, "seguro": true, "nota": "Se ve por transparencia en la cara ventral; vía de absorción sublingual (nitroglicerina)."}, {"n": "2", "nombre": "Conducto Submandibular.", "rosa": true, "seguro": true, "nota": "Conducto de Wharton: desde la glándula rodea el borde posterior del milohioideo, va por encima del hipogloso y por debajo del n. lingual (que lo cruza dos veces), y desemboca en la carúncula."}, {"n": "3", "nombre": "Pliegue sublingual recubriendo la gl. sublingual.", "rosa": true, "seguro": true, "nota": "Glándula sublingual bajo el pliegue; drena por los conductillos de Rivinus (y a veces por el conducto de Bartholin al de Wharton)."}, {"n": "4", "nombre": "Carúncula sublingual.", "rosa": true, "seguro": true, "nota": "Papila a cada lado del frenillo donde abre el conducto de Wharton (aquí se palpa/expulsa el cálculo submandibular)."}, {"n": "5", "nombre": "Cara inferior (ventral) de la lengua", "rosa": false, "seguro": false, "nota": "No está en la lista impresa; en la foto el corchete 5 abarca la superficie ventral de la lengua junto al frenillo."}, {"n": "6", "nombre": "Orificios de drenaje de la gl. sublingual.", "rosa": true, "seguro": true, "nota": "Conductos sublinguales menores (Rivinus) abriendo a lo largo del pliegue sublingual."}, {"n": "7", "nombre": "Frenillo lingual.", "rosa": true, "seguro": true, "nota": "Frenillo corto = anquiloglosia → frenotomía (caso 14)."}, {"n": "8", "nombre": "Pliegue fimbriado", "rosa": true, "seguro": true, "nota": "Pliegue mucoso festoneado lateral a la v. lingual profunda."}], "examen": [{"examen": "enero 2026", "pregunta": "P62", "imagen": 5, "clave": "d", "que_pregunto": "Imagen 5 = esta foto con letras A (frenillo lingual) y B (pliegue sublingual). 'Todas correctas' (d): la anquiloglosia es consecuencia de un frenillo (A) corto; la parte lateral del cuerpo de la lengua drena a submandibulares ipsilaterales; la lesión del n. lingual pierde la sensibilidad general (tacto/temperatura) del cuerpo de la lengua ipsilateral.", "img_key": "enero-05"}], "pack": "Lengua: a. lingual (← carótida externa; ramas dorsales, sublingual y lingual profunda/ranina); v. lingual profunda + dorsales → v. lingual → yugular interna. Linfa: ápice → submentonianos; borde lateral del cuerpo → submandibulares IPSIlaterales; parte central → cervicales profundos inferiores BIlaterales; raíz → cervicales profundos superiores bilaterales. Inervación: 2/3 anteriores sensibilidad general n. lingual (V3) y gusto cuerda del tímpano (VII); 1/3 posterior IX (general + gusto); raíz/vallécula X (laríngeo superior); motor XII (salvo palatogloso = vago). Suelo de la boca: gl. sublingual y submandibular, conducto de Wharton, n. lingual, n. hipogloso, a. lingual sobre el hiogloso.", "trampa": "Mezclar sensibilidad general (V3) con gusto (VII) y motor (XII); drenaje 'contralateral' del borde lateral (es ipsilateral; el bilateral es el de la parte central y la raíz).", "prioridad": 3}, {"key": "R1D-p07", "pagina": 7, "item": 6, "tipo": "imagen", "titulo": "Sialografía de la glándula submandibular", "que_se_ve": "Radiografía lateral con contraste inyectado por catéter en el conducto submandibular: se ve el conducto de Wharton largo por debajo del cuerpo de la mandíbula y la arborización intraglandular. Números 1-4 (todos listados). Ninguno rosa.", "etiquetas": [{"n": "1", "nombre": "Catéter.", "rosa": false, "seguro": true, "nota": "Canulado en la carúncula sublingual, junto al frenillo."}, {"n": "2", "nombre": "Conducto submandibular.", "rosa": false, "seguro": true, "nota": "Wharton: ~5 cm, va del suelo de la boca hacia atrás y abajo hasta la glándula, rodeando el borde posterior del milohioideo."}, {"n": "3", "nombre": "Mandíbula.", "rosa": false, "seguro": true, "nota": "Cuerpo/ángulo mandibular; la glándula queda bajo el cuerpo, en el triángulo submandibular (digástrico)."}, {"n": "4", "nombre": "Conductillos intraglandulares.", "rosa": false, "seguro": true, "nota": "Ramificación 'en árbol' dentro de la glándula."}], "examen": [{"examen": "enero 2026", "pregunta": "P64", "imagen": 3, "clave": "a", "que_pregunto": "Imagen 3 = dos sialografías (paneles A y B; versión del profesor en S7 p6-7, esta placa es la gemela submandibular). Clave a: 'la glándula del panel B se relaciona con la a. carótida externa' (= parótida, que la carótida externa atraviesa y se bifurca dentro). Falsas: A parótida (b), conducto de B en relación con el hipogloso (c), parasimpaticomimético → xerostomía (d; produce sialorrea).", "img_key": "enero-03"}], "pack": "Gl. submandibular: irrigación a. facial (← carótida externa, la cruza en su celda y deja surco) + submentoniana; venas facial/lingual → yugular interna; linfa → submandibulares → cervicales profundos. Secretomotor parasimpático: núcleo salivar superior → VII (cuerda del tímpano) → n. lingual → ganglio submandibular → glándula (misma vía para la sublingual). Relaciones del conducto: n. lingual lo cruza POR ENCIMA (lateral→medial), n. hipogloso va POR DEBAJO. Parótida: conducto de Stenon sobre el masetero, perfora el buccinador frente al 2º molar superior; a. carótida externa y v. retromandibular dentro; n. facial la atraviesa; parasimpático IX → ganglio ótico → auriculotemporal (V3).", "trampa": "Confundir qué panel es parótida y cuál submandibular (Stenon = conducto corto horizontal sobre el masetero, glándula preauricular; Wharton = conducto largo bajo la mandíbula); creer que el conducto de Wharton se relaciona con el hipogloso por encima (es el LINGUAL el que lo cruza por encima; el XII va por debajo).", "prioridad": 3}, {"key": "R1D-p08", "pagina": 8, "item": 7, "tipo": "caso", "titulo": "Caso 7 · Úvula desviada hacia la derecha", "que_se_ve": "Diapositiva de texto (caso clínico tipo test, sin imagen).", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 36 años es ingresada en el hospital con graves heridas en la cabeza después de sufrir un accidente de coche. Durante el examen neurológico se observa que la úvula está desviada hacia la derecha. ¿Cuál es el nervio más probablemente afectado en esta desviación?", "opciones": [{"letra": "a", "texto": "Vago izquierdo.", "correcta": true, "razon": "CORRECTA. Los músculos del paladar blando (elevador del velo, m. de la úvula, palatogloso, palatofaríngeo) los inerva el vago (X) vía plexo faríngeo. Si falla el vago izquierdo, el elevador izquierdo no tira: al decir 'aaah' el lado sano (derecho) eleva el velo y la úvula se DESVÍA HACIA EL LADO SANO = derecha."}, {"letra": "b", "texto": "Vago derecho.", "correcta": false, "razon": "Una lesión del vago derecho dejaría caído el hemivelo derecho y la úvula se iría hacia la IZQUIERDA (lado sano)."}, {"letra": "c", "texto": "Hipogloso derecho.", "correcta": false, "razon": "

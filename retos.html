"seguro": false}, {"n": "15", "nombre": "Labio menor (vestíbulo de la vagina)", "rosa": true, "seguro": false}, {"n": "16", "nombre": "Labio mayor", "rosa": true, "seguro": true}, {"n": "21", "nombre": "Promontorio / sacro (cara anterior, por encima del sigma)", "rosa": false, "seguro": false, "nota": "La línea acaba en la parte alta posterior; alternativa: mesocolon sigmoide."}, {"n": "22", "nombre": "Colon sigmoide (asa seccionada con la luz visible)", "rosa": false, "seguro": false}, {"n": "23", "nombre": "Fondo de saco rectouterino (Douglas)", "rosa": true, "seguro": true, "nota": "Preguntado en mayo 2026 P27: las tres opciones lo llamaban 'rectovesical' → todas falsas."}, {"n": "24", "nombre": "Recto (ampolla rectal, luz con contenido fecal)", "rosa": true, "seguro": true}, {"n": "25", "nombre": "Fórnix posterior de la vagina (el más profundo; sí peritonizado por el Douglas)", "rosa": true, "seguro": true}, {"n": "26", "nombre": "Cérvix uterino (porción vaginal, protruye en la vagina)", "rosa": true, "seguro": true, "nota": "Preguntado en mayo 2026 P27 (opción c lo cambiaba por 'uretra')."}, {"n": "27", "nombre": "M. esfínter externo del ano (etiqueta repetida: porción profunda arriba y subcutánea abajo, junto al ano)", "rosa": false, "seguro": false, "nota": "Alternativa para el 27 superior: m. elevador del ano (puborrectal). El mismo número aparece dos veces."}, {"n": "28", "nombre": "Conducto anal (luz, continuación del recto por detrás de la vagina)", "rosa": false, "seguro": false}, {"n": "29", "nombre": "Vagina (pared/luz, entre uretra y recto)", "rosa": true, "seguro": true}, {"n": "30", "nombre": "M. esfínter interno del ano / pared muscular del conducto anal", "rosa": false, "seguro": false}, {"n": "31", "nombre": "Ano (orificio anal)", "rosa": false, "seguro": false}, {"n": "32", "nombre": "Cuerpo perineal (centro tendinoso, entre orificio vaginal y ano)", "rosa": false, "seguro": false}], "pregunta": null, "examen": [{"examen": "mayo 2026", "pregunta": "P27", "imagen": 19, "clave": "d (todas falsas)", "que_pregunto": "a) 9 vesicouterino, 12 fórnix anterior PERITONIZADO, 23 RECTOVESICAL, 26 cérvix; b) igual pero fórnix sin peritoneo, 23 rectovesical; c) 23 rectovesical y 26 = uretra; d) todas falsas ← CORRECTA porque las tres dicen 'rectovesical', que en la mujer no existe (vesicouterino + rectouterino de Douglas). Clave real: 9 vesicouterino · 12 fórnix anterior sin peritoneo · 23 Douglas · 26 cérvix.", "img_key": "mayo-19"}, {"examen": "enero 2026", "pregunta": "P18", "imagen": 18, "clave": "c", "que_pregunto": "Fondos de saco A (rectovesical ♂) y B (rectouterino ♀) recubiertos de peritoneo donde se acumulan fluidos (cierta). Mismo concepto que 9/23 de esta lámina.", "img_key": "enero-18"}], "pack": "Relaciones sagitales de delante atrás: sínfisis (11) – vejiga (10) – vesicouterino (9) – útero (8) – Douglas (23) – recto (24); por debajo: uretra (13) – vagina (29) – conducto anal (28). Peritoneo ♀: vejiga → vesicouterino (a nivel del istmo) → cara anterior, fondo y cara posterior del útero → fórnix posterior (25, sí peritonizado) → rectouterino → recto; el fórnix anterior (12) se relaciona con la base vesical SIN peritoneo. Vagina: a. vaginal (← ilíaca interna) + ramas de la uterina, rectal media y pudenda interna; venas al plexo uterovaginal → ilíaca interna; linfa 2/3 superiores a ilíacos internos/externos, 1/3 inferior a inguinales superficiales (como la vulva). Uretra femenina (13): 4 cm, esfínter externo estriado (n. pudendo), irrigada por vesical inferior/vaginal y pudenda interna. Cuerpo perineal (32) entre vagina y ano = clave de la episiotomía (caso 7).", "trampa": "'Rectovesical' en la mujer; 'fórnix anterior peritonizado'; cambiar cérvix (26) por uretra (13); y la lateralidad de la lámina (anterior a la izquierda). Bermúdez repite los mismos círculos: 8, 10, 11, 13-16, 24, 25 y 29 aún no han sido preguntados y son candidatos.", "prioridad": 3}]}, "R3D": {"fuente": "R3D", "titulo": "Reto 3 digestivo · Sistema digestivo infracólico (páncreas, AMS/AMI, porta, colon, pelvis)", "resumen_examen": "Fuente de peso medio-alto. En enero 2026 salieron de aquí 2 de las 20 imágenes del anexo: la img 16 (enema opaco del marco cólico = p3, P16 → d 'sigma + ciego se volvulan') y la img 18 (fondos de saco pélvicos ♀/♂, P18 → c; el examen usó la lámina de Gray T15 p4, pero p12 y p14 de este reto son las gemelas Netter con los mismos números). Además la img 19 (vasos del supracólico, P19 → d 'todas falsas') se resuelve con la lámina del sistema porta de p11. Bermúdez pregunta con estas láminas de dos formas: lista 'A=…, B=…' con una pieza cambiada, y teoría colgada de la estructura (irrigación 'rama de ← rama de', ligadura quirúrgica, primer relevo linfático/metastásico). Los casos clínicos (p2, p5, p7, p8, p10, p13, p15, p16) son la cantera de las preguntas SIN imagen (≈24 % de anato en enero fueron clones de reto). Páginas 'Identifica' que AÚN NO han caído y por tanto son candidatas si el tribunal rota: p4 (páncreas y AMS), p6 (ramas de la AMS), p9 (AMI: ojo, la diapo llama 'rectal inferior' a la rama terminal, que es la rectal SUPERIOR) y p11 (porta).", "paginas": [{"key": "R3D-p01", "pagina": 1, "item": null, "tipo": "omitir", "titulo": "Portada · Reto 3 Sistema digestivo infracólico (Bermúdez)", "prioridad": 0}, {"key": "R3D-p02", "pagina": 2, "item": 1, "tipo": "caso", "titulo": "Caso 1 · Hemorragia masiva en colon descendente por diverticulitis", "que_se_ve": "Diapositiva de texto (caso clínico tipo Lippincott), sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un ingeniero de control de calidad de 53 años ingresa con dolor abdominal intenso. Historia y exploración indican diverticulitis cólica crónica, con taquicardia e hipotensión. La ecografía revela una hemorragia masiva en el colon descendente. ¿Cuál de las siguientes arterias será el origen más probable de la hemorragia?", "opciones": [{"letra": "a", "texto": "Una rama de la mesentérica inferior.", "correcta": true, "razon": "CORRECTA: el colon descendente lo irriga la a. cólica izquierda, rama de la AMI (aorta, L3). Es la única opción que pertenece al territorio del colon descendente."}, {"letra": "b", "texto": "Cólica media.", "correcta": false, "razon": "Rama de la AMS: irriga el colon transverso (2/3 proximales, hasta la línea de Cannon-Böhm), no el descendente."}, {"letra": "c", "texto": "Rectal superior.", "correcta": false, "razon": "Es la rama terminal de la AMI pero irriga el RECTO (tercio superior), no el colon descendente."}, {"letra": "d", "texto": "Rectal inferior.", "correcta": false, "razon": "Rama de la pudenda interna (ilíaca interna): irriga el canal anal infrapectíneo, muy lejos del colon descendente."}, {"letra": "e", "texto": "Gastroomental izquierda.", "correcta": false, "razon": "Rama de la esplénica (tronco celíaco): curvatura mayor del estómago, territorio supracólico."}], "respuesta": "a", "razonamiento": "El marco cólico se reparte entre dos troncos: la AMS (L1) irriga ciego, ascendente y 2/3 proximales del transverso (ileocólica, cólica derecha, cólica media) y la AMI (L3) irriga el 1/3 distal del transverso, descendente, sigma y recto superior (cólica izquierda, sigmoideas, rectal superior). Una diverticulitis del colon descendente que sangra lo hace por los vasos rectos de la rama descendente de la cólica izquierda → 'una rama de la mesentérica inferior'. Las opciones b y e son de otros territorios; c y d son ramas rectales, y además la 'rectal inferior' ni siquiera es de la AMI."}, "examen": [], "pack": "Colon descendente: a. cólica izquierda ← AMI ← aorta (L3). Venoso: v. cólica izquierda → VMI → v. esplénica → porta. Linfático: nodos cólicos izquierdos → mesentéricos inferiores. Inervación: parasimpático S2-S4 (esplácnicos pélvicos) a partir de Cannon-Böhm.", "trampa": "Colar 'rectal superior' (sí es de la AMI, pero irriga el recto) o 'cólica media' (transverso, AMS). Recordar que el descendente es el territorio de la AMI por excelencia.", "prioridad": 2}, {"key": "R3D-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Enema opaco (Rx con bario) del marco cólico · colon ascendente, transverso, descendente, sigmoide y recto", "que_se_ve": "Radiografía AP de abdomen con enema de bario: se ven las haustras del ascendente (1) con el ciego en fosa ilíaca derecha, el transverso (2) colgando, el descendente (3), el sigma (5) serpenteante en la pelvis y la ampolla rectal (4). Misma placa que S8 p13 (allí con leyenda 1-11) y que la IMAGEN 16 de enero 2026 (letras A-F).", "etiquetas": [{"n": "1", "nombre": "Colon ascendente", "rosa": true, "seguro": true, "nota": "Secundariamente retroperitoneal (fascia de Toldt dcha) → FIJO, no se vuelve. Irrigación: cólica derecha + ileocólica (AMS)."}, {"n": "2", "nombre": "Colon transverso", "rosa": true, "seguro": true, "nota": "Intraperitoneal con mesocolon transverso; irrigación cólica media (AMS) hasta Cannon-Böhm. Vólvulo excepcional (meso ancho y corto, anclado por gastrocólico y frenocólicos)."}, {"n": "3", "nombre": "Colon descendente", "rosa": true, "seguro": true, "nota": "Secundariamente retroperitoneal (Toldt izda) → fijo. Irrigación: cólica izquierda (AMI)."}, {"n": "4", "nombre": "Recto", "rosa": true, "seguro": true, "nota": "Ampolla rectal en la pelvis; empieza en S3. Irrigación rectal superior (AMI) + media (ilíaca interna) + inferior (pudenda interna)."}, {"n": "5", "nombre": "Colon sigmoide", "rosa": true, "seguro": true, "nota": "Intraperitoneal con mesosigma largo → segmento que MÁS se vuelve en el adulto. Irrigación: aa. sigmoideas (AMI)."}, {"n": "(sin nº)", "nombre": "Ciego", "rosa": false, "seguro": true, "nota": "La bolsa bajo el 1, en fosa ilíaca dcha: móvil (rodeado de peritoneo) → el otro segmento que se vuelve. En el examen fue la letra E/F junto al sigma."}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P16", "imagen": 16, "clave": "d", "img_key": "enero-16", "que_pregunto": "'En relación con la imagen 16, ¿qué segmentos se podrían volvular con mayor probabilidad?' a) A+B b) B+C c) C+D d) E+F. Clave d: E y F eran el SIGMA y el CIEGO, los dos únicos segmentos con meso largo y libre. Ascendente y descendente son secundariamente retroperitoneales (Toldt) y el transverso tiene meso corto y anclado."}], "pack": "Colon derecho (ciego, ascendente, 2/3 del transverso): ileocólica, cólica derecha y cólica media ← AMS ← aorta (L1); venas → VMS → porta; linfa → mesentéricos superiores; vago. Colon izquierdo (1/3 distal del transverso, descendente, sigma): cólica izquierda y sigmoideas ← AMI ← aorta (L3); VMI → esplénica → porta; linfa → mesentéricos inferiores; parasimpático S2-S4. Arcada marginal de Drummond en el borde del colon; arco de Riolano (cólica media ↔ cólica izquierda) más cerca de la aorta.", "trampa": "Con letras en vez de números: saber qué letra es el sigma y cuál el ciego. Trampa de fijación: 'el transverso es móvil, luego se vuelve' (no, meso corto). Unión rectosigmoidea = punto más estrecho del intestino grueso (P2).", "prioridad": 3}, {"key": "R3D-p04", "pagina": 4, "item": 3, "tipo": "identifica", "titulo": "Páncreas in situ con AMS, riñones y duodeno (Netter/Gilroy) · cola, cuello, cabeza, proceso uncinado", "que_se_ve": "Esquema anatómico en color con el estómago levantado: páncreas de cabeza (7) a cola (1), cuello (9) delante de la vena porta/VMS (azul) y de la AMS (4, roja) que baja por delante del proceso uncinado (5). A los lados, los dos riñones con sus uréteres; el duodeno abraza la cabeza.", "etiquetas": [{"n": "1", "nombre": "Cola del páncreas", "rosa": true, "seguro": true, "nota": "Llega al hilio esplénico dentro del lig. esplenorrenal; irrigada por la a. esplénica → tumor de cola compromete al BAZO. Linfa → nodos esplénicos."}, {"n": "2", "nombre": "Riñón izquierdo", "rosa": false, "seguro": false, "nota": "Órgano pardo en forma de judía a la derecha de la imagen con su uréter; el cuaderno previo lo etiquetó 'bazo', pero el bazo no aparece en este esquema (se ve un riñón con uréter)."}, {"n": "3", "nombre": "Flexura duodenoyeyunal / yeyuno seccionado", "rosa": false, "seguro": false, "nota": "Tubo rosado cortado bajo el cuerpo del páncreas, a la izquierda de la AMS = ángulo de Treitz (D4-yeyuno). Alternativa: uréter izquierdo (pero éste es el tubo amarillo)."}, {"n": "4", "nombre": "Arteria mesentérica superior (AMS)", "rosa": true, "seguro": true, "nota": "Nace de la aorta en L1, DETRÁS del cuello del páncreas, pasa DELANTE del proceso uncinado y de D3 (pinza aortomesentérica de Wilkie). La VMS va a su derecha."}, {"n": "5", "nombre": "Proceso uncinado", "rosa": true, "seguro": true, "nota": "Gancho de la cabeza que se mete DETRÁS de los vasos mesentéricos superiores (AMS/VMS pasan por delante)."}, {"n": "6", "nombre": "Duodeno (2ª porción, D2)", "rosa": false, "seguro": true, "nota": "Marco duodenal que abraza la cabeza; en D2 desembocan papila mayor (Vater: colédoco + Wirsung) y menor (Santorini)."}, {"n": "7", "nombre": "Cabeza del páncreas", "rosa": true, "seguro": true, "nota": "Dentro del marco duodenal; irrigada por las arcadas pancreatoduodenales (gastroduodenal ← hepática común ← TC, y PD inferior ← AMS). Tumor de cabeza → comprime el colédoco → ictericia."}, {"n": "8", "nombre": "Riñón derecho", "rosa": false, "seguro": true, "nota": "Detrás de la cabeza del páncreas y de D2 (relaciones posteriores de D2: hilio renal dcho, vasos renales y uréter dcho)."}, {"n": "9", "nombre": "Cuello del páncreas", "rosa": true, "seguro": true, "nota": "Delante de la formación de la vena PORTA (VMS + esplénica) y del origen de la AMS. Tumor de cuello → obstruye la porta (caso 7) y metastatiza primero al hígado (caso 6)."}, {"n": "10", "nombre": "Arteria esplénica (borde superior del cuerpo)", "rosa": false, "seguro": false, "nota": "Vaso rojo tortuoso que corre por el borde superior del cuerpo-cola desde el tronco celíaco; irriga cuerpo y cola (pancreática magna, dorsal, caudal)."}], "pregunta": null, "examen": [], "pack": "Páncreas: cabeza/cuello ← arcadas pancreatoduodenales superior (a. gastroduodenal ← hepática común ← tronco celíaco, T12) e inferior (← AMS, L1); cuerpo/cola ← ramas pancreáticas de la a. esplénica ← tronco celíaco. Venas espejo: v. PD superior → porta directa; v. PD inferior → VMS; vv. pancreáticas del cuerpo/cola → v. esplénica. La porta se forma DETRÁS del cuello (L1-L2). Linfa: cabeza/cuello → pancreatoduodenales (los mismos que el colédoco distal); cuerpo → pancreáticos sup/inf; cola → esplénicos; todos → celíacos y mesentéricos superiores.", "trampa": "Cambiar cuello por cabeza en la lista (el cuello es lo que está DELANTE de la porta; la cabeza, dentro del marco duodenal). Decir que la AMS pasa por detrás del uncinado (es al revés: el uncinado queda detrás de la AMS). Confundir el riñón izquierdo con el bazo.", "prioridad": 2}, {"key": "R3D-p05", "pagina": 5, "item": 4, "tipo": "caso", "titulo": "Caso 4 · Úlcera duodenal ANTERIOR que penetra", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una taquígrafa del juzgado de 37 años ingresa con dolor abdominal intenso. La exploración radiológica revela penetración de una úlcera duodenal anterior. ¿Cuál de las siguientes alteraciones se producirá con mayor probabilidad?", "opciones": [{"letra": "a", "texto": "Hemorragia de arteria gastroduodenal.", "correcta": false, "razon": "La gastroduodenal desciende por DETRÁS de D1: la erosiona la úlcera POSTERIOR del bulbo (hemorragia masiva), no la anterior."}, {"letra": "b", "texto": "Hemorragia de arteria mesentérica inferior.", "correcta": false, "razon": "La AMI nace en L3 y va al colon izquierdo; no tiene ninguna relación con el duodeno."}, {"letra": "c", "texto": "Hemorragia de arteria pancreaticoduodenal posterosuperior.", "correcta": false, "razon": "Arcada posterior de la cabeza del páncreas: relación POSTERIOR de D2, no de la cara anterior del bulbo."}, {"letra": "d", "texto": "Hemorragia de arteria pancreaticoduodenal posteroinferior.", "correcta": false, "razon": "Rama de la AMS en la cara posterior de la cabeza pancreática: también posterior y más distal."}, {"letra": "e", "texto": "Peritonitis.", "correcta": true, "razon": "CORRECTA: la cara anterior de D1 está cubierta por peritoneo y mira a la cavidad peritoneal (y al hígado/vesícula); una úlcera anterior que penetra perfora a la cavidad libre → aire libre y peritonitis química."}], "respuesta": "e", "razonamiento": "El bulbo duodenal (D1) tiene dos caras con destinos distintos: la ANTERIOR es intraperitoneal y da a la cavidad peritoneal (debajo del hígado y la vesícula), por lo que una úlcera anterior perforada produce neumoperitoneo y peritonitis; la POSTERIOR se apoya en la a. gastroduodenal (que cruza por detrás de D1 dividiéndolo en bulbo y porción fija) y en el colédoco, por lo que la úlcera posterior sangra masivamente. Las arcadas pancreatoduodenales están en la cabeza del páncreas, más lejos y posteriores. Regla: anterior = perfora, posterior = sangra."}, "examen": [], "pack": "D1: detrás desciende el colédoco retroduodenal y cruza la a. gastroduodenal (← hepática común ← tronco celíaco). Territorio proximal a la papila = tronco celíaco (a. PD superior ← gastroduodenal); distal a la papila = AMS (a. PD inferior). Venas: v. PD superior → porta directa; v. PD inferior → VMS.", "trampa": "Elegir 'gastroduodenal' por reflejo (es la respuesta de la úlcera POSTERIOR). Leer mal 'anterior/posterior' en el enunciado.", "prioridad": 2}, {"key": "R3D-p06", "pagina": 6, "item": 5, "tipo": "identifica", "titulo": "Ramas de la arteria mesentérica superior (esquema Netter) · yeyunales, ileales, ileocólica, cólica derecha y media, vasos rectos", "que_se_ve": "Esquema en color del intestino con el mesenterio abierto: la AMS (3) baja desde detrás del páncreas; a su izquierda las ramas yeyunales (5) e ileales (8) con arcadas y vasos rectos (6); a su derecha la pancreatoduodenal inferior (2), la cólica media (16) al transverso (1), la cólica derecha (15) al ascendente (14) y la ileocólica (13) hacia ciego (12) y apéndice (9).", "etiquetas": [{"n": "1", "nombre": "Colon transverso", "rosa": false, "seguro": true, "nota": "Órgano al que llega la cólica media; 2/3 proximales = AMS, 1/3 distal = AMI (Cannon-Böhm)."}, {"n": "2", "nombre": "A. pancreatoduodenal inferior", "rosa": true, "seguro": true, "nota": "Primera rama (derecha) de la AMS: cierra las arcadas con la PD superior (gastroduodenal) = colateral tronco celíaco ↔ AMS (caso 9)."}, {"n": "3", "nombre": "A. mesentérica superior (AMS)", "rosa": true, "seguro": true, "nota": "Aorta L1, detrás del cuello del páncreas, delante de D3 y del uncinado; da ramas IZQUIERDAS (yeyunales, ileales) y DERECHAS (PD inferior, cólica media, cólica dcha, ileocólica)."}, {"n": "4", "nombre": "Yeyuno (asa proximal)", "rosa": false, "seguro": false, "nota": "El asa a la que llegan las yeyunales; el cuaderno previo lo llamó 'arcadas'. La línea apunta a la pared del asa."}, {"n": "5", "nombre": "Aa. yeyunales", "rosa": true, "seguro": true, "nota": "Ramas del borde izquierdo de la AMS: 1-2 órdenes de arcadas y vasos rectos LARGOS (pared gruesa, más vascular)."}, {"n": "6", "nombre": "Vasos rectos (arteriae rectae)", "rosa": true, "seguro": true, "nota": "Desde la última arcada a la pared intestinal; son terminales → su oclusión da isquemia segmentaria."}, {"n": "7", "nombre": "Íleon (asa distal)", "rosa": false, "seguro": false, "nota": "Asas inferiores; el cuaderno previo lo llamó 'rama ileal'. Pared fina, placas de Peyer."}, {"n": "8", "nombre": "Aa. ileales", "rosa": true, "seguro": true, "nota": "Ramas izquierdas distales de la AMS: 3-5 órdenes de arcadas y vasos rectos CORTOS, más grasa en el meso."}, {"n": "9", "nombre": "Apéndice vermiforme / a. apendicular", "rosa": false, "seguro": false, "nota": "Tubo fino en la base del ciego; la a. apendicular (rama de la ileocólica) corre por el mesoapéndice."}, {"n": "10", "nombre": "Rama ileal / cecal de la a. ileocólica", "rosa": false, "seguro": false, "nota": "Ramas terminales de la ileocólica hacia el íleon terminal y el ciego (cecales anterior y posterior)."}, {"n": "11", "nombre": "Rama cólica (ascendente) de la a. ileocólica", "rosa": false, "seguro": false, "nota": "Asciende por el ascendente y se anastomosa con la cólica derecha."}, {"n": "12", "nombre": "Ciego", "rosa": false, "seguro": true, "nota": "Intraperitoneal y móvil → se vuelve (img 16 de enero). Irrigado por las cecales de la ileocólica."}, {"n": "13", "nombre": "A. ileocólica", "rosa": true, "seguro": true, "nota": "Rama terminal (derecha) de la AMS: ramas cólica, cecales anterior/posterior, apendicular e ileal."}, {"n": "14", "nombre": "Colon ascendente", "rosa": false, "seguro": true, "nota": "Fijo (Toldt); irrigado por cólica derecha + rama ascendente de la ileocólica."}, {"n": "15", "nombre": "A. cólica derecha", "rosa": true, "seguro": true, "nota": "Rama derecha de la AMS para el colon ascendente (inconstante, a menudo nace de la ileocólica o de la cólica media)."}, {"n": "16", "nombre": "A. cólica media", "rosa": true, "seguro": true, "nota": "Rama derecha de la AMS que entra en el mesocolon transverso: irriga el transverso; se LIGA en la cirugía del transverso (caso 15). Su rama izquierda se anastomosa con la cólica izquierda (Riolano)."}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P10 (relacionada)", "imagen": 14, "clave": "d", "img_key": "enero-14", "que_pregunto": "La img 14 de enero fue la ANGIOGRAFÍA de la AMS (S8 p7), no este esquema, pero el contenido es el mismo: etiquetas A/B/C cruzadas entre ileales, yeyunales y cólica media → clave d 'ninguna correcta'. Este esquema es la versión con nombres para aprenderse el mapa."}], "pack": "AMS ← aorta (L1). Ramas derechas: PD inferior, cólica media (transverso), cólica derecha (ascendente), ileocólica (ciego, apéndice, íleon terminal). Ramas izquierdas: 12-15 yeyunales e ileales → arcadas → vasos rectos. Venas satélites → VMS (a la derecha de la AMS) → porta detrás del cuello del páncreas. Linfa: yuxtaintestinales → mesentéricos → mesentéricos superiores. Inervación: vago (↑) + esplácnicos T8-T10 (↓); dolor referido periumbilical T10-T11.", "trampa": "Cruzar yeyunales/ileales (yeyunales = proximales, arcadas simples, vasos rectos largos). Poner la cólica media como rama de la AMI. Olvidar que la ileocólica es la rama TERMINAL de la AMS.", "prioridad": 2}, {"key": "R3D-p07", "pagina": 7, "item": 6, "tipo": "caso", "titulo": "Caso 6 · Adenocarcinoma del cuello del páncreas: primer órgano con metástasis", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 42 años con ictericia ingresa con dolor intenso que irradia a la espalda. La TC revela un tumor en el cuello del páncreas. La biopsia muestra un adenocarcinoma ductal. ¿Cuál de las siguientes estructuras recibirá primero células metastásicas?", "opciones": [{"letra": "a", "texto": "Estómago.", "correcta": false, "razon": "Está delante del páncreas (a través de la bolsa omental) pero no recibe la sangre venosa pancreática; sería invasión por contigüidad, no metástasis."}, {"letra": "b", "texto": "Bazo.", "correcta": false, "razon": "El drenaje va del bazo hacia la porta (v. esplénica), no al revés; la cola (no el cuello) es la parte que se relaciona con el bazo."}, {"letra": "c", "texto": "Duodeno.", "correcta": false, "razon": "Abraza la cabeza; no es destino venoso del páncreas."}, {"letra": "d", "texto": "Hígado.", "correcta": true, "razon": "CORRECTA: el cuello del páncreas descansa sobre la confluencia VMS + esplénica = origen de la vena PORTA; las células tumorales que invaden la porta llegan al hígado (primer filtro del sistema porta)."}, {"letra": "e", "texto": "Columna vertebral.", "correcta": false, "razon": "Vía de Batson (plexos vertebrales), típica de próstata/mama, no del páncreas."}], "respuesta": "d", "razonamiento": "El cuello del páncreas es la porción estrecha que se sitúa por delante de la formación de la vena porta (unión de la VMS con el tronco esplenomesentérico) y del origen de la AMS. Un carcinoma del cuello invade primero la porta/VMS, y la sangre portal desemboca íntegramente en los sinusoides hepáticos, así que el hígado es el primer órgano en recibir émbolos tumorales (metástasis hepáticas = patrón típico del cáncer de páncreas). La ictericia del enunciado indica compresión del colédoco (cabeza-cuello); el dolor irradiado a la espalda, invasión del plexo celíaco retroperitoneal."}, "examen": [], "pack": "Vena porta = VMS + tronco esplenomesentérico (v. esplénica + VMI) detrás del cuello del páncreas (L1-L2), sin válvulas, sube por el lig. hepatoduodenal (delante del hiato de Winslow, VCI detrás) y da el 75 % de la sangre hepática. Linfa del cuello/cabeza → nodos pancreatoduodenales → celíacos.", "trampa": "Elegir 'bazo' por asociar páncreas con bazo (es la COLA la que toca el bazo) o 'duodeno' por vecindad; la pregunta va de vía venosa (porta → hígado).", "prioridad": 2}, {"key": "R3D-p08", "pagina": 8, "item": 7, "tipo": "caso", "titulo": "Caso 7 · Tumor del cuello del páncreas: vaso obstruido", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un gran vaso parece estar casi ocluido en un paciente de 42 años diagnosticado de adenocarcinoma ductal. La TC ha demostrado claramente que el tumor está en el cuello del páncreas. ¿Cuál de los siguientes vasos estaría más probablemente obstruido?", "opciones": [{"letra": "a", "texto": "Vena mesentérica inferior.", "correcta": false, "razon": "Sube por la izquierda, detrás del cuerpo del páncreas, para desembocar en la esplénica; no es 'un gran vaso' bajo el cuello."}, {"letra": "b", "texto": "Vena porta.", "correcta": true, "razon": "CORRECTA: se forma justo DETRÁS del cuello del páncreas por la unión de la VMS y la v. esplénica; es el gran vaso comprimido por un tumor de cuello."}, {"letra": "c", "texto": "Arteria mesentérica superior.", "correcta": false, "razon": "Nace también detrás del cuello pero baja por detrás del páncreas hacia el uncinado; es más posterior y con pared arterial gruesa, menos comprimible que la porta."}, {"letra": "d", "texto": "Arteria pancreaticoduodenal posterosuperior.", "correcta": false, "razon": "Pequeña arteria de la cabeza (arcada posterior), no 'un gran vaso'."}, {"letra": "e", "texto": "Arteria pancreática magna.", "correcta": false, "razon": "Rama de la esplénica para el cuerpo-cola; calibre pequeño y lejos del cuello."}], "respuesta": "b", "razonamiento": "La relación anatómica clave del cuello del páncreas es que cubre por delante la confluencia venosa VMS + esplénica que forma la vena PORTA (en el borde superior del cuello, a nivel de L1-L2). Una masa en el cuello comprime primero esa vena de pared fina (hipertensión portal segmentaria, varices). La AMS nace por detrás pero desciende ya por debajo del cuello, delante del uncinado y D3, y las arterias pancreáticas son de pequeño calibre. Este caso y el anterior (p7) van juntos: cuello → porta → hígado."}, "examen": [], "pack": "Porta: VMS + (esplénica + VMI) detrás del cuello del páncreas; tributarias directas: gástricas izquierda y derecha, cística, PD superior. Anastomosis porto-cava: esofágicas (gástrica izda ↔ ácigos), rectales (rectal superior ↔ media/inferior), paraumbilicales (cabeza de medusa), retroperitoneales de Retzius.", "trampa": "Elegir la AMS (también 'nace detrás del cuello'); la pregunta dice 'gran vaso obstruido' y el que se comprime es la vena porta.", "prioridad": 2}, {"key": "R3D-p09", "pagina": 9, "item": 8, "tipo": "identifica", "titulo": "Arteria mesentérica inferior y ramas · esquema Netter + angiografía selectiva de la AMI", "que_se_ve": "Arriba, esquema del colon izquierdo con la AMI (1) naciendo de la aorta, la cólica izquierda (2) con sus ramas ascendente (3) y descendente (4), las sigmoideas (5) y la rama terminal al recto (6). Abajo, angiografía selectiva de la AMI con los mismos números (1, 2, 5, 6). Rosas: 3 y 4 en el esquema; 1, 2, 5, 6 en la angiografía.", "etiquetas": [{"n": "1", "nombre": "A. mesentérica inferior (AMI)", "rosa": true, "seguro": true, "nota": "Nace de la aorta en L3, 3-4 cm por encima de la bifurcación; irriga el colon a partir de Cannon-Böhm: 1/3 distal del transverso, descendente, sigma y recto superior."}, {"n": "2", "nombre": "A. cólica izquierda", "rosa": true, "seguro": true, "nota": "Primera rama de la AMI; se divide en ascendente y descendente. Hemorragia del colon descendente = 'rama de la AMI' (caso 1)."}, {"n": "3", "nombre": "Rama ascendente de la cólica izquierda", "rosa": true, "seguro": true, "nota": "Sube hacia el ángulo esplénico y se anastomosa con la rama izquierda de la cólica MEDIA (AMS) = arco de Riolano / arcada marginal de Drummond."}, {"n": "4", "nombre": "Rama descendente de la cólica izquierda", "rosa": true, "seguro": true, "nota": "Baja por el descendente y se une a las sigmoideas."}, {"n": "5", "nombre": "Aa. sigmoideas", "rosa": true, "seguro": true, "nota": "2-4 ramas en el mesosigma para el colon sigmoide."}, {"n": "6", "nombre": "A. rectal superior (la diapo dice 'rectal inferior': ERROR)", "rosa": true, "seguro": true, "nota": "La rama TERMINAL de la AMI es la rectal SUPERIOR (continúa la AMI en el mesosigma hasta el recto). La rectal inferior es rama de la pudenda interna. Si Bermúdez pone 'rectal inferior' en una opción de lista, es la pieza falsa."}], "pregunta": null, "examen": [], "pack": "AMI ← aorta (L3) → cólica izquierda (ascendente ↔ cólica media = Riolano; descendente), sigmoideas, rectal superior (terminal). Venas: v. cólica izquierda + sigmoideas + rectal superior → VMI → v. ESPLÉNICA (60 %) → porta (la VMI no llega a la porta directamente). Linfa: cólicos izquierdos → mesentéricos inferiores → preaórticos. Inervación: plexo mesentérico inferior + esplácnicos pélvicos S2-S4 (parasimpático) desde Cannon-Böhm; dolor referido T12-L1.", "trampa": "La propia diapo: 'rectal inferior' por rectal superior. También: hacer nacer la AMI en L1 (es L3) o meter la cólica media entre las ramas de la AMI.", "prioridad": 2}, {"key": "R3D-p10", "pagina": 10, "item": 9, "tipo": "caso", "titulo": "Caso 9 · Colaterales entre tronco celíaco y AMS", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 65 años ingresa con dolor abdominal inespecífico. La exploración revela isquemia intestinal leve por oclusión aterosclerótica de la pared medioproximal de la arteria mesentérica superior, pero la irrigación colateral ha retrasado el inicio de la necrosis. ¿Qué vasos ofrecen colaterales entre el tronco celíaco y la arteria mesentérica superior?", "opciones": [{"letra": "a", "texto": "Pancreaticoduodenal superior e inferior.", "correcta": true, "razon": "CORRECTA: la PD superior (← gastroduodenal ← hepática común ← tronco celíaco) y la PD inferior (← AMS) forman las arcadas anterior y posterior de la cabeza del páncreas, único puente TC ↔ AMS."}, {"letra": "b", "texto": "Gástrica izquierda y hepática.", "correcta": false, "razon": "Ambas son del tronco celíaco; se anastomosan entre sí (curvatura menor con la gástrica derecha) pero no con la AMS."}, {"letra": "c", "texto": "Cística y gastroduodenal.", "correcta": false, "razon": "Las dos son ramas de la hepática (tronco celíaco); la gastroduodenal participa vía PD superior, pero la cística no."}, {"letra": "d", "texto": "Cólica derecha e izquierda.", "correcta": false, "razon": "Colateral AMS ↔ AMI (arcada marginal / Riolano), no con el tronco celíaco."}, {"letra": "e", "texto": "Gastroomental derecha e izquierda.", "correcta": false, "razon": "Arco de la curvatura mayor: gastroduodenal ↔ esplénica, ambas del tronco celíaco."}], "respuesta": "a", "razonamiento": "Los tres troncos viscerales de la aorta se comunican en dos puntos: tronco celíaco ↔ AMS a través de las arcadas PANCREATODUODENALES (superior, de la gastroduodenal; inferior, de la AMS) alrededor de la cabeza del páncreas, y AMS ↔ AMI a través de la arcada marginal de Drummond y el arco de Riolano (cólica media ↔ cólica izquierda). Una estenosis proximal de la AMS se compensa por flujo retrógrado desde la gastroduodenal por las arcadas pancreatoduodenales. Las demás opciones son anastomosis dentro del propio tronco celíaco (b, c, e) o AMS-AMI (d)."}, "examen": [], "pack": "Arcada PD superior: a. gastroduodenal ← hepática común ← tronco celíaco (T12). Arcada PD inferior: ← AMS (L1). Venas: v. PD superior → porta; v. PD inferior → VMS. Colateral AMS ↔ AMI: cólica media ↔ cólica izquierda (Riolano, cerca de la aorta) y marginal de Drummond (borde del colon).", "trampa": "Elegir 'cólica derecha e izquierda' (es AMS-AMI) o 'cística y gastroduodenal' (suena a hepática, pero la cística no conecta con nada).", "prioridad": 2}, {"key": "R3D-p11", "pagina": 11, "item": 10, "tipo": "identifica", "titulo": "Sistema venoso porta (esquema Netter) · gástrica izquierda, esplénica, VMI, VMS, porta", "que_se_ve": "Esquema en color de hígado, estómago, bazo e intestino con las venas en azul: la porta (5) entrando en el hilio hepático, la gástrica izquierda (1) subiendo al esófago, la esplénica (2) desde el bazo por detrás del páncreas, la VMI (3) a la izquierda y la VMS (4) a la derecha de las asas.", "etiquetas": [{"n": "1", "nombre": "V. gástrica izquierda (coronaria estomáquica)", "rosa": true, "seguro": true, "nota": "Tributaria DIRECTA de la porta por la curvatura menor; recibe las vv. esofágicas → anastomosis porto-cava con la ácigos → VARICES ESOFÁGICAS en la hipertensión portal."}, {"n": "2", "nombre": "V. esplénica", "rosa": true, "seguro": true, "nota": "Recta, por DETRÁS del cuerpo del páncreas (la arteria es la tortuosa del borde superior); recibe las cortas, gastroomental izquierda, pancreáticas y la VMI → tronco esplenomesentérico."}, {"n": "3", "nombre": "V. mesentérica inferior (VMI)", "rosa": true, "seguro": true, "nota": "Recoge cólica izquierda, sigmoideas y rectal superior; sube por la izquierda y desemboca en la v. ESPLÉNICA (60 %) o en el ángulo esplenomesentérico; NO llega directa a la porta."}, {"n": "4", "nombre": "V. mesentérica superior (VMS)", "rosa": true, "seguro": true, "nota": "A la DERECHA de la AMS, delante de D3 y del uncinado; recibe yeyunales, ileales, ileocólica, cólicas derecha y media, gastroomental derecha y PD inferior."}, {"n": "5", "nombre": "V. porta", "rosa": true, "seguro": true, "nota": "VMS + esplénica detrás del cuello del páncreas; sin válvulas; sube en el lig. hepatoduodenal por delante del hiato de Winslow (VCI detrás); 75 % del flujo hepático."}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P19 (lámina afín)", "imagen": 19, "clave": "d", "img_key": "enero-19", "que_pregunto": "Img 19 (vísceras supramesocólicas con vasos): 'A = a. esplénica / B = VMS / C = VMI' → todas falsas (clave d). La placa exacta no está localizada en el campus; este esquema (p11) y R2D p17 son las láminas para orientarse: esplénica tortuosa arriba del páncreas, VMS a la derecha de la AMS, VMI a la izquierda desembocando en la esplénica."}], "pack": "Porta = VMS + tronco esplenomesentérico (esplénica + VMI), detrás del cuello del páncreas (L1-L2). Directas a porta: gástricas izquierda y derecha (con la prepilórica de Mayo), cística, PD superior. A la esplénica: cortas, gastroomental izquierda, VMI. A la VMS: gastroomental derecha, PD inferior. Anastomosis porto-cava: esófago (gástrica izda ↔ ácigos), recto (rectal sup ↔ media/inf), paraumbilicales (cabeza de medusa), Retzius (retroperitoneo).", "trampa": "Etiquetar como arteria lo que es vena (o un órgano). Decir que la VMI desemboca en la porta o en la VMS 'siempre'. Cambiar izquierda/derecha entre VMS y VMI.", "prioridad": 2}, {"key": "R3D-p12", "pagina": 12, "item": 11, "tipo": "identifica", "titulo": "Pelvis femenina, corte sagital (Netter) · fondo de saco rectouterino (Douglas) y recto", "que_se_ve": "Corte sagital medio de pelvis femenina en color: útero en anteversión sobre la vejiga, vagina detrás, recto apoyado en el sacro; entre útero/fórnix posterior y recto el fondo de saco rectouterino (2). Rosas: 2 y 3. Es la gemela Netter de la IMAGEN 18 de enero (que usó la lámina de Gray T15 p4, ♀ abajo).", "etiquetas": [{"n": "1", "nombre": "Útero (cuerpo)", "rosa": false, "seguro": true, "nota": "Órgano piriforme en anteversión-anteflexión sobre la vejiga; la línea del 1 termina en el cuerpo uterino."}, {"n": "2", "nombre": "Fondo de saco rectouterino (Douglas)", "rosa": true, "seguro": true, "nota": "Punto MÁS DECLIVE de la cavidad peritoneal en bipedestación → sangre, pus, ascitis; se punciona por el fórnix vaginal posterior (culdocentesis). Solo existe en la mujer; en el varón el equivalente es el rectovesical."}, {"n": "3", "nombre": "Recto", "rosa": true, "seguro": true, "nota": "Desde S3 hasta la flexura perineal; flexura sacra (concavidad anterior). Peritoneo: 1/3 sup. anterior y laterales, 1/3 medio solo anterior, 1/3 inf. subperitoneal."}, {"n": "4", "nombre": "Vagina", "rosa": false, "seguro": true, "nota": "Detrás de la vejiga/uretra y delante del recto; fórnix posterior en relación con Douglas (tabique rectovaginal por debajo)."}, {"n": "5", "nombre": "Uretra femenina", "rosa": false, "seguro": false, "nota": "Corta (3-4 cm), en la pared ANTERIOR de la vagina (pregunta de mayo P25). Podría ser etiquetada 'vagina' según la línea; la 4 ya es la vagina."}, {"n": "6", "nombre": "Vejiga urinaria", "rosa": false, "seguro": true, "nota": "Con mucosa rugosa; el fondo de saco vesicouterino (anterior) queda entre ella y el útero."}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P18", "imagen": 18, "clave": "c", "img_key": "enero-18", "que_pregunto": "Img 18 (pelvis sagital ♀ y ♂, lámina Gray T15 p4): 'a) A = fondo de saco rectovesical; b) B = rectouterino; c) A y B son fondos de saco recubiertos por peritoneo donde se acumulan fluidos; d) todas'. Clave c: A estaba en la ♀ (= rectouterino/Douglas) y B en el ♂ (= rectovesical), es decir, a y b estaban cruzadas. Esta p12 (♀) y la p14 (♂) son las láminas gemelas del reto."}], "pack": "Útero: a. uterina ← ilíaca interna (+ ovárica ← aorta, + a. del lig. redondo ← epigástrica inferior); plexo uterovaginal → ilíaca interna; linfa segmentaria (fondo → lumbares, cuerpo → ilíacos externos, cérvix → ilíacos internos/externos/sacros). Recto: rectal superior (AMI) + media (ilíaca interna) + inferior (pudenda interna). Vagina: 4 fuentes de la ilíaca interna (vaginal, uterina, rectal media, pudenda interna). Uréter pasa por DETRÁS de la a. uterina ('agua bajo el puente').", "trampa": "Asignar 'rectovesical' a la mujer (no existe: en ♀ hay vesicouterino + rectouterino). Formato 'todas correctas' con una pieza cruzada.", "prioridad": 3}, {"key": "R3D-p13", "pagina": 13, "item": 12, "tipo": "caso", "titulo": "Caso 12 · Carcinoma espinocelular del ano: primer relevo linfático", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 53 años acude por una masa anormal en el conducto anal. La biopsia revela un carcinoma espinocelular en el ano. ¿Cuál de los siguientes nódulos linfáticos recibiría primero células cancerosas del tumor anal?", "opciones": [{"letra": "a", "texto": "Nódulos linfáticos inguinales profundos.", "correcta": false, "razon": "Reciben de los superficiales y del glande/clítoris; no son el primer relevo de la piel anal."}, {"letra": "b", "texto": "Nódulos linfáticos inguinales superficiales.", "correcta": true, "razon": "CORRECTA: el canal anal por DEBAJO de la línea pectínea (epitelio escamoso, origen ectodérmico) drena como la piel del periné → inguinales superficiales. Un carcinoma ESPINOCELULAR es de ese epitelio."}, {"letra": "c", "texto": "Ganglios ilíacos internos.", "correcta": false, "razon": "Relevo del canal anal por ENCIMA de la línea pectínea (adenocarcinoma) y del recto distal."}, {"letra": "d", "texto": "Ganglios ilíacos externos.", "correcta": false, "razon": "Reciben de los inguinales en segunda estación y de vejiga/útero, no de la piel anal."}, {"letra": "e", "texto": "Ganglios paraaórticos.", "correcta": false, "razon": "Relevo del recto proximal (vía mesentéricos inferiores) y de las gónadas."}], "respuesta": "b", "razonamiento": "La línea pectínea divide el canal anal en dos mundos: por encima (endodermo, mucosa cilíndrica) la arteria es la rectal superior (AMI), la vena va a la porta, la linfa a ilíacos internos y la sensibilidad es visceral (indolora); por debajo (ectodermo, epitelio escamoso) la arteria es la rectal inferior (pudenda interna), la vena va a la cava, la linfa a inguinales SUPERFICIALES y la inervación es somática (pudendo, dolorosa). 'Espinocelular' = epitelio escamoso = zona infrapectínea, así que hay que palpar las ingles: primer relevo inguinales superficiales."}, "examen": [], "pack": "Canal anal infrapectíneo: a. rectal inferior ← pudenda interna ← ilíaca interna; v. rectal inferior → pudenda interna → ilíaca interna → cava; linfa → inguinales superficiales; n. rectal inferior ← pudendo (S2-S4). Suprapectíneo: rectal superior ← AMI; v. rectal superior → VMI → porta; linfa → ilíacos internos; plexo hipogástrico inferior. Esfínter interno liso (simpático mantiene tono) / externo estriado (pudendo).", "trampa": "Elegir ilíacos internos (válido para el ADENOcarcinoma del canal anal alto). Confundir superficiales con profundos.", "prioridad": 2}, {"key": "R3D-p14", "pagina": 14, "item": 13, "tipo": "identifica", "titulo": "Pelvis masculina, corte sagital (Netter) · fondo de saco rectovesical", "que_se_ve": "Corte sagital medio de pelvis masculina en color: vejiga, próstata debajo, uretra y pene, testículo en el escroto, recto detrás; entre la cara posterior de la vejiga y el recto el fondo de saco rectovesical (5, único rosa). Gemela Netter del corte ♂ de la IMAGEN 18 de enero (Gray T15 p4, ♂ arriba).", "etiquetas": [{"n": "1", "nombre": "Recto", "rosa": false, "seguro": true, "nota": "Sobre el sacro con la flexura sacra; delante, las vesículas seminales y la próstata separadas por la fascia rectoprostática de Denonvilliers."}, {"n": "2", "nombre": "Bulbo del pene / uretra bulbar (posible conducto anal)", "rosa": false, "seguro": false, "nota": "La línea termina en la región perineal anterior, bajo la próstata, junto al bulbo esponjoso; el cuaderno previo lo etiquetó 'conducto anal', que queda inmediatamente posterior. Verificar en la lámina original."}, {"n": "3", "nombre": "Próstata", "rosa": false, "seguro": true, "nota": "Bajo el cuello vesical, atravesada por la uretra prostática; irrigada por vesical inferior + rectal media + pudenda interna (todas de la ilíaca interna); drena a Santorini → ilíaca interna y Batson → columna."}, {"n": "4", "nombre": "Vejiga urinaria", "rosa": false, "seguro": true, "nota": "Subperitoneal; el peritoneo se refleja desde su cara posterior al recto formando el rectovesical."}, {"n": "5", "nombre": "Fondo de saco rectovesical (la diapo añade 'Douglas')", "rosa": true, "seguro": true, "nota": "Punto más declive de la cavidad peritoneal en el varón, entre vejiga/vesículas seminales y recto; por debajo, fascia de Denonvilliers. En la mujer NO existe (allí hay vesicouterino y rectouterino)."}], "pregunta": null, "examen": [{"examen": "enero 2026", "pregunta": "P18", "imagen": 18, "clave": "c", "img_key": "enero-18", "que_pregunto": "Img 18: en el corte ♂ la etiqueta B señalaba el fondo de saco RECTOVESICAL (la opción b decía 'rectouterino' → falsa). Clave c: 'A y B son fondos de saco peritoneales donde se acumulan fluidos'."}], "pack": "Vejiga: aa. vesicales superiores ← umbilical ← ilíaca interna; plexo vesical → ilíaca interna y → plexo vertebral de Batson (mayo P23); detrusor ← S2-S4. Próstata: vesical inferior + rectal media + pudenda interna; plexo de Santorini → ilíaca interna; linfa → ilíacos internos/sacros. Recto: rectal superior (AMI), media (ilíaca interna), inferior (pudenda interna).", "trampa": "Llamar 'Douglas' al rectovesical en un test de mujer, o preguntar por el 'rectouterino' en un corte de varón. Situar el fondo de saco entre próstata y recto (está más arriba: vejiga/vesículas seminales – recto).", "prioridad": 3}, {"key": "R3D-p15", "pagina": 15, "item": 14, "tipo": "caso", "titulo": "Caso 14 · Aneurisma aórtico en el origen de la AMS: órgano isquémico", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 62 años ingresa con dolores abdominales de origen indeterminado. La TC revela un aneurisma aórtico que afecta al origen de la arteria mesentérica superior, causando isquemia en un órgano abdominal. ¿Cuál de los siguientes órganos se afectará con mayor probabilidad?", "opciones": [{"letra": "a", "texto": "Íleon.", "correcta": true, "razon": "CORRECTA: yeyuno-íleon son territorio EXCLUSIVO de la AMS (ramas ileales del borde izquierdo) sin colaterales de otro tronco; el íleon, con vasos rectos cortos y arcadas terminales, es el que antes sufre."}, {"letra": "b", "texto": "Colon transverso.", "correcta": false, "razon": "Irrigado por la cólica media (AMS) pero con rescate desde la AMI por la cólica izquierda (Riolano / Drummond)."}, {"letra": "c", "texto": "Bazo.", "correcta": false, "razon": "A. esplénica ← tronco celíaco; nada que ver con la AMS."}, {"letra": "d", "texto": "Estómago.", "correcta": false, "razon": "Todo del tronco celíaco (gástricas, gastroomentales, cortas)."}, {"letra": "e", "texto": "Duodeno.", "correcta": false, "razon": "Doble irrigación: PD superior (tronco celíaco vía gastroduodenal) + PD inferior (AMS); las arcadas lo protegen."}], "respuesta": "a", "razonamiento": "La AMS irriga desde la papila duodenal hasta los 2/3 del transverso, pero sus extremos tienen colaterales: el duodeno-cabeza del páncreas por las arcadas pancreatoduodenales (tronco celíaco) y el colon transverso por la arcada marginal y el arco de Riolano (AMI). El yeyuno-íleon, en cambio, depende únicamente de las ramas yeyunales e ileales de la AMS ('territorio puro'), y el íleon, con arcadas múltiples y vasos rectos cortos y terminales, es el que se necrosa primero cuando cae el flujo en el origen de la AMS. Estómago y bazo son del tronco celíaco."}, "examen": [], "pack": "Yeyuno-íleon: aa. yeyunales e ileales ← AMS ← aorta (L1); vv. → VMS → porta; linfa → mesentéricos superiores; vago (↑) / esplácnicos T8-T10 (↓); dolor referido periumbilical T10-T11. Colaterales de la AMS: pancreatoduodenales (con TC) y Riolano/Drummond (con AMI).", "trampa": "Elegir 'duodeno' o 'colon transverso' por ser también de la AMS: la clave está en que esos tienen colaterales y el íleon no.", "prioridad": 2}, {"key": "R3D-p16", "pagina": 16, "item": 15, "tipo": "caso", "titulo": "Caso 15 · Diverticulosis del colon transverso: arteria a ligar", "que_se_ve": "Diapositiva de texto, sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Una mujer de 68 años sufre los efectos a largo plazo de la diverticulosis e inflamación del colon transverso. Para operarla, primero sería necesario ligar o pinzar el origen de la irrigación arterial. ¿Cuál de las siguientes arterias se ligará con mayor probabilidad?", "opciones": [{"letra": "a", "texto": "Cólica media.", "correcta": true, "razon": "CORRECTA: rama derecha de la AMS que entra en el mesocolon transverso y es la arteria principal del colon transverso."}, {"letra": "b", "texto": "Cólica derecha.", "correcta": false, "razon": "Irriga el colon ascendente."}, {"letra": "c", "texto": "Mesentérica superior.", "correcta": false, "razon": "Ligarla dejaría isquémico todo el delgado y el colon derecho; se liga la rama específica, no el tronco."}, {"letra": "d", "texto": "Ileocólica.", "correcta": false, "razon": "Ciego, apéndice, íleon terminal."}, {"letra": "e", "texto": "Cólica izquierda.", "correcta": false, "razon": "Rama de la AMI para el descendente (solo su rama ascendente aporta al tercio distal del transverso vía Riolano)."}], "respuesta": "a", "razonamiento": "El colon transverso recibe su irrigación principal de la a. cólica media, rama de la AMS que discurre por el mesocolon transverso y se divide en rama derecha (hacia el ángulo hepático, anastomosis con la cólica derecha) e izquierda (hacia el ángulo esplénico, anastomosis con la cólica izquierda = arco de Riolano). En una colectomía transversa se liga la cólica media en su origen. El tercio distal del transverso también recibe de la AMI (Cannon-Böhm), pero la pregunta pide 'el origen de la irrigación' del transverso: cólica media. Este caso está recogido en el glosario VID como dato de prioridad máxima del colon."}, "examen": [], "pack": "Colon transverso: a. cólica media ← AMS ← aorta (L1); v. cólica media → VMS → porta; linfa mixta (cólicos derechos → mesentéricos superiores; cólicos izquierdos → mesentéricos inferiores); vago hasta Cannon-Böhm, S2-S4 después. Meso: mesocolon transverso (raíz cruza D2, cabeza del páncreas y riñón izquierdo; separa supra/inframesocólico), ligamentos gastrocólico y frenocólicos.", "trampa": "Elegir 'mesentérica superior' (tronco) o 'cólica izquierda' (AMI). Bermúdez lo usa como pregunta sin imagen: 'para operar el transverso se liga…'.", "prioridad": 2}]}, "R3G": {"fuente": "R3G", "titulo": "Reto 3 GU · Aparato reproductor masculino", "resumen_examen": "Fuente muy rentable: de las 21 páginas del PDF, 2 láminas salieron LITERALES como imagen en mayo 2026 (img 12 = p17 eco de próstata '4,67 cm' → P14 irrigación prostática, clave b; img 14 = p19 eco testicular → P7 triple irrigación, clave c) y otras 2 páginas generaron preguntas SIN imagen con el mismo molde (P3 fascia de Buck ↔ p21 corte de pene Rohen; P12 ligamentos del pene ↔ p7 'Identifica los ligamentos del pene', clave b). La img 16 de mayo (P21, clave d: transrectal > suprapúbica) era una foto de técnica ecográfica del mismo tipo que p4. Siguen SIN caer y son candidatas calientes (F2 §3.2): p14 (pelvis ♂ coronal Rohen, rosas 5-6-11-16), p15 (testículo-epidídimo con conos eferentes y rete testis), p21 (pene transversal Rohen, 9 rosas), p11 (pelvis ♂ sagital Rohen, 12 rosas), p3/p9/p13 (Sobotta periné, uretra frontal y pelvis sagital). Los 9 casos clínicos son el molde de las preguntas de teoría (Retzius, varicocele izquierdo → v. renal izquierda, linfa testicular lumbar vs prostática ilíaca interna, pudenda interna e impotencia).", "paginas": [{"key": "R3G-p01", "pagina": 1, "item": 0, "tipo": "omitir", "titulo": "Portada · Reto 3 Aparato reproductor masculino (Bermúdez)", "prioridad": 0}, {"key": "R3G-p02", "pagina": 2, "item": 1, "tipo": "caso", "titulo": "Caso 1 · Niño de 4 meses que orina por el dorso del pene (epispadias)", "que_se_ve": "Diapositiva de texto: caso clínico de embriología con 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un niño de 4 meses es ingresado en la clínica pediátrica al observarse que emite orina a través de una abertura en el dorso del pene. ¿Cuál de las siguientes estructuras embriológicas no se ha fusionado adecuadamente?", "opciones": [{"letra": "a", "texto": "Uretra esponjosa.", "correcta": false, "razon": "La uretra esponjosa es el resultado final del cierre de los pliegues urogenitales; no es una estructura que 'se fusione', y su fallo de cierre daría un meato VENTRAL (hipospadias), no dorsal."}, {"letra": "b", "texto": "Pliegues labioescrotales.", "correcta": false, "razon": "Los pliegues (eminencias) labioescrotales forman el escroto; su falta de fusión da escroto bífido, no una abertura uretral en el dorso."}, {"letra": "c", "texto": "Membrana cloacal.", "correcta": false, "razon": "La membrana cloacal se reabsorbe (no se fusiona); su persistencia/rotura anómala se asocia a extrofia vesical, que puede acompañar al epispadias pero no es 'la estructura que no se ha fusionado'."}, {"letra": "d", "texto": "Pliegues urogenitales.", "correcta": false, "razon": "Es el distractor principal: la falta de fusión de los pliegues urogenitales (uretrales) produce HIPOSPADIAS = meato en la cara VENTRAL del pene. Aquí la abertura es DORSAL."}, {"letra": "e", "texto": "Tubérculo genital.", "correcta": true, "razon": "EPISPADIAS: el tubérculo genital se desarrolla/posiciona anómalamente (demasiado caudal, dorsal al seno urogenital) y el surco uretral queda abierto en la cara dorsal del pene; se asocia a extrofia vesical."}], "respuesta": "e", "razonamiento": "Orina por el DORSO del pene = epispadias. En el desarrollo normal el tubérculo genital crece y arrastra el seno urogenital a su cara ventral, donde los pliegues urogenitales se cierran de atrás adelante formando la uretra esponjosa (meato en la punta del glande). Si los pliegues urogenitales no se cierran, la uretra se abre en la cara VENTRAL (hipospadias: glandular, peneana, penoescrotal, perineal; la malformación más frecuente del pene). Si el tubérculo genital se forma mal posicionado (dorsal respecto al seno urogenital, defecto del mesodermo de la pared infraumbilical), la placa uretral queda expuesta en la cara DORSAL = epispadias, casi siempre asociado a extrofia vesical. Regla: ventral = pliegues urogenitales (hipospadias) · dorsal = tubérculo genital (epispadias)."}, "examen": [], "pack": "Derivados del tubérculo genital: pene (cuerpos cavernosos, glande) / clítoris. Pliegues urogenitales: uretra esponjosa y cuerpo esponjoso / labios menores. Eminencias labioescrotales: escroto / labios mayores. Seno urogenital: vejiga, uretra prostática y membranosa, próstata, glándulas de Cowper.", "trampa": "Intercambiar hipospadias (VENTRAL, pliegues urogenitales, mucho más frecuente) con epispadias (DORSAL, tubérculo genital, con extrofia vesical). Fíjate en la palabra 'dorso'.", "prioridad": 1}, {"key": "R3G-p03", "pagina": 3, "item": 2, "tipo": "identifica", "titulo": "Periné masculino, visión inferior (litotomía): músculos del espacio perineal superficial (Sobotta)", "que_se_ve": "Dibujo de atlas (Sobotta) del periné masculino visto desde abajo con el pene levantado hacia arriba: triángulo urogenital con los músculos bulboesponjoso, isquiocavernoso y transverso superficial, centro tendinoso, ano con su esfínter, elevador del ano y glúteo mayor. Números 1-10 en negro, sin círculos rosas.", "etiquetas": [{"n": "1", "nombre": "Músculo bulboesponjoso", "rosa": false, "seguro": true, "nota": "Impar, en la línea media; cubre el bulbo del pene; vacía la uretra al final de la micción/eyaculación y comprime la v. dorsal profunda. N. pudendo."}, {"n": "2", "nombre": "Músculo isquiocavernoso", "rosa": false, "seguro": true, "nota": "Par, lateral; cubre el pilar (crus) del pene fijado a la rama isquiopubiana; mantiene la erección comprimiendo el pilar."}, {"n": "3", "nombre": "Membrana perineal (fascia inferior del diafragma urogenital)", "rosa": false, "seguro": false, "nota": "Lámina blanquecina triangular entre bulboesponjoso e isquiocavernoso; techo del espacio perineal superficial; la atraviesa la uretra membranosa."}, {"n": "4", "nombre": "Centro tendinoso del periné (cuerpo perineal)", "rosa": false, "seguro": true, "nota": "Punto de convergencia de bulboesponjoso, transversos, esfínter anal externo y elevador; separa triángulo urogenital y anal. Es la opción B del caso 7 (no se atraviesa para llegar a la vejiga)."}, {"n": "5", "nombre": "Músculo transverso superficial del periné", "rosa": false, "seguro": true, "nota": "De la tuberosidad isquiática al centro tendinoso; límite posterior del espacio perineal superficial."}, {"n": "6", "nombre": "Músculo esfínter externo del ano", "rosa": false, "seguro": true, "nota": "Estriado, voluntario, n. pudendo (rectal inferior). Rodea el canal anal; partes subcutánea, superficial y profunda."}, {"n": "7", "nombre": "Músculo elevador del ano", "rosa": false, "seguro": false, "nota": "Suelo de la pelvis (puborrectal, pubococcígeo, iliococcígeo); forma la pared medial de la fosa isquioanal (opción A del caso 7)."}, {"n": "8", "nombre": "Músculo glúteo mayor", "rosa": false, "seguro": true, "nota": "Límite posterolateral del periné; entre él y el elevador queda la fosa isquioanal con el canal de Alcock (n. pudendo y vasos pudendos internos)."}, {"n": "9", "nombre": "Cuerpo esponjoso del pene (cara uretral/ventral del cuerpo del pene)", "rosa": false, "seguro": false, "nota": "El pene está levantado: se ve su cara ventral con el rafe; el cuerpo esponjoso contiene la uretra esponjosa."}, {"n": "10", "nombre": "Glande del pene (corona/prepucio)", "rosa": false, "seguro": false, "nota": "Extremo del pene levantado; alternativa: cuerpo cavernoso."}], "examen": [], "pack": "Espacio perineal superficial (entre fascia de Colles y membrana perineal): bulbo del pene + bulboesponjoso (impar, medial), pilares + isquiocavernosos (pares, laterales), transverso superficial, ramas del n. pudendo y vasos pudendos internos (a. perineal → escrotales posteriores). Irrigación: a. pudenda interna ← a. ilíaca interna → a. perineal, a. del bulbo, a. profunda y a. dorsal del pene. Inervación de todos los músculos: n. pudendo (S2-S4), ramo perineal (rama profunda muscular; rama superficial → escrotales posteriores). Drenaje venoso: vv. pudendas internas → ilíaca interna. Linfa de la piel del periné y escroto → inguinales superficiales.", "trampa": "Bulbo IMPAR y medial (cuerpo esponjoso, bulboesponjoso) vs pilares PARES y laterales (cuerpos cavernosos, isquiocavernosos). Y la trampa de fascia: rotura de la uretra esponjosa → orina al espacio perineal superficial (escroto, pene, pared abdominal), NO al muslo ni a la fosa isquioanal.", "prioridad": 2}, {"key": "R3G-p04", "pagina": 4, "item": 3, "tipo": "tecnica", "titulo": "Foto de técnica ecográfica: transductor en el flanco izquierdo (plano coronal del riñón izquierdo)", "que_se_ve": "Fotografía real: paciente en decúbito supino, el explorador apoya un transductor convex en el flanco izquierdo (línea axilar media-posterior, entre reborde costal y cresta ilíaca) con orientación longitudinal, y muestra al paciente una impresión ecográfica. Sin números ni círculos. Mismo tipo de imagen que la img 16 de mayo 2026 (fotos de vías A-D).", "etiquetas": [], "pregunta": {"enunciado": "Describe los planos que atraviesan los ultrasonidos", "opciones": [], "respuesta": "", "razonamiento": "Pregunta abierta. Con el transductor en el flanco izquierdo en plano longitudinal (coronal), el haz atraviesa de superficie a profundidad: piel → tejido celular subcutáneo → músculos de la pared anterolateral (oblicuo externo, oblicuo interno, transverso del abdomen; si es más posterior, dorsal ancho y cuadrado lumbar) → fascia transversalis y peritoneo parietal → grasa pararrenal (paranéfrica) → fascia renal (Gerota) → grasa perirrenal (perinéfrica) → cápsula fibrosa → corteza renal (hipoecoica respecto a hígado/bazo, con columnas de Bertin) → pirámides medulares (más hipoecoicas) → seno renal (hiperecoico: grasa, vasos, pelvis y cálices). Cranealmente el bazo hace de ventana acústica (a la derecha lo hace el hígado, y entre hígado y riñón derecho está el receso hepatorrenal de Morrison); anteromedial queda el colon descendente (gas = sombra) y medial el psoas. El riñón izquierdo está más alto y más posterior que el derecho (costillas 11-12, receso costodiafragmático), por eso se busca un espacio intercostal o el borde subcostal y se pide inspiración profunda."}, "examen": [{"examen": "mayo 2026", "pregunta": "P21", "imagen": 16, "clave": "d", "que_pregunto": "Fotos de 4 vías (A-D) de exploración ecográfica GU: la única cierta era que la vía transrectal (D) tiene MÁS resolución para la próstata que la suprapúbica (C, atraviesa pared abdominal y vejiga). Misma familia de imagen que esta foto de técnica (S10 p3-4-7 y S11 p4).", "img_key": "mayo-16"}], "pack": "Celda renal: grasa pararrenal (fuera de Gerota) → fascia renal de Gerota → grasa perirrenal → cápsula fibrosa (un solo peritoneo NO la cubre: el riñón es retroperitoneal primario). Irrigación: a. renal ← aorta (L1-L2), la a. renal va POR DETRÁS de la v. renal; v. renal izquierda pasa entre aorta y AMS (pinza aortomesentérica) y recibe la v. gonadal y suprarrenal izquierdas. Linfa renal → ganglios lumbares (paraaórticos).", "trampa": "El ultrasonido no atraviesa hueso ni aire: la vía correcta evita costillas y colon; la vejiga y la próstata NO se ven desde el flanco (para ellas: suprapúbica con vejiga llena o transrectal). Trampa 2026: 'la suprapúbica tiene más resolución que la transrectal' = falso.", "prioridad": 2}, {"key": "R3G-p05", "pagina": 5, "item": 4, "tipo": "caso", "titulo": "Caso 4 · Testículo derecho hinchado con líquido dentro de la fascia espermática interna (hidrocele)", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 25 años es ingresado por dolor testicular. La exploración física muestra un testículo derecho hinchado e inflamado. La exploración mediante TC muestra una acumulación anómala de líquido en la cavidad de la fascia espermática interna. ¿Cuál de las siguientes condiciones describe más adecuadamente los signos observados en el paciente?", "opciones": [{"letra": "a", "texto": "Varicocele.", "correcta": false, "razon": "Dilatación varicosa del plexo pampiniforme ('bolsa de gusanos'), casi siempre IZQUIERDA (v. testicular izq → v. renal izq); no es líquido libre en una cavidad."}, {"letra": "b", "texto": "Rectocele.", "correcta": false, "razon": "Prolapso del recto hacia la vagina (pared vaginal posterior); nada que ver con el escroto."}, {"letra": "c", "texto": "Cistocele.", "correcta": false, "razon": "Descenso de la vejiga hacia la pared vaginal anterior por debilidad del suelo pélvico; patología femenina."}, {"letra": "d", "texto": "Hidrocele.", "correcta": true, "razon": "Acumulación de líquido seroso en la cavidad de la túnica vaginal (entre hoja parietal y visceral), que queda por dentro de la fascia espermática interna: escroto aumentado, transiluminación positiva."}, {"letra": "e", "texto": "Hipospadias.", "correcta": false, "razon": "Malformación congénita con el meato uretral en la cara ventral del pene; no cursa con líquido escrotal."}], "respuesta": "d", "razonamiento": "La 'cavidad de la fascia espermática interna' es la cavidad de la túnica vaginal: la fascia espermática interna (derivada de la fascia transversalis) envuelve por fuera a la túnica vaginal, que es el resto del proceso vaginal del peritoneo con una hoja parietal y otra visceral y una cavidad virtual entre ambas. Líquido acumulado en esa cavidad = hidrocele (congénito si el proceso vaginal queda permeable y comunica con el peritoneo; adquirido por orquiepididimitis, traumatismo o tumor). Se transilumina y se confirma con eco (líquido anecoico rodeando el testículo). Envolturas de fuera a dentro: piel → dartos → fascia espermática externa (oblicuo externo) → cremáster y fascia cremastérica (oblicuo interno) → fascia espermática interna (transversalis) → túnica vaginal parietal/visceral → albugínea."}, "examen": [], "pack": "Túnica vaginal ← peritoneo (proceso vaginal). Hematocele = sangre en la misma cavidad; espermatocele = quiste del epidídimo; varicocele = venas del cordón. Irrigación del testículo: a. testicular ← aorta (L2) + a. deferencial ← vesical superior/inferior (ilíaca interna) + a. cremastérica ← epigástrica inferior (ilíaca externa).", "trampa": "Confundir hidrocele (líquido en la túnica VAGINAL) con varicocele (venas del plexo PAMPINIFORME, izquierdo, 'bolsa de gusanos', aumenta con Valsalva).", "prioridad": 1}, {"key": "R3G-p06", "pagina": 6, "item": 5, "tipo": "caso", "titulo": "Caso 5 · Carcinoma del riñón izquierdo que bloquea la vena testicular (varicocele izquierdo)", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones (las mismas del caso 4). Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 54 años ingresa en el hospital con dolor de espalda intenso. La exploración radiológica muestra un carcinoma del riñón izquierdo que bloquea el drenaje de la vena testicular. ¿Cuál de las siguientes enfermedades se asocia con mayor probabilidad con estos signos?", "opciones": [{"letra": "a", "texto": "Varicocele.", "correcta": true, "razon": "La v. testicular IZQUIERDA desemboca en ángulo recto en la v. RENAL IZQUIERDA; un tumor renal que invade/comprime la v. renal izquierda bloquea el retorno del plexo pampiniforme → dilatación varicosa = varicocele izquierdo de aparición brusca en un adulto (signo de alarma de tumor renal)."}, {"letra": "b", "texto": "Rectocele.", "correcta": false, "razon": "Prolapso rectal hacia la vagina; sin relación con la vena testicular."}, {"letra": "c", "texto": "Cistocele.", "correcta": false, "razon": "Prolapso vesical femenino; sin relación."}, {"letra": "d", "texto": "Hidrocele.", "correcta": false, "razon": "Líquido en la túnica vaginal; no es consecuencia de la obstrucción venosa (aunque un varicocele crónico puede acompañarse de hidrocele, no es 'lo más probable')."}, {"letra": "e", "texto": "Hipospadias.", "correcta": false, "razon": "Malformación congénita del meato uretral; nada que ver."}], "respuesta": "a", "razonamiento": "Asimetría venosa gonadal: la v. testicular DERECHA drena directamente en la VCI (ángulo agudo), la IZQUIERDA en la v. RENAL IZQUIERDA (ángulo recto, columna más larga, válvulas insuficientes). Por eso el 90 % de los varicoceles son izquierdos, y un varicocele izquierdo que aparece de golpe en un adulto, que no se vacía en decúbito, obliga a descartar un tumor renal izquierdo que invada la v. renal (o una pinza aortomesentérica / 'cascanueces'). En este caso el carcinoma renal bloquea la v. renal izquierda → se estanca la v. testicular → plexo pampiniforme dilatado ('bolsa de gusanos', aumenta con Valsalva). Dato colateral: el dolor de espalda es por el tumor renal (retroperitoneal, T10-L1)."}, "examen": [{"examen": "mayo 2026", "pregunta": "P7", "imagen": 14, "clave": "c", "que_pregunto": "En la eco testicular (img 14) la opción d decía 'la v. testicular izquierda drena en la v. renal CONTRALATERAL' = falsa (es la ipsilateral). El molde de este caso (v. testicular izq → v. renal izq) es exactamente lo que Bermúdez preguntó.", "img_key": "mayo-14"}], "pack": "Plexo pampiniforme (rodea la a. testicular, enfría la sangre: intercambio contracorriente) → 2-3 vv. testiculares en el anillo inguinal profundo → 1 v. testicular: DERECHA → VCI; IZQUIERDA → v. renal izquierda → VCI. Un trombo del testículo izquierdo llega PRIMERO a la v. renal izquierda (caso 17). Linfa del testículo → lumbares paraaórticos (L2), igual que su vena y arteria: 'nació en L2'.", "trampa": "'Contralateral' en vez de 'ipsilateral'; 'la v. testicular izquierda drena en la VCI' (es la derecha). Varicocele DERECHO aislado = sospechar masa retroperitoneal que comprima la VCI.", "prioridad": 3}, {"key": "R3G-p07", "pagina": 7, "item": 6, "tipo": "identifica", "titulo": "Ligamentos del pene: fundiforme (6) y suspensorio (7) sobre la raíz del pene y los músculos perineales (Gray's)", "que_se_ve": "Esquema de Gray's Anatomy for Students: raíz del pene vista desde abajo con los músculos del espacio perineal superficial, el pene desviado a la derecha y, en azul, los dos ligamentos: uno superior largo que baja desde la pared abdominal (6, rosa) y otro corto desde la sínfisis al dorso del pene (7, rosa). Números 2-8 en negro.", "etiquetas": [{"n": "6", "nombre": "Ligamento fundiforme del pene", "rosa": true, "seguro": true, "nota": "Condensación del tejido subcutáneo (fascia de Scarpa) que desciende desde la LÍNEA ALBA, rodea el pene en asa y se funde con el dartos/tabique escrotal. Superficial (anterior) al suspensorio."}, {"n": "7", "nombre": "Ligamento suspensorio del pene", "rosa": true, "seguro": true, "nota": "Fibras colágenas cortas y tensas desde la cara anterior de la SÍNFISIS DEL PUBIS a la fascia profunda (Buck) en la unión raíz-cuerpo; ancla los cuerpos cavernosos y da el ángulo de erección. Clave b de la P12 de mayo 2026."}, {"n": "2", "nombre": "Músculo transverso superficial del periné", "rosa": false, "seguro": true, "nota": "De la tuberosidad isquiática al cuerpo perineal."}, {"n": "3", "nombre": "Centro tendinoso del periné (cuerpo perineal)", "rosa": false, "seguro": true, "nota": "Entre bulbo del pene y ano."}, {"n": "4", "nombre": "Músculo bulboesponjoso", "rosa": false, "seguro": true, "nota": "Cubre el bulbo del pene (cuerpo esponjoso) en la línea media."}, {"n": "5", "nombre": "Músculo isquiocavernoso", "rosa": false, "seguro": true, "nota": "Cubre el pilar (crus) del pene = cuerpo cavernoso fijado a la rama isquiopubiana."}, {"n": "8", "nombre": "Rafe medio del músculo bulboesponjoso", "rosa": false, "seguro": false, "nota": "Línea media fibrosa donde se unen las dos mitades del bulboesponjoso; alternativa: bulbo del pene."}], "pregunta": {"enunciado": "Identifica los ligamentos del pene", "opciones": [], "respuesta": "", "razonamiento": "6 = ligamento FUNDIFORME: fibras elásticas largas y laxas del tejido subcutáneo abdominal (Scarpa) que bajan desde la línea alba, se abren en dos brazos que abrazan el pene lateralmente y se funden con el dartos formando el tabique escrotal; es el más superficial. 7 = ligamento SUSPENSORIO: fibras colágenas cortas y densas, triangulares, desde la cara anterior de la sínfisis del pubis hasta la fascia profunda del pene (Buck) en la unión entre raíz y cuerpo; ancla los cuerpos cavernosos al pubis y mantiene el ángulo del pene en erección (su sección quirúrgica alarga el pene pero pierde el ángulo). Por debajo del suspensorio, entre el ligamento arqueado del pubis y la membrana perineal, pasa la v. dorsal profunda del pene hacia el plexo prostático."}, "examen": [{"examen": "mayo 2026", "pregunta": "P12", "imagen": 0, "clave": "b", "que_pregunto": "Sin imagen, molde de esta lámina: CORRECTA 'el ligamento suspensorio ancla los cuerpos eréctiles a la sínfisis del pubis y el fundiforme, más superficial, baja de la línea alba'. Falsas: 'bajo la fascia superficial van las arterias dorsales' (van bajo Buck; bajo la superficial solo la v. dorsal superficial) y 'los pilares son del cuerpo esponjoso' (son los cuerpos cavernosos).", "img_key": ""}], "pack": "Planos del dorso del pene: piel → fascia superficial (dartos peneano, con la v. dorsal SUPERFICIAL → v. pudenda externa → v. safena magna/femoral) → ligamento fundiforme (en este plano) → fascia profunda de Buck (bajo ella: v. dorsal PROFUNDA impar central, aa. dorsales a cada lado ← a. pudenda interna, nn. dorsales del pene ← n. pudendo más laterales) → ligamento suspensorio se inserta en Buck → túnica albugínea. Drenaje de la v. dorsal profunda → plexo venoso prostático (Santorini) → v. ilíaca interna.", "trampa": "Fundiforme = LÍNEA ALBA / suspensorio = SÍNFISIS; intercambiarlos. Y la de fascias: 'aa. dorsales bajo la fascia superficial' es falsa (van bajo Buck).", "prioridad": 3}, {"key": "R3G-p08", "pagina": 8, "item": 7, "tipo": "caso", "titulo": "Caso 7 · Retención urinaria por HBP, sondaje fallido: punción suprapúbica (espacio de Retzius)", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 62 años ingresa en urgencias por una creciente dificultad en la micción durante varios meses. La exploración física muestra hipertrofia de la próstata. Tras varios intentos fallidos de sondaje de la uretra peneana, el urólogo decide el drenaje de la vejiga a través del método menos invasivo, evitando la entrada en la cavidad peritoneal o la lesión de vasos u órganos principales. ¿Cuál de los siguientes espacios debe ser atravesado por la aguja para alcanzar la vejiga?", "opciones": [{"letra": "a", "texto": "Fosa isquioanal.", "correcta": false, "razon": "Espacio graso lateral al canal anal, bajo el elevador del ano; contiene el canal de Alcock (n. pudendo). No comunica con la vejiga."}, {"letra": "b", "texto": "Cuerpo perineal.", "correcta": false, "razon": "Centro tendinoso del periné entre ano y bulbo del pene: nudo fibromuscular, no un espacio, y lejos de la vejiga."}, {"letra": "c", "texto": "Espacio retropúbico (de Retzius).", "correcta": true, "razon": "Espacio extraperitoneal entre la sínfisis del pubis y la vejiga, relleno de grasa y plexo venoso; cuando la vejiga está llena se eleva por encima del pubis y despega el peritoneo, de modo que una aguja suprapúbica en la línea media entra en ella sin atravesar peritoneo (cistostomía suprapúbica)."}, {"letra": "d", "texto": "Pliegue perineal superficial.", "correcta": false, "razon": "El espacio (bolsa) perineal superficial contiene bulbo, pilares y sus músculos; atravesarlo no lleva a la vejiga sino a los cuerpos eréctiles."}, {"letra": "e", "texto": "Fondo de saco perineal profundo.", "correcta": false, "razon": "El espacio perineal profundo contiene la uretra membranosa, el esfínter uretral externo y las glándulas de Cowper; es el que se rompe en la fractura de pelvis, no una vía de drenaje vesical."}], "respuesta": "c", "razonamiento": "Retención aguda de orina por HBP con sondaje imposible → cistostomía suprapúbica: se punciona en la línea media justo por encima de la sínfisis con la vejiga llena. La vejiga distendida asciende al abdomen y su cara anterior, desprovista de peritoneo, contacta con la pared abdominal a través del espacio retropúbico (prevesical) de Retzius, limitado por delante por la sínfisis y la fascia transversalis, por detrás por la vejiga y su fascia, y ocupado por grasa y el plexo venoso vesicoprostático. Al no atravesar el peritoneo (que se refleja desde la cúpula vesical a la pared abdominal a mayor altura cuanto más llena está la vejiga) se evitan asas intestinales y contaminación peritoneal. Lo mismo explica que una rotura extraperitoneal de vejiga (fractura de pelvis) vierta orina en el espacio de Retzius, y que la rotura intraperitoneal (cúpula, vejiga llena) vierta al peritoneo."}, "examen": [], "pack": "Relaciones de la vejiga ♂: delante sínfisis y espacio de Retzius; arriba peritoneo (fondo de saco rectovesical detrás); detrás vesículas seminales, ampollas deferenciales y recto (tabique rectovesical de Denonvilliers); abajo próstata. Irrigación: aa. vesicales superiores ← a. umbilical, aa. vesicales inferiores (♂) ← a. ilíaca interna. Venas: plexo vesical → vv. ilíacas internas + comunicación con plexos vertebrales (Batson) vía vv. sacras (M26 P23). Linfa → ilíacos externos (sobre todo) e internos.", "trampa": "Elegir 'espacio perineal profundo/superficial' porque suena a 'suelo'; o creer que la punción suprapúbica atraviesa peritoneo. Otra: el espacio de Retzius es también donde queda la orina en la rotura EXTRAperitoneal de vejiga.", "prioridad": 2}, {"key": "R3G-p09", "pagina": 9, "item": 8, "tipo": "identifica", "titulo": "Corte frontal de próstata, uretra masculina y pene (Sobotta)", "que_se_ve": "Dibujo de atlas en corte frontal (coronal) desde el cuello vesical hasta el glande: próstata atravesada por la uretra prostática, glándulas bulbouretrales a ambos lados de la uretra membranosa, bulbo y pilares, cuerpos cavernosos con su arteria profunda y cuerpo esponjoso central con la uretra esponjosa hasta el meato. Números 1-13 en negro, sin rosas.", "etiquetas": [{"n": "1", "nombre": "Cuello de la vejiga / pared vesical (m. detrusor) con el orificio uretral interno", "rosa": false, "seguro": false, "nota": "Aquí está el esfínter uretral interno (liso, simpático) que evita la eyaculación retrógrada."}, {"n": "2", "nombre": "Próstata", "rosa": false, "seguro": true, "nota": "Glándula fibromuscular de 20 g; zona periférica posterior (carcinoma, tacto rectal) / zona de transición periuretral (HBP)."}, {"n": "3", "nombre": "Colículo seminal (veru montanum) en la cresta uretral", "rosa": false, "seguro": false, "nota": "Elevación de la pared posterior de la uretra prostática donde se abren el utrículo y los 2 conductos eyaculadores; alternativa: uretra prostática."}, {"n": "4", "nombre": "Uretra prostática (luz) / orificios de los conductos eyaculadores", "rosa": false, "seguro": false, "nota": "3-4 cm, la porción más ancha y dilatable; a los lados del colículo, los senos prostáticos reciben los conductillos prostáticos."}, {"n": "5", "nombre": "Glándula bulbouretral (Cowper)", "rosa": false, "seguro": true, "nota": "En el espacio perineal profundo, lateral a la uretra membranosa; su conducto desemboca en la uretra esponjosa proximal (bulbar). Inervada por el n. pudendo (M26 P11), irrigada por a. del bulbo/dorsal del pene ← pudenda interna."}, {"n": "6", "nombre": "Músculo transverso profundo del periné / esfínter uretral externo (diafragma urogenital)", "rosa": false, "seguro": false, "nota": "Estriado, voluntario, n. pudendo; rodea la uretra membranosa."}, {"n": "7", "nombre": "Bulbo del pene", "rosa": false, "seguro": true, "nota": "Extremo posterior dilatado del cuerpo esponjoso, impar, fijado a la membrana perineal; cubierto por el bulboesponjoso."}, {"n": "8", "nombre": "Pilar (crus) del pene", "rosa": false, "seguro": true, "nota": "Raíz del cuerpo cavernoso, par, fijado a la rama isquiopubiana; cubierto por el isquiocavernoso."}, {"n": "9", "nombre": "Arteria profunda del pene (a. cavernosa)", "rosa": false, "seguro": true, "nota": "Central en cada cuerpo cavernoso; da las aa. helicinas (erección). Rama de la a. pudenda interna."}, {"n": "10", "nombre": "Túnica albugínea del cuerpo cavernoso", "rosa": false, "seguro": true, "nota": "Gruesa (2 mm), inextensible: su compresión de las venas emisarias mantiene la erección (mecanismo venooclusivo)."}, {"n": "11", "nombre": "Cuerpo esponjoso del pene (con la uretra esponjosa en su interior)", "rosa": false, "seguro": true, "nota": "Impar, ventral; albugínea fina, por eso no se pone rígido y no comprime la uretra."}, {"n": "12", "nombre": "Glande del pene", "rosa": false, "seguro": true, "nota": "Expansión distal del cuerpo esponjoso que capuchona los cuerpos cavernosos; corona y cuello del glande."}, {"n": "13", "nombre": "Orificio uretral externo (fosa navicular / meato)", "rosa": false, "seguro": true, "nota": "Es la porción MÁS ESTRECHA de toda la uretra; antes de él, la dilatación de la fosa navicular (válvula de Guérin)."}], "examen": [], "pack": "Uretra masculina (18-20 cm): intramural/preprostática (esfínter interno liso, simpático, evita eyaculación retrógrada) → prostática 3-4 cm (cresta, colículo, senos; la más ancha; ← ramas prostáticas de a. vesical inferior y rectal media) → membranosa 1-2 cm (esfínter externo estriado, n. pudendo; la más corta y menos distensible; Cowper a los lados; se rompe en la fractura de pelvis) → esponjosa 15 cm (fosa intrabulbar, glándulas de Littré, fosa navicular; ← a. del bulbo y a. dorsal del pene ← pudenda interna; se rompe en la caída a horcajadas). Venas: uretra posterior → plexo vesicoprostático (Santorini) → v. ilíaca INTERNA (M26 P15: 'externa' era falso); esponjosa → v. dorsal del pene. Linfa: prostática/membranosa → ilíacos internos; esponjosa → inguinales profundos.", "trampa": "Estrecheces: orificio interno, membranosa y orificio EXTERNO (el más estrecho); dilataciones: prostática, bulbar, navicular. Los conductos eyaculadores desembocan en la PROSTÁTICA (colículo), Cowper en la ESPONJOSA proximal.", "prioridad": 2}, {"key": "R3G-p10", "pagina": 10, "item": 9, "tipo": "caso", "titulo": "Caso 9 · Arterioesclerosis e impotencia: oclusión de la a. pudenda interna", "que_se_ve": "Diapositiva de texto con caso clínico y 5 opciones. Sin imagen.", "etiquetas": [], "pregunta": {"enunciado": "Un hombre de 65 años con antecedentes de consumo importante de tabaco e hipercolesterolemia es diagnosticado de arterioesclerosis grave que afecta a la mayoría de las arterias. En la anamnesis se recoge que el paciente aqueja impotencia. ¿La oclusión de cuál de las siguientes arterias es la causa más probable de esta complicación?", "opciones": [{"letra": "a", "texto": "Ilíaca externa.", "correcta": false, "razon": "Se continúa como a. femoral para el miembro inferio

/* ══ pestaña estrategia ══ */
.es-wrap{display:flex;flex-direction:column;gap:14px}
.es-sec{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.es-body{margin-top:12px}

.es-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.es-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px;font-size:12.5px;font-weight:800;color:#fff}

.es-rank{counter-reset:r;list-style:none;margin:0;padding:0}

.es-foot{font-size:12px;color:#8a98a8;text-align:center;padding:6px 0 20px}
@media(max-width:640px){.es-grid,.es-leg{grid-template-columns:1fr}.es-nunca{columns:1}.es-tema{grid-template-columns:1fr}}
@media print{header,.bar,#exbar{display:none!important}.es-sec{break-inside:avoid;box-shadow:none;border:1px solid #ccd}.es-sec>summary .es-chev{display:none}}

 en el bloque de anatomía", "Inervación por raíz medular / dermatomas / dolor referido", "Drenaje linfático terminal (conducto torácico, cisterna del quilo)", "Tecnicismo radiológico (Hounsfield, T1/T2, fases de contraste), TNM, Bismuth", "Variantes raras: Meckel, riñón en herradura, páncreas anular", "Arterial del colon distal (AMI, sigmoideas), a. lingual, inervación de páncreas/hígado/duodeno/colon", "Casos clínicos con viñeta y cálculos numéricos en fisiología (Prat no los usa)", "Diagnóstico diferencial endocrino (SOP, Turner, Klinefelter, Sheehan, prolactinoma)", "Vasos intrarrenales histológicos (Verheyen, interlobulillares, arcuatas): solo daypo 2019", "Distractores con varios errores: Prat invierte UN solo detalle por opción"], "baremo": [{"dato": "al azar puro (4 opciones)", "valor": "≈ 0"}, {"dato": "con 1 opción descartada", "valor": "+0,11"}, {"dato": "con 2 descartadas", "valor": "+0,33"}, {"dato": "cada fallo", "valor": "−0,33"}], "tactica_dia": ["Matemática del baremo: al azar puro la esperanza es ≈ 0 (neutra); con 1 opción descartada +0,11; con 2 descartadas +0,33 por pregunta. **Si descartas al menos UNA opción, contesta SIEMPRE**; deja en blanco solo lo que no entiendas en absoluto", "Palabra absoluta ('únicamente', 'solamente', 'siempre', 'nunca', 'sin…') = opción FALSA (6/6 en mayo, 0 excepciones)", "No descartes la d) compuesta: 'TODAS correctas / A y B' fue la respuesta en 10/35 de anatomía en mayo, y 'Totes són certes' acierta ~4 de cada 6 veces en Prat", "Lee el verbo del enunciado dos veces: 'señale la FALSA / senyali la INCORRECTA' aparece en 5-20 % y es donde se pierden puntos; marca una F en el margen", "Fisio en catalán: la correcta es la copia literal del slide de Prat aunque contradiga al libro (amilorida-NHE3, ADH en nansa ascendent, Müller-estrògens, ovulación 'induïda per l'hipotàlem', renina ↑ vasopresina, SNC madura tarde)", "Los conceptos estrella también caen como DISTRACTOR invertido (renal 'contralateral', HBP 'periférica', fecundación 'istmo'); epónimos DESCRITOS sin nombre (Mackenrodt = cervicales transversos; Batson = plexos vertebrales vía vv. sacras)", "Tiempo: 1ª pasada 90-100 min contestando lo seguro y marcando dudas; 2ª pasada 40 min para dudas e imágenes (buscar la placa de retos/seminarios y los números rosas); últimos 20 min repasar la hoja de respuestas y decidir las que quedan en blanco", "Orden de trabajo: 1º todas las que reconozcas de 2026 (busca el DATO, no la letra: Bermúdez recoloca las opciones) · 2º las de imagen (identifica TODAS las letras de la lámina antes de leer las opciones) · 3º el resto aplicando las trampas · al final las de azar puro: contéstalas si crees que vas por debajo de 50, déjalas si vas holgado", "En anatomía casi no debería haber blancos (siempre se descarta algo: absoluta, lateralidad, arteria↔vena, sexo del fondo de saco). En Prat, una pregunta con 'Totes són certes' nunca se deja en blanco", "Cambia de 'modo profesor' según el idioma: castellano + imagen = Bermúdez (lateralidad, epónimos, d) compuesta); catalán = Prat (slide literal, 'totes són certes')"], "plan_ultimas_horas": [{"prioridad": 1, "que": "Las 77 de fisio reales al 100 % (con las 4 razones y la diapo 📽) + las 16 verdades de Prat y las 14 claves dudosas en voz alta", "por_que": "Es la apuesta: si Prat repite (como hizo en cardio), fisio vale ~40 netos de 50", "donde": "📖 Estudio → Origen: 📝 Examen real 2026 + Materia: Fisiología"}, {"prioridad": 2, "que": "Las 73 de anatomía reales (35 mayo + 38 enero) con razones + diapo; marca ★ lo que falles", "por_que": "Si clona, ya está; si no, el 30 % son 'casi literales con la letra cambiada'", "donde": "📖 Estudio → Origen: 📝 Examen real 2026 + Materia: Anatomía (después 🔁 intercambiadas)"}, {"prioridad": 3, "que": "Autoevaluaciones de Bermúdez (207) saltando las de ⚠️ cifra, y los cuestionarios de Prat (62, 36 gemelas de enero)", "por_que": "El 75 % de la anatomía digestiva de enero salió de sus autoevaluaciones; los cuestionarios anticiparon ≥8 preguntas", "donde": "📖 Estudio → Origen: 📋 Autoevaluaciones Bermúdez · 📝 Cuestionarios Prat"}, {"prioridad": 4, "que": "Láminas: las 41 de 2026 (sección A del cuaderno) y los números rosas de los retos (sección B); tapar → nombrar → destapar", "por_que": "~22-27 preguntas con imagen + ~5 clones de reto sin imagen ≈ 30 puntos dependen de estas láminas; 85-90 % son la MISMA placa", "donde": "Cuaderno de láminas del móvil: salmiox.github.io/dgu-quizlet/laminas.html · en el quiz, filtro 🖼 Con imagen"}, {"prioridad": 5, "que": "Histórico GU = banco cerrado de Bermúdez (🔴 generadas de GU) + Glosario VID solo 🔴 y 🔥", "por_que": "GUC es el 'predictor rey' (≥10 gemelas de mayo); 25-30 % de Bermúdez es irrigación/drenaje/inervación", "donde": "📖 Estudio → Origen: 🤖 Generadas + Probabilidad 🔴 + Tema GU · 🩸 Glosario VID → 🔴 examen + 🔥 huecos"}, {"prioridad": 6, "que": "Simulacro completo de 100 'lo más probable' (hazlo en 120 min) y releer SOLO las falladas y las ★", "por_que": "Ensaya el baremo y el ritmo; detecta lo que aún falla", "donde": "📝 Simulacro → 'Solo lo más probable' + Los cuatro bloques + 100"}, {"prioridad": 7, "que": "LUNES 9:00-10:30: verdades de Prat + claves dudosas (10 min) · trampas de Bermúdez (5 min) · las 41 láminas a velocidad en el móvil (30 min) · los ★ que sigan fallando (20 min). Nada nuevo. DNI, lápiz, goma", "por_que": "El rendimiento en un test de 180 min con penalización depende más de la lectura atenta que de un tema extra", "donde": "Esta pestaña (🧪 Prat · 🦴 Bermúdez · 🎲 Táctica) + laminas.html"}]}, "bermudez": {"como_pregunta": [{"titulo": "\"En relación con la imagen N, señale la correcta\" (≈60-70 %)", "detalle": "Apertura canónica. Opción a) suele ser una lista de identificación (A=…, B=…, C=…) donde a veces hay UNA pieza cambiada; b/c son teoría anclada a la estructura (irrigación, drenaje, relación). ~50 % de las preguntas usan imagen y una misma placa se explota en 1-3 preguntas.", "ejemplo": "Mayo P26 (img 20): 4=riñón dcho, 5=AMS, 8=psoas, 9=bazo, 15=v. gonadal izda → c"}, {"titulo": "Opción d) compuesta como respuesta (29 % en mayo)", "detalle": "\"TODAS correctas\" (×5), \"TODAS FALSAS\" (×2, al alza) y \"A y B/C correctas\" (×3). Nunca descartar la d): fue la respuesta en 10 de 35.", "ejemplo": "Enero Q19: vísceras supramesocólicas con etiquetas permutadas → TODAS FALSAS"}, {"titulo": "\"Señale la FALSA\" = inversión de posición o lateralidad", "detalle": "Solo 5-9 % de preguntas, pero muy rentable: ahí mete delante/detrás, D/I, arteria/vena.", "ejemplo": "Enero Q1: VCI \"por delante\" del dedo en Winslow (es DETRÁS); Q3: D2 con uréter \"izdo\" (es DCHO)"}, {"titulo": "Caso clínico de 1 viñeta → 1 pregunta (13-15 %)", "detalle": "La viñeta es decorado; la respuesta es frecuencia anatómica pura, drenaje o relación. Nunca encadena varias preguntas al mismo paciente.", "ejemplo": "Niña 12 a. con apendicitis → apéndice retrocecal (no pélvico); mujer 60 a. cáncer gástrico → nodos celíacos"}, {"titulo": "VID por órgano (~25-30 %): irrigación con rama de origen, drenaje venoso, linfático de PRIMERA estación", "detalle": "Pregunta la terna arterial exacta o el primer grupo ganglionar regional (nunca conducto torácico).", "ejemplo": "Próstata: vesical inf + hemorroidal media + pudenda interna (corregido 26 → mayo P14, literal)"}, {"titulo": "Epónimo → ahora lo DESCRIBE, no lo nombra", "detalle": "En mayo 2026 no nombró Gerota, Lieutaud, Retzius, McNeal, Santorini, Mackenrodt: usó \"ligamentos cervicales transversos\", \"plexos vertebrales internos vía vv. sacras\". Hay que saber el concepto con su descripción.", "ejemplo": "Mayo P34: \"ligamentos cervicales transversos anclan el útero a paredes laterales\" (= Mackenrodt sin nombre)"}, {"titulo": "Números rodeados en ROSA de los retos = las preguntas", "detalle": "Las láminas Rohen/Weir de los PDFs *_STUDENTS traen números con círculo rosa; en mayo preguntó EXACTAMENTE esos números.", "ejemplo": "R1 slide 6 rosas 4,5,8,9,15 = mayo P26 pregunta 4,5,8,9,15 (5/5)"}, {"titulo": "Pares espejo a)/b) en la misma pregunta", "detalle": "Cuando dos opciones son contradictorias exactas (íntegra/rota, aferente/eferente), la clave está en ese par.", "ejemplo": "Mayo P3: hematoma limitado al pene = Buck íntegra vs \"rotura de Buck\" (FALSA)"}], "trampas": [{"trampa": "Palabra absoluta (\"únicamente\", \"solamente\", \"únicos\", \"totalmente\", \"sin inervación\", \"no se debe\")", "como_evitarla": "En mayo 2026 fue falsa en el 100 % de los casos (6/6). Descártala salvo prueba en contra."}, {"trampa": "Lateralidad / \"contralateral\"", "como_evitarla": "V. gonadal y suprarrenal IZDAS → v. renal izda; dchas → VCI. A. suprarrenal inf viene de la renal IPSIlateral. D2 ↔ uréter DCHO. Bazo = lado IZQUIERDO en TAC. \"Contralateral\" en Bermúdez casi siempre es falso."}, {"trampa": "Inversión arteria ↔ vena", "como_evitarla": "Leer literal: \"v. pancreatoduodenal tributaria de la ARTERIA mesentérica\" o \"v. gonadal drena en la ARTERIA renal\" = falsas por definición."}, {"trampa": "Sexo-swap de fondos de saco", "como_evitarla": "Douglas = rectoUTERINO (♀); en ♂ es rectoVESICAL. \"Fondo rectovesical\" en una mujer → falso y motor de un TODAS FALSAS (mayo P27). \"Douglas delante de la próstata\" → falso."}, {"trampa": "Inversión simpático ↔ parasimpático (3 preg en mayo)", "como_evitarla": "Simpático T11-L2 = continencia (relaja detrusor, cierra esfínter interno), emisión/eyaculación, contrae dartos. Parasimpático S2-S4 = micción (contrae detrusor), erección. Pudendo = esfínter externo + Cowper. \"Point and Shoot\"."}, {"trampa": "Estructura vecina plausible / nodo vecino", "como_evitarla": "Distractor nº 1. Colédoco distal → pancreatoduodenales (no gástricos ni císticos); colon ascendente → mesentéricos SUP; estómago cuerpo → celíacos. Elegir la primera estación regional, no la que \"está cerca\"."}, {"trampa": "Epónimo sustituido por otro parecido o de otro aparato", "como_evitarla": "\"Trompa de EUSTAQUIO\" por Falopio; \"cresta de Morgagny\"; Cooper (lig. mama) ≠ Cowper (bulbouretrales, desembocan en uretra ESPONJOSA, no membranosa); Arancio (lig. venoso/ductus) ≠ lig. redondo (v. umbilical); Stensen (parótida) ≠ Wharton (submandibular)."}, {"trampa": "Inercia \"TODAS correctas\" en preguntas de imagen", "como_evitarla": "Antes de marcar d) verificar cada etiqueta A/B/C: Bermúdez permuta etiquetas para un TODAS FALSAS o un NINGUNA (Q19, Q80, Q10 enero; P25, P27 mayo)."}, {"trampa": "Concepto estrella usado como DISTRACTOR", "como_evitarla": "\"HBP en zona periférica\" (es transición; cáncer = periférica), \"fecundación en istmo\" (es ampolla), \"v. testicular izda → renal contralateral\". Saber cada concepto en las dos direcciones."}, {"trampa": "Viñeta clínica que sugiere otra respuesta", "como_evitarla": "Ignorar la decoración: responder por anatomía/frecuencia pura (niña joven con apendicitis → retrocecal ~65 %, no pélvica)."}], "top_temas_dig": [{"tema": "T6 · Cavidad abdominal / peritoneo", "peso": "6 preg · 16 % (enero 2026) — tema REINA", "conceptos": ["Winslow: límite posterior = VCI; anterior = lig. hepatoduodenal (tríada portal)", "Transcavidad: techo peritoneo/caudado, suelo mesocolon transverso; evita desplazamiento gástrico", "Mesocolon transverso se adhiere a cara inferior de D2; divide supra/inframesocólico", "Vísceras supramesocólicas y vasos (imagen R2 s5 → TODAS FALSAS)", "Peritoneo: dolor visceral difuso, cavidad sin órganos", "Fondos de saco Douglas ♀ / rectovesical ♂ = puntos declives"]}, {"tema": "T7 · Estómago", "peso": "5 preg · 14 %", "conceptos": ["Irrigación por regiones (imagen tránsito): gástricas izdas curv. menor, cortas de esplénica fundus, gastroomentales curv. mayor", "Cáncer cuerpo gástrico → nodos CELÍACOS (reciclado 2016 + Reto 2)", "Epiplón gastroesplénico = vasos cortos + gastroepiploicos izdos (A y B ciertas)", "Vagotomía → ↓ ácido", "Ramas del tronco celíaco en arteriografía: esplénica / gastroduodenal / gástrica izda"]}, {"tema": "T10 · Duodeno (marco duodenal)", "peso": "4 preg · 11 % — imagen 15 explotada 3 veces", "conceptos": ["D2 ↔ uréter DCHO (trampa lateralidad, señale FALSA)", "D3 comprimido en pinza aortomesentérica = sd. Wilkie (clon Reto 2 #13)", "Detrás de D1-D2: colédoco (vs porta); gastroduodenal detrás del bulbo", "Bulbo móvil intraperitoneal; resto fijo; raíz del mesenterio", "Ampolla de Vater desemboca en D2"]}, {"tema": "T15 · Recto y canal anal", "peso": "4 preg · 11 %", "conceptos": ["Inicio en unión rectosigmoidea a nivel S3", "Peritonización por tercios (NO 'en su totalidad')", "Límites del espacio pelvirrectal superior (elevador del ano)", "Imagen enema lateral: recto / fascia perineal / canal anal", "Douglas rectouterino ♀ vs rectovesical ♂ (imagen)"]}, {"tema": "T8 · Hígado + T9 · Vías biliares", "peso": "3 + 2 preg · 13 %", "conceptos": ["Cara visceral: caudado (A), lig. redondo = v. umbilical obliterada (B), Arancio = ductus venoso", "Hígado DESCIENDE en inspiración", "Receso de Morrison (hepatorrenal) = más declive en supino; subfrénico vs subhepático", "Colédoco distal → nodos pancreatoduodenales; cuello vesícula → císticos/hepáticos", "CPRE: confluencia hepáticos, a. cística rama de hepática dcha, Calot (TODAS FALSAS en enero)"]}, {"tema": "T2-T3 · Boca, lengua, salivales", "peso": "5 preg · 13 %", "conceptos": ["Molares superiores = ramos alveolares sup. del MAXILAR (V2); inferiores = V3 (Reto 1 #12 espejado)", "Lesión XII → lengua se desvía al lado LESIONADO", "Sialografía: Stensen-parótida (carótida externa dentro; NO hipogloso) vs Wharton-submandibular", "Eco suelo de boca: sonda submentoniana (S7 s8-10)", "Amígdala palatina entre arcos palatogloso (ant) y palatofaríngeo (post) = Waldeyer"]}, {"tema": "T14 · Colon", "peso": "3 preg · 8 %", "conceptos": ["Apéndice más frecuente retrocecal (~65 %)", "Colon ascendente → mesentéricos SUPERIORES (Cannon-Böhm)", "Se vuelvulan ciego + sigma (mesos largos); ascendente/descendente fijos", "Ramas AMS en angiografía (ileocólica, cólica dcha, media) → NINGUNA correcta"]}, {"tema": "T5 · Esófago + T4 · Faringe", "peso": "3 preg · 8 % — concepto MÁS reciclado del corpus", "conceptos": ["3 estrechamientos: cricoideo C6, broncoaórtico, diafragmático (4 apariciones en 3 exámenes)", "Esófago detrás de la AURÍCULA IZDA → disfagia por cardiomegalia (clon Reto 1 #1)", "Adenoides obstruyen NASOfaringe (no oro)", "Músculos longitudinales elevan la faringe"]}, {"tema": "T11 Páncreas · T12 Bazo · T13 Yeyuno-íleon", "peso": "1 + 0 + 1 preg · 5 % — huecos calientes", "conceptos": ["Pancreatoduodenal sup ← gastroduodenal; inf ← AMS; venas → porta/VMS", "VMI → esplénica → tronco esplenomesentérico → porta", "Bazo: lig. gastroesplénico / esplenorrenal (cola páncreas)", "Yeyuno vs íleon, raíz del mesenterio (aún sin preguntar)"]}], "top_temas_gu": [{"tema": "T22 · Genitales internos ♀", "peso": "8 preg · 23 % (mayo 2026) — tema nº 1 real", "conceptos": ["A. ovárica de la aorta en lig. suspensorio, anastomosis con rama ovárica de la uterina (corregido 11c literal)", "Drenaje venoso trompa/ovario → vv. ováricas + plexo uterovaginal (imagen HSG)", "Ligamentos: suspensorio/propio/infundíbulo-ovárico; redondo → conducto inguinal; cervicales transversos (Mackenrodt) anclan a paredes laterales; uterosacros", "Trompa móvil pese a ligamentos; fecundación en AMPOLLA (istmo = distractor)", "Vagina: tabiques uretro/rectovaginal + Douglas; 4 fuentes de irrigación; espéculo", "Fosa de Krause: hipogástrica + uréter + umbilical obliterada"]}, {"tema": "T23 · Genitales externos ♂ (testículo, escroto, cordón, pene)", "peso": "6 preg · 17 %", "conceptos": ["3 arterias anastomosadas: testicular + deferencial + cremastérica (eco escrotal)", "Cordón espermático: TODOS los elementos (daypo 35 invertida)", "Simpático CONTRAE dartos; escroto → inguinales superficiales", "Mediastino testicular, tabiques; conductillos EFERENTES → epidídimo", "Fascia de Buck: hematoma limitado al pene = Buck íntegra", "Lig. suspensorio → sínfisis; fundiforme → pared abdominal; pilares = cavernosos"]}, {"tema": "T24 · Genitales internos ♂ (próstata, Cowper, deferente)", "peso": "4 preg · 11 %", "conceptos": ["Irrigación próstata: vesical inf + hemorroidal MEDIA + pudenda INTERNA (bicaída literal)", "Denonvilliers separa próstata-recto; uretra prostática ANCHA; drenaje a ilíaca INTERNA", "Zonas descritas sin 'McNeal': cáncer = periférica, HBP = transición", "Cowper: periné profundo, inervadas por pudendo, desembocan en uretra ESPONJOSA", "Simpático → contracción deferente + vesículas + próstata (emisión)"]}, {"tema": "T16 · Riñón + T17 · Suprarrenal", "peso": "4 + 1 preg · 14 % (predicho 20 %)", "conceptos": ["TAC/lámina numerada: aorta, VCI, v. renal izda, grasa peri/paranéfrica, pelvis, psoas, AMS, bazo IZDO, v. gonadal izda", "A. renal DETRÁS de la v. renal ipsilateral", "Eco renal: hígado, receso de Morrison, corteza, seno renal (vasos+grasa+pelvis, texto literal S10 p5)", "Arterias segmentarias (R1 s18 'identifica')", "Suprarrenal: por el hilio SOLO sale la vena + linfáticos; 3 arterias (frénica inf/aorta/renal ipsilateral); sin contacto directo"]}, {"tema": "MAMA (Melé, catalán)", "peso": "3 preg · 9 % — más peso del previsto", "conceptos": ["Abordaje menos traumático = surco mamario (lámina Netter A-E del Seminari_Mama)", "Unidad ductolobulillar + células mioepiteliales", "Perforantes de la MAMARIA INTERNA (intercostales 1ª-4ª, NO 7-8-9 de la aorta); niveles de Berg", "Cooper, Morgagni/Montgomery, Spence"]}, {"tema": "T20 · Uretra ♂/♀", "peso": "2 preg · 6 %", "conceptos": ["Uretrografía ♂: vejiga / prostática / membranosa / bulbar / esponjosa; orificios eyaculadores en cara posterior prostática", "Uretra ♀: cara posterior ↔ cara ANTERIOR de vagina; irrigación pudenda INTERNA + vaginal (cayó como TODAS FALSAS)", "Esfínter interno (simpático) vs externo (pudendo)"]}, {"tema": "T18 · Uréter + T19 · Vejiga", "peso": "1 + 1 preg · 6 %", "conceptos": ["Uréter cruzado por detrás del deferente (♂) y de la a. uterina (♀) — 'agua bajo el puente' (2019 literal)", "Irrigación ureteral multifuente (no 'únicamente')", "Vejiga: drenaje → ilíacas internas + plexos vertebrales internos vía vv. sacras (Batson) → metástasis vertebrales", "Parasimpático contrae detrusor (simpático NO)"]}, {"tema": "Embriología GU (otro profe, catalán)", "peso": "2 preg · 6 %", "conceptos": ["Pronefros/mesonefros/metanefros SOLAPADOS (no 'totalmente independientes')", "Mesonéfrico (Wolff) → epidídimo/deferente; paramesonéfrico (Müller) → útero/trompas; crestas gonadales 5ª semana"]}, {"tema": "T21 · Genitales externos ♀ + periné", "peso": "1 preg · 3 %", "conceptos": ["Pilares del clítoris/isquiocavernosos + bulbos del vestíbulo + Bartolino → TODAS correctas", "Bartolino posterolateral al introito; Skene parauretrales"]}, {"tema": "HUECOS de mayo (candidatos a rotar en la recuperación)", "peso": "0 preg en mayo pese a 'garantizados'", "conceptos": ["Gerota (hoja anterior) / Zuckerkandl (hoja posterior) de la fascia renal, celda renal", "Testículo/ovario → LUMBARES paraaórticos; próstata → ilíacos internos; glande/escroto → inguinales", "Varicocele izdo razonado (v. gonadal izda → renal izda a 90º)", "Trígono de Lieutaud, espacio de Retzius, Bertin/Malpighi, Hyrtl/Brodel, Marcille, Luschka", "Riñón corte coronal Netter (R1 s2) y pene corte transversal Rohen (R3 s20): láminas 'identifica' aún no usadas"]}], "poco_o_nunca": ["Medidas exactas en cm/mm (esófago 25 cm, distancias a incisivos, uretra 3+1+12) — 0 respuestas en 47+37+30 preguntas; las cifras del daypo 2019 desaparecieron", "Pesos de vísceras y volúmenes (hígado 1.500 g, flujo portal) — 0 apariciones", "Porcentajes poblacionales (AVF 90-94 %, Meckel 2 %) — solo en preguntas de fisio", "Histología (epitelios, capas, criptas) — 0 en Bermúdez; solo en mama-Melé (P5 mayo, catalán)", "Embriología pura como respuesta en castellano — Bermúdez la usa solo de contexto/distractor; cuando cae es en catalán (otro profe)", "Dermatomas e inervación por raíces medulares — pregunta el NOMBRE del nervio, no la raíz", "Conducto torácico / cisterna del quilo / drenaje linfático terminal — solo primera estación regional", "Técnica radiológica pura (Hounsfield, T1/T2, fases) — máximo 'qué vía ve mejor' (transrectal > transabdominal, P21 mayo)", "Variantes anatómicas raras (Meckel, riñón en herradura, páncreas anular, situs inversus) — 0", "Anatomía de superficie como sistema (9 regiones, planos de Addison, puntos de Murphy/McBurney como tema) — 0", "Clasificaciones de patología (TNM, Borrmann, Forrest) — 0", "Casos clínicos encadenados tipo USMLE, respuesta libre, 5 opciones — 1 viñeta → 1 pregunta, 4 opciones", "Autores históricos ('¿quién describió X?') y anatomía comparada — 0"], "imagenes": {"resumen": "Toda imagen del examen sale de un PDF que Bermúdez ha subido al campus: enero 17/20 literales (85 %), mayo 19/21 literales (90 %) + lámina Netter del Seminari Mama. 0 % salen exclusivamente de teoría o de atlas. Bermúdez repite placas entre convocatorias, así que prioridad máxima = las 41 imágenes YA usadas en 2026 (están todas en el modo Estudio, filtro 🖼 Con imagen), luego las láminas 'Identifica' de los retos aún no usadas; en cada lámina de reto los números rodeados en rosa son literalmente lo que pregunta.", "fuentes": ["Retos digestivo R1/R2/R3 (esofagograma R1 s16, hígado R2 s10, supramesocólico R2 s5, enema R3 s3/s9) — 70 % de las imágenes de enero", "Seminarios S7 (ortopanto, sialografías, fotos eco suelo de boca) y S8 (CPRE, a. celíaca, AMS, tránsito Kerckring, enema opaco)", "S10 RX urinario: eco renal p5-6, eco vesical p8, angio-TC p18, arteriografía p15, urografía p21, uretrografía ♂ p24 / ♀ p27", "S11 RX reproductor: eco próstata p5/p7/p8, eco testicular p11-12, eco útero p19, eco mama p24, HSG p26-27", "Retos GU: R1 s6/s15/s18/s21/s23 (Rohen retroperitoneo, pelvis ♂, aa. segmentarias, uretrografía, TC numerado), R2 s3/s16/s18/s20 (HSG, eco útero, eco ovario, pelvis ♀), R3 s16/s18 (eco próstata, eco testicular)", "Láminas 'identifica' AÚN NO usadas (candidatas): R1 s2 riñón coronal, s3 eco numerada, s4 suprarrenal, s9 urografía, s19 vejiga ♀; R2 s14 útero+anejos; R3 s13 pelvis coronal, s20 pene transversal", "Tipo favorito en mayo: ecografía 43 %, RX con contraste 24 %, láminas Rohen numeradas 14 %, TC 10 %"]}, "reglas_oro": ["Idioma = firma del profe: castellano = Bermúdez (anatomía, estas reglas); catalán = fisio/mama/embrio de otros profes.", "Palabra absoluta (únicamente/solamente/únicos/totalmente/sin) → opción falsa (6/6 en mayo).", "Nunca descartes la d) compuesta: TODAS correctas / TODAS FALSAS / A y B fue la respuesta en 10 de 35; verifica cada etiqueta antes de marcar TODAS correctas.", "\"Contralateral\", vena↔arteria, delante↔detrás, D↔I: sospecha inversión — lo izquierdo drena en la renal izda, D2 va con uréter dcho, VCI detrás de Winslow.", "Fondo de saco con sexo equivocado (rectovesical en mujer, Douglas delante de próstata) = falso y probable motor de un TODAS FALSAS.", "La viñeta clínica es decoración: responde por frecuencia/anatomía pura y por primera estación linfática regional.", "Si dos opciones son espejo exacto (íntegra/rota, aferente/eferente), la clave está en ese par; los conceptos estrella aparecen tanto como respuesta como de distractor invertido."], "cifras": [{"dato": "de anatomía por examen", "valor": "37-38/80 · 35/70"}, {"dato": "de las preguntas llevan imagen", "valor": "50 %"}, {"dato": "imágenes literales de sus PDFs (retos/seminarios)", "valor": "85-90 %"}, {"dato": "de anato GU de mayo con precedente en históricos", "valor": "86 %"}, {"dato": "de anato dig de enero anticipado por sus autoevaluaciones", "valor": "≈75 %"}, {"dato": "opción d) compuesta como respuesta (mayo)", "valor": "29 %"}, {"dato": "'señale la FALSA'", "valor": "5-9 %"}, {"dato": "palabra absoluta = falsa (mayo)", "valor": "6/6"}], "sub": "anatomía digestivo + GU · castellano · coordinador del examen", "intro": "**Banco cerrado que rota.** El 86 % de la anatomía GU de mayo tenía precedente en 2017-2019 y el 75 % de la de enero estaba en sus autoevaluaciones. Sus imágenes son las MISMAS placas de retos y seminarios (85-90 %). No inventa: recicla, permuta etiquetas e invierte lateralidades."}, "prat": {"sub": "fisiología digestiva + renal + reproductor · catalán · repite sus parciales", "intro": "**El slide manda.** La opción correcta es la copia literal de SU diapositiva 2026, aunque contradiga al Guyton. Cero clínica, cero imágenes, cero cálculos. Reciclaje literal bajo (3-5 %) pero los mismos ~25 conceptos cada año (51-56 % con precedente directo). En su otra asignatura repitió el examen tal cual en la recuperación.", "como_pregunta": [{"titulo": "Catalán 100 %, enunciado telegráfico", "detalle": "3-8 palabras, muchas veces sin verbo ('La renina', 'El cos luti') y 4 opciones de 1 línea sobre el MISMO concepto. Lee buscando la idea, no la gramática: hay erratas y frases truncadas.", "ejemplo": "M26 P49: 'La aldosterona' → c) incrementa l'activitat de la bomba de Na"}, {"titulo": "Muletilla 'Respecte de/dels…'", "detalle": "Abre el 37-45 % de los enunciados. La carga está en las opciones, no en la pregunta.", "ejemplo": "E26 P42: 'Respecte de la secreció pancreàtica' → la secretina activa la secreció de líquid tamponat"}, {"titulo": "La correcta = copia literal de SU diapositiva", "detalle": "Aunque contradiga al Guyton. Los 3 distractores son la misma frase con un detalle invertido. Cuando dudes, elige la formulación que suene a slide de Prat.", "ejemplo": "M26 P44: 'Amilorida inhibeix la NHE3' (slide Renal 12) → 'totes certes'"}, {"titulo": "'Totes són certes' suele ser la correcta", "detalle": "4/6 en mayo, 4/5 en enero. Es señal, no trampa. 'Cap és certa' solo cuando a-c son claramente falsas (E26 P45).", "ejemplo": "E26 P40 superficie absortiva (microvellositats + vàlvules conniventes + vellositats) → totes elles"}, {"titulo": "Cadenas por nutriente / en orden del temario", "detalle": "En digestivo pregunta 4-5 seguidas por nutriente: digestión → absorción → vía (portal/linfa) → destino hepático. En GU sigue el orden de la nefrona y luego eje → masculino → ciclo → gestación.", "ejemplo": "E26 P47-50 proteínas, P51-55 glúcidos, P56-60 lípidos"}, {"titulo": "'Senyalar la FALSA' / 'NO hi trobem'", "detalle": "10 % en enero, 20 % en mayo. Lee el enunciado dos veces: en M26 P47 pedía la FALSA y la clave fue 'Totes són certes'.", "ejemplo": "M26 P52: eliminación de ácido, NO: 'secreció de H per COtransport amb Na' (es ANTIport NHE3)"}, {"titulo": "Cero clínica, cero imágenes, cero cálculos", "detalle": "0/35 casos clínicos en mayo, 0/41 en enero. Solo concepto puro y nombres de transportadores/hormonas sin mecanismo molecular profundo.", "ejemplo": "SGLT1 apical, CFTR, PepT1, AQP2, NHE3, SGLT2"}, {"titulo": "Pocas cifras, y solo las del slide", "detalle": "7-14 % de preguntas llevan número: % reabsorción por segmento, semanas de gestación, % glándulas salivales, % solutos bilis.", "ejemplo": "M26 P41: TCP recapta el 65 % del filtrat (no el 60 % de los apuntes viejos)"}], "trampas": [{"trampa": "Inversión de UN detalle en opciones casi idénticas (portal ↔ linfática)", "como_evitarla": "aa y glucosa → vena porta; quilomicrones (AG larga, colesterol) → linfa; AG cadena corta → porta (E26 P49, P54, P59)"}, {"trampa": "Apical ↔ basolateral", "como_evitarla": "SGLT1 apical / GLUT2 basolateral en enterocito; CFTR apical; en TCP el transporte apical DEPENDE de la Na/K-ATPasa basal (M26 P43)"}, {"trampa": "Antiport ↔ cotransport", "como_evitarla": "NHE3 = ANTIport Na/H; 'secreció de H per cotransport amb Na' es la FALSA (M26 P52)"}, {"trampa": "Aferente ↔ eferente", "como_evitarla": "AT-II contrae la arteriola EFERENT → ↑ presión de filtración; aferente contrae → ↓P (M26 P39-40)"}, {"trampa": "Ejes hormonales al revés", "como_evitarla": "Gastrina → ECL → histamina → parietal (NO 'la gastrina es produïda per la histamina', E26 P33); secretina = agua + HCO₃ pancreática Y biliar + retrasa vaciado; CCK ice S2-S4; el concepto es parasimpático → NO → vasodilatación)", "Vesículas seminales: prostaglandinas + **TGFβ**; semenogelina **inmoviliza**; PSA licua → M59 = d", "Los azúcares absorbidos van 'mayoritariamente' al **músculo** → E54 = d (los aminoácidos sí van por porta, E49 = c)", "Soluto más abundante de la bilis = '**tensioactius**' (sales biliares) → E45 = b", "Vaciado gástrico: control principal = **tono del píloro**; la contracción pilórica **protege al duodeno** → E34 = b, E39 = b"], "claves_dudosas": "Las 14 claves dudosas de fisio y qué marcar si se repiten literales: **E32 d · E34 b · E39 b · E41 c · E54 d · E57 d · M40 c · M42 c · M44 d · M47 d · M48 a · M60 b · M64 d · M68 a**. 'Totes són certes' fue correcta en 8 de ~11 apariciones (E21, E40, E44, E59, M44, M47, M61, M66).", "top_temas_dig": [{"tema": "T6 · Digestión y absorción de nutrientes", "peso": "15/41 preg · 37 % (enero 2026)", "conceptos": ["Proteínas: pepsina → péptidos GRANDES en estómago; PepT1 di/tripéptidos; aa → porta → hígado forma proteínas plasmáticas", "Glúcidos: amilasas principales = jugo pancreático; disacaridasas borde en cepillo; SGLT1 apical (cayó en 3 exámenes); glucosa → porta; hígado = fuente de glucosa entre comidas", "Lípidos: sales biliares emulsionan pero NO son enzimas; lípidos en duodeno → CCK; SCFA → porta, quilomicrones → linfa", "Superficie absortiva: vellosidades + microvellosidades + válvulas conniventes = todas", "Colesterol: NPC1L1 / difusión pasiva"]}, {"tema": "T3 · Estómago", "peso": "7/41 · 17 % (7 seguidas)", "conceptos": ["Eje gastrina → ECL → histamina → parietal; ACh fase cefálica; somatostatina freno", "Prostaglandinas activan moco/protección; AINE → úlcera", "Secretina retarda vaciado; píloro protege duodeno del ácido; reflejo enterogástrico; MMC/motilina en ayuno", "Absorción gástrica: fármacos lipófilos y alcohol, no aa ni glucosa"]}, {"tema": "T1 · Saliva y masticación", "peso": "4/41 · 10 % + 2 cuestionarios del profe", "conceptos": ["% y tipo por
